<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ═══════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════
const VOXEL = 1;
const MICRO = 0.25;
const HALF = VOXEL / 2;
const WORLD_SIZE = 120;

// ═══════════════════════════════════════════════
// TEXTURE GENERATOR — 16x16 procedural pixel art
// ═══════════════════════════════════════════════
function makeCanvas() {
    const c = document.createElement('canvas');
    c.width = 16; c.height = 16;
    return c;
}

function toTexture(canvas) {
    const t = new THREE.CanvasTexture(canvas);
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.NearestFilter;
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
}

function px(ctx, x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, 1, 1);
}

function noise(ctx, colors, count) {
    for (let i = 0; i < count; i++) {
        px(ctx, Math.floor(Math.random() * 16), Math.floor(Math.random() * 16), colors[Math.floor(Math.random() * colors.length)]);
    }
}

const textures = {};

function generateTextures() {
    // 0: grass_top
    let c = makeCanvas(); let ctx = c.getContext('2d');
    ctx.fillStyle = '#4a8c3f'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#5a9c4f', '#3a7c2f', '#6aac5f', '#2a6c1f'], 50);
    textures.grass_top = toTexture(c);

    // 1: grass_side
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#6b4e32'; ctx.fillRect(0, 0, 16, 10);
    ctx.fillStyle = '#4a8c3f'; ctx.fillRect(0, 10, 16, 6);
    noise(ctx, ['#5a3e22', '#7b5e42', '#3a7c2f', '#5a9c4f'], 30);
    textures.grass_side = toTexture(c);

    // 2: dirt
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#6b4e32'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#5a3e22', '#7b5e42', '#4a2e12'], 35);
    textures.dirt = toTexture(c);

    // 3: stone
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#888'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#999', '#777', '#aaa', '#666'], 40);
    textures.stone = toTexture(c);

    // 4: stone_dark
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#555'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#666', '#444', '#5a5a5a'], 30);
    textures.stone_dark = toTexture(c);

    // 5: wood_dark
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#3a2518'; ctx.fillRect(0, 0, 16, 16);
    for (let i = 0; i < 16; i++) {
        px(ctx, i, Math.floor(Math.random() * 16), Math.random() > 0.5 ? '#2a1508' : '#4a3528');

    textures.wood_dark = toTexture(c);

    ctx.fillStyle = '#c4a265'; ctx.fillRect(0, 0, 16, 16);
    for (let i = 0; i < 16; i++) {

    for (let y = 0; y < 16; y += 4) {
        for (let x = 0; x < 16; x++) {

    // 9: gold
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#d4a017'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#c49007', '#e4b027', '#f4c037', '#b48007'], 30);
    textures.gold = toTexture(c);

    // 10: red (torii/bridge)
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#c41e24'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#b41018', '#d42e34', '#a40010'], 25);
    textures.red = toTexture(c);

    // 11: water
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#2864a8'; ctx.fillRect(0, 0, 16, 16);
    for (let y = 0; y < 16; y += 3) {
        for (let x = 0; x < 16; x++) {
            if (Math.random() > 0.6) px(ctx, x, y, '#3874b8');

    }
    textures.water = toTexture(c);

    // 12: snow
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#f0f0f8'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#e0e0e8', '#ffffff', '#d8d8e0'], 20);

    // 13: bamboo
    c = makeCanvas(); ctx = c.getContext('2d');

    noise(ctx, ['#4a7a2c', '#6a9a4c'], 10);
    textures.bamboo = toTexture(c);

    // 14: trunk_dark
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#5a3a28'; ctx.fillRect(0, 0, 16, 16);
    for (let y = 0; y < 16; y++) {
        px(ctx, Math.floor(Math.random() * 3), y, '#4a2a18');
        px(ctx, 15 - Math.floor(Math.random() * 3), y, '#4a2a18');
    }
    textures.trunk_dark = toTexture(c);

    // 15: blossom_pink
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#ffb7c5'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#ffa7b5', '#ffc7d5', '#ff97a5', '#ffd7e5'], 30);
    textures.blossom_pink = toTexture(c);

    // 16: stone_path
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#9a9590'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#8a8580', '#aaa5a0', '#7a7570', '#bab5b0'], 35);
    textures.stone_path = toTexture(c);

    // 17: stone_lantern
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#8a8a8a'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#7a7a7a', '#9a9a9a', '#6a6a6a'], 25);
    textures.stone_lantern = toTexture(c);

    // 18: lantern_glow
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#ffcc44'; ctx.fillRect(0, 0, 16, 16);

    textures.lantern_glow = toTexture(c);

    // 19: sand
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#d4c4a0'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#c4b490', '#e4d4b0', '#b4a480'], 25);
    textures.sand = toTexture(c);

    // 20: armor_dark
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#2a2a3e', '#0a0a1e', '#252540'], 20);
    textures.armor_dark = toTexture(c);

    // 21: armor_blue
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#1a3a6a'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#2a4a7a', '#0a2a5a', '#1a4a8a'], 20);
    textures.armor_blue = toTexture(c);

    // 22: skin
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#e8b890'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#d8a880', '#f8c8a0', '#c89870'], 15);
    textures.skin = toTexture(c);

    // 23: wool_white
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#f8f4f0'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#e8e4e0', '#ffffff', '#d8d4d0'], 30);
    textures.wool_white = toTexture(c);

    // 24: fur_tan
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#c4a070'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#b49060', '#d4b080', '#a48050'], 25);
    textures.fur_tan = toTexture(c);

    // 25: bird_black
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#2a2a2a'; ctx.fillRect(0, 0, 16, 16);

    textures.bird_black = toTexture(c);

    // 26: orange
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#e87a20'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#d86a10', '#f88a30'], 10);
    textures.orange = toTexture(c);

    // 27: moss
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#3a6a2a'; ctx.fillRect(0, 0, 16, 16);
    noise(ctx, ['#2a5a1a', '#4a7a3a', '#3a6a20'], 30);
    textures.moss = toTexture(c);

    // 28: dark_wood
    c = makeCanvas(); ctx = c.getContext('2d');
    ctx.fillStyle = '#2a1a0a'; ctx.fillRect(0, 0, 16, 16);
    for (let y = 0; y < 16; y++) {
        if (Math.random() > 0.7) px(ctx, Math.floor(Math.random() * 16), y, '#1a0a00');
    }
    textures.dark_wood = toTexture(c);
}

// ═══════════════════════════════════════════════
// VOXEL ENGINE — InstancedMesh batching by texture
// ═══════════════════════════════════════════════
class VoxelEngine {
    constructor() {
        this.buckets = new Map();
        this.meshes = [];
    }

    add(x, y, z, size, texId) {
        if (!this.buckets.has(texId)) this.buckets.set(texId, []);
        this.buckets.get(texId).push(x, y, z, size);
    }

    build(scene) {
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const matrix = new THREE.Matrix4();

        for (const [texId, data] of this.buckets) {
            const count = data.length / 4;
            if (count === 0) continue;

            const mat = new THREE.MeshLambertMaterial({
                map: textures[texId],
                transparent: texId === 'water' || texId === 'paper',
                opacity: texId === 'water' ? 0.7 : texId === 'paper' ? 0.85 : 1.0,
            });

            const mesh = new THREE.InstancedMesh(boxGeo, mat, count);
            mesh.frustumCulled = false;

            for (let i = 0; i < count; i++) {
                const x = data[i * 4], y = data[i * 4 + 1], z = data[i * 4 + 2], s = data[i * 4 + 3];
                matrix.makeScale(s, s, s);
                matrix.setPosition(x, y, z);
                mesh.setMatrixAt(i, matrix);
            }
            mesh.instanceMatrix.needsUpdate = true;
            scene.add(mesh);
            this.meshes.push(mesh);
        }
    }
}

// ═══════════════════════════════════════════════
// VOXEL HELPERS
// ═══════════════════════════════════════════════
function v(engine, texId, x, y, z, size = VOXEL) {
    engine.add(x, y, z, size, texId);
}

function box(engine, texId, x1, y1, z1, x2, y2, z2, size = VOXEL) {
    const ax = Math.min(x1, x2), bx = Math.max(x1, x2);
    const ay = Math.min(y1, y2), by = Math.max(y1, y2);
    const az = Math.min(z1, z2), bz = Math.max(z1, z2);
    for (let x = ax; x <= bx; x++)
        for (let y = ay; y <= by; y++)
            for (let z = az; z <= bz; z++)
                engine.add(x, y, z, size, texId);
}

function cylinder(engine, texId, cx, y, cz, radius, height, size = VOXEL) {
    for (let x = cx - radius; x <= cx + radius; x++) {
        for (let z = cz - radius; z <= cz + radius; z++) {
            const dx = x - cx, dz = z - cz;
            if (dx * dx + dz * dz <= radius * radius) {
                for (let yy = 0; yy < height; yy++) {
                    engine.add(x, y + yy, z, size, texId);
                }
            }
        }
    }
}

function disc(engine, texId, cx, y, cz, radius, size = VOXEL) {
    for (let x = cx - radius; x <= cx + radius; x++) {
        for (let z = cz - radius; z <= cz + radius; z++) {
            const dx = x - cx, dz = z - cz;
            if (dx * dx + dz * dz <= radius * radius) {
                engine.add(x, y, z, size, texId);
            }
        }
    }
}

// ═══════════════════════════════════════════════
// GROUND & TERRAIN
// ═══════════════════════════════════════════════
function buildGround(engine) {
    const half = WORLD_SIZE / 2;
    // Main ground at y = -0.5 to 0 (top at y=0)
    for (let x = -half; x < half; x += 2) {
        for (let z = -half; z < half; z += 2) {
            // Gentle hills
            const h = Math.floor(
                Math.sin(x * 0.05) * 1.5 +
                Math.cos(z * 0.04) * 1.5 +
                Math.sin((x + z) * 0.03) * 1.0
            );
            const y = Math.max(-3, h);
            // Top layer grass
            engine.add(x, y, z, VOXEL, 'grass_top');
            engine.add(x + 1, y, z, VOXEL, 'grass_top');
            engine.add(x, y, z + 1, VOXEL, 'grass_top');
            engine.add(x + 1, y, z + 1, VOXEL, 'grass_top');
            // Below: dirt
            for (let yy = y - 1; yy >= y - 2; yy--) {
                engine.add(x, yy, z, VOXEL, 'dirt');
                engine.add(x + 1, yy, z, VOXEL, 'dirt');
                engine.add(x, yy, z + 1, VOXEL, 'dirt');
                engine.add(x + 1, yy, z + 1, VOXEL, 'dirt');
            }
        }
    }
}

// ═══════════════════════════════════════════════
// MOUNTAINS
// ═══════════════════════════════════════════════
function buildMountain(engine, cx, cz, radius, height) {
    for (let y = 0; y < height; y++) {
        const r = radius * (1 - y / height);
        for (let x = cx - radius; x <= cx + radius; x++) {
            for (let z = cz - radius; z <= cz + radius; z++) {
                const dx = x - cx, dz = z - cz;
                const dist = Math.sqrt(dx * dx + dz * dz);
                if (dist <= r) {
                    const texId = y > height * 0.7 ? 'snow' : (dist > r * 0.7 ? 'stone' : 'stone_dark');
                    engine.add(x, y, z, VOXEL, texId);
                }
            }
        }
    }
}

function buildMountains(engine) {
    buildMountain(engine, -50, -50, 18, 35);
    buildMountain(engine, -20, -60, 22, 45);
    buildMountain(engine, 20, -55, 20, 40);
    buildMountain(engine, 50, -45, 16, 30);
    buildMountain(engine, -60, -30, 15, 28);
    buildMountain(engine, 60, -30, 14, 26);
    buildMountain(engine, 0, -65, 25, 50);
    buildMountain(engine, -35, -55, 19, 38);
    buildMountain(engine, 40, -50, 17, 32);
}

// ═══════════════════════════════════════════════
// PAGODA
// ═══════════════════════════════════════════════
function buildPagoda(engine, cx, cz) {
    const baseY = 1;
    // Stone foundation
    box(engine, 'stone', cx - 6, baseY, cz - 6, cx + 6, baseY + 1, cz + 6, VOXEL);

    // 3 tiers
    const tierSize = 5;
    for (let tier = 0; tier < 3; tier++) {
        const size = tierSize - tier;
        const y = baseY + 2 + tier * 5;
        const halfSize = Math.floor(size / 2);

        // Floor platform
        box(engine, 'wood_dark', cx - halfSize - 1, y, cz - halfSize - 1, cx + halfSize + 1, y, cz + halfSize + 1, VOXEL);

        // Corner beams (dark wood)
        for (let corner = 0; corner < 4; corner++) {
            const bx = corner < 2 ? cx - halfSize : cx + halfSize;
            const bz = corner % 2 === 0 ? cz - halfSize : cz + halfSize;
            box(engine, 'wood_dark', bx, y + 1, bz, bx, y + 4, bz, VOXEL);
        }

        // Shoji paper walls
        for (let side = 0; side < 4; side++) {
            for (let i = -halfSize + 1; i <= halfSize - 1; i++) {
                let wx, wz;
                if (side === 0) { wx = cx + i; wz = cz - halfSize; }
                else if (side === 1) { wx = cx + i; wz = cz + halfSize; }
                else if (side === 2) { wx = cx - halfSize; wz = cz + i; }
                else { wx = cx + halfSize; wz = cz + i; }

                // Wood frame + paper
                if (i === -halfSize + 1 || i === halfSize - 1) {
                    engine.add(wx, y + 1, wz, VOXEL, 'wood_light');
                    engine.add(wx, y + 2, wz, VOXEL, 'wood_light');
                    engine.add(wx, y + 3, wz, VOXEL, 'wood_light');
                } else {
                    engine.add(wx, y + 1, wz, VOXEL, 'paper');
                    engine.add(wx, y + 2, wz, VOXEL, 'paper');
                    engine.add(wx, y + 3, wz, VOXEL, 'wood_light');
                }
            }
        }

        // Roof (tiered, flared)
        const roofY = y + 5;
        const roofOverhang = halfSize + 2;
        for (let r = 0; r < 2; r++) {
            const overhang = roofOverhang - r;
            const ry = roofY + r;
            box(engine, 'roof_tile', cx - overhang, ry, cz - overhang, cx + overhang, ry, cz + overhang, VOXEL);
        }
        // Roof edge trim
        box(engine, 'wood_dark', cx - roofOverhang, roofY + 1, cz - roofOverhang, cx + roofOverhang, roofY + 1, cz + roofOverhang, VOXEL);
        // Fill edges
        for (let i = -roofOverhang; i <= roofOverhang; i++) {
            engine.add(cx + i, roofY + 1, cz - roofOverhang, VOXEL, 'wood_dark');
            engine.add(cx + i, roofY + 1, cz + roofOverhang, VOXEL, 'wood_dark');
            engine.add(cx - roofOverhang, roofY + 1, cz + i, VOXEL, 'wood_dark');
            engine.add(cx + roofOverhang, roofY + 1, cz + i, VOXEL, 'wood_dark');
        }
    }

    // Gold spire (Sorin)
    const spireY = baseY + 2 + 3 * 5 + 2;
    engine.add(cx, spireY, cz, VOXEL, 'gold');
    engine.add(cx, spireY + 1, cz, VOXEL, 'gold');
    engine.add(cx, spireY + 2, cz, VOXEL, 'gold');
    engine.add(cx, spireY + 3, cz, VOXEL, 'gold');
    engine.add(cx, spireY + 4, cz, VOXEL, 'gold');
    // Rings
    box(engine, 'gold', cx - 1, spireY + 1, cz, cx + 1, spireY + 1, cz, VOXEL);
    box(engine, 'gold', cx, spireY + 2, cz - 1, cx, spireY + 2, cz + 1, VOXEL);
    box(engine, 'gold', cx - 1, spireY + 3, cz, cx + 1, spireY + 3, cz, VOXEL);
}

// ═══════════════════════════════════════════════
// TORII GATE
// ═══════════════════════════════════════════════
function buildTorii(engine, cx, cz) {
    const baseY = 1;
    // Two pillars
    box(engine, 'red', cx - 4, baseY, cz, cx - 4, baseY + 6, cz, VOXEL);
    box(engine, 'red', cx + 4, baseY, cz, cx + 4, baseY + 6, cz, VOXEL);
    // Pillar tops
    box(engine, 'red', cx - 5, baseY + 6, cz, cx - 3, baseY + 6, cz, VOXEL);
    box(engine, 'red', cx + 3, baseY + 6, cz, cx + 5, baseY + 6, cz, VOXEL);

    // Top beam (kasagi) - curved up at ends
    box(engine, 'red', cx - 6, baseY + 7, cz, cx + 6, baseY + 7, cz, VOXEL);
    box(engine, 'red', cx - 5, baseY + 8, cz, cx + 5, baseY + 8, cz, VOXEL);

    // Second beam (nuki)
    box(engine, 'red', cx - 5, baseY + 5, cz, cx + 5, baseY + 5, cz, VOXEL);

    // Central plaque (gakuzuka)
    box(engine, 'dark_wood', cx - 1, baseY + 5, cz - 1, cx + 1, baseY + 6, cz + 1, VOXEL);
}

// ═══════════════════════════════════════════════
// BRIDGE & POND
// ═══════════════════════════════════════════════
function buildBridge(engine, cx, cz) {
    const baseY = 0;
    // Arched bridge
    for (let i = -8; i <= 8; i++) {
        const arch = Math.floor(Math.cos((i / 8) * Math.PI * 0.5) * 3);
        const x = cx + i;
        // Bridge deck
        box(engine, 'red', x, baseY + arch, cz - 1, x, baseY + arch, cz + 1, VOXEL);
        // Railings
        engine.add(x, baseY + arch + 1, cz - 1, VOXEL, 'red');
        engine.add(x, baseY + arch + 1, cz + 1, VOXEL, 'red');
        // Posts every few blocks
        if (i % 3 === 0) {
            engine.add(x, baseY + arch + 2, cz - 1, VOXEL, 'red');
            engine.add(x, baseY + arch + 2, cz + 1, VOXEL, 'red');
        }
    }
}

function buildPond(engine, cx, cz) {
    const baseY = -1;
    // Elliptical pond
    for (let x = cx - 10; x <= cx + 10; x++) {
        for (let z = cz - 7; z <= cz + 7; z++) {
            const dx = (x - cx) / 10, dz = (z - cz) / 7;
            if (dx * dx + dz * dz <= 1) {
                engine.add(x, baseY, z, VOXEL, 'water');
                // Bank
                if (dx * dx + dz * dz > 0.8 && dx * dx + dz * dz <= 1.1) {
                    engine.add(x, baseY + 1, z, VOXEL, 'stone');
                }
            }
        }
    }
    // Lily pads
    const lilyPositions = [
        [cx - 3, cz - 2], [cx + 2, cz + 1], [cx - 5, cz + 3], [cx + 4, cz - 3], [cx, cz + 2]
    ];
    for (const [lx, lz] of lilyPositions) {
        engine.add(lx, baseY + 0.5, lz, VOXEL * 0.8, 'moss');
    }
}

// ═══════════════════════════════════════════════
// BAMBOO
// ═══════════════════════════════════════════════
function buildBamboo(engine, cx, cz) {
    const baseY = 1;
    const height = 8 + Math.floor(Math.random() * 5);
    for (let y = 0; y < height; y++) {
        engine.add(cx, baseY + y, cz, VOXEL, 'bamboo');
        // Nodes
        if (y % 3 === 0 && y > 0) {
            engine.add(cx, baseY + y, cz, VOXEL, 'bamboo_dark');
        }
    }
    // Leaves at top
    for (let i = 0; i < 4; i++) {
        const dx = Math.floor(Math.random() * 3) - 1;
        const dz = Math.floor(Math.random() * 3) - 1;
        engine.add(cx + dx, baseY + height + Math.floor(Math.random() * 2), cz + dz, VOXEL * 0.6, 'bamboo');
    }
}

function buildBambooGrove(engine) {
    const positions = [
        [-30, 10], [-32, 14], [-28, 16], [-35, 8], [-33, 12],
        [30, 15], [33, 12], [28, 18], [35, 20], [31, 10],
        [-25, 20], [-27, 22], [25, 25], [27, 23]
    ];
    for (const [x, z] of positions) {
        buildBamboo(engine, x, z);
    }
}

// ═══════════════════════════════════════════════
// SAKURA TREES
// ═══════════════════════════════════════════════
function buildSakura(engine, cx, cz) {
    const baseY = 1;
    const trunkH = 4 + Math.floor(Math.random() * 3);
    // Trunk
    for (let y = 0; y < trunkH; y++) {
        engine.add(cx, baseY + y, cz, VOXEL, 'trunk_dark');
    }
    // Branches
    for (let i = 0; i < 4; i++) {
        const dx = Math.floor(Math.random() * 3) - 1;
        const dz = Math.floor(Math.random() * 3) - 1;
        for (let j = 1; j <= 2; j++) {
            engine.add(cx + dx * j, baseY + trunkH - 1 + j, cz + dz * j, VOXEL * 0.5, 'trunk_dark');
        }
    }
    // Canopy (blossoms)
    for (let dx = -3; dx <= 3; dx++) {
        for (let dz = -3; dz <= 3; dz++) {
            for (let dy = 0; dy <= 2; dy++) {
                const dist = Math.abs(dx) + Math.abs(dz) + Math.abs(dy - 1);
                if (dist <= 3 && Math.random() > 0.2) {
                    engine.add(cx + dx, baseY + trunkH + dy, cz + dz, VOXEL * 0.8, 'blossom_pink');
                }
            }
        }
    }
}

function buildSakuraGrove(engine) {
    const positions = [
        [-15, 5], [-12, 10], [15, 8], [18, 12],
        [-20, 0], [20, 0], [-10, 15], [10, 18]
    ];
    for (const [x, z] of positions) {
        buildSakura(engine, x, z);
    }
}

// ═══════════════════════════════════════════════
// PATHWAYS
// ═══════════════════════════════════════════════
function buildPathways(engine) {
    // Main path from torii to pagoda
    for (let z = 5; z < 35; z += 1) {
        const wobble = Math.floor(Math.sin(z * 0.15) * 1);
        engine.add(wobble, 1, z, VOXEL, 'stone_path');
        engine.add(wobble + 1, 1, z, VOXEL, 'stone_path');
    }
    // Side paths
    for (let x = -20; x < 0; x += 1) {
        engine.add(x, 1, 20, VOXEL, 'stone_path');
        engine.add(x, 1, 21, VOXEL, 'stone_path');
    }
    for (let x = 1; x < 20; x += 1) {
        engine.add(x, 1, 25, VOXEL, 'stone_path');
        engine.add(x, 1, 26, VOXEL, 'stone_path');
    }
    // Stepping stones
    for (let i = 0; i < 8; i++) {
        const sx = -25 + i * 3 + Math.floor(Math.random() * 2);
        const sz = 30 + Math.floor(Math.random() * 3);
        engine.add(sx, 1, sz, VOXEL * 1.5, 'stone_dark');
    }
}

// LANTERNS
// ═══════════════════════════════════════════════
const lanterns = []; // For point lights

function buildStoneLantern(engine, cx, cz) {
    const baseY = 1;
    // Base
    box(engine, 'stone_lantern', cx - 1, baseY, cz - 1, cx + 1, baseY, cz + 1, VOXEL);
    // Post
    box(engine, 'stone_lantern', cx, baseY + 1, cz, cx, baseY + 3, cz, VOXEL);
    // Light chamber
    box(engine, 'stone_lantern', cx - 1, baseY + 4, cz - 1, cx + 1, baseY + 4, cz + 1, VOXEL);
    engine.add(cx, baseY + 5, cz, VOXEL, 'lantern_glow');

    box(engine, 'stone_lantern', cx - 1, baseY + 6, cz - 1, cx + 1, baseY + 6, cz + 1, VOXEL);
    engine.add(cx, baseY + 7, cz, VOXEL * 0.5, 'stone_lantern');

    lanterns.push({ x: cx, y: baseY + 5, z: cz });
}

function buildHangingLantern(engine, cx, y, cz) {

}

    buildStoneLantern(engine, -25, 30);

    buildStoneLantern(engine, -8, 38);

}

class Samurai {

    build() {
        const m = (tex, x, y, z, sx, sy, sz) => {

            mesh.position.set(x * MICRO, y * MICRO, z * MICRO);
            this.group.add(mesh);
            return mesh;
        };

        // Legs
        m('armor_dark', -1, 0, 0, 2, 3, 2);
        m('armor_dark', 1, 0, 0, 2, 3, 2);
        // Torso (do)
        m('armor_blue', 0, 3, 0, 5, 4, 3);
        m('armor_dark', 0, 4, 0, 4, 3, 2.5);
        // Shoulder guards (sode)
        m('armor_dark', -3, 5, 0, 2, 3, 3);
        m('armor_dark', 3, 5, 0, 2, 3, 3);
        // Arms
        m('armor_dark', -2, 2, 0, 1.5, 3, 1.5);
        m('armor_dark', 2, 2, 0, 1.5, 3, 1.5);
        // Neck
        m('skin', 0, 7, 0, 1, 1, 1);
        // Head
        m('skin', 0, 8, 0, 2, 2, 2);
        // Helmet (kabuto)
        m('armor_dark', 0, 9, 0, 3, 2, 3);
        m('armor_dark', 0, 10, 0, 2.5, 1, 2.5);
        // Crescent crest
        m('gold', 0, 10.5, -1, 0.5, 2, 0.5);
        m('gold', 0.5, 10.5, -1.5, 1, 0.5, 0.5);
        m('gold', -0.5, 10.5, -1.5, 1, 0.5, 0.5);
        // Katana (sheathed)

        m('dark_wood', 0, 3, 0, 5, 0.5, 3);
    }

    update(t) {
        // Breathing: subtle scale on torso area

    }
}

class Sheep {
    constructor(x, y, z) {
        this.group = new THREE.Group();
        this.group.position.set(x, y, z);
        this.speed = 0.3 + Math.random() * 0.2;
        this.dir = Math.random() * Math.PI * 2;
        this.targetDir = this.dir;
        this.bobPhase = Math.random() * Math.PI * 2;
        this.wanderTimer = 0;
        this.build();
    }

    build() {
        const m = (tex, x, y, z, sx, sy, sz) => {
            const geo = new THREE.BoxGeometry(sx * MICRO * 3, sy * MICRO * 3, sz * MICRO * 3);
            const mat = new THREE.MeshLambertMaterial({ map: textures[tex] });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x * MICRO * 3, y * MICRO * 3, z * MICRO * 3);
            this.group.add(mesh);
            return mesh;
        };

        // Body (fluffy wool)
        m('wool_white', 0, 1, 0, 4, 3, 6);
        m('wool_white', 0, 2, 0, 3, 2, 5);
        // Head
        m('wool_white', 0, 1.5, -4, 2, 2, 2);
        m('bird_black', 0, 1.5, -5, 1, 1, 1); // face
        // Legs
        m('bird_black', -1, 0, -2, 1, 2, 1);
        m('bird_black', 1, 0, -2, 1, 2, 1);
        m('bird_black', -1, 0, 2, 1, 2, 1);
        m('bird_black', 1, 0, 2, 1, 2, 1);
        // Ears
        m('wool_white', -1.5, 2.5, -4, 0.8, 0.8, 0.5);
        m('wool_white', 1.5, 2.5, -4, 0.8, 0.8, 0.5);
    }

    update(t, dt) {
        // Wandering
        this.wanderTimer -= dt;
        if (this.wanderTimer <= 0) {
            this.targetDir = Math.random() * Math.PI * 2;
            this.wanderTimer = 3 + Math.random() * 4;
        }
        this.dir += (this.targetDir - this.dir) * 0.02;

        // Movement
        this.group.position.x += Math.sin(this.dir) * this.speed * dt;
        this.group.position.z += Math.cos(this.dir) * this.speed * dt;
        this.group.rotation.y = this.dir + Math.PI;

        // Grazing bob
        this.bobPhase += dt * 3;
        this.group.position.y += Math.sin(this.bobPhase) * 0.003;

        // Keep in bounds
        const bx = 30;
        if (Math.abs(this.group.position.x) > bx) this.dir = Math.PI - this.dir;
        if (Math.abs(this.group.position.z) > bx) this.dir = -this.dir;
    }
}

        const bx = 28;
        if (Math.abs(this.group.position.x) > bx) this.dir = Math.PI - this.dir;

class Bird {
    constructor() {
        this.group = new THREE.Group();
        this.speed = 2 + Math.random() * 3;
        this.phase = Math.random() * Math.PI * 2;
        this.orbitRadius = 20 + Math.random() * 30;
        this.orbitHeight = 25 + Math.random() * 15;
        this.orbitSpeed = 0.1 + Math.random() * 0.15;
        this.flapSpeed = 8 + Math.random() * 4;
        this.flapPhase = Math.random() * Math.PI * 2;
        this.build();
    }

    build() {
        const m = (tex, x, y, z, sx, sy, sz) => {
            const geo = new THREE.BoxGeometry(sx * MICRO * 2, sy * MICRO * 2, sz * MICRO * 2);
            const mat = new THREE.MeshLambertMaterial({ map: textures[tex] });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x * MICRO * 2, y * MICRO * 2, z * MICRO * 2);
            this.group.add(mesh);
            return mesh;
        };

        // Body
        m('bird_black', 0, 0, 0, 2, 1.5, 3);
        // Head
        m('bird_black', 0, 0.5, -2, 1.2, 1.2, 1);
        m('orange', 0, 0.3, -3, 0.8, 0.5, 0.8); // beak
        // Wings (pivot points for flapping)
        this.leftWing = new THREE.Group();
        this.leftWing.position.set(-1.2, 0, 0);
        this.group.add(this.leftWing);
        const lw = new THREE.Mesh(
            new THREE.BoxGeometry(2 * MICRO * 2, 0.3 * MICRO * 2, 2.5 * MICRO * 2),
            new THREE.MeshLambertMaterial({ map: textures['bird_black'] })
        );
        lw.position.set(-1 * MICRO * 2, 0, 0);
        this.leftWing.add(lw);

        this.rightWing = new THREE.Group();
        this.rightWing.position.set(1.2, 0, 0);
        this.group.add(this.rightWing);
        const rw = new THREE.Mesh(
            new THREE.BoxGeometry(2 * MICRO * 2, 0.3 * MICRO * 2, 2.5 * MICRO * 2),
            new THREE.MeshLambertMaterial({ map: textures['bird_black'] })
        );
        rw.position.set(1 * MICRO * 2, 0, 0);
        this.rightWing.add(rw);

        // Tail
        m('bird_black', 0, 0, 2.5, 0.8, 0.5, 1.5);
    }

    update(t, dt) {
        // Circular soaring
        this.phase += this.orbitSpeed * dt;
        this.group.position.x = Math.sin(this.phase) * this.orbitRadius;
        this.group.position.z = Math.cos(this.phase) * this.orbitRadius;
        this.group.position.y = this.orbitHeight + Math.sin(this.phase * 0.5) * 3;
        this.group.rotation.y = -this.phase + Math.PI / 2;

        // Wing flapping
        this.flapPhase += this.flapSpeed * dt;
        const flap = Math.sin(this.flapPhase) * 0.6;
        this.leftWing.rotation.z = flap;
        this.rightWing.rotation.z = -flap;
    }
}

// CLOUDS
// ═══════════════════════════════════════════════
const clouds = [];

function buildClouds(scene, engine) {
    for (let i = 0; i < 12; i++) {
        const cloudGroup = new THREE.Group();
        const cx = (Math.random() - 0.5) * 150;
        const cy = 40 + Math.random() * 15;
        const cz = (Math.random() - 0.5) * 150;

        // Build cloud from white voxels
        const numBlocks = 8 + Math.floor(Math.random() * 8);
        for (let j = 0; j < numBlocks; j++) {
            const geo = new THREE.BoxGeometry(2, 2, 2);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 3,
                (Math.random() - 0.5) * 6
            );
            cloudGroup.add(mesh);
        }
        cloudGroup.position.set(cx, cy, cz);
        scene.add(cloudGroup);
        clouds.push({ group: cloudGroup, speed: 0.2 + Math.random() * 0.3 });
    }
}

function updateClouds(dt) {
    for (const c of clouds) {
        c.group.position.x += c.speed * dt;
        if (c.group.position.x > 80) c.group.position.x = -80;
    }
}

// ═══════════════════════════════════════════════
// SAKURA PETALS (particle system)
// ═══════════════════════════════════════════════
let petalSystem;
const petalPositions = [];

function buildPetals(scene) {
    const count = 200;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const velocities = [];

    for (let i = 0; i < count; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 80;
        positions[i * 3 + 1] = 10 + Math.random() * 20;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 80;
        velocities.push({
            x: (Math.random() - 0.5) * 0.3,
            y: -0.3 - Math.random() * 0.2,
            z: (Math.random() - 0.5) * 0.3,
            phase: Math.random() * Math.PI * 2
        });
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({
        color: 0xffb7c5,
        size: 0.3,
        transparent: true,
        opacity: 0.8
    });
    petalSystem = new THREE.Points(geometry, material);
    scene.add(petalSystem);
    return velocities;
}

function updatePetals(velocities, dt) {
    const positions = petalSystem.geometry.attributes.position.array;
    for (let i = 0; i < velocities.length; i++) {
        const v = velocities[i];
        v.phase += dt * 2;
        positions[i * 3] += v.x + Math.sin(v.phase) * 0.1;
        positions[i * 3 + 1] += v.y;
        positions[i * 3 + 2] += v.z + Math.cos(v.phase) * 0.1;

        if (positions[i * 3 + 1] < 0) {
            positions[i * 3] = (Math.random() - 0.5) * 80;
            positions[i * 3 + 1] = 25 + Math.random() * 10;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 80;
        }
    }
    petalSystem.geometry.attributes.position.needsUpdate = true;
}

// DAY / NIGHT SYSTEM
// ═══════════════════════════════════════════════
class DayNightSystem {
    constructor(scene) {
        this.scene = scene;
        this.mode = 'sunset';
        this.time = 0;

        // Sun/Moon
        this.sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        this.sunLight.castShadow = true;
        this.sunLight.shadow.mapSize.width = 2048;
        this.sunLight.shadow.mapSize.height = 2048;
        this.sunLight.shadow.camera.near = 0.5;
        this.sunLight.shadow.camera.far = 200;
        this.sunLight.shadow.camera.left = -80;
        this.sunLight.shadow.camera.right = 80;
        this.sunLight.shadow.camera.top = 80;
        this.sunLight.shadow.camera.bottom = -80;
        scene.add(this.sunLight);
        scene.add(this.sunLight.target);

        // Sun/Moon visible sprite
        this.sunMesh = new THREE.Mesh(
            new THREE.BoxGeometry(4, 4, 4),
            new THREE.MeshBasicMaterial({ color: 0xffee88 })
        );
        scene.add(this.sunMesh);

        // Ambient
        this.ambientLight = new THREE.AmbientLight(0x404060, 0.4);
        scene.add(this.ambientLight);

        // Hemisphere light
        this.hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x3a5a2a, 0.3);
        scene.add(this.hemiLight);

        // Fog
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.006);

        // Lantern lights
        this.lanternLights = [];
    }

    addLanternLights() {
        for (const l of lanterns) {
            const light = new THREE.PointLight(0xffaa33, 0, 8, 2);
            light.position.set(l.x, l.y, l.z);
            this.scene.add(light);
            this.lanternLights.push(light);
        }
    }

    setMode(mode) {
        this.mode = mode;
        switch (mode) {
            case 'morning':
                this.sunMesh.material.color.setHex(0xffee88);
                this.scene.background = new THREE.Color(0x87ceeb);
                this.scene.fog.color.setHex(0x87ceeb);
                this.sunLight.color.setHex(0xfff4e0);
                this.sunLight.intensity = 1.5;
                this.ambientLight.color.setHex(0x6080a0);
                this.ambientLight.intensity = 0.5;
                this.hemiLight.intensity = 0.4;
                break;
            case 'sunset':
                this.sunMesh.material.color.setHex(0xff8844);
                this.scene.background = new THREE.Color(0xff7744);
                this.scene.fog.color.setHex(0xff8866);
                this.sunLight.color.setHex(0xff9966);
                this.sunLight.intensity = 1.2;
                this.ambientLight.color.setHex(0x604050);
                this.ambientLight.intensity = 0.4;
                this.hemiLight.intensity = 0.3;
                break;
            case 'night':
                this.sunMesh.material.color.setHex(0xc8d8ff);
                this.scene.background = new THREE.Color(0x0a0a2a);
                this.scene.fog.color.setHex(0x0a0a2a);
                this.sunLight.color.setHex(0x4466aa);
                this.sunLight.intensity = 0.4;
                this.ambientLight.color.setHex(0x1a1a3a);
                this.ambientLight.intensity = 0.25;
                this.hemiLight.intensity = 0.15;
                break;
        }
    }

    update(dt) {
        this.time += dt * 0.1;
        // Move sun/moon in arc
        const arcAngle = this.time;
        this.sunMesh.position.set(
            Math.sin(arcAngle) * 60,
            Math.cos(arcAngle) * 40 + 30,
            -50
        );
        this.sunLight.position.copy(this.sunMesh.position);
        this.sunLight.target.position.set(0, 0, 0);

        // Lantern intensity based on mode
        const lanternIntensity = this.mode === 'night' ? 2.5 : (this.mode === 'sunset' ? 1.0 : 0.0);
        for (const l of this.lanternLights) {
            l.intensity = lanternIntensity + Math.sin(this.time * 3 + l.position.x) * 0.2;
        }
    }
}

// ═══════════════════════════════════════════════
// AMBIENT AUDIO (Web Audio API)
// ═══════════════════════════════════════════════
class AmbientAudio {
    constructor() {
        this.ctx = null;
        this.enabled = true;
        this.started = false;
        this.chimeTimer = 0;
    }

    init() {
        if (this.ctx) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();

        // Wind: filtered noise
        const bufferSize = this.ctx.sampleRate * 4;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * 0.5;
        }

        this.windSource = this.ctx.createBufferSource();
        this.windSource.buffer = buffer;
        this.windSource.loop = true;

        // Bandpass filter for wind
        this.windFilter = this.ctx.createBiquadFilter();
        this.windFilter.type = 'bandpass';
        this.windFilter.frequency.value = 400;
        this.windFilter.Q.value = 0.5;

        this.windGain = this.ctx.createGain();
        this.windGain.gain.value = 0.08;

        this.windSource.connect(this.windFilter);
        this.windFilter.connect(this.windGain);
        this.windGain.connect(this.ctx.destination);
        this.windSource.start();

        // LFO for wind modulation
        this.lfo = this.ctx.createOscillator();
        this.lfo.frequency.value = 0.15;
        this.lfoGain = this.ctx.createGain();
        this.lfoGain.gain.value = 200;
        this.lfo.connect(this.lfoGain);
        this.lfoGain.connect(this.windFilter.frequency);
        this.lfo.start();

        this.started = true;
    }

    playChime() {
        if (!this.ctx || !this.enabled) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const notes = [523, 587, 659, 698, 784, 880, 988, 1047];
        osc.frequency.value = notes[Math.floor(Math.random() * notes.length)];
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 3);
    }

    update(dt) {
        if (!this.ctx || !this.enabled) return;
        this.chimeTimer -= dt;
        if (this.chimeTimer <= 0) {
            this.playChime();
            this.chimeTimer = 4 + Math.random() * 8;
        }
    }

    toggle() {
        this.enabled = !this.enabled;
        if (this.ctx) {
            this.windGain.gain.value = this.enabled ? 0.08 : 0;
        }
        return this.enabled;
    }
}

// ═══════════════════════════════════════════════
// CAMERA PRESETS
// ═══════════════════════════════════════════════
const cameraPresets = {
    pagoda: { pos: new THREE.Vector3(0, 18, 50), target: new THREE.Vector3(0, 10, 0) },
    samurai: { pos: new THREE.Vector3(8, 4, 12), target: new THREE.Vector3(0, 3, 0) },
    meadow: { pos: new THREE.Vector3(-25, 12, 30), target: new THREE.Vector3(-15, 2, 10) },
    mountain: { pos: new THREE.Vector3(0, 30, 80), target: new THREE.Vector3(0, 15, -30) },
    birds: { pos: new THREE.Vector3(0, 60, 0.1), target: new THREE.Vector3(0, 0, 0) }
};

let currentPreset = null;

function animateCamera(camera, controls, preset) {
    currentPreset = preset;
    const startPos = camera.position.clone();
    const startTarget = controls.target.clone();
    const endPos = preset.pos.clone();
    const endTarget = preset.target.clone();
    let t = 0;

    function step() {
        t += 0.02;
        if (t >= 1) t = 1;
        const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        camera.position.lerpVectors(startPos, endPos, ease);
        controls.target.lerpVectors(startTarget, endTarget, ease);
        controls.update();
        if (t < 1) requestAnimationFrame(step);
    }
    step();
}

// ═══════════════════════════════════════════════
// MAIN INITIALIZATION
// ═══════════════════════════════════════════════
let scene, camera, renderer, controls;
let dayNight, audio;
const characters = [];
let petalVelocities;

function init() {
    // Renderer
    const canvas = document.getElementById('canvas');
    renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    // Scene
    scene = new THREE.Scene();

    // Camera
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 300);
    camera.position.set(0, 18, 50);

    // Controls
    controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minDistance = 5;
    controls.maxDistance = 100;
    controls.target.set(0, 10, 0);

    // Generate textures
    generateTextures();

    // Build world
    const engine = new VoxelEngine();
    buildGround(engine);
    buildMountains(engine);
    buildPagoda(engine, 0, 35);
    buildTorii(engine, 0, 5);
    buildBridge(engine, 20, 0);
    buildPond(engine, 20, 0);
    buildBambooGrove(engine);
    buildSakuraGrove(engine);
    buildPathways(engine);
    buildAllLanterns(engine);
    buildClouds(scene, engine);
    engine.build(scene);

    // Day/Night
    dayNight = new DayNightSystem(scene);
    dayNight.addLanternLights();
    dayNight.setMode('sunset');

    // Characters
    const samurai1 = new Samurai(5, 1, 10, -0.3);
    const samurai2 = new Samurai(-5, 1, 10, 0.3);
    scene.add(samurai1.group);
    scene.add(samurai2.group);
    characters.push(samurai1, samurai2);

    // Sheep
    for (let i = 0; i < 5; i++) {
        const sheep = new Sheep(-15 + Math.random() * 10, 1, 8 + Math.random() * 8);
        scene.add(sheep.group);
        characters.push(sheep);
    }

    // Alpacas
    for (let i = 0; i < 3; i++) {
        const alpaca = new Alpaca(10 + Math.random() * 10, 1, 10 + Math.random() * 8);
        scene.add(alpaca.group);
        characters.push(alpaca);
    }

    // Birds
    for (let i = 0; i < 12; i++) {
        const bird = new Bird();
        scene.add(bird.group);
        characters.push(bird);
    }

    // Petals
    petalVelocities = buildPetals(scene);

    // Audio
    audio = new AmbientAudio();

    // UI Events
    setupUI();

    // Window resize
    window.addEventListener('resize', onResize);

    // Hide loading
    setTimeout(() => {
        document.getElementById('loading').classList.add('hidden');
    }, 500);

    // Start loop
    animate();
}

function setupUI() {
    // Camera presets
    document.querySelectorAll('[data-cam]').forEach(btn => {
        btn.addEventListener('click', () => {
            const cam = btn.dataset.cam;
            if (cameraPresets[cam]) {
                animateCamera(camera, controls, cameraPresets[cam]);
            }
        });
    });

    // Time modes
    document.querySelectorAll('[data-time]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('[data-time]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            dayNight.setMode(btn.dataset.time);
        });
    });

    // Audio
    const audioBtn = document.getElementById('audioBtn');
    audioBtn.addEventListener('click', () => {
        if (!audio.started) {
            audio.init();
        } else {
            audio.toggle();
        }
        audioBtn.textContent = audio.enabled ? '🔊 Sound' : '🔇 Muted';
        audioBtn.classList.toggle('active', !audio.enabled);
    });

    // Start audio on first interaction (browser policy)
    const startAudio = () => {
        if (!audio.started) {
            audio.init();
        }
        document.removeEventListener('click', startAudio);
        document.removeEventListener('keydown', startAudio);
    };
    document.addEventListener('click', startAudio);
    document.addEventListener('keydown', startAudio);
}

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// ═══════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.getElapsedTime();

    // Update controls
    controls.update();

    // Update day/night
    dayNight.update(dt);

    // Update clouds
    updateClouds(dt);

    // Update petals
    updatePetals(petalVelocities, dt);

    // Update characters
    for (const c of characters) {
        c.update(t, dt);
    }

    // Update audio
    audio.update(dt);

    // Render
    renderer.render(scene, camera);
}

// ═══════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════
init();

</script>
