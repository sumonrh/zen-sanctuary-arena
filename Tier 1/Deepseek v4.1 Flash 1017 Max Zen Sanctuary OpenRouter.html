<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#111714" />
<title>静寂の里 — Sanctuary of Stillness</title>
<meta name="description" content="A procedural voxel Japanese Zen sanctuary and mountain landscape, built with Three.js." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --ink: #0d1210;
    --paper: #f1eadc;
    --gold: #e5bd7d;
    --gold-bright: #f7dca4;
    --glass-border: rgba(255, 255, 255, .16);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0a1110;
    font-family: "Manrope", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { overscroll-behavior: none; touch-action: none; }
  .font-jp { font-family: "Noto Serif JP", "Yu Mincho", serif; }
  #world {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; outline: none; touch-action: none;
  }
  #vignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 42%, transparent 45%, rgba(4, 8, 7, .28) 82%, rgba(2, 5, 4, .48) 100%),
      linear-gradient(to bottom, rgba(0,0,0,.08), transparent 18%, transparent 78%, rgba(0,0,0,.18));
  }
  #grain {
    position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: .045;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");
    background-size: 180px 180px;
    mix-blend-mode: soft-light;
  }
  #hud {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: clamp(14px, 2vw, 26px);
    opacity: 0; transition: opacity 1.2s cubic-bezier(.2,.7,.2,1);
  }
  #hud.ready { opacity: 1; }
  .glass {
    background: linear-gradient(140deg, rgba(17, 23, 20, .68), rgba(14, 20, 18, .36));
    -webkit-backdrop-filter: blur(20px) saturate(1.15);
    backdrop-filter: blur(20px) saturate(1.15);
    border: 1px solid var(--glass-border);
    box-shadow: 0 18px 55px rgba(0, 0, 0, .32), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .eyebrow {
    font-size: 8px; line-height: 1; font-weight: 600;
    letter-spacing: .3em; text-transform: uppercase;
    color: rgba(240, 232, 218, .48);
  }
  .brand-card {
    border-radius: 3px 18px 18px 18px;
    padding: 13px 17px 13px 13px;
    display: flex; align-items: center; gap: 14px;
    position: relative; overflow: hidden;
  }
  .brand-card::after {
    content: ""; position: absolute; right: -34px; bottom: -46px;
    width: 130px; height: 130px; border-radius: 50%;
    border: 1px solid rgba(229,189,125,.12);
    box-shadow: 0 0 0 18px rgba(229,189,125,.025), 0 0 0 40px rgba(229,189,125,.018);
    pointer-events: none;
  }
  .seal {
    width: 48px; height: 48px; flex: 0 0 auto;
    display: grid; place-items: center;
    border: 1px solid rgba(229,189,125,.48);
    background: linear-gradient(145deg, rgba(150,55,42,.45), rgba(83,32,27,.25));
    color: var(--gold-bright);
    font-family: "Noto Serif JP", serif; font-size: 24px; font-weight: 600;
    box-shadow: inset 0 0 18px rgba(229,189,125,.11);
    position: relative;
  }
  .seal::before, .seal::after {
    content: ""; position: absolute; inset: 4px;
    border: 1px solid rgba(229,189,125,.16); pointer-events: none;
  }
  .seal::after { inset: 7px; border-color: rgba(255,255,255,.06); }
  .brand-title { color: #f3ecdf; font-size: clamp(19px, 2vw, 27px); line-height: 1.06; letter-spacing: .06em; }
  .brand-sub { color: rgba(243,236,223,.56); font-size: 8px; letter-spacing: .28em; margin-top: 5px; }
  .status-card {
    border-radius: 16px;
    padding: 13px 16px;
    min-width: 188px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .orb {
    width: 28px; height: 28px; border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #fff4cb 0 17%, #f0b75e 36%, #b55d37 70%, transparent 72%);
    box-shadow: 0 0 24px rgba(255, 187, 91, .38);
    transition: background .9s ease, box-shadow .9s ease, transform .9s ease;
    flex: 0 0 auto;
  }
  .orb.sunset {
    background: radial-gradient(circle at 50% 62%, #ffe3a3 0 15%, #ff9b56 35%, #cb4f39 64%, transparent 66%);
    box-shadow: 0 0 28px rgba(255, 132, 77, .4);
  }
  .orb.night {
    background: radial-gradient(circle at 63% 36%, #f2f4de 0 42%, #c8d4de 49%, #8097b7 62%, transparent 64%);
    box-shadow: 0 0 20px rgba(170, 199, 236, .3);
    transform: rotate(-16deg);
  }
  .status-name { font-size: 13px; color: #f2ecdf; font-weight: 500; letter-spacing: .02em; }
  .status-time { font-size: 10px; color: rgba(242,236,223,.5); letter-spacing: .14em; }
  .hairline { height: 1px; background: linear-gradient(to right, rgba(255,255,255,.12), rgba(255,255,255,.02)); }
  .panel { border-radius: 16px; padding: 12px 13px 13px; pointer-events: auto; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 9px; }
  .panel-meta { font-size: 8px; color: rgba(240,232,218,.32); letter-spacing: .16em; white-space: nowrap; }
  .camera-panel { min-width: 0; }
  .camera-list { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
  .camera-list::-webkit-scrollbar { display: none; }
  .cam-btn {
    appearance: none; border: 1px solid transparent; outline: none;
    background: transparent; color: rgba(243,236,223,.55);
    display: flex; align-items: center; gap: 8px;
    border-radius: 9px; padding: 7px 9px; min-width: max-content;
    cursor: pointer; transition: background .25s ease, border-color .25s ease, color .25s ease, transform .25s ease;
    font-family: inherit;
  }
  .cam-btn:hover { color: #f5eddf; background: rgba(255,255,255,.055); }
  .cam-btn:focus-visible { border-color: var(--gold); }
  .cam-num {
    font-size: 8px; color: rgba(229,189,125,.45); border: 1px solid rgba(229,189,125,.16);
    width: 18px; height: 18px; display: grid; place-items: center; border-radius: 5px;
    transition: color .25s, border-color .25s, background .25s;
    font-variant-numeric: tabular-nums;
  }
  .cam-label { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; gap: 3px; font-size: 11px; font-weight: 500; letter-spacing: .01em; }
  .cam-sub { font-size: 7px; letter-spacing: .16em; color: rgba(243,236,223,.3); }
  .cam-btn[data-active="true"] {
    background: linear-gradient(135deg, rgba(229,189,125,.165), rgba(229,189,125,.045));
    border-color: rgba(229,189,125,.38); color: #f8e8c7;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
  }
  .cam-btn[data-active="true"] .cam-num { color: #f6dcaa; border-color: rgba(229,189,125,.55); background: rgba(229,189,125,.1); }
  .cam-btn[data-active="true"] .cam-sub { color: rgba(247,216,164,.55); }
  .right-dock { display: flex; gap: 9px; align-items: stretch; }
  .time-panel { min-width: 245px; }
  .time-list { display: flex; gap: 4px; background: rgba(0,0,0,.16); padding: 3px; border-radius: 10px; border: 1px solid rgba(255,255,255,.055); }
  .time-btn {
    appearance: none; border: 1px solid transparent; outline: none;
    flex: 1; min-width: max-content;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: inherit; font-size: 10px; font-weight: 500;
    letter-spacing: .025em; cursor: pointer;
    color: rgba(243,236,223,.5);
    padding: 8px 10px; border-radius: 7px;
    transition: color .3s, background .3s, border-color .3s, box-shadow .3s;
  }
  .time-btn svg { width: 13px; height: 13px; opacity: .65; transition: opacity .3s, transform .4s; }
  .time-btn:hover { color: #f5eddf; background: rgba(255,255,255,.04); }
  .time-btn:hover svg { transform: translateY(-1px); opacity: 1; }
  .time-btn:focus-visible { border-color: var(--gold); }
  .time-btn[data-active="true"] { color: #f9e9c8; background: rgba(229,189,125,.13); border-color: rgba(229,189,125,.25); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
  .time-btn[data-active="true"] svg { opacity: 1; color: var(--gold); }
  .audio-btn {
    appearance: none; outline: none; cursor: pointer;
    border-radius: 16px; padding: 0 15px; min-width: 92px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    color: rgba(243,236,223,.65); font-family: inherit; border: 1px solid var(--glass-border);
    background: linear-gradient(140deg, rgba(17,23,20,.68), rgba(14,20,18,.36));
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    transition: color .3s, border-color .3s, background .3s;
    pointer-events: auto;
  }
  .audio-btn:hover { color: #f8e8c5; border-color: rgba(229,189,125,.35); }
  .audio-btn:focus-visible { border-color: var(--gold); }
  .audio-label { font-size: 8px; letter-spacing: .17em; text-transform: uppercase; }
  .audio-state { font-size: 8px; color: rgba(243,236,223,.32); letter-spacing: .08em; }
  .eq { height: 14px; display: flex; align-items: flex-end; gap: 2px; }
  .eq i { width: 2px; height: 5px; border-radius: 2px; background: rgba(229,189,125,.55); transition: height .25s; }
  .audio-btn.on .eq i { animation: eqPulse .8s ease-in-out infinite alternate; }
  .audio-btn.on .eq i:nth-child(2) { animation-delay: .18s; }
  .audio-btn.on .eq i:nth-child(3) { animation-delay: .35s; }
  .audio-btn.on .eq i:nth-child(4) { animation-delay: .1s; }
  @keyframes eqPulse { from { height: 4px; opacity: .55; } to { height: 13px; opacity: 1; } }
  .bottom-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .hint {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 8px; letter-spacing: .15em; text-transform: uppercase;
    color: rgba(240,232,218,.4);
    padding: 7px 11px; border-radius: 99px;
    background: rgba(11,16,14,.26); border: 1px solid rgba(255,255,255,.08);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    margin-bottom: 10px;
  }
  .hint .dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(229,189,125,.55); flex: none; }
  #loading {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 45%, #17221d 0%, #0b1210 55%, #070b0a 100%);
    transition: opacity 1s ease, visibility 1s ease;
  }
  #loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loader-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; padding: 24px; }
  .loader-seal {
    width: 66px; height: 66px; display: grid; place-items: center;
    border: 1px solid rgba(229,189,125,.45);
    color: #f3d69f; font-family: "Noto Serif JP", serif; font-size: 32px;
    background: rgba(120,45,35,.18);
    animation: sealBreathe 2.6s ease-in-out infinite;
  }
  @keyframes sealBreathe { 0%,100% { box-shadow: 0 0 0 rgba(229,189,125,0); } 50% { box-shadow: 0 0 35px rgba(229,189,125,.15); } }
  .loader-title { color: #f2eadc; font-family: "Noto Serif JP", serif; font-size: 22px; letter-spacing: .14em; }
  .loader-sub { font-size: 8px; letter-spacing: .3em; text-transform: uppercase; color: rgba(240,232,218,.36); }
  .loader-line { width: 130px; height: 1px; background: rgba(255,255,255,.1); overflow: hidden; }
  .loader-line span { display: block; width: 45%; height: 100%; background: linear-gradient(to right, transparent, var(--gold), transparent); animation: loadSlide 1.8s ease-in-out infinite; }
  @keyframes loadSlide { 0% { transform: translateX(-120%); } 100% { transform: translateX(340%); } }
  .loader-status { height: 12px; font-size: 8px; letter-spacing: .18em; color: rgba(240,232,218,.32); text-transform: uppercase; }
  .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  @media (max-width: 760px) {
    #hud { padding: 12px; }
    .brand-card { padding: 9px 12px 9px 9px; gap: 10px; border-radius: 3px 14px 14px 14px; }
    .seal { width: 38px; height: 38px; font-size: 19px; }
    .brand-sub { font-size: 6.5px; letter-spacing: .2em; margin-top: 4px; }
    .status-card { min-width: 0; padding: 10px 11px; gap: 7px; }
    .status-card .eyebrow, .status-time { display: none; }
    .orb { width: 22px; height: 22px; }
    .status-name { font-size: 11px; }
    .bottom-row { flex-direction: column; align-items: stretch; }
    .hint { display: none; }
    .panel { border-radius: 13px; padding: 10px; }
    .camera-panel { width: 100%; }
    .cam-btn { padding: 6px 7px; gap: 6px; }
    .cam-label { font-size: 9.5px; }
    .cam-sub { display: none; }
    .cam-num { width: 16px; height: 16px; font-size: 7px; }
    .camera-list { touch-action: pan-x; -webkit-overflow-scrolling: touch; }
    .right-dock { width: 100%; align-items: stretch; }
    .time-panel { flex: 1; min-width: 0; }
    .time-btn { padding: 8px 4px; font-size: 9px; gap: 3px; }
    .time-btn svg { width: 12px; height: 12px; }
    .audio-btn { min-width: 68px; padding: 0 9px; border-radius: 13px; }
    .panel-meta { display: none; }
  }
  @media (max-width: 480px) {
    .brand-card .eyebrow { display: none; }
    .brand-title { font-size: 19px; }
    .status-card { padding: 8px 10px; }
    .status-name { font-size: 10px; }
  }
  @media (max-width: 380px) {
    .status-card { display: none; }
    .time-btn span { display: none; }
    .time-btn svg { width: 15px; height: 15px; }
  }
</style>
</head>
<body>
<canvas id="world" aria-label="Interactive voxel Japanese sanctuary"></canvas>
<div id="vignette"></div>
<div id="grain"></div>

<div id="hud">
  <div class="top-row">
    <div class="glass brand-card pointer-events-auto">
      <div class="seal">禅</div>
      <div>
        <div class="eyebrow">A meditative voxel landscape</div>
        <div class="brand-title font-jp">静寂の里</div>
        <div class="brand-sub">SANCTUARY OF STILLNESS</div>
      </div>
    </div>
    <div class="glass status-card">
      <div class="flex items-center gap-3">
        <div class="orb" id="statusOrb"></div>
        <div>
          <div class="eyebrow">Atmosphere</div>
          <div class="status-name" id="statusName">Morning Sun</div>
        </div>
      </div>
      <div class="hairline"></div>
      <div class="flex items-center justify-between">
        <span class="status-time" id="statusClock">06:24</span>
        <span class="status-time">35°N · SANCTUARY</span>
      </div>
    </div>
  </div>

  <div>
    <div class="hint"><span class="dot"></span> Drag to orbit <span class="dot"></span> Scroll to zoom <span class="dot"></span> Select a viewpoint</div>
    <div class="bottom-row">
      <section class="glass panel camera-panel" aria-label="Camera viewpoints">
        <div class="panel-head">
          <span class="eyebrow">Viewpoints</span>
          <span class="panel-meta">1–5 · ORBIT FREE</span>
        </div>
        <div class="camera-list">
          <button class="cam-btn" data-view="pagoda" data-active="true" title="Pagoda front (1)">
            <span class="cam-num">01</span><span class="cam-label">Pagoda<span class="cam-sub">FRONT</span></span>
          </button>
          <button class="cam-btn" data-view="samurai" title="Samurai closeup (2)">
            <span class="cam-num">02</span><span class="cam-label">Samurai<span class="cam-sub">CLOSEUP</span></span>
          </button>
          <button class="cam-btn" data-view="meadow" title="Pastoral meadow (3)">
            <span class="cam-num">03</span><span class="cam-label">Meadow<span class="cam-sub">PASTORAL</span></span>
          </button>
          <button class="cam-btn" data-view="mountain" title="Mountain vista (4)">
            <span class="cam-num">04</span><span class="cam-label">Vista<span class="cam-sub">MOUNTAINS</span></span>
          </button>
          <button class="cam-btn" data-view="bird" title="Bird's eye (5)">
            <span class="cam-num">05</span><span class="cam-label">Sky<span class="cam-sub">BIRD'S EYE</span></span>
          </button>
        </div>
      </section>

      <div class="right-dock">
        <section class="glass panel time-panel" aria-label="Time of day">
          <div class="panel-head">
            <span class="eyebrow">Light</span>
            <span class="panel-meta">TIME OF DAY</span>
          </div>
          <div class="time-list">
            <button class="time-btn" data-time="morning" data-active="true" title="Morning sun (M)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
              <span>Morning</span>
            </button>
            <button class="time-btn" data-time="sunset" title="Sunset (U)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 17h18M5 21h14M7 13a5 5 0 0 1 10 0M12 2v3M4.2 6.2l2 2M19.8 6.2l-2 2"/></svg>
              <span>Sunset</span>
            </button>
            <button class="time-btn" data-time="night" title="Night (N)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5 8.5 8.5 0 1 0 20.5 14.3Z"/><path d="M17 3.5v2M16 4.5h2M5 3l.5 1.5L7 5l-1.5.5L5 7l-.5-1.5L3 5l1.5-.5Z"/></svg>
              <span>Night</span>
            </button>
          </div>
        </section>
        <button class="audio-btn" id="audioBtn" aria-pressed="false" title="Toggle ambient wind and wind chimes">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="audio-label">Ambient</span>
          <span class="audio-state" id="audioState">Sound off</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div id="loading">
  <div class="loader-inner">
    <div class="loader-seal">禅</div>
    <div>
      <div class="loader-title">静寂の里</div>
      <div class="loader-sub" style="margin-top:8px;">Sanctuary of Stillness</div>
    </div>
    <div class="loader-line"><span></span></div>
    <div class="loader-status" id="loaderStatus">Shaping the mountains</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =========================================================================
   静寂の里 · Sanctuary of Stillness
   A single-file procedural voxel world.
   ========================================================================= */

// ---------------------------------------------------------------- utilities
const { clamp, lerp } = THREE.MathUtils;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20261019);
const rr = (a, b) => a + (b - a) * rng();
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = (arr) => arr[Math.floor(rng() * arr.length)];
const smoothstep = (a, b, x) => {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
function hash2(x, z) {
  const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function valueNoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z);
  const xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  return lerp(lerp(hash2(xi, zi), hash2(xi + 1, zi), u), lerp(hash2(xi, zi + 1), hash2(xi + 1, zi + 1), u), v);
}
function fbm(x, z) {
  let v = 0, amp = .5, f = 1;
  for (let i = 0; i < 4; i++) { v += valueNoise(x * f, z * f) * amp; f *= 2; amp *= .5; }
  return v;
}

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById('world');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const isSmall = window.innerWidth < 760;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isSmall ? 1.5 : 1.8));

function makeTexture(seed, painter) {
  const c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  const random = mulberry32(seed);
  painter(g, random);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestMipmapNearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}
function px(g, x, y, w, h, color) { g.fillStyle = color; g.fillRect(x, y, w, h); }
function speckle(g, random, colors, count, size = 1) {
  for (let i = 0; i < count; i++) {
    px(g, Math.floor(random() * 16), Math.floor(random() * 16), size, size, colors[Math.floor(random() * colors.length)]);
  }
}

function textureClone(t, rx, ry) {
  const c = t.clone();
  c.needsUpdate = true;
  c.wrapS = c.wrapT = THREE.RepeatWrapping;
  c.repeat.set(rx, ry);
  return c;
}

function makeRadialTexture(stops) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  for (const [p, col] of stops) grd.addColorStop(p, col);
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const STAR_COUNT = 900;
const starPositions = new Float32Array(STAR_COUNT * 3);
for (let i = 0; i < STAR_COUNT; i++) {
  const a = rng() * Math.PI * 2;
  const y = Math.pow(rng(), .6) * .92 + .08;
  const rad = Math.sqrt(1 - y * y);
  starPositions[i * 3] = Math.cos(a) * rad * 620;
  starPositions[i * 3 + 1] = y * 620;
  starPositions[i * 3 + 2] = Math.sin(a) * rad * 620;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMat = new THREE.PointsMaterial({ color: 0xe9f1ff, size: 1.5, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false, fog: false });
const stars = new THREE.Points(starGeo, starMat);
stars.renderOrder = -20;
scene.add(stars);

function addInstances(items, material, opts = {}) {
  if (!items.length) return null;
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mesh = new THREE.InstancedMesh(geo, material, items.length);
  const dummy = new THREE.Object3D();
  const color = new THREE.Color();
  let hasColor = false;
  items.forEach((v, i) => {
    dummy.position.set(v.x, v.y, v.z);
    dummy.rotation.set(v.rx || 0, v.ry || 0, v.rz || 0);
    dummy.scale.set(v.sx ?? 1, v.sy ?? 1, v.sz ?? 1);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    if (v.color !== undefined) {
      hasColor = true;
      color.set(v.color);
      mesh.setColorAt(i, color);
    }
  });
  if (hasColor && mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = opts.castShadow ?? false;
  mesh.receiveShadow = opts.receiveShadow ?? true;
  mesh.frustumCulled = false;
  scene.add(mesh);
  return mesh;
}

function addMerged(voxels, opts = {}) {
  const group = new THREE.Group();
  const buckets = new Map();
  for (const v of voxels) {
    const geo = new THREE.BoxGeometry(v.sx ?? 1, v.sy ?? 1, v.sz ?? 1);
    if (v.rx || v.ry || v.rz) {
      geo.rotateX(v.rx || 0); geo.rotateY(v.ry || 0); geo.rotateZ(v.rz || 0);
    }
    geo.translate(v.x ?? 0, v.y ?? 0, v.z ?? 0);
    if (!buckets.has(v.m)) buckets.set(v.m, []);
    buckets.get(v.m).push(geo);
  }
  for (const [key, geos] of buckets) {
    const merged = mergeGeometries(geos, false);
    geos.forEach(g => g.dispose());
    if (!merged) continue;
    const mesh = new THREE.Mesh(merged, typeof key === 'string' ? MAT[key] : key);
    mesh.castShadow = opts.castShadow ?? true;
    mesh.receiveShadow = opts.receiveShadow ?? true;
    group.add(mesh);
  }
  return group;
}
function V(x, y, z, sx, sy, sz, m, extras = {}) {
  return { x, y, z, sx, sy, sz, m, ...extras };
}

function isPond(x, z) {
  const dx = (x - LAYOUT.pond.x) / LAYOUT.pond.rx;
  const dz = (z - LAYOUT.pond.z) / LAYOUT.pond.rz;
  return dx * dx + dz * dz + .075 * Math.sin(x * .72 + 1.3) * Math.cos(z * .93 - .4) < 1;
}

const animatedLilies = [];
const animatedKoi = [];

function buildTerrain() {
  // A wide, softly textured meadow plane receives the forest and mountains.
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1400, 1400),
    new THREE.MeshStandardMaterial({ map: grassFieldTex, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -.72;

  scene.add(ground);

  // Low, earthy island under the careful two-metre garden blocks.
  const island = new THREE.Mesh(new THREE.CylinderGeometry(51, 53.5, 2.7, 72), MAT.dirt);
  island.position.y = -1.9;
  island.receiveShadow = true;
  scene.add(island);

  const grassItems = [];
  const dirtItems = [];
  const waterItems = [];
  const pondBottom = [];
  const pondCells = [];

  for (let x = -47; x <= 47; x += 2) {
    for (let z = -47; z <= 47; z += 2) {
      if (Math.hypot(x, z) > 48.2) continue;
      if (isPond(x, z)) {
        pondCells.push([x, z]);
        waterItems.push({ x, y: -.15, z, sx: 2.035, sy: .16, sz: 2.035, color: 0xffffff });
        pondBottom.push({ x, y: -.52, z, sx: 2.02, sy: .1, sz: 2.02, color: new THREE.Color().setRGB(rr(.55, .75), rr(.64, .8), rr(.62, .72)) });
      } else {
        const tint = new THREE.Color().setRGB(rr(.88, 1), rr(.9, 1), rr(.84, .98));
        grassItems.push({ x, y: -.25, z, sx: 2.035, sy: .5, sz: 2.035, color: tint });
        if ((x + z) % 6 === 0 || rng() < .22) {
          dirtItems.push({ x, y: -.88, z, sx: 2.02, sy: .78, sz: 2.02, color: new THREE.Color().setRGB(rr(.8, 1), rr(.78, .95), rr(.72, .9)) });
        }
      }
    }
  }

  addInstances(grassItems, GRASS_MATS, { castShadow: false, receiveShadow: true });
  addInstances(dirtItems, MAT.dirt, { castShadow: false, receiveShadow: true });
  const waterMesh = addInstances(waterItems, MAT.water, { castShadow: false, receiveShadow: false });
  addInstances(pondBottom, MAT.stoneDark, { castShadow: false, receiveShadow: true });

  // Rolling outer meadow built from broad 4 x 4 voxel columns.
  const hillItems = [];
  for (let x = -118; x <= 118; x += 4) {
    for (let z = -118; z <= 118; z += 4) {
      const r = Math.hypot(x, z);
      if (r < 50 || r > 118) continue;
      const n = fbm(x * .033 + 8.4, z * .033 - 3.2);
      let levels = Math.floor((n - .27) * 5.2 + Math.max(0, r - 56) * .012);
      levels = clamp(levels, 0, 3);
      if (levels === 0) continue;
      for (let k = 0; k < levels; k++) {
        hillItems.push({
          x, y: -.18 + k * 1.05, z, sx: 4.04, sy: 1.05, sz: 4.04,
          color: new THREE.Color().setRGB(rr(.82, 1), rr(.86, 1), rr(.78, .97))
        });
      }
    }
  }
  addInstances(hillItems, GRASS_MATS, { castShadow: false, receiveShadow: true });

  // Animated lily pads
  const lilyData = [];
  const lilies = [];
  const tries = 22;
  for (let i = 0; i < tries; i++) {
    const x = rr(15, 35);
    const z = rr(2.3, 16);
    if (!isPond(x, z) || Math.abs(z - LAYOUT.bridge.z) < 1.9) continue;
    if (Math.abs(x - LAYOUT.pond.x) > 8.5 && z > 13) continue;
    lilies.push({
      x, z, baseY: -.02 + rr(0, .025), rot: rr(0, Math.PI * 2),
      sx: rr(.48, 1.15), sz: rr(.45, .95), phase: rr(0, Math.PI * 2)
    });
  }
  lilyData.push(...lilies);
  const lilyMesh = createLilyMesh(lilyData);
  animatedLilies.push({ mesh: lilyMesh, data: lilyData });

  // Micro lotus blossoms on a few pads
  const lotusVox = [];
  for (const pad of lilies.filter((_, i) => i % 4 === 1)) {
    const y = .015;
    lotusVox.push(V(pad.x, y, pad.z, .16, .08, .16, 'flowerPink'));
    lotusVox.push(V(pad.x + .13, y, pad.z, .12, .05, .12, 'flowerWhite'));
    lotusVox.push(V(pad.x, y, pad.z + .13, .11, .05, .11, 'flowerPink'));
    lotusVox.push(V(pad.x, y + .1, pad.z, .05, .14, .05, 'flowerYellow'));
  }
  if (lotusVox.length) scene.add(addMerged(lotusVox, { castShadow: false, receiveShadow: true }));

  // Dark stones and mossy banks around the water.
  const bankVox = [];
  const seen = new Set();
  for (const [cx, cz] of pondCells) {
    for (const [dx, dz] of [[2, 0], [-2, 0], [0, 2], [0, -2]]) {
      if (isPond(cx + dx, cz + dz)) continue;
      const key = `${cx + dx / 2}:${cz + dz / 2}`;
      if (seen.has(key)) continue;
      seen.add(key);
      if (rng() < .56) {
        const px = cx + dx * .92 + rr(-.35, .35);
        const pz = cz + dz * .92 + rr(-.35, .35);
        bankVox.push(V(px, rr(-.01, .06), pz, rr(.35, .85), rr(.16, .3), rr(.35, .8), rng() > .55 ? 'stone' : 'stoneDark', { ry: rr(0, Math.PI) }));
        if (rng() < .45) bankVox.push(V(px + rr(-.3, .3), rr(-.01, .05), pz + rr(-.3, .3), rr(.3, .65), rr(.12, .22), rr(.3, .6), 'moss', { ry: rr(0, Math.PI) }));
      }
    }
  }

  // Reeds at the pond margins.
  const reedStarts = [];
  for (let i = 0; i < 30; i++) {
    const a = rr(0, Math.PI * 2);
    const x = LAYOUT.pond.x + Math.cos(a) * (LAYOUT.pond.rx * .91);
    const z = LAYOUT.pond.z + Math.sin(a) * (LAYOUT.pond.rz * .91);
    if (isPond(x, z) && Math.abs(z - LAYOUT.bridge.z) > 2.3) reedStarts.push([x, z]);
  }
  const reedVox = [];
  for (const [x, z] of reedStarts) {
    const h = rr(.8, 1.7);
    const ox = rr(-.2, .2), oz = rr(-.2, .2);
    reedVox.push(V(x + ox, h / 2, z + oz, .055, h, .055, 'reed', { rz: rr(-.12, .12) }));
    reedVox.push(V(x + ox + .12, rr(.7, 1.15), z + oz, .045, .55, .045, 'reed', { rz: rr(-.25, .25) }));
    if (rng() < .6) reedVox.push(V(x + ox, h * .84, z + oz, .12, .26, .12, 'cattail'));
  }
  bankVox.push(...reedVox);
  if (bankVox.length) scene.add(addMerged(bankVox, { castShadow: true, receiveShadow: true }));

  // Koi, glimpsed under the water.
  for (let i = 0; i < 4; i++) {
    const k = buildKoi();
    scene.add(k.group);
    animatedKoi.push({
      ...k,
      centerX: LAYOUT.pond.x + rr(-2.8, 2.8),
      centerZ: LAYOUT.pond.z + rr(-2.2, 2.2),
      rx: rr(2.2, 5.2), rz: rr(1.5, 3.2),
      speed: rr(.12, .28) * (rng() > .5 ? 1 : -1),
      phase: rr(0, Math.PI * 2),
      y: -.36
    });
  }
  return { waterMesh, pondCells, lilyMesh };
}

function createLilyMesh(data) {
  if (!data.length) return null;
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mesh = new THREE.InstancedMesh(geo, MAT.lily, data.length);
  const d = new THREE.Object3D();
  data.forEach((p, i) => {
    d.position.set(p.x, p.baseY, p.z);
    d.rotation.set(0, p.rot, 0);
    d.scale.set(p.sx, .045, p.sz);
    d.updateMatrix();
    mesh.setMatrixAt(i, d.matrix);
    mesh.setColorAt(i, new THREE.Color().setRGB(rr(.8, 1.05), rr(.92, 1.1), rr(.8, 1)));
  });
  mesh.receiveShadow = true;
  mesh.frustumCulled = false;
  scene.add(mesh);
  return mesh;
}

function buildKoi() {
  const group = new THREE.Group();
  const v = [];
  v.push(V(0, 0, 0, .22, .11, .48, 'koiOrange'));
  v.push(V(0, .055, -.02, .13, .04, .22, 'koiWhite'));
  v.push(V(0, .02, .31, .12, .04, .12, 'koiOrange'));
  v.push(V(.16, 0, -.26, .13, .06, .2, 'koiOrange', { ry: -.42 }));
  v.push(V(-.16, 0, -.26, .13, .06, .2, 'koiWhite', { ry: .42 }));
  v.push(V(0, 0, -.27, .06, .05, .18, 'koiWhite'));
  group.add(addMerged(v, { castShadow: false, receiveShadow: false }));
  group.scale.setScalar(.72);
  return { group };
}

function buildPath() {
  const stones = [];
  for (let z = 35; z >= -6; z -= 2.05) {
    const cx = Math.sin((z + 5) * .14) * .55 + rr(-.13, .13);
    const w = rr(1.25, 1.95), d = rr(.92, 1.3);
    stones.push(V(cx, rr(.015, .055), z, w, .11, d, rng() > .35 ? 'pathStone' : 'stone', { ry: rr(-.2, .2) }));
    if (rng() < .7) stones.push(V(cx + rr(-.72, .72), .025, z + rr(-.5, .5), rr(.35, .7), .08, rr(.3, .55), 'stoneDark', { ry: rr(0, Math.PI) }));
    if (rng() < .45) stones.push(V(cx + rr(-.75, .75), .035, z + rr(-.6, .6), rr(.2, .4), .1, rr(.2, .35), 'moss'));
  }
  // A branch of stepping stones leading toward the curved bridge.
  for (let x = 3.1; x <= 11.5; x += 1.55) {
    stones.push(V(x, .03, 8.35 + Math.sin(x * .7) * .22, rr(1.0, 1.4), .1, rr(.8, 1.1), 'pathStone', { ry: rr(-.25, .25) }));
  }
  // Small gravel apron beneath the torii.
  for (let x = -4; x <= 4; x += 2) {
    for (let z = 26; z <= 32; z += 2) {
      stones.push(V(x + rr(-.15, .15), -.01, z, 2.0, .055, 2.0, 'gravel'));
    }
  }
  // Keep a few flat stones inside the pagoda court.
  for (let i = 0; i < 14; i++) {
    const a = rr(0, Math.PI * 2);
    const r = rr(7, 11);
    stones.push(V(Math.cos(a) * r, .015, -13 + Math.sin(a) * r, rr(.4, 1.1), .08, rr(.4, 1.0), rng() > .5 ? 'stoneDark' : 'pathStone', { ry: rr(0, Math.PI) }));
  }
  scene.add(addMerged(stones, { castShadow: true, receiveShadow: true }));
}

function buildGardenFlora() {
  const tufts = [];
  for (let i = 0; i < 560; i++) {
    const x = rr(-45, 45), z = rr(-45, 45);
    if (Math.hypot(x, z) > 46.5 || isPond(x, z)) continue;
    if (Math.abs(x) < 1.7 && z > -7 && z < 36) continue;
    if (Math.abs(z - 8.4) < 1.2 && x > 0 && x < 12) continue;
    if (x > 10 && x < 38 && z > 0 && z < 18) continue;
    if (Math.abs(x - DRY_GARDEN.x) < DRY_GARDEN.w / 2 + .8 && Math.abs(z - DRY_GARDEN.z) < DRY_GARDEN.d / 2 + .8) continue;
    const y = .01;
    const blades = ri(2, 4);
    for (let b = 0; b < blades; b++) {
      tufts.push(V(x + rr(-.18, .18), y + rr(.12, .3), z + rr(-.18, .18), .055, rr(.25, .55), .055, rng() > .45 ? 'grassTuftLight' : 'grassTuft', { rz: rr(-.25, .25) }));
    }

  // Shrubs around the sanctuary.

  // A wildflower meadow with small drifts of colour.

      if (rng() < .45) tufts.push(V(x + .08, .2, z + .04, .07, .16, .07, 'grassTuftLight'));

  // A few large garden boulders.

    }
    if (rng() < .7) tufts.push(V(x, .35 * s, z, .7 * s, .16 * s, .6 * s, 'moss'));

  scene.add(addMerged(tufts, { castShadow: true, receiveShadow: true }));
}

    v.push(V(0, cy, 0, w, h, w, 'wood'));
    v.push(V(0, y + .12, 0, w + .14, .28, w + .14, 'black'));
    v.push(V(0, y + h * .16, 0, w + .2, .14, w + .2, 'woodLight'));
    v.push(V(0, y + h - .18, 0, w + .18, .2, w + .18, 'woodLight'));
    v.push(V(0, y + h - .48, 0, w + .14, .1, w + .14, 'black'));
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      v.push(V(sx * (w / 2 - .14), cy, sz * (w / 2 - .14), .36, h + .05, .36, 'woodLight'));
      v.push(V(sx * (w / 2 + .07), y + h - .35, sz * (w / 2 + .07), .48, .22, .48, 'wood'));
      v.push(V(sx * (w / 2 - .3), y + .02, sz * (w / 2 - .3), .26, .24, .26, 'gold'));
    }

    // Shoji paper windows on each face, with a dark lattice already in the texture.
    const n = 3;
    const panelW = (w - 1.5) / n;
    const panelH = Math.min(1.72, h * .63);
    const panelY = y + h * .55;
    for (let i = 0; i < n; i++) {
      const off = (i - (n - 1) / 2) * (panelW + .14);
      v.push(V(off, panelY, w / 2 + .045, panelW, panelH, .06, 'shoji'));
      v.push(V(off, panelY, -w / 2 - .045, panelW, panelH, .06, 'shoji'));
      v.push(V(w / 2 + .045, panelY, off, .06, panelH, panelW, 'shoji'));
      v.push(V(-w / 2 - .045, panelY, off, .06, panelH, panelW, 'shoji'));
      // thin vertical mullion
      v.push(V(off - panelW / 2 - .05, panelY, w / 2 + .085, .075, panelH + .12, .075, 'wood'));
      v.push(V(off - panelW / 2 - .05, panelY, -w / 2 - .085, .075, panelH + .12, .075, 'wood'));
      v.push(V(w / 2 + .085, panelY, off - panelW / 2 - .05, .075, panelH + .12, .075, 'wood'));
      v.push(V(-w / 2 - .085, panelY, off - panelW / 2 - .05, .075, panelH + .12, .075, 'wood'));
    }
    v.push(V(0, panelY + panelH / 2 + .08, w / 2 + .06, w - .8, .11, .1, 'woodLight'));
    v.push(V(0, panelY + panelH / 2 + .08, -w / 2 - .06, w - .8, .11, .1, 'woodLight'));

    if (idx === 0) {
      // Low double doors with gold studs.
      v.push(V(0, y + 1.19, w / 2 + .09, 1.4, 2.18, .11, 'wood'));
      v.push(V(-.34, y + 1.19, w / 2 + .16, .05, 2.0, .02, 'gold'));
      v.push(V(.34, y + 1.19, w / 2 + .16, .05, 2.0, .02, 'gold'));
      for (const sy of [-.55, 0, .55]) {
        v.push(V(.52, y + 1.19 + sy, w / 2 + .16, .075, .075, .055, 'goldAccent'));
        v.push(V(-.52, y + 1.19 + sy, w / 2 + .16, .075, .075, .055, 'goldAccent'));
      }
    }

    // Bracket work under the eaves.
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      v.push(V(sx * (w / 2 + .25), y + h + .06, sz * (w / 2 + .25), .7, .2, .7, 'woodLight'));
      v.push(V(sx * (w / 2 + .5), y + h + .18, sz * (w / 2 + .5), .38, .18, .38, 'wood'));
    }

    const roofBase = y + h;
    roofBases.push(roofBase);
    const W = tier.roof;
    // Stepped, gently tapered roof mass.
    v.push(V(0, roofBase + .13, 0, W, .26, W, 'roof'));
    v.push(V(0, roofBase + .38, 0, W - .9, .27, W - .9, 'roof'));
    v.push(V(0, roofBase + .63, 0, W - 2.0, .25, W - 2.0, 'roof'));
    v.push(V(0, roofBase + .81, 0, W - 3.4, .18, W - 3.4, 'roofEdge'));
    v.push(V(0, roofBase + .02, W / 2 - .22, W - .4, .09, .18, 'roofEdge'));
    v.push(V(0, roofBase + .02, -W / 2 + .22, W - .4, .09, .18, 'roofEdge'));
    v.push(V(W / 2 - .22, roofBase + .02, 0, .18, .09, W - .4, 'roofEdge'));
    v.push(V(-W / 2 + .22, roofBase + .02, 0, .18, .09, W - .4, 'roofEdge'));

    // Flared corners and little gold wind bells.
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      v.push(V(sx * (W / 2 - .1) + sx * .38, roofBase + .33, sz * (W / 2 - .1) + sz * .38, 1.7, .2, 1.7, 'roof'));
      v.push(V(sx * (W / 2 - .1) + sx * .82, roofBase + .49, sz * (W / 2 - .1) + sz * .82, 1.02, .18, 1.02, 'roof'));
      v.push(V(sx * (W / 2 - .1) + sx * 1.18, roofBase + .64, sz * (W / 2 - .1) + sz * 1.18, .48, .16, .48, 'roofEdge'));
      v.push(V(sx * (W / 2 - .1) + sx * 1.18, roofBase + .8, sz * (W / 2 - .1) + sz * 1.18, .16, .16, .16, 'gold'));
      v.push(V(sx * (W / 2 - .45), roofBase - .18, sz * (W / 2 - .45), .19, .22, .19, 'gold'));
      v.push(V(sx * (W / 2 - .45), roofBase - .37, sz * (W / 2 - .45), .09, .2, .09, 'black'));
    }
    // Eave rafters.
    for (let r = -2; r <= 2; r++) {
      v.push(V(r * (W * .17), roofBase - .06, W / 2 - .55, .14, .17, .85, 'wood'));
      v.push(V(r * (W * .17), roofBase - .06, -W / 2 + .55, .14, .17, .85, 'wood'));
      v.push(V(W / 2 - .55, roofBase - .06, r * (W * .17), .85, .17, .14, 'wood'));
      v.push(V(-W / 2 + .55, roofBase - .06, r * (W * .17), .85, .17, .14, 'wood'));
    }
    lastRoofBase = roofBase;

    // Hanging lanterns under the first roof's front eaves.
    if (idx === 0) {
      for (const sx of [-1, 1]) {
        const lantern = new THREE.Group();
        lantern.position.set(sx * 3.25, roofBase - .22, 5.06);
        const lv = [];
        lv.push(V(0, -.24, 0, .05, .48, .05, 'black'));
        lv.push(V(0, -.51, 0, .5, .09, .5, 'black'));
        lv.push(V(0, -.86, 0, .46, .62, .46, 'paper'));
        lv.push(V(0, -1.2, 0, .4, .07, .4, 'black'));
        lv.push(V(0, -1.38, 0, .06, .28, .06, 'gold'));
        lantern.add(addMerged(lv, { castShadow: true, receiveShadow: true }));
        makeGlowSprite(lantern, 0, -.86, 0, 2.5);
        makeLanternLight(lantern, 0, -.83, 0, 98);
        group.add(lantern);
        pagodaLanterns.push(lantern);
      }
    }

    y = roofBase + .78;
  });

  // Sorin — the golden spire.
  const sy = lastRoofBase + .95;
  v.push(V(0, sy - .35, 0, 1.75, .36, 1.75, 'roofEdge'));
  v.push(V(0, sy, 0, 1.15, .32, 1.15, 'gold'));
  v.push(V(0, sy + 1.65, 0, .2, 3.0, .2, 'gold'));
  for (let i = 0; i < 7; i++) {
    const w = 1.45 - i * .12;
    const ry = sy + .45 + i * .4;
    v.push(V(0, ry, 0, w, .075, .18, 'gold'));
    v.push(V(0, ry, 0, .18, .075, w, 'gold'));
    v.push(V(-w / 2, ry - .06, 0, .1, .12, .1, 'goldAccent'));
    v.push(V(w / 2, ry - .06, 0, .1, .12, .1, 'goldAccent'));
  }
  v.push(V(0, sy + 3.28, 0, .14, .32, .14, 'gold'));
  v.push(V(0, sy + 3.55, 0, .42, .34, .42, 'goldAccent'));

  // Ground-plane details catch the warm interior light.
  v.push(V(-3.25, 1.1, 3.25, .3, .35, .3, 'gold'));
  v.push(V(3.25, 1.1, 3.25, .3, .35, .3, 'gold'));

  group.add(addMerged(v, { castShadow: true, receiveShadow: true }));
  scene.add(group);

  // Soft, warm interior glow spilling from the door.
  const interior = new THREE.PointLight(0xffa55a, 0, 12, 2);
  interior.position.set(0, 2.4, 5.7);
  group.add(interior);
  lanternLights.push({ light: interior, base: 58 });
  makeGlowSprite(group, 0, 2.15, 5.95, 2.6);

  return { group, roofBases };
}

function makePlaqueTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#1d1610'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#2f2419'; g.fillRect(5, 5, 54, 54);
  g.strokeStyle = '#cda04e'; g.lineWidth = 3; g.strokeRect(4, 4, 56, 56);
  g.strokeStyle = '#7b5c27'; g.lineWidth = 1; g.strokeRect(8, 8, 48, 48);
  g.fillStyle = '#ebc676';
  g.font = 'bold 38px "Noto Serif JP", serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText('禅', 32, 35);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// =====================================================================
//  POND BRIDGE (TAIKO-BASHI)
// =====================================================================
function buildBridge() {
  const { x1, x2, z } = LAYOUT.bridge;
  const span = x2 - x1;
  const segments = 30;
  const v = [];
  const surface = (t) => .23 + Math.sin(t * Math.PI) * 1.92;

  for (let i = 0; i < segments; i++) {
    const t0 = i / segments, t1 = (i + 1) / segments;
    const tm = (t0 + t1) / 2;
    const x = x1 + span * tm;
    const y = surface(tm);
    const segW = span / segments + .06;
    v.push(V(x, y, z, segW, .22, 2.76, i % 2 === 0 ? 'redWood' : 'wood'));
    v.push(V(x, y - .16, z, segW, .16, 2.9, 'wood'));
    // Raised rails.
    for (const sz of [-1, 1]) {
      v.push(V(x, y + .15, z + sz * 1.36, segW, .18, .17, 'redWood'));
      v.push(V(x, y + .65, z + sz * 1.39, segW, .09, .12, 'redWood'));
      v.push(V(x, y + .98, z + sz * 1.39, segW, .11, .14, 'redWood'));
    }
  }
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    const x = x1 + span * t;
    const y = surface(t);
    for (const sz of [-1, 1]) {
      const postY = y + .58;
      v.push(V(x, postY, z + sz * 1.39, .17, 1.06, .17, 'redWood'));
      v.push(V(x, postY + .56, z + sz * 1.39, .24, .12, .24, 'goldAccent'));
      if (i === 0 || i === 10) {
        v.push(V(x, .2, z + sz * 1.39, .35, .48, .35, 'stoneDark'));
        v.push(V(x, .55, z + sz * 1.39, .27, .24, .27, 'stone'));
        v.push(V(x, y + 1.06, z + sz * 1.39, .14, .16, .14, 'gold'));
      }
    }
    if (i === 3 || i === 5 || i === 7) {
      const pillarTop = surface(t) - .25;
      const pillarH = pillarTop + .55;
      for (const sz of [-1, 1]) {
        v.push(V(x, -.55 + pillarH / 2, z + sz * 1.02, .22, pillarH, .22, 'wood'));
      }
    }
  }
  // A small stone landing at each bank.
  for (const bx of [x1 - 1.25, x2 + 1.25]) {
    v.push(V(bx, .1, z, 1.8, .2, 3.6, 'stone'));
    v.push(V(bx + (bx < LAYOUT.pond.x ? .4 : -.4), .24, z, 1.2, .12, 3.0, 'pathStone'));
  }
  scene.add(addMerged(v, { castShadow: true, receiveShadow: true }));
}

}

// =====================================================================
//  SAKURA GROVES
// =====================================================================
const sakuraTrees = [];
const petalOrigins = [];

function buildSakura(x, z, scale = 1, seed = 1) {
  const tr = mulberry32(seed);
  const trr = (a, b) => a + (b - a) * tr();
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  group.rotation.y = trr(0, Math.PI * 2);
  const trunk = [];
  const canopy = [];
  const trunkH = trr(3.2, 4.2) * scale;
  let tx = 0, tz = 0;
  for (let i = 0; i < 7; i++) {
    const y = .3 + i * (trunkH / 7);
    tx += trr(-.06, .06); tz += trr(-.06, .06);
    const w = (.75 - i * .055) * scale;
    trunk.push(V(tx, y, tz, w, trunkH / 7 + .06, w, 'bark', { ry: trr(-.15, .15) }));
  }
  // Flared roots make the tree feel planted.
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * Math.PI * 2;
    trunk.push(V(Math.cos(a) * .42 * scale, .08 * scale, Math.sin(a) * .42 * scale, .65 * scale, .2 * scale, .28 * scale, 'bark', { ry: -a }));
  }

  const tips = [];
  const branchCount = Math.round(6 * scale);
  for (let b = 0; b < branchCount; b++) {
    const angle = b / branchCount * Math.PI * 2 + trr(-.3, .3);
    let bx = trr(-.1, .1), bz = trr(-.1, .1);
    let by = trunkH * trr(.55, .9);
    const segs = ri(3, 5);
    for (let s = 0; s < segs; s++) {
      bx += Math.cos(angle) * trr(.38, .68) * scale;
      bz += Math.sin(angle) * trr(.38, .68) * scale;
      by += trr(.17, .38) * scale;
      const w = (.32 - s * .035) * scale;
      trunk.push(V(bx, by, bz, w, .42 * scale, w, 'bark', { ry: angle, rz: trr(-.15, .15) }));
      if (s >= 1) tips.push([bx, by, bz]);
    }
  }
  tips.push([0, trunkH + .6 * scale, 0]);

  for (const [bx, by, bz] of tips) {
    const puffs = ri(4, 8);
    for (let i = 0; i < puffs; i++) {
      const a = trr(0, Math.PI * 2);
      const rad = Math.sqrt(trr(0, 1)) * 1.45 * scale;
      canopy.push(V(
        bx + Math.cos(a) * rad,
        by + trr(-.35, 1.05) * scale,
        bz + Math.sin(a) * rad,
        trr(.55, 1.15) * scale,
        trr(.45, .95) * scale,
        trr(.55, 1.15) * scale,
        tr > .35 ? (tr > .55 ? 'sakura1' : 'sakura2') : 'sakura3',
        { ry: trr(0, Math.PI), rz: trr(-.08, .08) }
      ));
    }
  }
  // An airy crown above the trunk.
  for (let i = 0; i < 30; i++) {
    const a = trr(0, Math.PI * 2);
    const rad = Math.sqrt(trr(0, 1)) * 2.1 * scale;
    canopy.push(V(
      Math.cos(a) * rad,
      trunkH + trr(.4, 2.0) * scale,
      Math.sin(a) * rad,
      trr(.4, 1.05) * scale,
      trr(.35, .78) * scale,
      trr(.4, 1.05) * scale,
      trr(0, 1) > .55 ? 'sakura1' : (trr() > .5 ? 'sakura2' : 'sakura3'),
      { ry: trr(0, Math.PI) }
    ));
  }
  // Fallen petals ring the base.
  for (let i = 0; i < 34; i++) {
    const a = trr(0, Math.PI * 2), r = Math.sqrt(trr(0, 1)) * 2.4 * scale;
    canopy.push(V(Math.cos(a) * r, .01, Math.sin(a) * r, trr(.08, .2), .018, trr(.06, .16), trr() > .5 ? 'sakura2' : 'sakura3', { ry: trr(0, Math.PI) }));
  }

  group.add(addMerged(trunk, { castShadow: true, receiveShadow: true }));
  group.add(addMerged(canopy, { castShadow: true, receiveShadow: true }));
  scene.add(group);
  sakuraTrees.push({ group, x, z, canopyY: trunkH + 1.5 * scale, radius: 2.7 * scale, scale });
  petalOrigins.push({ x, z, y: trunkH + 1.6 * scale, radius: 2.2 * scale });
  return group;
}

  buildSakura(-17.2, 13.6, 1.18, 710);

  buildSakura(-38.6, -5.3, .96, 732);
  buildSakura(39.0, 19.8, 1.02, 743);

// =====================================================================
//  BAMBOO GROVE
// =====================================================================
const bambooStalks = [];

function buildBambooStalk(x, z, height, seed) {
  const tr = mulberry32(seed);
  const trr = (a, b) => a + (b - a) * tr();
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  const v = [];
  const segH = trr(1.0, 1.35);
  const segments = Math.floor(height / segH);
  let leanX = trr(-.025, .025), leanZ = trr(-.025, .025);
  let toX = 0, toZ = 0;
  for (let i = 0; i < segments; i++) {
    const y = .4 + i * segH;
    toX += leanX; toZ += leanZ;
    const w = (.28 + (.32 - .28) * (i / segments)) * trr(.93, 1.06);
    v.push(V(toX, y, toZ, w, segH + .02, w, 'bamboo'));
    v.push(V(toX, y + segH * .5, toZ, w * 1.22, .055, w * 1.22, 'forest'));
    if (i > segments * .42 && trr() < .72) {
      const branches = ri(1, 3);
      for (let b = 0; b < branches; b++) {
        const a = trr(0, Math.PI * 2);
        const len = trr(.55, 1.35);
        v.push(V(toX + Math.cos(a) * len * .48, y + trr(-.18, .4), toZ + Math.sin(a) * len * .48, .48, .035, len, trr() > .5 ? 'bambooLeaf' : 'forestLight', { ry: -a, rz: trr(-.12, .12) }));
        if (trr() < .75) {
          v.push(V(toX + Math.cos(a) * len, y + trr(.05, .45), toZ + Math.sin(a) * len, .28, .03, .5, 'bambooLeaf', { ry: -a + trr(-.7, .7) }));
        }
      }
    }
  }
  // Crown leaves.
  for (let i = 0; i < 14; i++) {
    const a = trr(0, Math.PI * 2);
    const len = trr(.5, 1.25);
    v.push(V(toX + Math.cos(a) * len * .5, height + trr(-.9, .5), toZ + Math.sin(a) * len * .5, .42, .032, len, trr() > .3 ? 'bambooLeaf' : 'forestLight', { ry: -a, rz: trr(-.3, .3) }));
  }
  group.add(addMerged(v, { castShadow: true, receiveShadow: true }));
  scene.add(group);
  bambooStalks.push({ group, phase: rr(0, Math.PI * 2), sway: rr(.0025, .007) });
  return group;
}

function buildBambooGrove() {
  const groves = [
    { cx: -31.5, cz: -16, rx: 8, rz: 8, count: 17, seed: 900 },
    { cx: 32.5, cz: -25, rx: 6.5, rz: 6.5, count: 9, seed: 940 },
    { cx: -41, cz: 17, rx: 4.2, rz: 5.5, count: 5, seed: 960 }
  ];
  for (const grove of groves) {
    for (let i = 0; i < grove.count; i++) {
      const a = rr(0, Math.PI * 2), rad = Math.sqrt(rr(0, 1));
      const x = grove.cx + Math.cos(a) * grove.rx * rad;
      const z = grove.cz + Math.sin(a) * grove.rz * rad;
      if (isPond(x, z)) continue;
      buildBambooStalk(x, z, rr(9, 16.5), grove.seed + i * 17);
    }
    const floor = [];
    for (let i = 0; i < 34; i++) {
      const a = rr(0, Math.PI * 2), rad = Math.sqrt(rr(0, 1));
      const x = grove.cx + Math.cos(a) * grove.rx * rad;
      const z = grove.cz + Math.sin(a) * grove.rz * rad;
      if (isPond(x, z)) continue;
      floor.push(V(x, .035, z, rr(.35, 1.0), .07, rr(.35, 1.0), rng() > .45 ? 'moss' : 'grassTuft', { ry: rr(0, Math.PI) }));
      if (rng() < .45) {
        floor.push(V(x + rr(-.5, .5), rr(.15, .32), z + rr(-.5, .5), .12, rr(.3, .6), .12, 'bamboo'));
        floor.push(V(x + rr(-.5, .5), .06, z + rr(-.5, .5), .3, .06, .3, 'moss'));
      }
    }
    scene.add(addMerged(floor, { castShadow: true, receiveShadow: true }));
  }
}

// =====================================================================
//  PINES AND A DRY ZEN GARDEN
// =====================================================================
const PINE_SPOTS = [
  [-8.2, -27.2, 10.5, 1113], [28.2, -22.8, 9.4, 1121], [-40.8, -17.4, 8.0, 1129],
  [41.5, 1.0, 8.8, 1137], [-39.0, 26.2, 7.4, 1149], [44.0, 33.0, 8.2, 1157],
  [-28.5, 38.0, 7.6, 1163], [37.0, -34.0, 8.8, 1171], [-25.0, -39.0, 9.1, 1181],
  [-44.0, -31.0, 8.4, 1191]
];

function buildPines() {
  const vox = [];
  for (const [x, z, height, seed] of PINE_SPOTS) {
    const tr = mulberry32(seed);
    const trr = (a, b) => a + (b - a) * tr();
    let tx = 0, tz = 0;
    const bendAngle = trr(0, Math.PI * 2);
    for (let i = 0; i < 6; i++) {
      const y = .3 + i * height / 6;
      tx += Math.cos(bendAngle) * trr(0, .08);
      tz += Math.sin(bendAngle) * trr(0, .08);
      vox.push(V(x + tx, y, z + tz, .58 - i * .045, height / 6 + .1, .58 - i * .045, 'bark', { ry: trr(0, 1) }));
    }
    // Low roots.
    for (let r = 0; r < 6; r++) {
      const a = r / 6 * Math.PI * 2;
      vox.push(V(x + Math.cos(a) * .55, .1, z + Math.sin(a) * .55, .6, .14, .24, 'bark', { ry: -a }));
    }
    const pads = [
      { y: height * .48, count: 4, spread: 2.2 },
      { y: height * .62, count: 5, spread: 2.8 },
      { y: height * .76, count: 4, spread: 2.2 },
      { y: height * .88, count: 3, spread: 1.4 }
    ];
    for (const pad of pads) {
      for (let b = 0; b < pad.count; b++) {
        const a = trr(0, Math.PI * 2);
        const len = trr(.7, pad.spread);
        const bx = x + tx + Math.cos(a) * len;
        const bz = z + tz + Math.sin(a) * len;
        const by = pad.y + trr(-.25, .35);
        if (len > .7) {
          vox.push(V((x + tx + bx) / 2, by - .25, (z + tz + bz) / 2, .22, .16, len * .95, 'bark', { ry: -a }));
        }

const MOUNTAIN_PEAKS = [
  { x: -44, z: -216, h: 128, r: 70, phase: .8 },
  { x: 36, z: -254, h: 151, r: 82, phase: 2.1 },
  { x: 118, z: -196, h: 112, r: 62, phase: 4.1 },
  { x: -134, z: -186, h: 119, r: 67, phase: 1.2 },
  { x: -209, z: -88, h: 96, r: 61, phase: 3.5 },

  { x: -192, z: 158, h: 92, r: 66, phase: 4.8 },
  { x: -48, z: 264, h: 80, r: 85, phase: 6.1 },
  { x: 92, z: 216, h: 72, r: 61, phase: 1.9 },
  { x: -98, z: 102, h: 62, r: 48, phase: .9 },
  { x: 115, z: 78, h: 57, r: 46, phase: 3.2 },

  // Secondary spires give the skyline shoulders, horns and saddles.
  { x: -108, z: -231, h: 94, r: 35, phase: 2.9 },
  { x: -10, z: -237, h: 102, r: 32, phase: 5.1 },
  { x: 73, z: -257, h: 118, r: 36, phase: 1.7 },
  { x: -185, z: -189, h: 79, r: 30, phase: 4.2 },
  { x: 171, z: -167, h: 76, r: 30, phase: .7 },
  { x: -82, z: -154, h: 70, r: 33, phase: 3.3 },
  { x: 12, z: -181, h: 77, r: 29, phase: 1.0 }
];

function mountainHeight(x, z) {
  const r = Math.hypot(x, z);
  if (r < 92) return 0;
  let first = 0, second = 0;
  for (const p of MOUNTAIN_PEAKS) {
    const dx = x - p.x, dz = z - p.z;
    const d = Math.hypot(dx, dz);
    if (d > p.r) continue;
    const t = 1 - d / p.r;
    const angle = Math.atan2(dz, dx);
    const lobes = 1 + Math.sin(angle * 3 + p.phase) * .09 + Math.sin(angle * 7 - p.phase * 1.7) * .045;
    const spur = 1 + Math.sin(angle * 9 + t * 8 + p.phase) * .05 * smoothstep(.2, 1, t);
    const v = p.h * Math.pow(t, 1.38) * lobes * spur;
    if (v > first) { second = first; first = v; }
    else if (v > second) { second = v; }
  }
  let h = first + second * .18;
  const foot = smoothstep(96, 144, r) * (1 - smoothstep(255, 330, r));
  const foothill = foot * (4 + fbm(x * .029 + 4, z * .029 - 8) * 20);
  h = Math.max(h, foothill);
  const detail = (fbm(x * .047 + 11, z * .047 - 17) - .5) * 20
    + (fbm(x * .115, z * .115) - .5) * 6;
  h += detail * smoothstep(3, 28, h);
  h *= smoothstep(92, 112, r);
  return Math.max(0, h);
}

const distantRidgeLayers = [];
function buildBackdropRidges() {
  const defs = [
    { radius: 355, segments: 190, base: 18, amp: 58, phase: 1.2, tint: .13, light: .7 },
    { radius: 482, segments: 170, base: 27, amp: 79, phase: 3.7, tint: .29, light: .8 }
  ];
  for (const def of defs) {
    const positions = [];
    const indices = [];
    for (let i = 0; i <= def.segments; i++) {
      const a = i / def.segments * Math.PI * 2;
      const x = Math.cos(a) * def.radius;
      const z = Math.sin(a) * def.radius;
      const wave = .16 + .44 * Math.pow(.5 + .5 * Math.sin(a * 5 + def.phase), 2.1)
        + .25 * Math.pow(.5 + .5 * Math.sin(a * 9 - def.phase * 2.1), 2.4)
        + .12 * Math.sin(a * 17 + def.phase * 1.6) + .06 * Math.sin(a * 29 - def.phase);
      const h = def.base + def.amp * clamp(wave, .12, 1.02);
      positions.push(x, -12, z, x, h, z);
      if (i < def.segments) {
        const k = i * 2;
        indices.push(k, k + 2, k + 1, k + 1, k + 2, k + 3);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(indices);
    const mat = new THREE.MeshBasicMaterial({
      color: 0x9fb3b7, side: THREE.DoubleSide, fog: false, toneMapped: false,
      transparent: true, opacity: .92, depthWrite: true
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.frustumCulled = false;
    mesh.renderOrder = -4;
    scene.add(mesh);
    distantRidgeLayers.push({ mat, tint: def.tint, light: def.light });
  }
}

function buildMountains() {
  const rockItems = [];
  const snowItems = [];
  const mossItems = [];
  const snowCaps = [];
  const step = 4;

  for (let x = -304; x <= 304; x += step) {
    for (let z = -304; z <= 304; z += step) {
      const r = Math.hypot(x, z);
      if (r < 94 || r > 318) continue;
      const h = mountainHeight(x, z);
      if (h < 2.8) continue;
      const levels = Math.max(1, Math.ceil(h / step));
      const snowLine = 84 + (fbm(x * .045 + 2, z * .045 - 5) - .5) * 15;
      const topFace = (levels - 1) * 4 + 1;
      for (let k = 0; k < levels; k++) {
        const top = k * 4 + 1;
        const isSnow = top > snowLine && !(fbm(x * .13, z * .13) > .82 && top < snowLine + 16);
        let matKey = 'rock';
        if (isSnow) matKey = 'snow';
        else if (top < 9 && rng() < .5) matKey = 'moss';
        const jitter = rr(-1.45, 1.45);
        const item = {
          x: x + jitter, y: -1 + k * 4, z: z + rr(-1.45, 1.45),
          sx: 4.02, sy: 4.02, sz: 4.02,
          color: matKey === 'snow'
            ? new THREE.Color().setRGB(rr(.94, 1), rr(.96, 1), rr(.99, 1))
            : matKey === 'moss'
              ? new THREE.Color().setRGB(rr(.67, .9), rr(.77, 1), rr(.62, .86))
              : new THREE.Color().setRGB(rr(.72, .98), rr(.74, .98), rr(.76, 1))
        };
        if (matKey === 'snow') snowItems.push(item);
        else if (matKey === 'moss') mossItems.push(item);
        else rockItems.push(item);
      }

      // Tiny 2 x 2 crowns make the ridgeline uneven at close distance.
      if (h > snowLine - 18 && levels > 5 && ((Math.round((x + 304) / step) + Math.round((z + 304) / step)) % 3 === 0)) {
        const jitterX = rr(-1.2, 1.2), jitterZ = rr(-1.2, 1.2);
        const capH = rr(1.1, 2.7);
        snowCaps.push({
          x: x + jitterX, y: topFace + capH * .5, z: z + jitterZ,
          sx: 2.02, sy: capH, sz: 2.02,
          color: new THREE.Color().setRGB(rr(.91, 1), rr(.94, 1), rr(.98, 1))
        });
      }
    }
  }
  addInstances(rockItems, MAT.rock, { castShadow: false, receiveShadow: false });
  addInstances(snowItems, MAT.snow, { castShadow: false, receiveShadow: false });
  addInstances(snowCaps, MAT.snow, { castShadow: false, receiveShadow: false });
  addInstances(mossItems, MAT.moss, { castShadow: false, receiveShadow: false });
}

  addInstances(leavesPink, MAT.sakura1, { castShadow: false, receiveShadow: false });
}

  const p = TIME_PRESETS[mode];
  document.querySelectorAll('.time-btn').forEach(btn => {
    btn.dataset.active = btn.dataset.time === mode ? 'true' : 'false';
    btn.setAttribute('aria-pressed', btn.dataset.time === mode ? 'true' : 'false');
  });
  const statusName = document.getElementById('statusName');
  const statusClock = document.getElementById('statusClock');
  const orb = document.getElementById('statusOrb');
  if (statusName) statusName.textContent = p.name;
  if (statusClock) statusClock.textContent = p.clock;
  if (orb) orb.className = 'orb ' + p.orb;
}

let skyColorTimer = 0;
function updateSkyColors() {
  const arr = skyColors;
  const c = new THREE.Color();
  for (let i = 0; i < skyPosition.count; i++) {
    const f = skyFactors[i];
    c.copy(currentAtmo.skyBottom).lerp(currentAtmo.skyTop, f);
    const horizon = Math.exp(-Math.pow((f - .055) / .2, 2)) * .17;
    if (horizon > .001) c.lerp(currentAtmo.skyGlow, horizon);
    arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b;
  }
  skyGeo.attributes.color.needsUpdate = true;
}

function updateAtmosphere(dt, elapsed) {
  const k = 1 - Math.exp(-dt * 1.5);
  for (const name of atmoColors) currentAtmo[name].lerp(targetAtmo[name], k);
  for (const name of atmoNumeric) currentAtmo[name] = lerp(currentAtmo[name], targetAtmo[name], k);
  currentAtmo.sunDir.lerp(targetAtmo.sunDir, k).normalize();

  scene.fog.color.copy(currentAtmo.fogColor);
  scene.fog.density = currentAtmo.fogDensity;
  renderer.toneMappingExposure = currentAtmo.exposure;
  hemi.color.copy(currentAtmo.hemiSky);
  hemi.groundColor.copy(currentAtmo.hemiGround);
  hemi.intensity = currentAtmo.hemiIntensity;
  fillLight.color.copy(currentAtmo.hemiSky).lerp(new THREE.Color(0xffffff), .6);
  fillLight.intensity = currentAtmo.lightIntensity * .21;
  sunLight.color.copy(currentAtmo.lightColor);
  sunLight.intensity = currentAtmo.lightIntensity;
  sunLight.position.copy(currentAtmo.sunDir).multiplyScalar(118);
  sunLight.target.position.set(0, 0, 0);

  celestialGroup.position.copy(currentAtmo.sunDir).multiplyScalar(560);
  celestialGroup.lookAt(camera.position);
  sunMat.opacity = currentAtmo.sunOpacity;
  moonMat.opacity = currentAtmo.moonOpacity;
  sunBox.visible = currentAtmo.sunOpacity > .01;
  moonBox.visible = currentAtmo.moonOpacity > .01;
  sunGlowMat.opacity = .68 * currentAtmo.sunOpacity;
  moonGlowMat.opacity = .42 * currentAtmo.moonOpacity;
  sunGlow.visible = currentAtmo.sunOpacity > .01;
  moonGlow.visible = currentAtmo.moonOpacity > .01;

  starMat.opacity = currentAtmo.stars * (.82 + .18 * Math.sin(elapsed * .35));
  motesPoints.material.opacity = currentAtmo.motes;
  fireflyPoints.material.opacity = currentAtmo.fireflies * (.78 + .22 * Math.sin(elapsed * 1.4));

  MAT.shoji.emissiveIntensity = currentAtmo.shoji;
  MAT.paper.emissiveIntensity = .18 + currentAtmo.paper * 1.4;
  MAT.cloud.color.copy(currentAtmo.cloudColor);
  MAT.cloudShade.color.copy(currentAtmo.cloudShade);
  MAT.cloud.emissiveIntensity = .05 + currentAtmo.sunOpacity * .13;
  MAT.cloudShade.emissiveIntensity = .035 + currentAtmo.sunOpacity * .09;
  lanternGlowMat.opacity = .04 + currentAtmo.lantern * .55;

  for (let i = 0; i < lanternLights.length; i++) {
    const entry = lanternLights[i];
    const flicker = .93 + .055 * Math.sin(elapsed * 2.7 + i * 2.1) + .02 * Math.sin(elapsed * 7.3 + i);
    entry.light.intensity = entry.base * currentAtmo.lantern * flicker;
  }

  for (const layer of distantRidgeLayers) {
    layer.mat.color.copy(currentAtmo.fogColor).lerp(currentAtmo.skyTop, layer.tint).multiplyScalar(layer.light);
  }

  updateSkyColors();
  if (currentAtmo.stars > .03) {
    starMat.size = 1.5 + .15 * Math.sin(elapsed * .7);
  }
}

function setCameraActive(view) {

    const active = btn.dataset.view === view;

  });
}
function flyToView(view, duration = 1.9) {
  const preset = CAMERA_PRESETS[view];
  if (!preset) return;
  cameraTween = {
    fromPos: camera.position.clone(),
    toPos: preset.pos.clone(),
    fromTarget: controls.target.clone(),
    toTarget: preset.target.clone(),
    fromFov: camera.fov,
    toFov: preset.fov || 50,
    duration,
    age: 0
  };
  controls.enabled = false;
  setCameraActive(view);
}
function updateCamera(dt) {
  if (cameraTween) {
    cameraTween.age += dt;
    const x = clamp(cameraTween.age / cameraTween.duration, 0, 1);
    const e = x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    camera.position.lerpVectors(cameraTween.fromPos, cameraTween.toPos, e);
    controls.target.lerpVectors(cameraTween.fromTarget, cameraTween.toTarget, e);
    camera.lookAt(controls.target);
    if (cameraTween.toFov !== undefined) {
      camera.fov = lerp(cameraTween.fromFov, cameraTween.toFov, e);
      camera.updateProjectionMatrix();
    }
    if (x >= 1) {
      cameraTween = null;
      controls.enabled = true;
      controls.update();
    }
  } else {
    controls.update();
  }
}

// =====================================================================
//  AMBIENT AUDIO — wind + random chimes (native Web Audio)
// =====================================================================
class ZenAmbience {
  constructor() {
    this.ctx = null;
    this.enabled = false;
    this.chimeTimer = null;
    this.notes = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
  }
  init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error('Web Audio is not available in this browser.');
    const ctx = new AC();
    this.ctx = ctx;
    this.master = ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(ctx.destination);

    // A simple algorithmic hall for the chimes.
    this.convolver = ctx.createConvolver();
    const seconds = 3.2;
    const length = Math.floor(ctx.sampleRate * seconds);
    const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = impulse.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.4);
      }
    }
    this.convolver.buffer = impulse;
    const wet = ctx.createGain();
    wet.gain.value = .58;
    this.convolver.connect(wet);
    wet.connect(this.master);
    this.wetSend = ctx.createGain();
    this.wetSend.gain.value = .55;
    this.wetSend.connect(this.convolver);
    this.dry = ctx.createGain();
    this.dry.gain.value = .72;
    this.dry.connect(this.master);

    // Wind: brown-ish noise through a soft low-pass and a second airy band.
    const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 6), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let last = 0;
    for (let i = 0; i < data.length; i++) {
      const white = Math.random() * 2 - 1;
      last = (last + white * .018) / 1.018;
      data[i] = last * 3.1;
    }
    const windSrc = ctx.createBufferSource();
    windSrc.buffer = buffer;
    windSrc.loop = true;
    const windFilter = ctx.createBiquadFilter();
    windFilter.type = 'lowpass';
    windFilter.frequency.value = 380;
    windFilter.Q.value = .65;
    const windGain = ctx.createGain();
    windGain.gain.value = .12;
    windSrc.connect(windFilter).connect(windGain).connect(this.master);
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    lfo.frequency.value = .055;
    lfoGain.gain.value = .06;
    lfo.connect(lfoGain).connect(windGain.gain);
    lfo.start();
    windSrc.start();

    const airSrc = ctx.createBufferSource();
    airSrc.buffer = buffer;
    airSrc.loop = true;
    airSrc.playbackRate.value = 1.7;
    const airFilter = ctx.createBiquadFilter();
    airFilter.type = 'bandpass';
    airFilter.frequency.value = 1250;
    airFilter.Q.value = .38;
    const airGain = ctx.createGain();
    airGain.gain.value = .018;
    airSrc.connect(airFilter).connect(airGain).connect(this.master);
    airSrc.start();
    this.wind = { windSrc, airSrc };
  }
  scheduleChime(first = false) {
    clearTimeout(this.chimeTimer);
    if (!this.enabled) return;
    const delay = first ? 800 : (4500 + Math.random() * 8500);
    this.chimeTimer = setTimeout(() => {
      this.playChime();
      this.scheduleChime(false);
    }, delay);
  }
  playChime() {
    if (!this.enabled || !this.ctx) return;
    const ctx = this.ctx;
    const t0 = ctx.currentTime + .05;
    const count = Math.random() > .55 ? 2 : 1;
    for (let n = 0; n < count; n++) {
      const freq = this.notes[2 + Math.floor(Math.random() * (this.notes.length - 2))] * (Math.random() > .86 ? .5 : 1);
      const when = t0 + n * (.28 + Math.random() * .3);
      const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      if (panner) { panner.pan.value = (Math.random() * 2 - 1) * .7; panner.connect(this.dry); panner.connect(this.wetSend); }
      const voice = ctx.createGain();
      voice.gain.setValueAtTime(0, when);
      voice.gain.linearRampToValueAtTime(.085, when + .012);
      voice.gain.exponentialRampToValueAtTime(.0001, when + 2.8);
      if (panner) voice.connect(panner); else { voice.connect(this.dry); voice.connect(this.wetSend); }
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, when);
      osc.frequency.exponentialRampToValueAtTime(freq * .994, when + 2.5);
      osc.connect(voice);
      const harm = ctx.createOscillator();
      harm.type = 'triangle';
      harm.frequency.setValueAtTime(freq * 2.01, when);
      const hg = ctx.createGain();
      hg.gain.value = .13;
      harm.connect(hg).connect(voice);
      osc.start(when); harm.start(when);
      osc.stop(when + 3); harm.stop(when + 3);
    }
  }
  async toggle() {
    if (!this.ctx) this.init();
    if (this.ctx.state === 'suspended') await this.ctx.resume();
    this.enabled = !this.enabled;
    const now = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setTargetAtTime(this.enabled ? .68 : 0, now, .35);
    if (this.enabled) this.scheduleChime(true);
    else { clearTimeout(this.chimeTimer); this.chimeTimer = null; }
    return this.enabled;
  }
}
const ambience = new ZenAmbience();

// =====================================================================
//  LIVE ANIMATION
// =====================================================================
function updateAnimations(elapsed, dt) {
  // Samurai breathing and the tiniest turn of the head.
  for (const s of samuraiList) {
    const breath = Math.sin(elapsed * 1.15 + s.phase);
    s.root.scale.y = 1.04 * (1 + breath * .0055);
    s.root.position.y = breath * .004;
    s.root.rotation.y = s.baseRotY + Math.sin(elapsed * .22 + s.phase) * .013;
    s.head.rotation.y = Math.sin(elapsed * .34 + s.phase) * .055;
    s.head.rotation.x = Math.sin(elapsed * .53 + s.phase) * .012;
  }

  // Wandering sheep and grazing alpacas.
  for (const a of animals) {
    a.timer -= dt;
    const dx = a.target.x - a.root.position.x;
    const dz = a.target.z - a.root.position.z;
    const dist = Math.hypot(dx, dz);
    if (a.timer <= 0) {
      chooseAnimalTarget(a);
    }
    let moving = 0;
    if (a.state === 'walk') {
      if (dist < .45) {
        a.state = 'graze';
        a.timer = rr(4, 10);
      } else {
        moving = 1;
        const desired = Math.atan2(dx, dz);
        let diff = (desired - a.root.rotation.y + Math.PI * 3) % (Math.PI * 2) - Math.PI;
        a.root.rotation.y += diff * Math.min(1, dt * 2.2);
        const step = Math.min(a.speed * dt, dist);
        a.root.position.x += dx / (dist || 1) * step;
        a.root.position.z += dz / (dist || 1) * step;
        const b = a.bounds;
        a.root.position.x = clamp(a.root.position.x, b.minX, b.maxX);
        a.root.position.z = clamp(a.root.position.z, b.minZ, b.maxZ);
      }
    }
    a.walkBlend = lerp(a.walkBlend, moving, Math.min(1, dt * 3));
    const bob = Math.abs(Math.sin(elapsed * (moving ? 7 : 2) + a.phase)) * (moving ? .022 : .007);
    a.root.position.y = bob;
    a.legs.forEach((leg, i) => {
      const swings = [0, Math.PI, Math.PI, 0];
      leg.rotation.x = Math.sin(elapsed * 7.5 + a.phase + swings[i]) * .34 * a.walkBlend;
    });
    const graze = a.state === 'graze' ? 1 : 0;
    const targetHead = a.type === 'alpaca'
      ? (graze ? 1.08 : .03)
      : (graze ? .82 : .03);
    a.head.rotation.x = lerp(a.head.rotation.x, targetHead, Math.min(1, dt * 2.4));
    if (a.type === 'alpaca') {
      a.head.position.y = lerp(a.head.position.y, a.headBaseY - graze * .13, Math.min(1, dt * 2.2));
      a.head.rotation.z = Math.sin(elapsed * .75 + a.phase) * .018;
    } else {
      a.head.rotation.z = Math.sin(elapsed * .8 + a.phase) * .025;
    }
  }

  // Birds circling overhead.
  for (const b of birds) {
    const angle = b.phase + elapsed * b.speed;
    const x = b.cx + Math.cos(angle) * b.rx;
    const z = b.cz + Math.sin(angle) * b.rz;
    const y = b.altitude + Math.sin(elapsed * .62 + b.phase) * b.bob;
    b.root.position.set(x, y, z);
    const vx = -Math.sin(angle) * b.rx * b.speed;
    const vz = Math.cos(angle) * b.rz * b.speed;
    b.root.rotation.y = Math.atan2(vx, vz);
    const wing = Math.sin(elapsed * b.flap + b.phase) * .62;
    b.left.rotation.z = -wing;
    b.right.rotation.z = wing;
    b.root.rotation.z = Math.sin(elapsed * b.flap * .5 + b.phase) * .06;
  }

  // Slow block clouds across the high sky.
  for (const c of clouds) {
    c.group.position.x += c.speed * dt;
    if (c.group.position.x > 205) c.group.position.x = -205;
    if (c.group.position.x < -205) c.group.position.x = 205;
    c.group.position.y = c.baseY + Math.sin(elapsed * .16 + c.bob) * .65;
  }

  // Bamboo sways as one tall, slender stalk.
  for (const stalk of bambooStalks) {
    stalk.group.rotation.z = Math.sin(elapsed * .36 + stalk.phase) * stalk.sway * 5.2;
    stalk.group.rotation.x = Math.cos(elapsed * .29 + stalk.phase) * stalk.sway * 3.3;
  }

  // Water texture drift.
  MAT.water.map.offset.x = Math.sin(elapsed * .075) * .016;
  MAT.water.map.offset.y = Math.cos(elapsed * .055) * .013;

  // Lily pads breathe on the surface.
  for (const l of animatedLilies) {
    const m = l.mesh;
    for (let i = 0; i < l.data.length; i++) {
      const p = l.data[i];
      petalDummy.position.set(p.x, p.baseY + Math.sin(elapsed * .85 + p.phase) * .018, p.z);
      petalDummy.rotation.set(0, p.rot + Math.sin(elapsed * .2 + p.phase) * .1, 0);
      petalDummy.scale.set(p.sx, .045, p.sz);
      petalDummy.updateMatrix();
      m.setMatrixAt(i, petalDummy.matrix);
    }
    m.instanceMatrix.needsUpdate = true;
  }

  // Koi tracing lazy circuits beneath the bridge.
  for (const k of animatedKoi) {
    const a = k.phase + elapsed * k.speed;
    const x = k.centerX + Math.cos(a) * k.rx;
    const z = k.centerZ + Math.sin(a) * k.rz;
    k.group.position.set(x, k.y + Math.sin(elapsed * 1.1 + k.phase) * .025, z);
    const vx = -Math.sin(a) * k.rx;
    const vz = Math.cos(a) * k.rz;
    k.group.rotation.y = Math.atan2(vx, vz) + Math.sin(elapsed * 3.4 + k.phase) * .13;
    k.group.rotation.z = Math.sin(elapsed * 2.3 + k.phase) * .03;
  }

  // Sakura petals.
  updatePetals(elapsed, dt);

  // Motes and fireflies.
  motesPoints.rotation.y = elapsed * .004;
  const fp = fireflyPoints.geometry.attributes.position;
  for (let i = 0; i < fireflyData.length; i++) {
    const f = fireflyData[i];
    fp.array[i * 3] = f.x + Math.sin(elapsed * .28 + f.phase) * f.amp;
    fp.array[i * 3 + 1] = f.y + Math.sin(elapsed * .43 + f.phase * 1.7) * .35;
    fp.array[i * 3 + 2] = f.z + Math.cos(elapsed * .23 + f.phase) * f.amp;
  }
  fp.needsUpdate = true;
}

function updatePetals(elapsed, dt) {
  if (!petalMesh) return;
  for (let i = 0; i < petalData.length; i++) {
    const p = petalData[i];
    p.y -= p.fall * dt;
    p.x += Math.sin(elapsed * .85 + p.phase) * p.sway * dt;
    p.z += Math.cos(elapsed * .57 + p.phase) * p.sway * .35 * dt;
    p.rx += p.spinX * dt;
    p.ry += p.spinY * dt;
    p.rz += p.spinZ * dt;
    if (p.y < .055) resetPetal(p);
    petalDummy.position.set(p.x, p.y, p.z);
    petalDummy.rotation.set(p.rx, p.ry, p.rz);
    petalDummy.scale.set(p.scale, 1, p.scale);
    petalDummy.updateMatrix();
    petalMesh.setMatrixAt(i, petalDummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;
}

// =====================================================================
//  UI EVENTS
// =====================================================================
function bindUI() {
  document.querySelectorAll('.cam-btn').forEach(btn => {
    btn.addEventListener('click', () => flyToView(btn.dataset.view));
  });
  document.querySelectorAll('.time-btn').forEach(btn => {
    btn.addEventListener('click', () => setTimeMode(btn.dataset.time));
  });

  const audioBtn = document.getElementById('audioBtn');
  const audioState = document.getElementById('audioState');
  audioBtn.addEventListener('click', async () => {
    try {
      const on = await ambience.toggle();
      audioBtn.classList.toggle('on', on);
      audioBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      audioState.textContent = on ? 'Wind on' : 'Sound off';
    } catch (err) {
      console.warn('Ambient audio unavailable:', err);
      audioState.textContent = 'Unavailable';
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k >= '1' && k <= '5') {
      flyToView(['pagoda', 'samurai', 'meadow', 'mountain', 'bird'][Number(k) - 1]);
    } else if (k === 'm') setTimeMode('morning');
    else if (k === 'u') setTimeMode('sunset');
    else if (k === 'n') setTimeMode('night');
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, window.innerWidth < 760 ? 1.5 : 1.8));
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function nextFrame() {

}

async function bootWorld() {
  try {
    const sequence = [
      ['Shaping the island garden', buildTerrain],
      ['Raising the mountain range', buildMountains],
      ['Layering the distant haze', buildBackdropRidges],
      ['Planting the distant forest', buildDistantForest],
      ['Raising the five-storey pagoda', buildPagoda],
      ['Setting the torii gate', buildTorii],
      ['Carving the pond and bridge', buildBridge],
      ['Lighting the stone lanterns', buildLanterns],
      ['Scattering garden flora', buildGardenFlora],
      ['Planting sakura and bamboo', () => { buildSakuraGrove(); buildBambooGrove(); }],
      ['Combing the zen gravel', buildDryGarden],
      ['Shaping the pines', buildPines],
      ['Welcoming the guardians', buildSamuraiPair],
      ['Calling the meadow animals', buildPastoralLife],
      ['Releasing the birds', buildBirds],
      ['Gathering the clouds', buildClouds],
      ['Hanging lantern lights', () => { buildBridgeLanternPosts(); }],
      ['Letting the petals fall', () => { buildPetals(); buildMotes(); buildFireflies(); }]
    ];
    for (const [label, task] of sequence) {
      setLoader(label);
      await nextFrame();
      task();
    }
    setLoader('Opening the gate');
    await nextFrame();

    setTimeMode('morning', true);
    updateAtmosphere(1, 0);
    updateCamera(0);
    bindUI();
    setCameraActive('pagoda');

    renderer.render(scene, camera);
    document.getElementById('hud').classList.add('ready');
    document.getElementById('loading').classList.add('hidden');
    controls.enabled = false;
    cameraTween = {
      fromPos: camera.position.clone(),
      toPos: CAMERA_PRESETS.pagoda.pos.clone(),
      fromTarget: new THREE.Vector3(0, 6, -4),
      toTarget: CAMERA_PRESETS.pagoda.target.clone(),
      fromFov: camera.fov,
      toFov: CAMERA_PRESETS.pagoda.fov,
      duration: 3.2,
      age: 0
    };
    centerIntroTarget(cameraTween);

    clock.start();
    requestAnimationFrame(animate);
  } catch (err) {
    console.error(err);
    setLoader('The sanctuary could not be raised — see console');
    const status = document.getElementById('loaderStatus');
    if (status) status.style.color = '#e0a280';
  }
}

function centerIntroTarget(tween) {
  tween.fromPos.set(43, 23, 63);
  camera.position.copy(tween.fromPos);
  controls.target.copy(tween.fromTarget);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  elapsed += dt;
  updateCamera(dt);
  updateAtmosphere(dt, elapsed);
  updateAnimations(elapsed, dt);
  renderer.render(scene, camera);
}

bootWorld();






</script>
