<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// Seeded RNG & noise
// ============================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260925);
const rr = (a, b) => a + (b - a) * rand();
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < 5; i++) { s += a * vnoise(x * f, y * f); n += a; a *= 0.5; f *= 2; }
  return s / n;
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ============================================================
// Renderer / scene / camera
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe6f5, 90, 430);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1200);
camera.position.set(38, 24, 64);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 2;
controls.maxDistance = 380;
controls.maxPolarAngle = Math.PI * 0.495;

// ============================================================
// Procedural 16x16 pixel textures
// ============================================================
const clampC = v => Math.max(0, Math.min(255, v | 0));
function makeTex(draw) {
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const g = c.getContext('2d');
  const px = (x, y, hex, j = 0) => {
    const k = (rand() * 2 - 1) * j;
    g.fillStyle = `rgb(${clampC(((hex >> 16) & 255) + k)},${clampC(((hex >> 8) & 255) + k)},${clampC((hex & 255) + k)})`;
    g.fillRect(x, y, 1, 1);

}
const each = f => px => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) f(px, x, y); };
const pick = (r, list) => { for (const [p, c] of list) if (r < p) return c; return list[list.length - 1][1]; };

const T = {};
T.grassTop = makeTex(each((px, x, y) => px(x, y, pick(rand(), [[0.12, 0x4a9336], [0.22, 0x74c653], [1, 0x5fb043]]), 12)));
T.grassSide = makeTex(px => { for (let x = 0; x < 16; x++) { const dd = 3 + Math.floor(rand() * 3); for (let y = 0; y < 16; y++) px(x, y, y < dd ? 0x5fb043 : (rand() < 0.18 ? 0x6a482c : 0x8b6341), 12); } });
T.dirt = makeTex(each((px, x, y) => px(x, y, rand() < 0.18 ? 0x6a482c : 0x8b6341, 12)));
T.sand = makeTex(each((px, x, y) => px(x, y, rand() < 0.2 ? 0xb8a57a : 0xcdb98c, 10)));
T.stone = makeTex(each((px, x, y) => px(x, y, pick(rand(), [[0.12, 0x66676d], [0.26, 0x9c9ca3], [1, 0x84858c]]), 8)));
T.snow = makeTex(each((px, x, y) => px(x, y, rand() < 0.15 ? 0xdbe5f3 : 0xf5f9ff, 6)));
T.snowSide = makeTex(px => { for (let x = 0; x < 16; x++) { const dd = 4 + Math.floor(rand() * 4); for (let y = 0; y < 16; y++) px(x, y, y < dd ? 0xf5f9ff : (rand() < 0.2 ? 0x66676d : 0x84858c), 7); } });
T.darkWood = makeTex(each((px, x, y) => px(x, y, x % 4 === 0 ? 0x24160f : (rand() < 0.08 ? 0x4a3020 : 0x3a2519), 6)));
T.plank = makeTex(each((px, x, y) => px(x, y, y % 4 === 3 ? 0x5e3b20 : 0x8d5d35, 10)));
T.red = makeTex(each((px, x, y) => px(x, y, (x === 0 || y === 0 || x === 15 || y === 15) ? 0x9e2314 : 0xc9361f, 10)));
T.black = makeTex(each((px, x, y) => px(x, y, rand() < 0.1 ? 0x2c282a : 0x1b191a, 4)));
T.roof = makeTex(each((px, x, y) => {
  const r = y % 4, seam = ((x + (Math.floor(y / 4) % 2) * 4) % 8) === 0;
  px(x, y, r === 3 ? 0x1a1d21 : seam ? 0x22262b : r === 0 ? 0x4b545d : 0x353c44, 5);
}));
T.gold = makeTex(each((px, x, y) => px(x, y, pick(rand(), [[0.15, 0xfff0a0], [0.3, 0xb07e12], [1, 0xe2b23a]]), 8)));
T.shoji = makeTex(each((px, x, y) => px(x, y, (x % 5 === 0 || y % 5 === 0) ? 0x3a2415 : 0xfff1d2, 5)));
T.lantern = makeTex(each((px, x, y) => px(x, y, (y < 2 || y > 13) ? 0x1b1a1a : (y % 3 === 0 ? 0x8a2412 : 0xe9532b), 8)));
T.lampWin = makeTex(each((px, x, y) => px(x, y, (x % 8 === 0 || y % 8 === 0 || x === 15 || y === 15) ? 0x4b4a48 : 0xffd27a, 6)));
T.water = makeTex(each((px, x, y) => px(x, y, pick(rand(), [[0.08, 0x8cc8ee], [0.25, 0x3f86c0], [1, 0x2e6ca6]]), 6)));
T.leaf = makeTex(each((px, x, y) => px(x, y, pick(rand(), [[0.2, 0x22501d], [0.4, 0x3f8a35], [1, 0x2f6d29]]), 10)));
T.pine = makeTex(each((px, x, y) => px(x, y, pick(rand(), [[0.25, 0x16361f], [0.5, 0x2a5a36], [1, 0x1f4a2b]]), 8)));
T.sakura = makeTex(each((px, x, y) => px(x, y, pick(rand(), [[0.1, 0xffffff], [0.35, 0xf48fb8], [0.6, 0xffc4da], [1, 0xffadd0]]), 8)));
T.sakura2 = makeTex(each((px, x, y) => px(x, y, pick(rand(), [[0.08, 0xffe4ef], [0.4, 0xef7aa9], [1, 0xf799c0]]), 8)));
T.bamboo = makeTex(each((px, x, y) => px(x, y, y < 2 ? 0x5d8a22 : y === 2 ? 0xa6dd62 : (x % 4 === 1 ? 0x6fae34 : 0x86c545), 8)));
T.bambooLeaf = makeTex(each((px, x, y) => px(x, y, rand() < 0.35 ? 0x5f9f2c : 0x7cbf3c, 10)));
T.bark = makeTex(each((px, x, y) => px(x, y, x % 3 === 0 ? 0x2f2019 : (rand() < 0.3 ? 0x5a3e31 : 0x4a3328), 6)));
T.gravel = makeTex(each((px, x, y) => px(x, y, y % 3 === 0 ? 0xb5ae9e : 0xd9d3c3, 10)));
T.pathStone = makeTex(each((px, x, y) => px(x, y, (x === 0 || y === 0 || x === 15 || y === 15) ? 0x7f7b74 : (rand() < 0.2 ? 0x9a958c : 0xb1aca2), 6)));
T.wool = makeTex(each((px, x, y) => px(x, y, rand() < 0.25 ? 0xdedad0 : 0xf6f3ec, 6)));
T.skin = makeTex(each((px, x, y) => px(x, y, 0xeabb91, 5)));
T.tsuka = makeTex(each((px, x, y) => px(x, y, ((x + y) % 4 === 0 || (x - y + 16) % 4 === 0) ? 0xf1ead8 : 0x1d1b24, 3)));
T.iron = makeTex(each((px, x, y) => px(x, y, y % 4 === 0 ? 0x4a525e : 0x262b33, 6)));
T.hakama = makeTex(each((px, x, y) => px(x, y, x % 4 === 0 ? 0x1e2946 : 0x2e3d63, 6)));
T.sheepFace = makeTex(each((px, x, y) => px(x, y, 0x3d3734, 6)));
const lamellar = (base, dark) => makeTex(each((px, x, y) => px(x, y, y % 3 === 2 ? dark : ((x % 4 === 1 && y % 3 === 1) ? 0xd6a83c : base), 8)));
T.armorRed = lamellar(0xb3261e, 0x5a120d);
T.armorBlue = lamellar(0x234070, 0x0f1d36);
const fur = base => makeTex(each((px, x, y) => px(x, y, base, 18)));
T.lily = makeTex(each((px, x, y) => px(x, y, (x === 8 && y < 8) ? 0x1f4f1f : ((x + y) % 5 === 0 ? 0x5fb04a : 0x3d8f3a), 6)));
T.sun = makeTex(each((px, x, y) => { const e = Math.min(x, y, 15 - x, 15 - y); px(x, y, e === 0 ? 0xffc53a : e < 3 ? 0xffe27a : 0xfff8d8, 4); }));
T.moon = makeTex(each((px, x, y) => px(x, y, rand() < 0.18 ? 0xc3c9d8 : 0xeef1f8, 4)));
T.cloud = makeTex(each((px, x, y) => px(x, y, 0xffffff, 4)));

// ============================================================
// Materials
// ============================================================
const L = (map, o = {}) => new THREE.MeshLambertMaterial({ map, ...o });
const C = (color, o = {}) => new THREE.MeshLambertMaterial({ color, ...o });
const M = {};
M.grassSide = L(T.grassSide); M.grassTop = L(T.grassTop); M.dirt = L(T.dirt);
M.grass = [M.grassSide, M.grassSide, M.grassTop, M.dirt, M.grassSide, M.grassSide];
M.snowSide = L(T.snowSide); M.snowTop = L(T.snow); M.stone = L(T.stone);
M.snowCap = [M.snowSide, M.snowSide, M.snowTop, M.stone, M.snowSide, M.snowSide];
M.sand = L(T.sand); M.darkWood = L(T.darkWood); M.plank = L(T.plank);
M.red = L(T.red); M.black = L(T.black); M.roof = L(T.roof);
M.gold = L(T.gold, { emissive: 0x3a2400 });
M.shoji = L(T.shoji, { emissive: 0xffb35c, emissiveMap: T.shoji, emissiveIntensity: 0.25 });
M.lantern = L(T.lantern, { emissive: 0xff6a2a, emissiveMap: T.lantern, emissiveIntensity: 0.4 });
M.lampWin = L(T.lampWin, { emissive: 0xffb050, emissiveMap: T.lampWin, emissiveIntensity: 0.3 });
M.leaf = L(T.leaf); M.pine = L(T.pine); M.sakura = L(T.sakura); M.sakura2 = L(T.sakura2);
M.bamboo = L(T.bamboo); M.bambooLeaf = L(T.bambooLeaf); M.bark = L(T.bark);
M.gravel = L(T.gravel); M.pathStone = L(T.pathStone);
M.wool = L(T.wool); M.skin = L(T.skin); M.tsuka = L(T.tsuka); M.iron = L(T.iron);
M.hakama = L(T.hakama); M.sheepFace = L(T.sheepFace);
M.armorRed = L(T.armorRed); M.armorBlue = L(T.armorBlue);
M.alpaca = [L(fur(0xe9d8b4)), L(fur(0xa0714a)), L(fur(0xf6f1e6)), L(fur(0x6b4a33))];
M.lily = L(T.lily);
M.cloud = L(T.cloud, { emissive: 0x303038 });
M.flowerW = C(0xffffff); M.flowerY = C(0xffd84a); M.flowerP = C(0xff8fc0);
M.pinkNose = C(0xd88a8a); M.eye = C(0x111111); M.muzzle = C(0x6b5244);
M.birdW = C(0xf4f4f4); M.birdB = C(0x1a1a1a); M.birdR = C(0xd02020); M.beak = C(0x8a8a70);
M.petal = C(0xffb6d3, { emissive: 0x3a1020 });

// ============================================================
// Instanced voxel batching (variable sized blocks)
// ============================================================
const BOX = new THREE.BoxGeometry(1, 1, 1);
class VoxelBatch {
  constructor() { this.groups = new Map(); }
  add(mat, x, y, z, sx = 1, sy = 1, sz = 1) {
    let a = this.groups.get(mat);
    if (!a) { a = []; this.groups.set(mat, a); }
    a.push(x, y, z, sx, sy, sz);
  }
  build(parent, cast = true, receive = true) {
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3();
    for (const [mat, a] of this.groups) {
      const n = a.length / 6;
      const mesh = new THREE.InstancedMesh(BOX, mat, n);
      for (let i = 0; i < n; i++) {
        const o = i * 6;
        p.set(a[o], a[o + 1], a[o + 2]); s.set(a[o + 3], a[o + 4], a[o + 5]);
        mesh.setMatrixAt(i, m4.compose(p, q, s));
      }
      mesh.instanceMatrix.needsUpdate = true;
      mesh.castShadow = cast; mesh.receiveShadow = receive;
      mesh.computeBoundingSphere();
      parent.add(mesh);
    }
  }
}
const V = 0.25; // micro-voxel unit
function vbox(parent, mat, x, y, z, w, h, d, v = V) {
  const m = new THREE.Mesh(BOX, mat);
  m.position.set(x * v, y * v, z * v);
  m.scale.set(w * v, h * v, d * v);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}

const ground = new VoxelBatch();  // 2x2 sanctuary terrain
const far = new VoxelBatch();     // 4x4 mountain terrain
const world = new VoxelBatch();   // 1x1 structures & decor (shadow casting)

// ============================================================
// Lighting & sky
// ============================================================
const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x5a7a45, 1.1);

void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,

const starGeo = new THREE.BufferGeometry();
{
  const sp = [];
  for (let i = 0; i < 1600; i++) {
    const th = rand() * Math.PI * 2, y = 0.04 + rand() * 0.96, r = Math.sqrt(1 - y * y);

}

const stars = new THREE.Points(starGeo, starMat);

// Sun / moon: a square sky voxel

function glowTexture() {

// Terrain
// ============================================================
const POND = { x: 0, z: 20, rx: 12, rz: 6.5 };
const pondD = (x, z) => ((x - POND.x) / POND.rx) ** 2 + ((z - POND.z) / POND.rz) ** 2;
const inCourtyard = (x, z) => Math.abs(x) < 15 && z < -3 && z > -35;
const MB = { x0: 23, x1: 47, z0: -35, z1: -5 }; // meadow bounds

function mountainH(x, z) {
  const d = Math.hypot(x, z);
  const t = smooth(64, 170, d);
  if (t <= 0) return 0;
  const n = fbm(x * 0.011 + 3.1, z * 0.011 - 7.7);
  const r = 1 - Math.abs(fbm(x * 0.022 - 11, z * 0.022 + 5) * 2 - 1);
  const back = 1 + 0.5 * Math.max(0, -z / d);
  return t * back * (6 + 132 * n * n + 30 * r * r * t);
}

function pine(batch, x, y, z, s = 1) {
  batch.add(M.bark, x, y + 1 * s, z, 0.8 * s, 2 * s, 0.8 * s);
  batch.add(M.pine, x, y + 2.6 * s, z, 3.6 * s, 1.4 * s, 3.6 * s);
  batch.add(M.pine, x, y + 3.9 * s, z, 2.6 * s, 1.3 * s, 2.6 * s);
  batch.add(M.pine, x, y + 5.1 * s, z, 1.6 * s, 1.2 * s, 1.6 * s);
  batch.add(M.pine, x, y + 6.1 * s, z, 0.7 * s, 0.9 * s, 0.7 * s);
}

const INNER = 72, OUTER = 288;
for (let gx = -INNER; gx < INNER; gx += 2) {
  for (let gz = -INNER; gz < INNER; gz += 2) {
    const cx = gx + 1, cz = gz + 1;
    if (pondD(cx, cz) < 1) {
      ground.add(M.sand, cx, -2.5, cz, 2, 1, 2);
      ground.add(M.dirt, cx, -4, cz, 2, 2, 2);
      continue;
    }
    const h = Math.round(mountainH(cx, cz));
    ground.add(inCourtyard(cx, cz) ? M.gravel : M.grass, cx, h - 0.5, cz, 2, 1, 2);
    ground.add(M.dirt, cx, (h - 6) / 2, cz, 2, h + 4, 2);
  }
}
for (let gx = -OUTER; gx < OUTER; gx += 4) {
  for (let gz = -OUTER; gz < OUTER; gz += 4) {
    if (gx >= -INNER && gx < INNER && gz >= -INNER && gz < INNER) continue;
    const cx = gx + 2, cz = gz + 2;
    const h = Math.max(0, Math.round(mountainH(cx, cz) / 4) * 4);
    const hr = hash2(cx * 7, cz * 13);
    const cap = h >= 72 - hr * 14 ? M.snowCap : h >= 44 - hr * 8 ? M.stone : M.grass;
    far.add(cap, cx, h - 2, cz, 4, 4, 4);
    if (h - 4 > -6) far.add(M.stone, cx, (h - 10) / 2, cz, 4, h + 2, 4);
    if (cap === M.grass && hr < 0.14 && Math.hypot(cx, cz) > 76) pine(far, cx + rr(-1, 1), h, cz + rr(-1, 1), 1.2 + rand() * 0.5);
  }
}

const PAGODA = { x: 0, z: -18 };
function buildPagoda(ox, oz) {
  const B = 1.2;
  world.add(M.stone, ox, B / 2, oz, 16, B, 16);
  world.add(M.pathStone, ox, B + 0.05, oz, 15, 0.1, 15);
  world.add(M.stone, ox, 0.2, oz + 8.6, 4, 0.4, 1.2);
  world.add(M.stone, ox, 0.6, oz + 8.3, 4, 0.4, 0.6);

  let y0 = B + 0.1;
  const tiers = 5;
  for (let i = 0; i < tiers; i++) {
    const w = 4.2 - i * 0.55;
    const H = i === 0 ? 3.4 : 2.3;
    world.add(M.darkWood, ox, y0 + H / 2, oz, 2 * w - 0.3, H, 2 * w - 0.3);
    for (const sx of [-1, 1]) for (const sz of [-1, 1])
      world.add(M.darkWood, ox + sx * (w - 0.3), y0 + H / 2, oz + sz * (w - 0.3), 0.6, H, 0.6);

    // Shoji paper screens on all four sides
    const span = 2 * w - 1.2, n = Math.max(1, Math.floor(span / 1.1)), pw = span / n;
    const ph = H - 0.9, py = y0 + 0.35 + ph / 2;
    for (let k = 0; k < n; k++) {
      const t = -span / 2 + pw * (k + 0.5);
      world.add(M.shoji, ox + t, py, oz + w - 0.1, pw - 0.14, ph, 0.12);
      world.add(M.shoji, ox + t, py, oz - w + 0.1, pw - 0.14, ph, 0.12);
      world.add(M.shoji, ox + w - 0.1, py, oz + t, 0.12, ph, pw - 0.14);
      world.add(M.shoji, ox - w + 0.1, py, oz + t, 0.12, ph, pw - 0.14);
    }
    world.add(M.red, ox, y0 + 0.15, oz, 2 * w + 0.1, 0.3, 2 * w + 0.1);
    world.add(M.darkWood, ox, y0 + H - 0.25, oz, 2 * w + 0.1, 0.5, 2 * w + 0.1);
    if (i > 0) { // balcony railing
      world.add(M.red, ox, y0 + 0.45, oz, 2 * w + 0.7, 0.12, 2 * w + 0.7);
    }

    const yb = y0 + H;
    world.add(M.darkWood, ox, yb + 0.2, oz, 2 * w + 1.2, 0.4, 2 * w + 1.2);
    world.add(M.red, ox, yb + 0.05, oz, 2 * w + 0.8, 0.1, 2 * w + 0.8);

    const R = w + (i === 0 ? 3 : 2.5);
    const ry = yb + 0.4;
    const layers = i === tiers - 1 ? Math.floor((R - 0.35) / 0.85) + 1 : 4;
    for (let k = 0; k < layers; k++) {
      const r = Math.max(0.3, R - k * 0.85);
      world.add(M.roof, ox, ry + k * 0.35 + 0.175, oz, 2 * r, 0.35, 2 * r);
    }
    // Flared, upturned corner eaves
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      world.add(M.roof, ox + sx * (R - 0.3), ry + 0.525, oz + sz * (R - 0.3), 0.6, 0.35, 0.6);
      world.add(M.roof, ox + sx * (R + 0.1), ry + 0.875, oz + sz * (R + 0.1), 0.5, 0.35, 0.5);
      world.add(M.gold, ox + sx * (R + 0.25), ry + 1.15, oz + sz * (R + 0.25), 0.25, 0.2, 0.25);
      world.add(M.gold, ox + sx * (R - 0.15), ry - 0.2, oz + sz * (R - 0.15), 0.18, 0.3, 0.18); // wind bell
      // mid-edge droop makes the corners read as flared
      world.add(M.roof, ox + sx * (R - 1.4), ry + 0.35 + 0.1, oz + sz * (R - 0.2), 1.2, 0.2, 0.4);
      world.add(M.roof, ox + sx * (R - 0.2), ry + 0.35 + 0.1, oz + sz * (R - 1.4), 0.4, 0.2, 1.2);
    }

    if (i === 0) { // hanging paper lanterns under the lowest eaves
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        const lx = ox + sx * (R - 1.1), lz = oz + sz * (R - 1.1);
        world.add(M.black, lx, ry - 0.4, lz, 0.06, 0.8, 0.06);
        world.add(M.black, lx, ry - 0.82, lz, 0.5, 0.1, 0.5);
        world.add(M.lantern, lx, ry - 1.22, lz, 0.55, 0.7, 0.55);
        world.add(M.black, lx, ry - 1.62, lz, 0.4, 0.1, 0.4);
        world.add(M.gold, lx, ry - 1.75, lz, 0.1, 0.2, 0.1);
        addLamp(lx, ry - 1.22, lz, sz > 0, 3);
      }
      for (const sx of [-1.8, 1.8]) {
        const lx = ox + sx, lz = oz + R - 1.1;
        world.add(M.black, lx, ry - 0.3, lz, 0.06, 0.6, 0.06);
        world.add(M.lantern, lx, ry - 0.95, lz, 0.5, 0.7, 0.5);
        world.add(M.black, lx, ry - 0.57, lz, 0.45, 0.08, 0.45);
        addLamp(lx, ry - 0.95, lz, false, 2.6);
      }
    }

    if (i === tiers - 1) {
      // Sorin: gold spire with nine rings, flame & jewel
      const topY = ry + layers * 0.35;
      world.add(M.gold, ox, topY + 0.2, oz, 0.9, 0.4, 0.9);
      world.add(M.gold, ox, topY + 0.55, oz, 0.6, 0.3, 0.6);
      world.add(M.gold, ox, topY + 3.5, oz, 0.25, 6, 0.25);
      for (let j = 0; j < 9; j++) {
        const rs = 0.85 - j * 0.035;
        world.add(M.gold, ox, topY + 1.2 + j * 0.45, oz, rs, 0.12, rs);
      }
      world.add(M.gold, ox, topY + 5.6, oz, 0.7, 0.45, 0.12);
      world.add(M.gold, ox, topY + 5.6, oz, 0.12, 0.45, 0.7);
      world.add(M.gold, ox, topY + 6.2, oz, 0.45, 0.45, 0.45);
      world.add(M.gold, ox, topY + 6.55, oz, 0.25, 0.3, 0.25);
    }
    y0 = ry + 0.7;
  }
  // Offering box & entry frame at the front
  world.add(M.red, ox - 1.1, B + 1.8, oz + 4.25, 0.3, 3.4, 0.3);
  world.add(M.red, ox + 1.1, B + 1.8, oz + 4.25, 0.3, 3.4, 0.3);
  world.add(M.darkWood, ox, B + 0.45, oz + 5.2, 1.6, 0.9, 0.8);
  world.add(M.gold, ox, B + 0.92, oz + 5.2, 1.4, 0.05, 0.6);
}

function buildBridge() {
  const z0 = 10, Lb = 20;
  for (let s = 0; s <= Lb; s += 0.5) {
    const y = 3 * Math.sin(Math.PI * s / Lb), z = z0 + s;
    world.add(M.plank, 0, y, z, 3.4, 0.35, 0.55);
    for (const sx of [-1, 1]) {
      world.add(M.red, sx * 1.7, y - 0.35, z, 0.25, 0.4, 0.55);
      world.add(M.red, sx * 1.8, y + 1.05, z, 0.2, 0.2, 0.55);
      if (Math.round(s * 2) % 4 === 0) {
        world.add(M.red, sx * 1.8, y + 0.55, z, 0.3, 1.0, 0.3);
        if (s === 0 || s === Lb || s === Lb / 2) {
          world.add(M.gold, sx * 1.8, y + 1.3, z, 0.36, 0.3, 0.36);
          world.add(M.gold, sx * 1.8, y + 1.55, z, 0.18, 0.2, 0.18);
        }
      }
    }
  }
  for (const s of [5, 15]) {
    const y = 3 * Math.sin(Math.PI * s / Lb);
    for (const sx of [-1, 1]) world.add(M.red, sx * 1.4, (y - 0.55 - 2) / 2, z0 + s, 0.4, y - 0.55 + 2, 0.4);
    world.add(M.red, 0, y - 0.6, z0 + s, 3, 0.3, 0.3);
  }
}

const canopyCenters = [];
const occ = new Set();
function blob(cx, cy, cz, r) {
  canopyCenters.push(new THREE.Vector3(cx, cy, cz));
  const R = Math.ceil(r), bx = Math.round(cx), by = Math.round(cy), bz = Math.round(cz);
  for (let dx = -R; dx <= R; dx++) for (let dy = -R; dy <= R; dy++) for (let dz = -R; dz <= R; dz++) {
    if (Math.hypot(dx, dy * 1.4, dz) >= r - rand() * 0.9) continue;
    const key = `${bx + dx},${by + dy},${bz + dz}`;
    if (occ.has(key)) continue;
    occ.add(key);
    world.add(rand() < 0.55 ? M.sakura : M.sakura2, bx + dx, by + dy, bz + dz, 1, 1, 1);
  }
}
function sakura(x, z) {

  for (let y = 0; y < h; y++) world.add(M.bark, x, y + 0.5, z, 0.9, 1, 0.9);

  for (let b = 0; b < nb; b++) {
    const a = (b / nb) * Math.PI * 2 + rand() * 0.6;
    let bx = x, by = h - 0.5, bz = z;
    const len = 2 + Math.floor(rand() * 2);
    for (let s = 0; s < len; s++) {
      bx += Math.cos(a) * 0.9; bz += Math.sin(a) * 0.9; by += 0.7;
      world.add(M.bark, bx, by, bz, 0.7, 0.7, 0.7);
    }
    blob(bx, by + 0.8, bz, 2.2 + rand() * 0.8);
  }
  blob(x, h + 1.6, z, 2.6);
}

function updateAnimal(a, dt, t) {
  const g = a.group;
  if (a.state === 'walk') {
    const dx = a.tx - g.position.x, dz = a.tz - g.position.z;
    if (Math.hypot(dx, dz) < 0.3) { a.state = rand() < 0.65 ? 'graze' : 'idle'; a.timer = rr(3, 9); }
    else {
      let diff = Math.atan2(dx, dz) - g.rotation.y;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      g.rotation.y += diff * Math.min(1, dt * 3);
      const sp = a.speed * (Math.abs(diff) < 0.8 ? 1 : 0.3);
      g.position.x += Math.sin(g.rotation.y) * sp * dt;
      g.position.z += Math.cos(g.rotation.y) * sp * dt;
      a.walk += dt * sp * 9;
    }
  } else {
    a.timer -= dt;
    if (a.timer <= 0) { a.state = 'walk'; a.tx = rr(MB.x0, MB.x1); a.tz = rr(MB.z0, MB.z1); }
  }
  const walking = a.state === 'walk';
  const sw = walking ? Math.sin(a.walk) * 0.55 : 0;
  const kl = Math.min(1, dt * 10);
  a.legs.forEach((l, i) => { const tgt = (i === 0 || i === 3) ? sw : -sw; l.rotation.x += (tgt - l.rotation.x) * kl; });
  g.position.y = walking ? Math.abs(Math.sin(a.walk)) * 0.04 : 0;
  let hx, hy = 0;
  if (a.state === 'graze') hx = a.down + Math.sin(t * 5 + a.ph) * 0.1;
  else if (a.state === 'idle') { hx = -0.1; hy = Math.sin(t * 0.7 + a.ph) * 0.5; }
  else hx = Math.sin(a.walk * 2) * 0.06;
  a.head.rotation.x += (hx - a.head.rotation.x) * Math.min(1, dt * 4);
  a.head.rotation.y += (hy - a.head.rotation.y) * Math.min(1, dt * 3);
}

const numKeys = ['sunI', 'hemiI', 'lamp', 'emis', 'lampGlow', 'stars', 'celGlow', 'fogNear', 'fogFar', 'exposure'];
const colKeys = ['top', 'bottom', 'fog', 'sun', 'hemiSky', 'hemiGround', 'cel'];
const env = {};

function setMode(name) {
  targetEnv = MODES[name];

function updateEnv(dt, t) {
  const k = 1 - Math.exp(-dt * 2.2);

  env.dir.lerp(targetEnv.dir, k).normalize();

  skyMat.uniforms.top.value.copy(env.top);
  skyMat.uniforms.bottom.value.copy(env.bottom);

  sun.color.copy(env.sun); sun.intensity = env.sunI;
  sun.position.copy(sun.target.position).addScaledVector(env.dir, 160);
  hemi.color.copy(env.hemiSky); hemi.groundColor.copy(env.hemiGround); hemi.intensity = env.hemiI;

  sky.position.copy(camera.position);
  stars.position.copy(camera.position);
  starMat.opacity = env.stars * (0.85 + 0.15 * Math.sin(t * 2));
  celestial.position.copy(camera.position).addScaledVector(env.dir, 420);
  celestial.lookAt(camera.position);
  celMat.color.copy(env.cel);
  celGlow.position.copy(camera.position).addScaledVector(env.dir, 410);
  celGlowMat.color.copy(env.cel); celGlowMat.opacity = env.celGlow;

  lamps.forEach((l, i) => { l.intensity = env.lamp * (0.9 + 0.1 * Math.sin(t * 9 + i * 1.7) * Math.sin(t * 5.3 + i)); });
  lampGlowMat.opacity = env.lampGlow * (0.92 + 0.08 * Math.sin(t * 7));
  M.shoji.emissiveIntensity = env.emis;
  M.lantern.emissiveIntensity = env.emis * 1.3 + 0.2;
  M.lampWin.emissiveIntensity = env.emis * 1.2 + 0.1;
}

// ============================================================
// Camera presets
// ============================================================
const CAMS = {
  pagoda:   { pos: [0, 10, 28],       target: [0, 8, -18] },
  samurai:  { pos: [0.9, 3.0, -2.3],  target: [3.2, 2.5, -6.8] },
  meadow:   { pos: [14, 7, 6],        target: [35, 0.5, -20] },
  mountain: { pos: [-28, 16, 52],     target: [0, 32, -90] },
  bird:     { pos: [60, 140, 95],     target: [0, 0, 0] }
};
let tween = null;
function goCam(name) {
  const c = CAMS[name];
  tween = { fp: camera.position.clone(), ft: controls.target.clone(), tp: new THREE.Vector3(...c.pos), tt: new THREE.Vector3(...c.target), t: 0 };
  document.querySelectorAll('[data-cam]').forEach(b => b.dataset.active = String(b.dataset.cam === name));
}
controls.addEventListener('start', () => {
  tween = null;
  document.querySelectorAll('[data-cam]').forEach(b => b.dataset.active = 'false');
});
const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

// ============================================================
// Ambient audio (Web Audio API)
// ============================================================
class ZenAudio {
  constructor() { this.ctx = null; this.on = false; this.vol = 0.7; }
  init() {
    const ctx = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = ctx.createGain(); this.master.gain.value = 0; this.master.connect(ctx.destination);

    const len = ctx.sampleRate * 4, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    this.verb = ctx.createConvolver(); this.verb.buffer = ir;
    const vg = ctx.createGain(); vg.gain.value = 0.55;
    this.verb.connect(vg).connect(this.master);

    const nb = ctx.createBuffer(1, ctx.sampleRate * 6, ctx.sampleRate), nd = nb.getChannelData(0);
    let last = 0;
    for (let i = 0; i < nd.length; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; nd[i] = last * 3.5; }

    const windLayer = (freq, q, gain, lfoRate, lfoDepth, gRate) => {
      const src = ctx.createBufferSource(); src.buffer = nb; src.loop = true;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain(); g.gain.value = gain;
      src.connect(f).connect(g).connect(this.master);
      const l1 = ctx.createOscillator(); l1.frequency.value = lfoRate;
      const l1g = ctx.createGain(); l1g.gain.value = lfoDepth; l1.connect(l1g).connect(f.frequency); l1.start();
      const l2 = ctx.createOscillator(); l2.frequency.value = gRate;
      const l2g = ctx.createGain(); l2g.gain.value = gain * 0.6; l2.connect(l2g).connect(g.gain); l2.start();
      src.start(0, Math.random() * 5);
    };
    windLayer(420, 0.6, 0.5, 0.05, 220, 0.09);
    windLayer(900, 1.2, 0.18, 0.08, 400, 0.13);
    windLayer(1800, 6, 0.05, 0.11, 600, 0.07);
    this.scheduleChime();
  }
  chime() {
    const ctx = this.ctx, now = ctx.currentTime;
    const scale = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];
    const n = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const t = now + i * (0.12 + Math.random() * 0.4);
      const f = scale[Math.floor(Math.random() * scale.length)];
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.1, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 4);
      for (const [m, a] of [[1, 1], [2.76, 0.35], [5.4, 0.12], [8.93, 0.05]]) {
        const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
        const og = ctx.createGain(); og.gain.value = a;
        o.connect(og).connect(g); o.start(t); o.stop(t + 4.2);
      }
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.random() * 1.6 - 0.8;
      g.connect(pan); pan.connect(this.master); pan.connect(this.verb);
    }
  }
  scheduleChime() {
    setTimeout(() => { if (this.on) this.chime(); this.scheduleChime(); }, 2000 + Math.random() * 6000);
  }
  toggle() {
    if (!this.ctx) this.init();
    this.on = !this.on;
    if (this.on) this.ctx.resume();
    const now = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setTargetAtTime(this.on ? this.vol : 0, now, 0.8);
    return this.on;
  }
  setVol(v) { this.vol = v; if (this.ctx && this.on) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.1); }
}
const audio = new ZenAudio();

// ============================================================
// UI wiring
// ============================================================
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
document.querySelectorAll('[data-cam]').forEach(b => b.addEventListener('click', () => goCam(b.dataset.cam)));
const audioBtn = document.getElementById('audioBtn');
audioBtn.addEventListener('click', () => {
  const on = audio.toggle();
  audioBtn.textContent = on ? 'Sound On' : 'Sound Off';
  audioBtn.dataset.active = String(on);
});
document.getElementById('vol').addEventListener('input', e => audio.setVol(parseFloat(e.target.value)));
const camKeys = ['pagoda', 'samurai', 'meadow', 'mountain', 'bird'];
window.addEventListener('keydown', e => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 5) goCam(camKeys[n - 1]);
  const k = e.key.toLowerCase();
  if (k === 'm') setMode('morning');
  if (k === 's') setMode('sunset');
  if (k === 'n') setMode('night');
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
setMode('morning');

// ============================================================
// Main loop
// ============================================================
const clock = new THREE.Clock();
function loop() {
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05), t = clock.elapsedTime;

  if (tween) {
    tween.t = Math.min(1, tween.t + Math.min(raw, 0.25) / 1.8);
    const e = easeInOut(tween.t);
    camera.position.lerpVectors(tween.fp, tween.tp, e);
    controls.target.lerpVectors(tween.ft, tween.tt, e);
    if (tween.t >= 1) tween = null;
  }
  controls.update();

  updateEnv(dt, t);
  for (const s of samurai) {
    const b = Math.sin(t * 1.6 + s.ph);
    s.up.scale.set(1 + 0.012 * b, 1 + 0.02 * b, 1 + 0.018 * b);
    s.head.position.y = 4.1 * V + 0.015 * b;
    s.head.rotation.y = Math.sin(t * 0.3 + s.ph) * 0.25;
  }
  for (const a of animals) updateAnimal(a, dt, t);
  updateBirds(dt, t);
  updateClouds(dt);
  updatePetals(dt, t);
  for (const l of lilies) {
    l.g.position.y = l.y + Math.sin(t * 1.3 + l.ph) * 0.02;
    l.g.rotation.y += dt * 0.03;
  }
  waterMap.offset.x += dt * 0.02;
  waterMap.offset.y += dt * 0.012;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
const loader = document.getElementById('loader');
loader.style.opacity = '0';
setTimeout(() => loader.remove(), 800);
</script>
