  const starMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(.35,.35,.35),mats.star,90);
  const starDummy=new THREE.Object3D();for(let i=0;i<90;i++){const a=rng()*Math.PI*2,h=.25+rng()*.7,r=70;starDummy.position.set(Math.cos(a)*r*(.4+rng()*.6),20+h*50,Math.sin(a)*r*(.4+rng()*.6));starDummy.updateMatrix();starMesh.setMatrixAt(i,starDummy.matrix)}starMesh.instanceMatrix.needsUpdate=true;scene.add(starMesh);
  const controls=new OrbitControls(camera,canvas);
  controls.enableDamping=true;controls.dampingFactor=.06;controls.target.set(0,5.5,-4);controls.minDistance=4;controls.maxDistance=90;controls.maxPolarAngle=Math.PI*.48;controls.autoRotate=true;controls.autoRotateSpeed=.35;controls.enablePan=true;
  let timeMode="morning",skyBlend=1,fromSky=SKY.morning,toSky=SKY.morning;
  const tmpColor=new THREE.Color(),tmpVec=new THREE.Vector3();
  let camTween=null;
  function applySky(from,to,t){
    const k=t*t*(3-2*t);
    skyNow.top.lerpColors(from.top,to.top,k);skyNow.mid.lerpColors(from.mid,to.mid,k);skyNow.bot.lerpColors(from.bot,to.bot,k);
    tmpColor.lerpColors(from.fog,to.fog,k);scene.fog.color.copy(tmpColor);renderer.setClearColor(tmpColor,1);
    tmpColor.lerpColors(from.sun,to.sun,k);sun.color.copy(tmpColor);
    tmpColor.lerpColors(from.hemiSky,to.hemiSky,k);hemi.color.copy(tmpColor);
    tmpColor.lerpColors(from.hemiGround,to.hemiGround,k);hemi.groundColor.copy(tmpColor);
    sun.intensity=from.sunInt+(to.sunInt-from.sunInt)*k;hemi.intensity=from.hemiInt+(to.hemiInt-from.hemiInt)*k;amb.intensity=from.amb+(to.amb-from.amb)*k;renderer.toneMappingExposure=from.exposure+(to.exposure-from.exposure)*k;
    sun.position.lerpVectors(from.sunPos,to.sunPos,k);
    const lantern=from.lantern+(to.lantern-from.lantern)*k;for(const l of lanternLights)l.intensity=lantern;
    mats.shoji.emissiveIntensity=from.shoji+(to.shoji-from.shoji)*k;mats.gold.emissiveIntensity=from.gold+(to.gold-from.gold)*k;mats.lantern.emissiveIntensity=.4+lantern*.5;
    const night=to.celestial==="moon"?k:from.celestial==="moon"?1-k:0;mats.star.opacity=night;mats.star.transparent=true;celestial.material=night>.5?mats.moon:mats.sun;tmpVec.copy(sun.position).normalize().multiplyScalar(92);celestial.position.copy(tmpVec);fireflyMesh.visible=night>.35;starMesh.visible=night>.2;
  }
  applySky(SKY.morning,SKY.morning,1);
  const clock={last:performance.now(),getDelta(){const now=performance.now();const d=(now-this.last)/1000;this.last=now;return d}};
  let elapsed=0,disposed=false;
  function resize(){const w=host.clientWidth||window.innerWidth,h=Math.max(1,host.clientHeight||window.innerHeight);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}
  resize();const ro=new ResizeObserver(resize);ro.observe(host);window.addEventListener("resize",resize);
  const onPointer=()=>{if(controls.autoRotate)controls.autoRotate=false};
  canvas.addEventListener("pointerdown",onPointer);
  function updateWander(w,dt){
    w.timer-=dt;
    if(w.timer<=0){w.graze=!w.graze;w.timer=w.graze?1.6+Math.random()*2.2:2.5+Math.random()*3.5;if(!w.graze)w.heading+=(Math.random()-.5)*1.6}
    if(!w.graze){w.group.position.x+=Math.cos(w.heading)*w.speed*dt;w.group.position.z+=Math.sin(w.heading)*w.speed*dt;
      if(w.group.position.x<w.minX||w.group.position.x>w.maxX){w.heading=Math.PI-w.heading;w.group.position.x=Math.max(w.minX,Math.min(w.maxX,w.group.position.x))}
      if(w.group.position.z<w.minZ||w.group.position.z>w.maxZ){w.heading=-w.heading;w.group.position.z=Math.max(w.minZ,Math.min(w.maxZ,w.group.position.z))}
      w.group.rotation.y=w.heading;
    }
    const bob=w.graze?Math.sin(elapsed*2.4+w.phase)*.04:Math.abs(Math.sin(elapsed*6+w.phase))*.05;w.group.position.y=.8+bob;w.group.rotation.x=w.graze?Math.sin(elapsed*2+w.phase)*.08:0;
  }
  function animate(){
    if(disposed)return;
    try{
      const dt=Math.min(clock.getDelta(),.08);elapsed+=dt;
      if(skyBlend<1){skyBlend=Math.min(1,skyBlend+dt/1.6);applySky(fromSky,toSky,skyBlend)}
      if(camTween){camTween.t+=dt;const u=Math.min(1,camTween.t/camTween.dur),e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;camera.position.lerpVectors(camTween.fromPos,camTween.toPos,e);controls.target.lerpVectors(camTween.fromTarget,camTween.toTarget,e);if(u>=1){camTween=null;controls.enabled=true}}
      controls.update();
      samuraiA.scale.y=1+Math.sin(elapsed*1.7)*.012;samuraiB.scale.y=1+Math.sin(elapsed*1.7+.9)*.012;
      for(const w of wanderers)updateWander(w,dt);
      for(let i=0;i<koi.length;i++){const p=koiPhase[i],fish=koi[i],ang=elapsed*.35+p;fish.position.set(-12+Math.cos(ang)*3.6,.72,6+Math.sin(ang)*2.6);fish.rotation.y=-ang+Math.PI/2}
      for(let i=0;i<lilies.length;i++)lilies[i].position.y=1.08+Math.sin(elapsed*.8+i)*.04;
      pond.material.opacity=.55+Math.sin(elapsed*.6)*.04;
      for(const b of birds){const t=elapsed*b.speed+b.phase;b.group.position.set(Math.cos(t)*b.radius,b.height+Math.sin(t*2)*.6,Math.sin(t*.7)*b.radius*.7-4);b.group.rotation.y=t+Math.PI/2;const flap=Math.sin(elapsed*12+b.phase)*.55;b.wingL.rotation.x=flap;b.wingR.rotation.x=-flap}
      for(const c of clouds){c.group.position.x+=c.speed*dt;if(c.group.position.x>70)c.group.position.x=-70}
      for(let i=0;i<petals.length;i++){const p=petals[i];p.y-=p.s*dt;p.x+=Math.sin(elapsed*.7+i)*.35*dt;p.spin+=dt*1.5;if(p.y<.6){p.y=7+Math.random()*8;p.x=-8+Math.random()*18;p.z=-18+Math.random()*40}petalDummy.position.set(p.x,p.y,p.z);petalDummy.rotation.set(p.spin,p.spin*.4,.4);petalDummy.updateMatrix();petalMesh.setMatrixAt(i,petalDummy.matrix)}petalMesh.instanceMatrix.needsUpdate=true;
      if(fireflyMesh.visible){for(let i=0;i<fireflies.length;i++){const f=fireflies[i],y=f.y+Math.sin(elapsed*1.4+f.phase)*.35,x=f.x+Math.sin(elapsed*.6+f.phase)*.4;petalDummy.position.set(x,y,f.z+Math.cos(elapsed*.5+f.phase)*.4);petalDummy.rotation.set(0,0,0);const s=.7+Math.sin(elapsed*6+f.phase)*.45;petalDummy.scale.setScalar(s);petalDummy.updateMatrix();fireflyMesh.setMatrixAt(i,petalDummy.matrix)}fireflyMesh.instanceMatrix.needsUpdate=true;petalDummy.scale.setScalar(1)}
      renderer.render(scene,camera);
    }catch(err){console.error(err)}
  }
  renderer.render(scene,camera);renderer.setAnimationLoop(animate);queueMicrotask(()=>hooks.onReady?.());
  return {
    setTimeMode(mode){
      if(mode===timeMode)return;
      fromSky={top:skyNow.top.clone(),mid:skyNow.mid.clone(),bot:skyNow.bot.clone(),fog:scene.fog.color.clone(),sun:sun.color.clone(),hemiSky:hemi.color.clone(),hemiGround:hemi.groundColor.clone(),sunPos:sun.position.clone(),sunInt:sun.intensity,hemiInt:hemi.intensity,amb:amb.intensity,exposure:renderer.toneMappingExposure,lantern:lanternLights[0]?.intensity??.3,shoji:mats.shoji.emissiveIntensity,gold:mats.gold.emissiveIntensity,celestial:timeMode==="night"?"moon":"sun"};
      toSky=SKY[mode];timeMode=mode;skyBlend=0;
    },
    goToPreset(preset){
      const p=PRESETS[preset];
      camTween={t:0,dur:1.45,fromPos:camera.position.clone(),toPos:new THREE.Vector3(...p.pos),fromTarget:controls.target.clone(),toTarget:new THREE.Vector3(...p.target)};
      controls.autoRotate=false;controls.enabled=false;
    },
    setMuted(muted){audio.setMuted(muted)},
    enter(){audio.enter();controls.autoRotate=false},
    dispose(){disposed=true;renderer.setAnimationLoop(null);ro.disconnect();window.removeEventListener("resize",resize);canvas.removeEventListener("pointerdown",onPointer);controls.dispose();audio.dispose();scene.traverse(obj=>{if(obj instanceof THREE.Mesh||obj instanceof THREE.InstancedMesh)obj.geometry.dispose()});disposeMaterials(mats);renderer.dispose();canvas.remove()}
  };
}

// === app glue ===
const host=document.getElementById("host");
const entry=document.getElementById("entry");
const enterBtn=document.getElementById("enterBtn");
const errEl=document.getElementById("err");
const hud=document.getElementById("hud");
const hint=document.getElementById("hint");
let engine=null,ready=false,entered=false,muted=false,hide=false,time="morning",view="pagoda";
try{
  engine=createZenEngine(host,{onReady:()=>{ready=true;enterBtn.disabled=false;enterBtn.textContent="Enter sanctuary"}});
}catch(e){
  errEl.textContent=e.message||"WebGL failed";errEl.style.display="block";enterBtn.textContent="Failed to load";
}
enterBtn.addEventListener("click",()=>{
  if(!ready||!engine)return;
  engine.enter();entered=true;entry.classList.add("hidden");hud.classList.remove("hidden-hud");hint.classList.add("entered");
});
function updateTimeButtons(){document.querySelectorAll("[data-time]").forEach(b=>b.classList.toggle("is-active",b.dataset.time===time))}
function updateViewButtons(){document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("is-active",b.dataset.view===view))}
document.querySelectorAll("[data-time]").forEach(b=>b.addEventListener("click",()=>{time=b.dataset.time;updateTimeButtons();engine?.setTimeMode(time)}));
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{view=b.dataset.view;updateViewButtons();engine?.goToPreset(view)}));
document.getElementById("muteBtn").addEventListener("click",(e)=>{
  muted=!muted;engine?.setMuted(muted);e.currentTarget.textContent=muted?"🔇 Muted":"🔊 Sound";
});
document.getElementById("hideBtn").addEventListener("click",()=>{
  hide=!hide;hud.classList.toggle("hidden-hud",hide);document.getElementById("hideBtn").textContent=hide?"UI":"Hide";
});
window.addEventListener("keydown",(e)=>{
  if(e.target instanceof HTMLInputElement||e.target instanceof HTMLTextAreaElement)return;
  const map={Digit1:"pagoda",Digit2:"samurai",Digit3:"meadow",Digit4:"vista",Digit5:"aerial"};
  const p=map[e.code];
  if(p){view=p;updateViewButtons();engine?.goToPreset(p);return}
  if(e.code==="KeyM"){muted=!muted;engine?.setMuted(muted);document.getElementById("muteBtn").textContent=muted?"🔇 Muted":"🔊 Sound"}
  if(e.code==="KeyT"){const order=["morning","sunset","night"];time=order[(order.indexOf(time)+1)%order.length];updateTimeButtons();engine?.setTimeMode(time)}
  if(e.code==="KeyH"){hide=!hide;hud.classList.toggle("hidden-hud",hide);document.getElementById("hideBtn").textContent=hide?"UI":"Hide"}
});
</script>
</body>
