<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voxel Zen Sanctuary &amp; Mountain Landscape</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0b1020; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .glass {
    background: rgba(20, 24, 40, 0.42);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 8px 34px rgba(0,0,0,0.38);
  }
  .btn {
    transition: all .18s ease;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
  }
  .btn:hover { background: rgba(255,255,255,0.18); transform: translateY(-1px); }
  .btn.active { background: rgba(233, 84, 63, 0.85); border-color: rgba(255,180,160,0.6); color:#fff; }
  .fade-in { animation: fadeIn 1.1s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to {opacity:1; transform:none;} }
  #loader {
    position: fixed; inset: 0; z-index: 50;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    background: radial-gradient(circle at 50% 40%, #1b2440, #080b16);
    color:#e8ecf6; gap: 18px; transition: opacity .8s ease;

  .spinner { width: 46px; height:46px; border-radius: 6px; background:#e9543f;
    animation: spin 1.4s cubic-bezier(.6,.2,.3,.9) infinite; }
  @keyframes spin { 0%{transform:rotate(0) scale(1);} 50%{transform:rotate(180deg) scale(.6);} 100%{transform:rotate(360deg) scale(1);} }
  .scrollbar::-webkit-scrollbar { width: 6px; }
  .scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 6px; }
</style>
</head>
<body>
<div id="app"></div>

</div>

<!-- Title card -->
<div class="glass fade-in" style="position:fixed; top:16px; left:16px; z-index:20; border-radius:18px; padding:16px 18px; max-width: 320px;">

    <div>
      <div class="text-white font-semibold text-[15px] leading-tight">Zen Sanctuary</div>

    </div>

<!-- Time-of-day controls -->
<div class="glass fade-in" style="position:fixed; top:16px; right:16px; z-index:20; border-radius:18px; padding:14px;">

  <div class="flex flex-col gap-2 w-40">

<!-- Camera presets -->
<div class="glass fade-in" style="position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:20; border-radius:20px; padding:10px 12px;">
  <div class="flex items-center gap-2 flex-wrap justify-center">
    <span class="text-white/50 text-[10px] uppercase tracking-widest pr-1 hidden sm:inline">Views</span>
    <button data-cam="pagoda" class="btn camBtn active rounded-xl px-3 py-2 text-[12px] text-white/90">⛩️ Pagoda Front</button>
    <button data-cam="samurai" class="btn camBtn rounded-xl px-3 py-2 text-[12px] text-white/90">🗡️ Samurai</button>
    <button data-cam="meadow" class="btn camBtn rounded-xl px-3 py-2 text-[12px] text-white/90">🐑 Meadow</button>
    <button data-cam="mountain" class="btn camBtn rounded-xl px-3 py-2 text-[12px] text-white/90">🏔️ Mountain Vista</button>
    <button data-cam="birdseye" class="btn camBtn rounded-xl px-3 py-2 text-[12px] text-white/90">🦅 Bird's Eye</button>

<div class="glass fade-in" style="position:fixed; bottom:16px; right:16px; z-index:20; border-radius:14px; padding:8px 12px;">
  <div id="fps" class="text-white/60 text-[11px] font-mono">-- fps</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   GLOBAL SETUP
   ============================================================ */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xcfe0f0, 0.0032);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(48, 34, 62);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 8;
controls.maxDistance = 220;
controls.target.set(0, 8, 0);

/* ============================================================
   PROCEDURAL 16x16 PIXEL CANVAS TEXTURES  (NearestFilter)
   ============================================================ */
const texCache = {};
function makeTexture(key, drawFn) {
  if (texCache[key]) return texCache[key];
  const c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  const ctx = c.getContext('2d');
  drawFn(ctx);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  t.generateMipmaps = false;
  texCache[key] = t;
  return t;
}
// helper to draw noisy pixel blocks
function fill(ctx, base) { ctx.fillStyle = base; ctx.fillRect(0,0,16,16); }
function noise(ctx, colors, density=0.5) {
  for (let x=0;x<16;x++) for (let y=0;y<16;y++) {
    if (Math.random() < density) {
      ctx.fillStyle = colors[(Math.random()*colors.length)|0];
      ctx.fillRect(x,y,1,1);
    }
  }
}

const TX = {
  grass:      makeTexture('grass', ctx=>{ fill(ctx,'#5aa54a'); noise(ctx,['#4f9a41','#68b356','#57a248','#489138'],0.7); }),
  dirt:       makeTexture('dirt', ctx=>{ fill(ctx,'#7a5638'); noise(ctx,['#6e4c30','#8a6242','#5f4229'],0.6); }),
  stone:      makeTexture('stone', ctx=>{ fill(ctx,'#9098a0'); noise(ctx,['#828a92','#a0a8b0','#767e86'],0.6); }),
  darkstone:  makeTexture('darkstone', ctx=>{ fill(ctx,'#5b626b'); noise(ctx,['#4e555d','#686f78','#454b52'],0.6); }),
  snow:       makeTexture('snow', ctx=>{ fill(ctx,'#eef4fb'); noise(ctx,['#e2eaf4','#ffffff','#d8e2ee'],0.4); }),
  rock:       makeTexture('rock', ctx=>{ fill(ctx,'#77726c'); noise(ctx,['#6a655f','#847e77','#5d5852'],0.7); }),
  darkwood:   makeTexture('darkwood', ctx=>{ fill(ctx,'#3d2b1c'); for(let y=0;y<16;y++){ctx.fillStyle=(y%3===0)?'#33241a':'#452f20';ctx.fillRect(0,y,16,1);} noise(ctx,['#2e2015','#4b3222'],0.25); }),
  wood:       makeTexture('wood', ctx=>{ fill(ctx,'#8a5a34'); for(let y=0;y<16;y++){ctx.fillStyle=(y%3===0)?'#7a4e2c':'#96633a';ctx.fillRect(0,y,16,1);} }),
  red:        makeTexture('red', ctx=>{ fill(ctx,'#c1362b'); noise(ctx,['#a92c22','#d24236','#b23127'],0.4); }),
  roof:       makeTexture('roof', ctx=>{ fill(ctx,'#2a3138'); for(let x=0;x<16;x+=4){ctx.fillStyle='#1e242a';ctx.fillRect(x,0,1,16);} noise(ctx,['#232a30','#333c44'],0.3); }),
  gold:       makeTexture('gold', ctx=>{ fill(ctx,'#e7b53c'); noise(ctx,['#d6a52f','#f4c957','#c99728'],0.4); }),
  shoji:      makeTexture('shoji', ctx=>{ fill(ctx,'#f6e6b0'); ctx.fillStyle='#c9a24a'; for(let i=0;i<16;i+=5){ctx.fillRect(i,0,1,16);ctx.fillRect(0,i,16,1);} }),
  water:      makeTexture('water', ctx=>{ fill(ctx,'#2f7fb5'); noise(ctx,['#2a76ac','#3a8cc4','#276e9f'],0.5); }),
  wool:       makeTexture('wool', ctx=>{ fill(ctx,'#f2f0ea'); noise(ctx,['#e6e3db','#ffffff','#dcd8ce'],0.55); }),
  alpaca:     makeTexture('alpaca', ctx=>{ fill(ctx,'#d8b38a'); noise(ctx,['#cba579','#e3c199','#c39a70'],0.5); }),
  skin:       makeTexture('skin', ctx=>{ fill(ctx,'#e6b98f'); noise(ctx,['#dcae82','#eec49b'],0.3); }),
  armor:      makeTexture('armor', ctx=>{ fill(ctx,'#20304d'); for(let y=0;y<16;y+=4){ctx.fillStyle='#2c4066';ctx.fillRect(0,y,16,2);} noise(ctx,['#1a2740','#33497a'],0.25); }),
  leaf:       makeTexture('leaf', ctx=>{ fill(ctx,'#3f8a3a'); noise(ctx,['#357c31','#4a9a44','#2f7030'],0.7); }),
  bamboo:     makeTexture('bamboo', ctx=>{ fill(ctx,'#7fae45'); ctx.fillStyle='#6d9a38'; ctx.fillRect(0,7,16,2); noise(ctx,['#77a53f','#8bbb50'],0.3); }),
  sakura:     makeTexture('sakura', ctx=>{ fill(ctx,'#f4b9d0'); noise(ctx,['#eea9c4','#ffc9dd','#e895b6'],0.6); }),
  cloud:      makeTexture('cloud', ctx=>{ fill(ctx,'#ffffff'); noise(ctx,['#f2f6fb','#ffffff','#e8eef6'],0.35); }),
  paperlantern: makeTexture('paperlantern', ctx=>{ fill(ctx,'#e8783a'); ctx.fillStyle='#b8531f'; ctx.fillRect(0,3,16,1);ctx.fillRect(0,11,16,1); }),
  lily:       makeTexture('lily', ctx=>{ fill(ctx,'#3d8f4a'); noise(ctx,['#347f40','#489a54'],0.5); }),
};

/* material cache keyed by texture + emissive settings */
function mat(tex, opts={}) {
  return new THREE.MeshStandardMaterial({
    map: tex,
    roughness: opts.rough ?? 0.92,
    metalness: opts.metal ?? 0.02,
    emissive: opts.emissive ? new THREE.Color(opts.emissive) : 0x000000,
    emissiveIntensity: opts.emissiveIntensity ?? 0,
    transparent: opts.transparent ?? false,
    opacity: opts.opacity ?? 1,
    color: opts.tint ?? 0xffffff,
    side: opts.side ?? THREE.FrontSide
  });
}

/* ============================================================
   VOXEL HELPER  — variable sized boxes
   ============================================================ */
const boxGeoCache = {};
function boxGeo(w,h,d){
  const k = `${w}_${h}_${d}`;
  if(!boxGeoCache[k]) boxGeoCache[k]=new THREE.BoxGeometry(w,h,d);
  return boxGeoCache[k];
}
function voxel(parent, x,y,z, w,h,d, material, shadow=true){
  const m = new THREE.Mesh(boxGeo(w,h,d), material);
  m.position.set(x,y,z);
  m.castShadow = shadow;
  m.receiveShadow = shadow;
  parent.add(m);
  return m;
}

/* ============================================================
   TERRAIN — variable 4x4 & 2x2 blocks, grass field
   ============================================================ */
const world = new THREE.Group();
scene.add(world);

/* ---- hoisted shared state (used by IIFEs/functions below) ---- */
let pagodaGlow = null;
let petalPoints = null;
const lanternLights = [];
const lilyPads = [];
const petalEmitters = [];

// Base grass plateau (single large receiving block for the sanctuary floor)
const groundMat = mat(TX.grass);
const ground = new THREE.Mesh(new THREE.BoxGeometry(120, 4, 120), groundMat);
ground.position.set(0, -2, 0);
ground.receiveShadow = true;
scene.add(ground);

// scatter subtle grass-height variation using 4x4 blocks around edges
(function grassField(){
  const g = new THREE.Group();
  for(let i=0;i<120;i++){
    const x=(Math.random()-0.5)*110, z=(Math.random()-0.5)*110;
    if(Math.hypot(x,z) < 26) continue; // keep courtyard clear
    const s = Math.random()<0.5?4:2;
    voxel(g, x, 0.4, z, s, Math.random()*1.5+0.5, s, groundMat);
  }
  world.add(g);
})();

// Stone stepping-stone path from Torii to Pagoda
(function stonePath(){
  const g = new THREE.Group();
  const stoneMat = mat(TX.stone);
  for(let i=0;i<10;i++){
    const z = 40 - i*4.4;
    const x = Math.sin(i*0.6)*1.4;
    voxel(g, x, 0.35, z, 3, 0.6, 2.4, stoneMat);
  }
  world.add(g);
})();

/* ============================================================
   MOUNTAIN RANGE — snow-capped, big 4x4 voxels
   ============================================================ */
(function mountains(){
  // Collect transforms per material, then build InstancedMeshes (few draw calls).
  const rockM = [], snowM = [], darkM = [];
  const count = 9;
  const BS = 8; // block size
  for(let m=0;m<count;m++){
    const ang = (m/count)*Math.PI*2 + 0.2;
    const dist = 150 + Math.random()*45;
    const cx = Math.cos(ang)*dist;
    const cz = Math.sin(ang)*dist;
    const peak = 60 + Math.random()*55;
    const baseR = peak*0.9;
    for(let y=0;y<peak;y+=BS){
      const t = y/peak;
      const r = baseR*(1-t);
      for(let x=-r;x<=r;x+=BS){
        for(let z=-r;z<=r;z+=BS){
          if(Math.hypot(x,z) > r) continue;
          if(Math.random() < t*0.4) continue; // erode upper slopes
          const isSnow = t > 0.6;
          const arr = isSnow ? snowM : (Math.random()<0.25?darkM:rockM);
          arr.push(cx+x, y, cz+z);
        }
      }
    }
  }
  const geo = new THREE.BoxGeometry(BS, BS, BS);
  function build(list, material){
    const n = list.length/3;
    const im = new THREE.InstancedMesh(geo, material, n);
    im.castShadow = false; im.receiveShadow = true;
    const mtx = new THREE.Matrix4();
    for(let i=0;i<n;i++){
      mtx.makeTranslation(list[i*3], list[i*3+1], list[i*3+2]);
      im.setMatrixAt(i, mtx);
    }
    im.instanceMatrix.needsUpdate = true;
    scene.add(im);
  }
  build(rockM, mat(TX.rock));
  build(snowM, mat(TX.snow));
  build(darkM, mat(TX.darkstone));
})();

/* ============================================================
   POND + LILY PADS + ARCH BRIDGE (Taiko-bashi)
   ============================================================ */
let waterMesh;
(function pond(){
  const g = new THREE.Group();
  // pond basin (dark)
  const basinMat = mat(TX.darkstone);
  voxel(g, -22, -1.6, 6, 30, 2, 22, basinMat);
  // water surface
  waterMesh = new THREE.Mesh(new THREE.BoxGeometry(28, 1.2, 20),
    mat(TX.water, {transparent:true, opacity:0.82, rough:0.25, metal:0.15}));
  waterMesh.position.set(-22, -0.4, 6);
  waterMesh.receiveShadow = true;
  g.add(waterMesh);
  // lily pads
  for(let i=0;i<8;i++){
    const px = -22 + (Math.random()-0.5)*22;
    const pz = 6 + (Math.random()-0.5)*14;
    const lp = voxel(g, px, 0.25, pz, 1.5, 0.15, 1.5, mat(TX.lily), false);
    lp.userData.float = { base:0.25, phase:Math.random()*6.28 };
    lilyPads.push(lp);
    // occasional pink flower
    if(Math.random()<0.4) voxel(g, px, 0.4, pz, 0.5,0.3,0.5, mat(TX.sakura), false);
  }
  world.add(g);
})();

// Arch bridge over the pond
(function bridge(){
  const g = new THREE.Group();
  const redMat = mat(TX.red);
  const woodMat = mat(TX.darkwood);
  const span = 18, steps = 14;
  for(let i=0;i<=steps;i++){
    const t = i/steps;
    const x = -22 + (t-0.5)*span;
    const y = 2.6 + Math.sin(t*Math.PI)*3.4; // arch
    voxel(g, x, y, 6, span/steps+0.3, 0.6, 5, redMat);
    // railings
    if(i%2===0){
      voxel(g, x, y+1.4, 4.6, 0.4, 2.2, 0.4, redMat);
      voxel(g, x, y+1.4, 7.4, 0.4, 2.2, 0.4, redMat);
    }
  }
  // rail top beams
  for(let side of [4.6,7.4]){
    for(let i=0;i<=steps;i++){
      const t=i/steps;
      const x=-22+(t-0.5)*span;
      const y=2.6+Math.sin(t*Math.PI)*3.4 + 2.4;
      voxel(g, x, y, side, span/steps+0.3, 0.35, 0.4, woodMat);
    }
  }
  world.add(g);
})();

/* ============================================================
   RED TORII GATE
   ============================================================ */
(function torii(){
  const g = new THREE.Group();
  g.position.set(0, 0, 42);
  const redMat = mat(TX.red);
  const darkMat = mat(TX.darkwood);
  const H = 16, span = 12;
  // two pillars
  voxel(g, -span/2, H/2, 0, 1.6, H, 1.6, redMat);
  voxel(g,  span/2, H/2, 0, 1.6, H, 1.6, redMat);
  // second lower tie beam (nuki)
  voxel(g, 0, H-4, 0, span+2, 1.2, 1.2, redMat);
  // top curved beam (kasagi) - slight upward flare with segments
  const segs=9;
  for(let i=0;i<segs;i++){
    const t=i/(segs-1);
    const x=(t-0.5)*(span+6);
    const y=H + Math.pow(Math.abs(t-0.5)*2,2)*1.6;
    voxel(g, x, y, 0, (span+6)/segs+0.3, 1.4, 2.0, darkMat);
  }
  // ridge cap
  voxel(g, 0, H+2.6, 0, span+3, 0.8, 1.2, darkMat);
  world.add(g);
})();

/* ============================================================
   PAGODA TEMPLE — multi-tiered, shoji windows, gold sorin
   ============================================================ */
const shojiWindows = [];
(function pagoda(){
  const g = new THREE.Group();
  g.position.set(0, 0, -20);
  const darkWoodMat = mat(TX.darkwood);
  const woodMat = mat(TX.wood);
  const roofMat = mat(TX.roof);
  const goldMat = mat(TX.gold, {metal:0.5, rough:0.35, emissive:0x3a2a08, emissiveIntensity:0.25});
  const shojiMat = mat(TX.shoji, {emissive:0xffd27a, emissiveIntensity:0.9});

  // stone platform base
  voxel(g, 0, 1, 0, 26, 2, 26, mat(TX.stone));
  voxel(g, 0, 2.4, 0, 22, 1, 22, mat(TX.darkstone));

  const tiers = 4;
  let baseY = 3;
  let width = 18;
  for(let t=0;t<tiers;t++){
    const tierH = 7 - t*0.7;
    const w = width - t*3.4;
    const cy = baseY + tierH/2;
    // corner pillars
    const half = w/2 - 0.8;
    for(let sx of [-half, half]) for(let sz of [-half, half]){
      voxel(g, sx, cy, sz, 1.2, tierH, 1.2, darkWoodMat);
    }
    // wall panels (front/back/left/right) with shoji windows
    const wallMatSolid = woodMat;
    // solid corners walls + glowing shoji center
    for(let face=0; face<4; face++){
      const rot = face*Math.PI/2;
      const wx = Math.sin(rot), wz = Math.cos(rot);
      // shoji glowing panel
      const sw = voxel(g, wx*(w/2-0.4), cy, wz*(w/2-0.4), (face%2? 0.6 : w-3), tierH-2, (face%2? w-3 : 0.6), shojiMat, false);
      shojiWindows.push(sw);
      // frame beams top & bottom
      voxel(g, wx*(w/2-0.3), baseY+0.4, wz*(w/2-0.3), (face%2?0.8:w), 0.8, (face%2?w:0.8), darkWoodMat);
      voxel(g, wx*(w/2-0.3), baseY+tierH-0.4, wz*(w/2-0.3), (face%2?0.8:w), 0.8, (face%2?w:0.8), darkWoodMat);
    }

    // ROOF — flared tiered roof
    const roofBase = baseY + tierH;
    const roofW = w + 6;
    const layers = 5;
    for(let r=0;r<layers;r++){
      const rt = r/layers;
      const rw = roofW*(1-rt*0.8);
      voxel(g, 0, roofBase + r*0.9, 0, rw, 0.9, rw, roofMat);
    }
    // flared corner eaves (upturned) with gold tips
    const eaveY = roofBase + 0.5;
    const eR = roofW/2;
    for(let sx of [-1,1]) for(let sz of [-1,1]){
      voxel(g, sx*eR, eaveY+0.8, sz*eR, 2.2, 0.7, 2.2, roofMat);
      voxel(g, sx*(eR+1), eaveY+1.8, sz*(eR+1), 1.0, 0.7, 1.0, roofMat);
      voxel(g, sx*(eR+1.4), eaveY+2.6, sz*(eR+1.4), 0.6, 0.6, 0.6, goldMat);
    }
    baseY = roofBase + layers*0.9 - 0.6;
    width = w;
  }

  // SORIN — golden spire on top
  let sy = baseY + 0.5;
  voxel(g, 0, sy, 0, 3.5, 1, 3.5, roofMat);
  for(let i=0;i<7;i++){
    voxel(g, 0, sy + 1 + i*1.1, 0, 2.2 - i*0.22, 1.1, 2.2 - i*0.22, goldMat);
  }
  // rings
  for(let i=0;i<5;i++){
    const ring = voxel(g, 0, sy + 2 + i*1.1, 0, 3.2 - i*0.3, 0.25, 3.2 - i*0.3, goldMat, false);
  }
  voxel(g, 0, sy + 9, 0, 0.8, 2, 0.8, goldMat);
  // gold finial sphere-ish
  voxel(g, 0, sy + 10.4, 0, 1.4, 1.4, 1.4, goldMat);

  // Point light glow from pagoda interior
  const glow = new THREE.PointLight(0xffb85c, 0, 40, 2);
  glow.position.set(0, 12, 0);
  g.add(glow);
  pagodaGlow = glow;

  world.add(g);
})();

/* ============================================================
   WEB AUDIO — wind + gentle chimes
   ============================================================ */
let audioCtx=null, audioOn=false, windGain, chimeTimer;
function initAudio(){
  if(audioCtx) { toggleAudio(); return; }
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  // Wind: filtered brown noise
  const bufSize = 2*audioCtx.sampleRate;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const out = buf.getChannelData(0);
  let last=0;
  for(let i=0;i<bufSize;i++){ const w=Math.random()*2-1; out[i]=(last+0.02*w)/1.02; last=out[i]; out[i]*=3.2; }
  const noiseSrc = audioCtx.createBufferSource();
  noiseSrc.buffer = buf; noiseSrc.loop = true;
  const bp = audioCtx.createBiquadFilter();
  bp.type='bandpass'; bp.frequency.value=420; bp.Q.value=0.7;
  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.frequency.value=0.08; lfoGain.gain.value=220;
  lfo.connect(lfoGain); lfoGain.connect(bp.frequency);
  windGain = audioCtx.createGain(); windGain.gain.value=0.0;
  noiseSrc.connect(bp); bp.connect(windGain); windGain.connect(audioCtx.destination);
  noiseSrc.start(); lfo.start();
  // Chimes
  const notes=[523.25,587.33,659.25,783.99,880.0,1046.5];
  function chime(){
    if(!audioOn){ chimeTimer=setTimeout(chime, 2000); return; }
    const n = notes[(Math.random()*notes.length)|0];
    const osc=audioCtx.createOscillator(); osc.type='sine'; osc.frequency.value=n;
    const g=audioCtx.createGain(); g.gain.value=0;
    const t=audioCtx.currentTime;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.12, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+2.6);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t+2.7);
    chimeTimer=setTimeout(chime, 2500+Math.random()*5000);
  }
  chime();
  audioOn=true; updateAudioBtn();
  windGain.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime+2);
}
function toggleAudio(){
  audioOn=!audioOn;
  if(windGain) windGain.gain.linearRampToValueAtTime(audioOn?0.35:0.0, audioCtx.currentTime+1);
  updateAudioBtn();
}
function updateAudioBtn(){
  const b=document.getElementById('audioBtn');
  b.innerHTML = audioOn ? '🔈 <span>Mute Ambience</span>' : '🔊 <span>Enable Ambience</span>';
  b.classList.toggle('active', audioOn);
}
document.getElementById('audioBtn').addEventListener('click', initAudio);

/* ============================================================
   RESIZE
   ============================================================ */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
const clock = new THREE.Clock();
let frames=0, fpsTime=0;
const fpsEl = document.getElementById('fps');

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  // --- time-of-day blending ---
  if(blend < 1 && targetState){
    blend = Math.min(1, blend + dt*0.6);
    const e = blend;
    scene.background.copy(fromState.sky).lerp(targetState.sky, e);
    scene.fog.color.copy(fromState.fog).lerp(targetState.fog, e);
    scene.fog.density = THREE.MathUtils.lerp(fromState.fogD, targetState.fogD, e);
    sun.color.copy(fromState.sunColor).lerp(targetState.sunColor, e);
    sun.intensity = THREE.MathUtils.lerp(fromState.sunInt, targetState.sunInt, e);
    hemi.intensity = THREE.MathUtils.lerp(fromState.hemiInt, targetState.hemiInt, e);
    ambient.intensity = THREE.MathUtils.lerp(fromState.ambInt, targetState.ambInt, e);
    sun.position.copy(fromState.sunPos).lerp(targetState.sunPos, e);
    celestial.position.copy(sun.position);
    celestial.material.color.copy(fromState.celColor).lerp(targetState.celColor, e);
    renderer.toneMappingExposure = THREE.MathUtils.lerp(fromState.exposure, targetState.exposure, e);
    const lv = THREE.MathUtils.lerp(fromState.lantern, targetState.lantern, e);
    lanternLights.forEach(l=>{ l.light.intensity=lv; });
    pagodaGlow.intensity = THREE.MathUtils.lerp(fromState.glow, targetState.glow, e);
  }

  // lantern flicker
  const flick = 1 + Math.sin(t*8)*0.06 + Math.sin(t*13.3)*0.04;
  lanternLights.forEach((l,i)=>{
    if(l.light.intensity>0.01){
      l.light.intensity *= 1; // keep base from blend
      l.mesh.material.emissiveIntensity = 1.1 * flick;
    }
  });

  // --- samurai idle breathing ---
  samurai.forEach(s=>{
    const b = 1 + Math.sin(t*1.6 + s.phase)*0.02;
    s.body.scale.y = b;
    s.body.position.y = (b-1)*1.5;
  });

  // --- animals wander + graze ---
  animals.forEach(a=>{
    a.timer -= 1;
    if(a.timer<=0){ a.dir += (Math.random()-0.5)*1.4; a.timer = 120+Math.random()*240; }
    a.group.position.x += Math.cos(a.dir)*a.speed*60*dt;
    a.group.position.z += Math.sin(a.dir)*a.speed*60*dt;
    // keep within meadow bounds
    const r = Math.hypot(a.group.position.x, a.group.position.z);
    if(r>55){ a.dir += Math.PI; }
    a.group.rotation.y = -a.dir + Math.PI/2;
    // grazing head bob
    const bob = Math.sin(t*2 + a.phase);
    a.head.rotation.x = bob*0.25 + 0.1;
    // body bounce while walking
    a.group.position.y = Math.abs(Math.sin(t*6 + a.phase))*0.15;
  });

  // --- birds ---
  birds.forEach(b=>{
    b.angle += b.speed;
    const x = b.cx + Math.cos(b.angle)*b.radius;
    const z = b.cz + Math.sin(b.angle)*b.radius;
    const y = b.height + Math.sin(b.angle*2)*4;
    b.group.position.set(x,y,z);
    b.group.rotation.y = -b.angle + Math.PI/2;
    b.flap += 0.4;
    const f = Math.sin(b.flap)*0.6;
    b.lw.rotation.z = f; b.rw.rotation.z = -f;
  });

  // --- clouds drift ---
  clouds.forEach(c=>{
    c.group.position.x += c.speed*60*dt;
    if(c.group.position.x > 150) c.group.position.x = -150;
  });

  // --- water shimmer ---
  if(waterMesh){ waterMesh.material.map.offset.x = t*0.02; waterMesh.position.y = -0.4 + Math.sin(t*1.5)*0.06; }
  // lily pads bob
  lilyPads.forEach(lp=>{ lp.position.y = lp.userData.float.base + Math.sin(t*1.2 + lp.userData.float.phase)*0.08; });

  // --- petals falling ---
  if(petalPoints){
    const pos = petalPoints.geo.attributes.position.array;
    for(let i=0;i<petalPoints.N;i++){
      const d = petalPoints.data[i];
      pos[i*3+1] -= d.fall*60*dt;
      pos[i*3] += Math.sin(t*1.5 + d.sway)*0.02;
      if(pos[i*3+1] < 0.3){
        const e = petalEmitters.length ? petalEmitters[(Math.random()*petalEmitters.length)|0] : d.e;
        pos[i*3] = e.x + (Math.random()-0.5)*10;
        pos[i*3+1] = e.y + 2;
        pos[i*3+2] = e.z + (Math.random()-0.5)*10;
      }
    }
    petalPoints.geo.attributes.position.needsUpdate = true;
  }

  // --- camera animation ---
  if(camAnim){
    camAnim.t = Math.min(1, camAnim.t + dt*0.9);
    const e = camAnim.t<0.5 ? 2*camAnim.t*camAnim.t : 1-Math.pow(-2*camAnim.t+2,2)/2; // easeInOut
    camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, e);
    controls.target.lerpVectors(camAnim.fromTgt, camAnim.toTgt, e);
    if(camAnim.t>=1) camAnim=null;
  }

  // sun target follows origin
  sun.target.position.set(0,8,0);

  controls.update();
  renderer.render(scene, camera);

  // fps
  frames++; fpsTime += dt;
  if(fpsTime>=0.5){ fpsEl.textContent = Math.round(frames/fpsTime)+' fps'; frames=0; fpsTime=0; }
}
animate();

/* hide loader */
setTimeout(()=>{
  const l=document.getElementById('loader');
  l.style.opacity='0';
  setTimeout(()=>l.remove(), 900);
}, 700);

</script>
