import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function smoothstep(e0,e1,x){const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);}
function fract(x){return x-Math.floor(x);}
function hash2(x,y){return fract(Math.sin(x*127.1+y*311.7)*43758.5453);}
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(a,b,u),lerp(c,d,u),v);
}
function fbm(x,y){let v=0,amp=0.5,f=1;for(let i=0;i<5;i++){v+=amp*vnoise(x*f,y*f);f*=2;amp*=0.5;}return v;}
function rnd(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>{s=s*16807%2147483647;return (s-1)/2147483646;};}

function makeTex(draw){
  const c=document.createElement('canvas');c.width=c.height=16;
  const ctx=c.getContext('2d');draw(ctx);
  const t=new THREE.CanvasTexture(c);
  t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function texNoise(h,s,l,vr){
  return makeTex(ctx=>{
    for(let y=0;y<16;y++)for(let x=0;x<16;x++){
      const hh=h+(Math.random()-0.5)*10;
      const ss=s+(Math.random()-0.5)*8;
      const ll=(l+(Math.random()-0.5)*vr)|0;
      ctx.fillStyle='hsl('+hh+','+ss+'%,'+ll+'%)';
      ctx.fillRect(x,y,1,1);
    }
  });
}
function plankTex(h,s,l){
  return makeTex(ctx=>{
    for(let y=0;y<16;y++)for(let x=0;x<16;x++){
      const hh=h+(Math.random()-0.5)*8;
      const ss=s+(Math.random()-0.5)*6;
      const ll=(l+(Math.random()-0.5)*10)|0;
      ctx.fillStyle='hsl('+hh+','+ss+'%,'+ll+'%)';
      ctx.fillRect(x,y,1,1);
    }
    ctx.fillStyle='hsl('+h+','+s+'%,'+Math.max(4,l-14)+'%)';
    for(let y=0;y<16;y+=4)ctx.fillRect(0,y,16,1);
  });
}

  ctx.fillRect(5,0,1,16);ctx.fillRect(10,0,1,16);

const tBamboo=texNoise(100,45,38,10);

});

const MATS={};
function defMat(name,tex,tile,mo){
  const m=new THREE.MeshLambertMaterial(Object.assign({map:tex},mo||{}));
  m.userData.tile=tile||0;
  MATS[name]=m;
}
defMat('grass',tGrass,4);
defMat('dirt',tDirt,4);
defMat('rock',tRock,4);
defMat('snow',tSnow,4);

defMat('gold',tGold,0);
defMat('bamboo',tBamboo,0);

const FACES=[
 {dir:[-1,0,0],corners:[{pos:[0,1,0],uv:[0,1]},{pos:[0,0,0],uv:[0,0]},{pos:[0,1,1],uv:[1,1]},{pos:[0,0,1],uv:[1,0]}]},
 {dir:[1,0,0],corners:[{pos:[1,1,1],uv:[0,1]},{pos:[1,0,1],uv:[0,0]},{pos:[1,1,0],uv:[1,1]},{pos:[1,0,0],uv:[1,0]}]},
 {dir:[0,-1,0],corners:[{pos:[1,0,1],uv:[1,0]},{pos:[0,0,1],uv:[0,0]},{pos:[1,0,0],uv:[1,1]},{pos:[0,0,0],uv:[0,1]}]},
 {dir:[0,1,0],corners:[{pos:[0,1,1],uv:[1,1]},{pos:[1,1,1],uv:[0,1]},{pos:[0,1,0],uv:[1,0]},{pos:[1,1,0],uv:[0,0]}]},
 {dir:[0,0,-1],corners:[{pos:[1,0,0],uv:[0,0]},{pos:[0,0,0],uv:[1,0]},{pos:[1,1,0],uv:[0,1]},{pos:[0,1,0],uv:[1,1]}]},
 {dir:[0,0,1],corners:[{pos:[0,0,1],uv:[0,0]},{pos:[1,0,1],uv:[1,0]},{pos:[0,1,1],uv:[0,1]},{pos:[1,1,1],uv:[1,1]}]}
];
const vox={
  bags:new Map(),
  add(name,x,y,z,sx,sy,sz){
    let b=this.bags.get(name);
    if(!b){b={pos:[],nor:[],uv:[],idx:[]};this.bags.set(name,b);}
    const tile=MATS[name].userData.tile;
    for(const f of FACES){
      const ndx=b.pos.length/3;
      let uw=1,vh=1;
      if(tile){
        if(f.dir[0]){uw=sz/tile;vh=sy/tile;}
        else if(f.dir[1]){uw=sx/tile;vh=sz/tile;}
        else{uw=sx/tile;vh=sy/tile;}
      }
      for(const c of f.corners){
        b.pos.push(x+c.pos[0]*sx,y+c.pos[1]*sy,z+c.pos[2]*sz);
        b.nor.push(f.dir[0],f.dir[1],f.dir[2]);
        b.uv.push(c.uv[0]*uw,c.uv[1]*vh);
      }
      b.idx.push(ndx,ndx+1,ndx+2,ndx+2,ndx+1,ndx+3);
    }
  },
  flush(scene){
    for(const [name,b] of this.bags){
      const g=new THREE.BufferGeometry();
      g.setAttribute('position',new THREE.Float32BufferAttribute(b.pos,3));
      g.setAttribute('normal',new THREE.Float32BufferAttribute(b.nor,3));
      g.setAttribute('uv',new THREE.Float32BufferAttribute(b.uv,2));
      g.setIndex(b.idx);
      g.computeBoundingSphere();
      const m=new THREE.Mesh(g,MATS[name]);
      if(name==='water'){m.castShadow=false;m.receiveShadow=false;m.renderOrder=1;}
      else{m.castShadow=true;m.receiveShadow=true;}
      scene.add(m);
    }
    this.bags.clear();
  }
};
const unitBox=new THREE.BoxGeometry(1,1,1);
function part(g,name,x,y,z,sx,sy,sz,rx,ry,rz){
  const m=new THREE.Mesh(unitBox,MATS[name]);
  m.scale.set(sx,sy,sz);m.position.set(x,y,z);
  if(rx||ry||rz)m.rotation.set(rx||0,ry||0,rz||0);
  m.castShadow=true;g.add(m);return m;
}

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.5,1600);
camera.position.set(62,44,92);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=0.06;
controls.minDistance=8;
controls.maxDistance=400;
controls.maxPolarAngle=1.48;

const MODES={
  morning:{sky:'#9fc8f2',fog:'#c3ddf5',fogD:0.0014,sun:[90,110,60],sunCol:'#fff4d8',sunI:1.15,hemiSky:'#bcd9ff',hemiGnd:'#5e7a4a',hemiI:0.8,lantern:0.3,shoji:0.35,cel:'#fff6c8',cloud:'#ffffff',star:0},
  sunset:{sky:'#f08a5a',fog:'#e8a074',fogD:0.0022,sun:[-110,42,-40],sunCol:'#ff9650',sunI:1.0,hemiSky:'#ffb090',hemiGnd:'#6a4a3a',hemiI:0.55,lantern:1.1,shoji:0.8,cel:'#ffd07a',cloud:'#ffd2b0',star:0},
  night:{sky:'#070d22',fog:'#0c1430',fogD:0.0012,sun:[-70,120,-90],sunCol:'#9db6ff',sunI:0.35,hemiSky:'#2a3a66',hemiGnd:'#0c1410',hemiI:0.4,lantern:2.4,shoji:1.5,cel:'#e8f0ff',cloud:'#39466e',star:1}
};
let target=MODES.morning;
const tgtC={
  sky:new THREE.Color(),fog:new THREE.Color(),sunCol:new THREE.Color(),

  tgtC.hemiSky.set(target.hemiSky);tgtC.hemiGnd.set(target.hemiGnd);

}

const cur={

scene.fog=new THREE.FogExp2(cur.fog,cur.fogD);

scene.add(sun);scene.add(sun.target);
const lanternLights=[];
const celestial=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:cur.cel,fog:false}));
celestial.scale.setScalar(14);
scene.add(celestial);

const T=4,N=64,HALF=N*T/2,PLATEAU=12;
const POND={x0:14,x1:62,z0:-16,z1:26,bottom:4,level:8};
const PASTURE={x0:-35,x1:35,z0:-70,z1:-38};
const heights=new Int32Array(N*N);
function computeHeight(x,z){
  let h=8+fbm(x*0.02+3.1,z*0.02+7.7)*9;
  const edge=Math.min(x+60,75-x,z+50,80-z);
  const flat=smoothstep(-16,6,edge);
  h=lerp(h,PLATEAU,flat);
  const d=Math.hypot(x,z);
  if(d>70){
    const m=smoothstep(70,135,d);
    const ridge=fbm(x*0.014+11,z*0.014+5);
    h+=(1-flat)*m*m*(35+ridge*95);
  }
  if(x>=POND.x0&&x<POND.x1&&z>=POND.z0&&z<POND.z1)h=POND.bottom;
  return Math.max(4,Math.round(h/4)*4);
}
function heightAt(x,z){
  const gx=clamp(Math.floor((x+HALF)/T),0,N-1);
  const gz=clamp(Math.floor((z+HALF)/T),0,N-1);
  return heights[gx+gz*N];
}
function inPond(x,z){return x>=POND.x0&&x<POND.x1&&z>=POND.z0&&z<POND.z1;}
function genTerrain(){
  for(let gz=0;gz<N;gz++)for(let gx=0;gx<N;gx++){
    const x=-HALF+gx*T+T/2,z=-HALF+gz*T+T/2;
    const h=computeHeight(x,z);
    heights[gx+gz*N]=h;
    const inP=inPond(x,z);
    const topM=inP?'dirt':h>=64?'snow':h>=40?'rock':'grass';
    const bodyM=h>=40?'rock':'dirt';
    const bx=-HALF+gx*T,bz=-HALF+gz*T;
    if(h>4)vox.add(bodyM,bx,0,bz,T,h-4,T);
    vox.add(topM,bx,h-4,bz,T,4,T);
  }
}

function buildTorii(cx,cz,base){
  const H=13;
  for(const sx of[-1,1]){
    const px=cx+sx*7;
    vox.add('red',px-0.9,base,cz-0.9,1.8,H,1.8);
    vox.add('red',px-1.2,base-0.2,cz-1.2,2.4,1.4,2.4);
  }
  vox.add('red',cx-9,base+H-4,cz-0.9,18,1.5,1.8);
  const yA=base+H;
  vox.add('red',cx-5.5,yA,cz-1.1,11,1.3,2.2);
  vox.add('red',cx-13.5,yA+1,cz-1.1,8,1.3,2.2);
  vox.add('red',cx+5.5,yA+1,cz-1.1,8,1.3,2.2);
  vox.add('red',cx-6.5,yA+1.3,cz-1.3,13,1.5,2.6);

    for(let ix=-h;ix<h;ix++)for(let iz=-h;iz<h;iz++){
      const per=ix===-h||ix===h-1||iz===-h||iz===h-1;
      if(!per)continue;

      vox.add(corner||mid?'woodDark':'shoji',cx+ix,wallY,cz+iz,1,wh,1);

function pathLine(x0,z0,x1,z1,step){
  step=step||2.4;
  const dx=x1-x0,dz=z1-z0;
  const len=Math.hypot(dx,dz);
  const n=Math.max(1,Math.round(len/step));
  for(let i=0;i<=n;i++){
    const t=i/n;
    const x=x0+dx*t+(hash2(i+1,x0)*2-1)*0.7;
    const z=z0+dz*t+(hash2(i+1,z0)*2-1)*0.7;
    if(inPond(x,z))continue;
    const y=heightAt(x,z);
    vox.add('path',x-1.1,y-0.15,z-1.1,2.2,0.5,2.2);
  }
}

function playTone(f,t0,dur,vol){
  const o=actx.createOscillator();o.type='sine';o.frequency.value=f;
  const o2=actx.createOscillator();o2.type='sine';o2.frequency.value=f*2.01;
  const g=actx.createGain(),g2=actx.createGain();
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  g2.gain.setValueAtTime(0,t0);
  g2.gain.linearRampToValueAtTime(vol*0.3,t0+0.02);
  g2.gain.exponentialRampToValueAtTime(0.0001,t0+dur*0.5);
  o.connect(g);o2.connect(g2);
  g.connect(masterGain);g2.connect(masterGain);
  g.connect(revSend);g2.connect(revSend);
  o.start(t0);o.stop(t0+dur+0.1);
  o2.start(t0);o2.stop(t0+dur+0.1);
}
function chime(){
  if(!actx||!soundOn)return;
  const n=1+(Math.random()*2|0);
  for(let i=0;i<n;i++){
    const t0=actx.currentTime+i*(0.15+Math.random()*0.4);
    playTone(SCALE[Math.floor(Math.random()*SCALE.length)],t0,2.8+Math.random()*1.5,0.12);
  }
}
function scheduleChimes(){
  clearTimeout(chimeTO);
  chimeTO=setTimeout(()=>{
    chime();
    if(soundOn)scheduleChimes();
  },3000+Math.random()*7000);
}
function initAudio(){
  actx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=actx.createGain();
  masterGain.gain.value=0;
  masterGain.connect(actx.destination);
  const conv=actx.createConvolver();
  const irLen=Math.floor(actx.sampleRate*2.2);
  const ir=actx.createBuffer(2,irLen,actx.sampleRate);
  for(let c=0;c<2;c++){
    const d=ir.getChannelData(c);
    for(let i=0;i<irLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/irLen,3);
  }
  conv.buffer=ir;
  revSend=actx.createGain();
  revSend.gain.value=0.5;
  revSend.connect(conv);
  conv.connect(masterGain);
  const nLen=actx.sampleRate*4;
  const nBuf=actx.createBuffer(1,nLen,actx.sampleRate);
  const nd=nBuf.getChannelData(0);
  for(let i=0;i<nLen;i++)nd[i]=Math.random()*2-1;
  const src=actx.createBufferSource();
  src.buffer=nBuf;src.loop=true;
  const bp=actx.createBiquadFilter();
  bp.type='bandpass';bp.frequency.value=480;bp.Q.value=0.6;
  const wg=actx.createGain();
  wg.gain.value=0.13;
  src.connect(bp);bp.connect(wg);wg.connect(masterGain);
  const lfo=actx.createOscillator();
  lfo.frequency.value=0.07;
  const lg=actx.createGain();
  lg.gain.value=0.07;
  lfo.connect(lg);lg.connect(wg.gain);lfo.start();
  const lfo2=actx.createOscillator();
  lfo2.frequency.value=0.05;
  const lg2=actx.createGain();
  lg2.gain.value=250;
  lfo2.connect(lg2);lg2.connect(bp.frequency);lfo2.start();
  src.start();
}

const clock=new THREE.Clock();
function updateLighting(dt){
  const k=1-Math.exp(-1.8*dt);
  cur.sky.lerp(tgtC.sky,k);
  cur.fog.lerp(tgtC.fog,k);
  cur.sunCol.lerp(tgtC.sunCol,k);
  cur.hemiSky.lerp(tgtC.hemiSky,k);
  cur.hemiGnd.lerp(tgtC.hemiGnd,k);
  cur.cel.lerp(tgtC.cel,k);
  cur.cloud.lerp(tgtC.cloud,k);
  cur.sunPos.lerp(tgtC.sunPos,k);
  cur.fogD=lerp(cur.fogD,target.fogD,k);
  cur.sunI=lerp(cur.sunI,target.sunI,k);
  cur.hemiI=lerp(cur.hemiI,target.hemiI,k);
  cur.lantern=lerp(cur.lantern,target.lantern,k);
  cur.shoji=lerp(cur.shoji,target.shoji,k);
  cur.star=lerp(cur.star,target.star,k);
  scene.background.copy(cur.sky);
  scene.fog.color.copy(cur.fog);
  scene.fog.density=cur.fogD;
  hemi.color.copy(cur.hemiSky);
  hemi.groundColor.copy(cur.hemiGnd);
  hemi.intensity=cur.hemiI;
  sun.color.copy(cur.sunCol);
  sun.intensity=cur.sunI;
  sun.position.copy(cur.sunPos).normalize().multiplyScalar(200);
  celestial.position.copy(cur.sunPos).normalize().multiplyScalar(340);
  celestial.material.color.copy(cur.cel);
  for(const pl of lanternLights)pl.intensity=6*cur.lantern;
  MATS.shoji.emissiveIntensity=cur.shoji;
  MATS.lanternGlow.emissiveIntensity=0.5+cur.lantern*0.9;
  MATS.cloud.color.copy(cur.cloud);
  if(stars)stars.material.opacity=cur.star;
}
function updateAnimals(t,dt){
  for(const a of animals){
    a.timer-=dt;
    if(a.timer<=0){
      if(a.state==='walk'){
        a.state=Math.random()<0.55?'graze':'walk';
        a.timer=a.state==='graze'?2.5+Math.random()*3:1.5+Math.random()*3;
        a.heading+=(Math.random()-0.5)*2.5;
      }else{
        a.state='walk';
        a.timer=2+Math.random()*3;
        a.heading+=(Math.random()-0.5)*2;
      }
    }
    let bob=0;
    if(a.state==='walk'){
      if(a.hx<PASTURE.x0||a.hx>PASTURE.x1||a.hz<PASTURE.z0||a.hz>PASTURE.z1){
        const tx=(PASTURE.x0+PASTURE.x1)/2,tz=(PASTURE.z0+PASTURE.z1)/2;
        a.heading=Math.atan2(tx-a.hx,tz-a.hz)+(Math.random()-0.5)*0.5;
      }
      const sp=a.kind==='sheep'?1.1:0.9;
      a.hx+=Math.sin(a.heading)*sp*dt;
      a.hz+=Math.cos(a.heading)*sp*dt;
      bob=Math.abs(Math.sin(t*7+a.ph))*0.07;
      a.g.rotation.y=a.heading;
    }
    const gy=heightAt(a.hx,a.hz);
    a.g.position.set(a.hx,gy+bob,a.hz);
    const want=a.state==='graze'?1:0;
    a.graze=lerp(a.graze,want,1-Math.exp(-4*dt));
    const isSheep=a.kind==='sheep';
    a.head.rotation.x=a.graze*(isSheep?1.15:1.3);
    a.head.position.y=(isSheep?1.2:3.05)-a.graze*(isSheep?0.45:0.55);
  }
}
function updateBirds(t){
  for(const f of flocks)for(const o of f.birds){
    const ang=t*f.speed+o.off;
    const rr=f.r+o.ro;
    const x=f.cx+Math.cos(ang)*rr;
    const z=f.cz+Math.sin(ang)*rr;
    const y=f.cy+o.yoff+Math.sin(t*0.6+o.ph)*3;
    o.b.g.position.set(x,y,z);
    o.b.g.rotation.y=-ang;
    const flap=Math.sin(t*o.fl+o.ph)*0.85;
    o.b.wl.rotation.z=-flap;
    o.b.wr.rotation.z=flap;
  }
}
function updatePetals(t,dt){
  if(!petals)return;
  const attr=petals.geometry.attributes.position;
  for(let i=0;i<petalData.length;i++){
    const d=petalData[i];
    d.y-=d.sp*dt;
    d.x+=Math.sin(t*1.5+d.ph)*0.6*dt;
    if(d.y<heightAt(d.x,d.z)+0.2){
      d.y=8+Math.random()*14;
      d.x=d.tr.x+(Math.random()-0.5)*16;
      d.z=d.tr.z+(Math.random()-0.5)*16;
    }
    attr.array[i*3]=d.x;
    attr.array[i*3+1]=d.y;
    attr.array[i*3+2]=d.z;
  }
  attr.needsUpdate=true;
}
function animate(){
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;
  updateLighting(dt);
  if(tween){
    tween.t+=dt;
    const u=Math.min(tween.t/tween.dur,1);
    const e=u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    camera.position.lerpVectors(tween.p0,tween.p1,e);
    controls.target.lerpVectors(tween.t0,tween.t1,e);
    if(u>=1)tween=null;
  }
  for(let i=0;i<clouds.length;i++){
    const c=clouds[i];
    c.g.position.x+=c.sp*dt;
    if(c.g.position.x>230)c.g.position.x=-230;
  }
  for(const s of samuraiList){
    s.g.position.y=heightAt(s.g.position.x,s.g.position.z)+Math.sin(t*1.6+s.ph)*0.035;
    s.chest.scale.y=0.9*(1+Math.sin(t*1.6+s.ph)*0.035);
  }
  updateAnimals(t,dt);
  updateBirds(t);
  updatePetals(t,dt);
  for(let i=0;i<pads.length;i++){
    const p=pads[i];
    p.m.position.y=POND.level+0.05+Math.sin(t*1.2+p.ph)*0.04;
    p.m.rotation.y+=dt*0.06;
  }
  controls.update();
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(animate);
requestAnimationFrame(()=>{
  const l=document.getElementById('loader');
  l.style.opacity='0';
  setTimeout(()=>l.remove(),900);
});
