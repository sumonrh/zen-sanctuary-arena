<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zen Sanctuary</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Georgia', 'serif'],
            ui: ['Trebuchet MS', 'sans-serif'],
          },
          colors: {
            ink: '#17231f',
            paper: '#edf3e7',
            vermilion: '#bd3d31',
            moss: '#4d7a4b',
          },
        },
      },
    };
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #8cb2c4; font-family: 'Trebuchet MS', sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
    .glass {
      background: rgba(17, 31, 27, 0.6);
      border: 1px solid rgba(237, 243, 231, 0.22);
      box-shadow: 0 16px 45px rgba(8, 19, 16, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .control-button {
      border: 1px solid rgba(237, 243, 231, 0.18);
      background: rgba(237, 243, 231, 0.08);
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }
    .control-button:hover { background: rgba(237, 243, 231, 0.18); transform: translateY(-1px); }
    .control-button.is-active { background: #d15b43; border-color: #ffd6ad; color: #fff9e9; }
    .control-button:focus-visible { outline: 2px solid #ffd6ad; outline-offset: 2px; }
    #loader { transition: opacity 500ms ease, visibility 500ms ease; }
    #loader.loaded { opacity: 0; visibility: hidden; }
    .brand-rule { background: linear-gradient(90deg, #e5b963, #d15b43, transparent); }
    @media (max-width: 640px) {
      .preset-label { display: none; }
      .panel-label { font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="relative h-screen w-screen overflow-hidden" aria-label="Interactive voxel Japanese Zen sanctuary">
    <canvas id="scene" aria-label="3D voxel sanctuary"></canvas>

    <div id="loader" class="absolute inset-0 z-20 grid place-items-center bg-ink">
      <div class="text-center text-paper">
        <div class="mx-auto mb-4 h-10 w-10 border-2 border-paper/20 border-t-[#e5b963]" style="animation: spin 1.1s linear infinite"></div>
        <p class="font-display text-xl tracking-wide">Kohaku Sanctuary</p>
        <p class="mt-1 text-xs uppercase tracking-[0.18em] text-paper/65">Setting stones in the mountain mist</p>
      </div>
    </div>

    <header class="pointer-events-none absolute inset-x-0 top-0 z-10 flex items-start justify-between p-3 sm:p-5">
      <section class="glass pointer-events-auto max-w-[235px] border-l-2 border-l-[#e5b963] px-4 py-3 sm:max-w-xs">
        <p class="text-[10px] uppercase tracking-[0.2em] text-[#e5b963]">Kohaku Valley</p>
        <h1 class="mt-1 font-display text-xl leading-none text-paper sm:text-2xl">Zen Sanctuary</h1>
        <div class="brand-rule mt-3 h-px w-full"></div>
        <p id="mode-description" class="mt-2 text-[11px] leading-4 text-paper/70">Morning light rests over the pagoda.</p>
      </section>

      <div class="flex gap-2">
        <button id="audio-button" type="button" class="glass pointer-events-auto grid h-10 w-10 place-items-center text-paper transition hover:bg-paper/15" title="Enable ambient wind and wind chimes" aria-label="Enable ambient sound">
          <i data-lucide="volume-2" class="h-[18px] w-[18px]"></i>
        </button>
        <button id="help-button" type="button" class="glass pointer-events-auto grid h-10 w-10 place-items-center text-paper transition hover:bg-paper/15" title="Open scene guide" aria-label="Open scene guide">
          <i data-lucide="circle-help" class="h-[18px] w-[18px]"></i>
        </button>
      </div>
    </header>

    <section class="glass absolute right-3 top-32 z-10 w-[174px] p-2 sm:right-5 sm:top-36" aria-label="Lighting controls">
      <p class="panel-label px-2 pb-2 text-[10px] uppercase tracking-[0.16em] text-paper/65">Sky cycle</p>
      <div class="grid gap-1">
        <button type="button" data-time="morning" class="control-button is-active flex items-center gap-2 px-2.5 py-2 text-left text-xs text-paper" aria-pressed="true"><i data-lucide="sunrise" class="h-3.5 w-3.5 text-[#e5b963]"></i> Morning Sun</button>
        <button type="button" data-time="sunset" class="control-button flex items-center gap-2 px-2.5 py-2 text-left text-xs text-paper" aria-pressed="false"><i data-lucide="sunset" class="h-3.5 w-3.5 text-[#f58b5b]"></i> Sunset</button>
        <button type="button" data-time="night" class="control-button flex items-center gap-2 px-2.5 py-2 text-left text-xs text-paper" aria-pressed="false"><i data-lucide="moon-star" class="h-3.5 w-3.5 text-[#b9c8ff]"></i> Lantern Night</button>
      </div>
    </section>

    <nav class="absolute inset-x-0 bottom-3 z-10 mx-auto flex w-fit max-w-[calc(100%-24px)] gap-1 overflow-x-auto p-1 sm:bottom-5" aria-label="Camera viewpoints">
      <button type="button" data-preset="pagoda" class="control-button is-active flex h-10 shrink-0 items-center gap-2 px-3 text-xs text-paper" title="Pagoda Front"><i data-lucide="landmark" class="h-4 w-4 text-[#e5b963]"></i><span class="preset-label">Pagoda</span></button>
      <button type="button" data-preset="samurai" class="control-button flex h-10 shrink-0 items-center gap-2 px-3 text-xs text-paper" title="Samurai Closeup"><i data-lucide="shield" class="h-4 w-4 text-[#e5b963]"></i><span class="preset-label">Guardians</span></button>
      <button type="button" data-preset="meadow" class="control-button flex h-10 shrink-0 items-center gap-2 px-3 text-xs text-paper" title="Pastoral Meadow"><i data-lucide="sprout" class="h-4 w-4 text-[#e5b963]"></i><span class="preset-label">Meadow</span></button>
      <button type="button" data-preset="mountains" class="control-button flex h-10 shrink-0 items-center gap-2 px-3 text-xs text-paper" title="Mountain Vista"><i data-lucide="mountain" class="h-4 w-4 text-[#e5b963]"></i><span class="preset-label">Vista</span></button>
      <button type="button" data-preset="aerial" class="control-button flex h-10 shrink-0 items-center gap-2 px-3 text-xs text-paper" title="Bird's Eye"><i data-lucide="bird" class="h-4 w-4 text-[#e5b963]"></i><span class="preset-label">Bird's Eye</span></button>
    </nav>

    <aside id="help-panel" class="glass absolute bottom-20 left-3 z-10 hidden w-[270px] p-4 text-paper sm:bottom-5 sm:left-5" aria-live="polite">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p class="text-[10px] uppercase tracking-[0.18em] text-[#e5b963]">Scene guide</p>
          <p class="mt-2 text-xs leading-5 text-paper/80">Drag to orbit, scroll to travel, and select a viewpoint. The world shifts from soft morning to lantern-lit night.</p>
        </div>
        <button id="close-help" type="button" class="grid h-7 w-7 shrink-0 place-items-center text-paper/75 hover:text-paper" title="Close scene guide" aria-label="Close scene guide"><i data-lucide="x" class="h-4 w-4"></i></button>
      </div>
    </aside>
  </main>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js';

    const canvas = document.querySelector('#scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#a8c9d5');
    scene.fog = new THREE.Fog('#a8c9d5', 72, 165);

    const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(34, 26, 57);
    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 8, 1);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.minDistance = 11;
    controls.maxDistance = 130;
    controls.maxPolarAngle = Math.PI * 0.49;

    const world = new THREE.Group();
    scene.add(world);
    const animated = { clouds: [], birds: [], animals: [], samurai: [], petals: [], lanterns: [] };
    const geometryCache = new Map();

    function seeded(value) {
      const sine = Math.sin(value * 127.1 + 311.7) * 43758.5453123;
      return sine - Math.floor(sine);
    }

    function pixelTexture(palette, feature = '') {
      const textureCanvas = document.createElement('canvas');
      textureCanvas.width = 16;
      textureCanvas.height = 16;
      const context = textureCanvas.getContext('2d');
      context.imageSmoothingEnabled = false;
      for (let y = 0; y < 16; y += 1) {
        for (let x = 0; x < 16; x += 1) {
          const random = seeded(x * 17 + y * 43 + palette.length * 13);
          const index = random > 0.84 ? Math.min(palette.length - 1, 1) : 0;
          context.fillStyle = palette[index];
          context.fillRect(x, y, 1, 1);
        }
      }
      if (feature === 'wood') {
        context.fillStyle = palette[2] || palette[1];
        for (let y = 1; y < 16; y += 4) context.fillRect(0, y, 16, 1);
      }
      if (feature === 'paper') {
        context.fillStyle = palette[2] || '#c79b58';
        context.fillRect(3, 0, 1, 16);
        context.fillRect(11, 0, 1, 16);
        context.fillRect(0, 5, 16, 1);
        context.fillRect(0, 11, 16, 1);
      }
      if (feature === 'water') {
        context.fillStyle = palette[2] || '#d2efe8';
        for (let y = 2; y < 16; y += 5) {
          for (let x = (y % 3); x < 16; x += 6) context.fillRect(x, y, 3, 1);
        }
      }
      const texture = new THREE.CanvasTexture(textureCanvas);
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    const material = {
      grass: new THREE.MeshStandardMaterial({ map: pixelTexture(['#5b8a4c', '#73a55b', '#406d3d']), roughness: 1 }),
      grassDark: new THREE.MeshStandardMaterial({ map: pixelTexture(['#466d3d', '#608a4d', '#315a36']), roughness: 1 }),
      dirt: new THREE.MeshStandardMaterial({ map: pixelTexture(['#76573d', '#8f6b49', '#593e2e']), roughness: 1 }),
      rock: new THREE.MeshStandardMaterial({ map: pixelTexture(['#6d7772', '#8c9690', '#505955']), roughness: 1 }),
      snow: new THREE.MeshStandardMaterial({ map: pixelTexture(['#eff8f3', '#ffffff', '#cbdedb']), roughness: 0.85 }),
      wood: new THREE.MeshStandardMaterial({ map: pixelTexture(['#2c2927', '#3d352e', '#181b1b'], 'wood'), roughness: 0.83 }),
      woodWarm: new THREE.MeshStandardMaterial({ map: pixelTexture(['#5d382a', '#76503a', '#38221e'], 'wood'), roughness: 0.9 }),
      roof: new THREE.MeshStandardMaterial({ map: pixelTexture(['#20292b', '#334044', '#111718']), roughness: 0.78 }),
      shoji: new THREE.MeshStandardMaterial({ map: pixelTexture(['#ffe3a0', '#fff0be', '#c89f54'], 'paper'), emissive: '#d98b32', emissiveIntensity: 0.55, roughness: 0.75 }),
      red: new THREE.MeshStandardMaterial({ map: pixelTexture(['#ae3732', '#d25642', '#7c272a']), roughness: 0.7 }),
      gold: new THREE.MeshStandardMaterial({ map: pixelTexture(['#d7a943', '#f3d477', '#9b6e25']), metalness: 0.6, roughness: 0.34 }),
      water: new THREE.MeshStandardMaterial({ map: pixelTexture(['#317e93', '#4fabc0', '#b5e0db'], 'water'), color: '#75cfdb', transparent: true, opacity: 0.82, roughness: 0.32, metalness: 0.14 }),
      bamboo: new THREE.MeshStandardMaterial({ map: pixelTexture(['#4f8b45', '#74ae55', '#2f663a']), roughness: 0.9 }),
      blossom: new THREE.MeshStandardMaterial({ map: pixelTexture(['#ef9bab', '#ffc1c8', '#c96882']), roughness: 0.9 }),
      skin: new THREE.MeshStandardMaterial({ map: pixelTexture(['#bd7b5b', '#e4aa7f', '#8d5645']), roughness: 0.93 }),
      armor: new THREE.MeshStandardMaterial({ map: pixelTexture(['#263b51', '#3e5c76', '#142435']), roughness: 0.72 }),
      wool: new THREE.MeshStandardMaterial({ map: pixelTexture(['#e7eadc', '#ffffff', '#c6cdbf']), roughness: 1 }),
      alpaca: new THREE.MeshStandardMaterial({ map: pixelTexture(['#d3b18a', '#e8cba8', '#a98063']), roughness: 1 }),
      black: new THREE.MeshStandardMaterial({ color: '#181b1d', roughness: 0.85 }),
      leaf: new THREE.MeshStandardMaterial({ map: pixelTexture(['#3f743e', '#619c50', '#285c36']), roughness: 1 }),
      lily: new THREE.MeshStandardMaterial({ color: '#4d9e4d', roughness: 0.88 }),
    };

    function getGeometry(width, height, depth) {
      const key = `${width}:${height}:${depth}`;
      if (!geometryCache.has(key)) geometryCache.set(key, new THREE.BoxGeometry(width, height, depth));
      return geometryCache.get(key);
    }

    function block(parent, blockMaterial, x, y, z, width = 1, height = width, depth = width, options = {}) {
      const mesh = new THREE.Mesh(getGeometry(width, height, depth), blockMaterial);
      mesh.position.set(x, y, z);
      if (options.rotation) mesh.rotation.set(options.rotation.x || 0, options.rotation.y || 0, options.rotation.z || 0);
      mesh.castShadow = options.castShadow !== false;
      mesh.receiveShadow = options.receiveShadow !== false;
      parent.add(mesh);
      return mesh;
    }

    function micro(parent, blockMaterial, x, y, z, size = 0.25) {
      return block(parent, blockMaterial, x, y, z, size, size, size);
    }

    function addGround() {
      const ground = new THREE.Group();
      for (let x = -76; x <= 76; x += 4) {
        for (let z = -74; z <= 58; z += 4) {
          const ripple = seeded(x * 0.17 + z * 0.39);
          const height = ripple > 0.84 ? 2.45 : 2;
          block(ground, ripple > 0.7 ? material.grassDark : material.grass, x, -height / 2, z, 4, height, 4);
        }
      }
      world.add(ground);

      for (let x = -38; x <= 6; x += 2) {
        for (let z = -11; z <= 17; z += 2) {
          const ellipse = ((x + 16) * (x + 16)) / 610 + ((z - 3) * (z - 3)) / 265;
          if (ellipse < 1) block(world, material.water, x, -0.75, z, 2, 0.25, 2);
        }
      }
      for (const [x, z] of [[-25, 4], [-18, 11], [-30, -3], [-8, 5], [-35, 10]]) {
        block(world, material.lily, x, -0.48, z, 2.1, 0.12, 1.45);
        block(world, material.blossom, x + 0.25, -0.37, z, 0.45, 0.1, 0.45);
      }
    }

    function createMountain(centerX, baseZ, peakHeight, width, depth, seedOffset) {
      const mountain = new THREE.Group();
      for (let x = centerX - width / 2; x <= centerX + width / 2; x += 4) {
        for (let z = baseZ - depth / 2; z <= baseZ + depth / 2; z += 4) {
          const nx = Math.abs((x - centerX) / (width / 2));
          const nz = Math.abs((z - baseZ) / (depth / 2));
          const falloff = Math.max(0, 1 - Math.sqrt(nx * nx + nz * nz));
          const noise = seeded(x * 3.1 + z * 7.7 + seedOffset) * 6 - 2;
          const columnHeight = Math.max(3, Math.floor((peakHeight * falloff + noise) / 4) * 4);
          for (let y = 1; y < columnHeight; y += 4) {
            const isSnow = y > peakHeight * 0.63 && falloff > 0.35;
            block(mountain, isSnow ? material.snow : material.rock, x, y, z, 4, 4, 4);
          }
        }
      }
      world.add(mountain);
    }

    function createCloud(x, y, z, scale, speed) {
      const cloud = new THREE.Group();
      const chunks = [[0, 0, 0, 2.5, 1.4, 1.5], [2, 0.25, 0.1, 2.4, 1.8, 1.6], [-2, 0.15, 0.2, 2.1, 1.3, 1.4], [0.8, 1.05, 0, 1.5, 1, 1.1], [-0.7, 0.85, 0, 1.5, 0.9, 1.1]];
      const cloudMaterial = new THREE.MeshBasicMaterial({ color: '#f5fbf2', transparent: true, opacity: 0.9 });
      for (const [cx, cy, cz, width, height, depth] of chunks) block(cloud, cloudMaterial, cx * scale, cy * scale, cz * scale, width * scale, height * scale, depth * scale, { castShadow: false, receiveShadow: false });
      cloud.position.set(x, y, z);
      cloud.userData = { startX: x, speed, phase: seeded(x + y) * Math.PI * 2 };
      animated.clouds.push(cloud);
      scene.add(cloud);
    }

    function createRoof(parent, y, width, depth) {
      for (let layer = 0; layer < 3; layer += 1) {
        const inset = layer * 1.25;
        const roofWidth = width - inset * 2;
        const roofDepth = depth - inset * 2;
        const roofY = y + layer * 0.55;
        block(parent, material.roof, 0, roofY, -(roofDepth / 2), roofWidth, 0.65, 1.35);
        block(parent, material.roof, 0, roofY, roofDepth / 2, roofWidth, 0.65, 1.35);
        block(parent, material.roof, -(roofWidth / 2), roofY, 0, 1.35, 0.65, roofDepth);
        block(parent, material.roof, roofWidth / 2, roofY, 0, 1.35, 0.65, roofDepth);
      }
      const corners = [[-width / 2 - 0.55, -depth / 2 - 0.55], [width / 2 + 0.55, -depth / 2 - 0.55], [-width / 2 - 0.55, depth / 2 + 0.55], [width / 2 + 0.55, depth / 2 + 0.55]];
      for (const [x, z] of corners) block(parent, material.roof, x, y + 0.42, z, 2.2, 0.55, 1.1, { rotation: { z: x < 0 ? -0.22 : 0.22, x: z < 0 ? 0.08 : -0.08 } });
    }

    function createPagoda() {
      const pagoda = new THREE.Group();
      pagoda.position.set(5, 0, -5);
      block(pagoda, material.rock, 0, 0, 0, 21, 1.6, 21);
      block(pagoda, material.rock, 0, 1.2, 0, 17, 0.8, 17);

      const levels = [
        { base: 2.2, top: 7.1, width: 15, depth: 15, roof: 19 },
        { base: 8.25, top: 12.4, width: 11.5, depth: 11.5, roof: 15 },
        { base: 13.45, top: 17.1, width: 8, depth: 8, roof: 11 },
      ];
      for (const level of levels) {
        const halfWidth = level.width / 2 - 0.45;
        const halfDepth = level.depth / 2 - 0.45;
        for (const [x, z] of [[-halfWidth, -halfDepth], [halfWidth, -halfDepth], [-halfWidth, halfDepth], [halfWidth, halfDepth]]) {
          block(pagoda, material.wood, x, (level.base + level.top) / 2, z, 0.9, level.top - level.base, 0.9);
        }
        block(pagoda, material.woodWarm, 0, level.base + 0.22, 0, level.width, 0.55, level.depth);
        block(pagoda, material.wood, 0, level.top - 0.35, -halfDepth, level.width - 1.5, 0.7, 0.65);
        block(pagoda, material.shoji, 0, level.base + 2.15, -halfDepth - 0.04, level.width - 2.5, 2.65, 0.28);
        block(pagoda, material.shoji, -halfWidth - 0.04, level.base + 2.15, 0, 0.28, 2.65, level.depth - 2.5);
        block(pagoda, material.shoji, halfWidth + 0.04, level.base + 2.15, 0, 0.28, 2.65, level.depth - 2.5);
        createRoof(pagoda, level.top, level.roof, level.roof);
      }
      block(pagoda, material.gold, 0, 20.1, 0, 0.8, 5.7, 0.8);
      block(pagoda, material.gold, 0, 23, 0, 3, 0.45, 3);
      block(pagoda, material.gold, 0, 24, 0, 1.5, 1.8, 1.5);
      block(pagoda, material.gold, 0, 25.55, 0, 0.65, 1.8, 0.65);
      world.add(pagoda);
    }

    function createTorii() {
      const torii = new THREE.Group();
      torii.position.set(5, 0, 37);
      block(torii, material.rock, 0, 0, 0, 13, 1, 4);
      for (const x of [-5.1, 5.1]) {
        block(torii, material.red, x, 5.2, 0, 1.25, 10.4, 1.25);
        block(torii, material.black, x, 8.5, 0, 1.45, 0.4, 1.45);
      }
      block(torii, material.red, 0, 9.2, 0, 14.8, 1.25, 1.5);
      block(torii, material.red, 0, 8.1, 0, 11.6, 1.1, 1.05);
      block(torii, material.gold, 0, 7.2, 0, 1.2, 1.1, 1.3);
      world.add(torii);
    }

    function createBridge() {
      const bridge = new THREE.Group();
      const startX = -39;
      const segments = 17;
      for (let index = 0; index < segments; index += 1) {
        const progress = index / (segments - 1);
        const x = startX + progress * 30;
        const y = 1 + Math.sin(progress * Math.PI) * 3.4;
        const tangent = Math.cos(progress * Math.PI) * 0.34;
        block(bridge, material.red, x, y, 4, 2.05, 0.6, 4.8, { rotation: { z: -tangent } });
        if (index % 2 === 0) {
          for (const z of [1.85, 6.15]) block(bridge, material.red, x, y + 1.7, z, 0.38, 3, 0.38);
          block(bridge, material.red, x, y + 3.1, 1.85, 2.1, 0.34, 0.34, { rotation: { z: -tangent } });
          block(bridge, material.red, x, y + 3.1, 6.15, 2.1, 0.34, 0.34, { rotation: { z: -tangent } });
        }
      }
      world.add(bridge);
    }

    function createStonePath() {
      const path = [[5, 31], [5, 27], [4.5, 23], [5, 19], [4.5, 15], [5, 11], [5, 7], [5, 3]];
      for (const [x, z] of path) {
        block(world, material.rock, x, -0.38, z, 2.4, 0.3, 2.4);
        block(world, material.rock, x + 0.65, -0.24, z - 0.25, 0.7, 0.18, 0.7);
      }
    }

    function createLantern(x, z, height = 3.5) {
      const lantern = new THREE.Group();
      lantern.position.set(x, 0, z);
      block(lantern, material.rock, 0, 0, 0, 2, 0.75, 2);
      block(lantern, material.rock, 0, 1.25, 0, 0.85, 2.1, 0.85);
      block(lantern, material.shoji, 0, height - 1.2, 0, 1.6, 1.5, 1.6);
      block(lantern, material.roof, 0, height - 0.25, 0, 2.4, 0.6, 2.4);
      const light = new THREE.PointLight('#ffbd66', 1.1, 22, 2);
      light.position.set(0, height - 0.85, 0);
      light.castShadow = true;
      light.shadow.mapSize.set(256, 256);
      lantern.add(light);
      lantern.userData.light = light;
      animated.lanterns.push(lantern);
      world.add(lantern);
    }

    function createBamboo(x, z, height, scale = 1) {
      const bamboo = new THREE.Group();
      bamboo.position.set(x, 0, z);
      const segmentCount = Math.floor(height / 2);
      for (let index = 0; index < segmentCount; index += 1) {
        block(bamboo, material.bamboo, 0, index * 2, 0, 0.72 * scale, 1.9, 0.72 * scale);
        if (index > 1 && index % 2 === 0) {
          const side = index % 4 === 0 ? -1 : 1;
          block(bamboo, material.leaf, side * 1.1 * scale, index * 2 + 0.3, 0, 1.9 * scale, 0.42 * scale, 0.7 * scale, { rotation: { z: side * 0.35 } });
          block(bamboo, material.leaf, 0, index * 2 + 0.55, 1.05 * scale, 0.7 * scale, 0.42 * scale, 1.9 * scale, { rotation: { x: 0.35 } });
        }
      }
      world.add(bamboo);
    }

    function createSakura(x, z, scale = 1) {
      const tree = new THREE.Group();
      tree.position.set(x, 0, z);
      block(tree, material.woodWarm, 0, 3 * scale, 0, 1.3 * scale, 6 * scale, 1.3 * scale);
      const branches = [[1.8, 5.3, 0, 3.5, 0.8, 0.8, 0.4], [-1.7, 5, 0.2, 3.3, 0.75, 0.75, -0.42], [0, 6.1, 1.6, 0.75, 0.75, 3.1, 0.35]];
      for (const [bx, by, bz, width, height, depth, angle] of branches) block(tree, material.woodWarm, bx * scale, by * scale, bz * scale, width * scale, height * scale, depth * scale, { rotation: { z: angle } });
      const canopy = [[0, 7.5, 0, 5.8], [2.3, 6.8, 0, 3.6], [-2.2, 6.9, 0.5, 3.8], [0, 7, 2.2, 3.7], [0.6, 9.1, 0, 3.1]];
      for (const [cx, cy, cz, size] of canopy) block(tree, material.blossom, cx * scale, cy * scale, cz * scale, size * scale, 2.4 * scale, size * scale);
      world.add(tree);
      for (let index = 0; index < 24; index += 1) {
        const petal = block(world, material.blossom, x + (seeded(index * 33) - 0.5) * 8 * scale, seeded(index * 19) * 7 * scale + 1.5, z + (seeded(index * 17) - 0.5) * 8 * scale, 0.22, 0.12, 0.22, { castShadow: false });
        petal.userData = { homeX: x, homeZ: z, phase: index * 0.63, scale };
        animated.petals.push(petal);
      }
    }

    function createBush(x, z, scale = 1) {
      const bush = new THREE.Group();
      bush.position.set(x, 0, z);
      for (const [bx, by, bz, size] of [[0, 1.2, 0, 2.4], [1.35, 1, 0.2, 1.7], [-1.2, 1, -0.1, 1.7]]) block(bush, material.leaf, bx * scale, by * scale, bz * scale, size * scale, size * 0.8 * scale, size * scale);
      world.add(bush);
    }

    function createSamurai(x, z, facing = 0) {
      const warrior = new THREE.Group();
      warrior.position.set(x, 0, z);
      warrior.rotation.y = facing;
      const lower = new THREE.Group();
      const upper = new THREE.Group();
      warrior.add(lower, upper);
      for (const legX of [-0.3, 0.3]) {
        for (let y = 0.25; y < 1.35; y += 0.25) micro(lower, material.armor, legX, y, 0);
        micro(lower, material.black, legX, 0.15, 0.13);
      }
      for (let xIndex = -2; xIndex <= 2; xIndex += 1) {
        for (let yIndex = 0; yIndex < 5; yIndex += 1) {
          for (let zIndex = -1; zIndex <= 1; zIndex += 1) micro(upper, material.armor, xIndex * 0.25, 1.45 + yIndex * 0.25, zIndex * 0.25);
        }
      }
      for (const shoulderX of [-0.9, 0.9]) {
        for (let plate = 0; plate < 3; plate += 1) micro(upper, material.armor, shoulderX, 2.1 - plate * 0.22, 0);
      }
      for (const headX of [-0.25, 0, 0.25]) {
        for (const headY of [2.7, 2.95]) micro(upper, material.skin, headX, headY, -0.03);
      }
      for (let xIndex = -2; xIndex <= 2; xIndex += 1) {
        for (let zIndex = -1; zIndex <= 1; zIndex += 1) micro(upper, material.black, xIndex * 0.25, 3.16, zIndex * 0.25);
      }
      micro(upper, material.gold, -0.28, 3.48, 0);
      micro(upper, material.gold, 0, 3.67, 0);
      micro(upper, material.gold, 0.28, 3.48, 0);
      for (let swordY = 1.1; swordY < 2.25; swordY += 0.25) micro(warrior, material.black, 0.78, swordY, 0.2);
      micro(warrior, material.gold, 0.78, 2.35, 0.2);
      warrior.userData = { upper, phase: seeded(x * 9 + z) * Math.PI * 2 };
      animated.samurai.push(warrior);
      world.add(warrior);
    }

    function createSheep(x, z) {
      const sheep = new THREE.Group();
      const body = new THREE.Group();
      sheep.add(body);
      for (let ix = -3; ix <= 3; ix += 1) {
        for (let iy = 0; iy <= 3; iy += 1) {
          for (let iz = -2; iz <= 2; iz += 1) {
            if (Math.abs(ix) === 3 && Math.abs(iz) === 2 && iy > 1) continue;
            micro(body, material.wool, ix * 0.25, 1.05 + iy * 0.25, iz * 0.25);
          }
        }
      }
      for (const legX of [-0.55, 0.55]) for (const legZ of [-0.3, 0.3]) for (const legY of [0.2, 0.45, 0.7]) micro(sheep, material.black, legX, legY, legZ);
      for (const [hx, hy, hz] of [[1, 1.65, 0], [1.25, 1.65, 0], [1.25, 1.9, 0]]) micro(sheep, material.wool, hx, hy, hz);
      micro(sheep, material.black, 1.42, 1.73, -0.12);
      sheep.position.set(x, 0, z);
      sheep.userData = { body, home: new THREE.Vector2(x, z), phase: seeded(x * 3 + z), speed: 0.18 };
      animated.animals.push(sheep);
      world.add(sheep);
    }

    function createAlpaca(x, z) {
      const alpaca = new THREE.Group();
      const body = new THREE.Group();
      alpaca.add(body);
      for (let ix = -3; ix <= 3; ix += 1) for (let iy = 0; iy <= 3; iy += 1) for (let iz = -2; iz <= 2; iz += 1) micro(body, material.alpaca, ix * 0.25, 0.95 + iy * 0.25, iz * 0.25);
      for (const legX of [-0.55, 0.55]) for (const legZ of [-0.3, 0.3]) for (const legY of [0.2, 0.45, 0.7]) micro(alpaca, material.alpaca, legX, legY, legZ);
      for (let y = 1.5; y < 2.8; y += 0.25) micro(alpaca, material.alpaca, 0.72, y, 0);
      for (const px of [0.55, 0.8, 1.05]) micro(alpaca, material.alpaca, px, 2.78, 0);
      micro(alpaca, material.black, 1.15, 2.7, -0.13);
      for (const earZ of [-0.18, 0.18]) micro(alpaca, material.alpaca, 0.72, 3.12, earZ);
      alpaca.position.set(x, 0, z);
      alpaca.userData = { body, home: new THREE.Vector2(x, z), phase: seeded(x * 3 + z), speed: 0.15 };
      animated.animals.push(alpaca);
      world.add(alpaca);
    }

    function createBird(index) {
      const bird = new THREE.Group();
      block(bird, material.black, 0, 0, 0, 0.55, 0.22, 0.36, { castShadow: false });
      const leftWing = block(bird, material.black, -0.5, 0, 0, 0.7, 0.1, 0.25, { castShadow: false });
      const rightWing = block(bird, material.black, 0.5, 0, 0, 0.7, 0.1, 0.25, { castShadow: false });
      bird.userData = { leftWing, rightWing, phase: index * 0.65, radius: 31 + (index % 4) * 4, height: 24 + (index % 5) * 2.2 };
      animated.birds.push(bird);
      scene.add(bird);
    }

    const ambientLight = new THREE.HemisphereLight('#d7edff', '#49653e', 2.1);
    scene.add(ambientLight);
    const sun = new THREE.DirectionalLight('#fff1c4', 3.2);
    sun.position.set(-45, 65, 30);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -75;
    sun.shadow.camera.right = 75;
    sun.shadow.camera.top = 75;
    sun.shadow.camera.bottom = -75;
    sun.shadow.bias = -0.00025;
    scene.add(sun);
    scene.add(sun.target);
    sun.target.position.set(0, 0, 0);

    const celestial = new THREE.Mesh(new THREE.BoxGeometry(9, 9, 0.8), new THREE.MeshBasicMaterial({ color: '#fff2b8' }));
    celestial.position.set(-43, 42, -76);
    scene.add(celestial);

    addGround();
    createMountain(-42, -76, 42, 56, 32, 7);
    createMountain(7, -83, 61, 64, 34, 15);
    createMountain(53, -75, 38, 48, 29, 25);
    createCloud(-52, 34, -53, 2.1, 1.2);
    createCloud(27, 42, -65, 1.65, 0.76);
    createCloud(67, 30, -41, 1.4, 0.92);
    createPagoda();
    createTorii();
    createBridge();
    createStonePath();
    createLantern(14, 11);
    createLantern(-4, 14);
    createLantern(13, 30);
    createLantern(-13, 29);
    for (const [x, z, height, scale] of [[-58, 10, 13, 1], [-54, 7, 17, 1.12], [-49, 10, 11, 0.84], [-60, 1, 15, 1.05], [-48, 0, 14, 0.94], [48, -2, 14, 1], [53, 2, 18, 1.1], [58, -5, 12, 0.9]]) createBamboo(x, z, height, scale);
    createSakura(30, -1, 1.2);
    createSakura(26, 23, 0.9);
    for (const [x, z, scale] of [[37, 7, 1], [41, 18, 0.9], [-44, 24, 1.1], [18, 22, 0.85], [30, 16, 0.85]]) createBush(x, z, scale);
    createSamurai(-5.5, 8.7, 0.2);
    createSamurai(15.5, 8.7, -0.2);
    createSheep(39, 28);
    createSheep(49, 18);
    createSheep(33, 15);
    createAlpaca(47, 29);
    createAlpaca(37, 20);
    for (let index = 0; index < 10; index += 1) createBird(index);

    const modes = {
      morning: { background: '#a8c9d5', fog: '#a8c9d5', sky: '#fff2b8', sun: '#fff1c4', sunIntensity: 3.2, ambientSky: '#d7edff', ambientGround: '#49653e', ambientIntensity: 2.1, celestial: [-43, 42, -76], lantern: 1.1, shoji: 0.55, description: 'Morning light rests over the pagoda.' },
      sunset: { background: '#d68668', fog: '#d68668', sky: '#ffd0a1', sun: '#ffae73', sunIntensity: 2.35, ambientSky: '#f0a479', ambientGround: '#394a35', ambientIntensity: 1.48, celestial: [49, 28, -74], lantern: 2.3, shoji: 1.25, description: 'The valley turns copper as the sun sinks.' },
      night: { background: '#102541', fog: '#102541', sky: '#d8e5ff', sun: '#9fb9ff', sunIntensity: 0.4, ambientSky: '#526b9d', ambientGround: '#1a3029', ambientIntensity: 0.7, celestial: [38, 39, -76], lantern: 5.1, shoji: 2.7, description: 'Lanterns guide the path beneath a square moon.' },
    };
    let activeMode = 'morning';

    function setMode(modeName) {
      activeMode = modeName;
      const mode = modes[modeName];
      scene.background.set(mode.background);
      scene.fog.color.set(mode.fog);
      sun.color.set(mode.sun);
      sun.intensity = mode.sunIntensity;
      ambientLight.color.set(mode.ambientSky);
      ambientLight.groundColor.set(mode.ambientGround);
      ambientLight.intensity = mode.ambientIntensity;
      celestial.material.color.set(mode.sky);
      celestial.position.set(...mode.celestial);
      material.shoji.emissiveIntensity = mode.shoji;
      for (const lantern of animated.lanterns) lantern.userData.light.intensity = mode.lantern;
      document.querySelector('#mode-description').textContent = mode.description;
      document.querySelectorAll('[data-time]').forEach((button) => {
        const selected = button.dataset.time === modeName;
        button.classList.toggle('is-active', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
    }

    const viewpoints = {
      pagoda: { position: new THREE.Vector3(34, 24, 54), target: new THREE.Vector3(5, 9, -5) },
      samurai: { position: new THREE.Vector3(13, 8.5, 26), target: new THREE.Vector3(5, 2.1, 8) },
      meadow: { position: new THREE.Vector3(63, 16, 46), target: new THREE.Vector3(41, 2, 21) },
      mountains: { position: new THREE.Vector3(6, 30, 66), target: new THREE.Vector3(4, 22, -64) },
      aerial: { position: new THREE.Vector3(48, 74, 58), target: new THREE.Vector3(4, 0, 2) },
    };
    let cameraMove = null;

    function selectViewpoint(name) {
      const viewpoint = viewpoints[name];
      cameraMove = { startPosition: camera.position.clone(), startTarget: controls.target.clone(), endPosition: viewpoint.position, endTarget: viewpoint.target, startTime: performance.now() };
      document.querySelectorAll('[data-preset]').forEach((button) => button.classList.toggle('is-active', button.dataset.preset === name));
    }

    document.querySelectorAll('[data-time]').forEach((button) => button.addEventListener('click', () => setMode(button.dataset.time)));
    document.querySelectorAll('[data-preset]').forEach((button) => button.addEventListener('click', () => selectViewpoint(button.dataset.preset)));
    document.querySelector('#help-button').addEventListener('click', () => document.querySelector('#help-panel').classList.remove('hidden'));
    document.querySelector('#close-help').addEventListener('click', () => document.querySelector('#help-panel').classList.add('hidden'));

    let audioContext;
    let windGain;
    let audioEnabled = false;
    function startWind() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 2, audioContext.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let index = 0; index < output.length; index += 1) output[index] = (Math.random() * 2 - 1) * 0.5;
      const wind = audioContext.createBufferSource();
      wind.buffer = noiseBuffer;
      wind.loop = true;
      const filter = audioContext.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 420;
      windGain = audioContext.createGain();
      windGain.gain.value = 0.026;
      wind.connect(filter).connect(windGain).connect(audioContext.destination);
      wind.start();
      scheduleChime();
    }

    function ringChime() {
      if (!audioEnabled || !audioContext) return;
      const now = audioContext.currentTime;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.value = [523.25, 659.25, 783.99, 1046.5][Math.floor(Math.random() * 4)];
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.075, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 3);
    }

    function scheduleChime() {
      if (!audioEnabled) return;
      window.setTimeout(() => { ringChime(); scheduleChime(); }, 6500 + Math.random() * 9000);
    }

    document.querySelector('#audio-button').addEventListener('click', async () => {
      const button = document.querySelector('#audio-button');
      if (!audioContext) startWind();
      if (audioContext.state === 'suspended') await audioContext.resume();
      audioEnabled = !audioEnabled;
      windGain.gain.setTargetAtTime(audioEnabled ? 0.026 : 0.0001, audioContext.currentTime, 0.1);
      button.classList.toggle('bg-[#d15b43]', audioEnabled);
      button.setAttribute('aria-label', audioEnabled ? 'Mute ambient sound' : 'Enable ambient sound');
      button.title = audioEnabled ? 'Mute ambient wind and wind chimes' : 'Enable ambient wind and wind chimes';
      button.innerHTML = `<i data-lucide="${audioEnabled ? 'volume-2' : 'volume-x'}" class="h-[18px] w-[18px]"></i>`;
      window.lucide.createIcons();
      if (audioEnabled) { ringChime(); scheduleChime(); }
    });

    function animate(timestamp) {
      const time = timestamp * 0.001;
      for (const cloud of animated.clouds) {
        cloud.position.x = cloud.userData.startX + Math.sin(time * cloud.userData.speed + cloud.userData.phase) * 22;
      }
      for (let index = 0; index < animated.birds.length; index += 1) {
        const bird = animated.birds[index];
        const phase = time * 0.35 + bird.userData.phase;
        bird.position.set(Math.cos(phase) * bird.userData.radius - 3, bird.userData.height + Math.sin(phase * 1.9) * 2.1, -38 + Math.sin(phase) * 13);
        bird.rotation.y = -phase + Math.PI * 0.5;
        const flap = Math.sin(time * 8 + bird.userData.phase) * 0.65;
        bird.userData.leftWing.rotation.z = flap;
        bird.userData.rightWing.rotation.z = -flap;
      }
      for (const warrior of animated.samurai) {
        warrior.userData.upper.position.y = Math.sin(time * 1.75 + warrior.userData.phase) * 0.06;
      }
      for (const animal of animated.animals) {
        const phase = time * animal.userData.speed + animal.userData.phase * Math.PI * 2;
        const nextX = animal.userData.home.x + Math.sin(phase) * 4.3;
        const nextZ = animal.userData.home.y + Math.cos(phase * 0.83) * 3.1;
        animal.position.x = nextX;
        animal.position.z = nextZ;
        animal.rotation.y = Math.atan2(Math.cos(phase), -Math.sin(phase));
        animal.userData.body.position.y = Math.abs(Math.sin(time * 2.2 + animal.userData.phase * 8)) * 0.13;
        animal.rotation.z = Math.sin(time * 0.8 + animal.userData.phase) * 0.03;
      }
      for (const petal of animated.petals) {
        const data = petal.userData;
        petal.position.y -= 0.012 + Math.sin(time + data.phase) * 0.002;
        petal.position.x += Math.sin(time * 1.2 + data.phase) * 0.008;
        petal.rotation.y += 0.07;
        if (petal.position.y < -0.5) {
          petal.position.y = 7.5 * data.scale + seeded(time * 10 + data.phase) * 2;
          petal.position.x = data.homeX + (seeded(time * 15 + data.phase) - 0.5) * 7 * data.scale;
          petal.position.z = data.homeZ + (seeded(time * 19 + data.phase) - 0.5) * 7 * data.scale;
        }
      }
      for (const lantern of animated.lanterns) {
        const glow = activeMode === 'night' ? 0.82 + Math.sin(time * 5 + lantern.position.x) * 0.18 : 1;
        lantern.userData.light.intensity = modes[activeMode].lantern * glow;
      }
      if (cameraMove) {
        const elapsed = Math.min(1, (timestamp - cameraMove.startTime) / 1050);
        const eased = 1 - Math.pow(1 - elapsed, 3);
        camera.position.lerpVectors(cameraMove.startPosition, cameraMove.endPosition, eased);
        controls.target.lerpVectors(cameraMove.startTarget, cameraMove.endTarget, eased);
        if (elapsed === 1) cameraMove = null;
      }
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.lucide.createIcons();
    setMode('morning');
    requestAnimationFrame(animate);
    window.setTimeout(() => document.querySelector('#loader').classList.add('loaded'), 450);
  </script>
</body>
