<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zen Sanctuary</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1e;font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif}
  #scene canvas{display:block}
  .btn{padding:.35rem .8rem;border-radius:9999px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
       color:rgba(255,255,255,.85);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
       transition:all .25s;cursor:pointer;white-space:nowrap;backdrop-filter:blur(4px)}
  .btn:hover{background:rgba(255,255,255,.22);color:#fff}
  .btn.active{background:rgba(255,205,120,.28);border-color:rgba(255,205,120,.55);color:#ffe9b8;box-shadow:0 0 18px rgba(255,190,110,.25)}
  .glass{border-radius:1rem;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.09);
         backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,0,.35)}
  .spinner{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#ffd98c;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="scene" class="fixed inset-0"></div>

<!-- ===================== UI OVERLAY ===================== -->
<div class="fixed inset-0 pointer-events-none select-none z-10 text-white">

  <!-- Title card -->
  <div class="glass pointer-events-auto absolute top-4 left-4 px-5 py-4 max-w-[300px]">
    <div class="text-[10px] uppercase tracking-[0.35em] text-amber-200/80">Voxel Japan · Three.js</div>
    <h1 class="mt-1 text-xl font-semibold tracking-wide" style="font-family:Georgia,serif">Zen Sanctuary <span class="text-amber-200/90">禅の聖域</span></h1>
    <p class="mt-1.5 text-[11px] leading-relaxed text-white/60">
      Pagoda, torii &amp; koi pond beneath snow-capped peaks.<br>
      <span id="voxCount" class="text-amber-200/70">…</span> voxels assembled.
    </p>
  </div>

  <!-- Top-right toggles -->
  <div class="pointer-events-auto absolute top-4 right-4 flex flex-col items-end gap-2">
    <button id="audioBtn" class="btn pulse">🔇 Enable Sound</button>
    <button id="orbitBtn" class="btn">✦ Auto Orbit</button>
  </div>

  <!-- Hint -->
  <div class="absolute bottom-4 left-4 text-[10px] tracking-widest text-white/40 uppercase hidden sm:block">
    Drag orbit · Scroll zoom · Right-drag pan
  </div>

  <!-- Bottom control bar -->
  <div class="pointer-events-auto absolute bottom-4 left-1/2 -translate-x-1/2 glass px-3 py-2
              flex flex-wrap justify-center items-center gap-1.5 max-w-[94vw]">
    <span class="text-[10px] uppercase tracking-[0.25em] text-white/45 pr-1">Time</span>
    <button class="btn mode-btn active" data-mode="morning">☀ Morning</button>
    <button class="btn mode-btn" data-mode="sunset">🌇 Sunset</button>
    <button class="btn mode-btn" data-mode="night">🌙 Night</button>
    <span class="w-px h-5 bg-white/20 mx-1"></span>
    <span class="text-[10px] uppercase tracking-[0.25em] text-white/45 pr-1">Views</span>
    <button class="btn view-btn active" data-view="pagoda">Pagoda</button>
    <button class="btn view-btn" data-view="samurai">Samurai</button>
    <button class="btn view-btn" data-view="meadow">Meadow</button>
    <button class="btn view-btn" data-view="vista">Vista</button>
    <button class="btn view-btn" data-view="aerial">Aerial</button>
  </div>
</div>

<!-- ===================== LOADER ===================== -->
<div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-5 bg-[#0b0f1e] transition-opacity duration-700">
  <div class="spinner"></div>
  <div class="text-white/80 text-sm tracking-[0.3em] uppercase">Raising mountains · Planting sakura…</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- SECTION A · RENDERER / SCENE / CAMERA ----------
const G = 4; // sanctuary ground top (y)
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('scene').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe8f2, 130, 380);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1500);
camera.position.set(30, 16, 52);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 18, 2);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = 1.5;
controls.minDistance = 6;
controls.maxDistance = 230;
controls.autoRotateSpeed = 0.7;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- SECTION B · 16×16 PROCEDURAL TEXTURES + MATERIALS ----------
function rng(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
let _seed = 7;
function tex(painter){
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const g = c.getContext('2d'); painter(g, rng(_seed += 1013));
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestMipmapLinearFilter; // blocky up close, calm far away
  t.generateMipmaps = true;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const speckle = (colors) => (g, R) => {
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++){
    g.fillStyle = colors[(R() * colors.length) | 0]; g.fillRect(x, y, 1, 1);
  }
};
function woodTex(dark, mid, light){
  return tex((g, R) => {
    g.fillStyle = mid; g.fillRect(0, 0, 16, 16);
    for (let x = 0; x < 16; x++){
      const r = R();
      if (r < .3){ g.fillStyle = dark; g.fillRect(x, 0, 1, 16); }
      else if (r < .55){ g.fillStyle = light; g.fillRect(x, 0, 1, 16); }
    }
    for (let i = 0; i < 5; i++){ g.fillStyle = dark; g.fillRect((R()*16)|0, (R()*16)|0, 1, 2 + ((R()*3)|0)); }
  });
}
function roofTex(a, b, c){
  return tex((g, R) => {
    speckle([a, b, b, c])(g, R);
    for (let y = 0; y < 16; y += 3){ g.fillStyle = b; g.fillRect(0, y, 16, 1); }
  });
}

const T = {};
T.grass     = tex(speckle(['#69a846','#5d9a3c','#74b551','#559035','#7cbf58']));
T.dirt      = tex(speckle(['#8a6a45','#7d5e3c','#96744e','#6f5334']));
T.grassSide = tex((g, R) => {
  speckle(['#8a6a45','#7d5e3c','#96744e','#6f5334'])(g, R);
  for (let y = 0; y < 4; y++) for (let x = 0; x < 16; x++){
    g.fillStyle = ['#69a846','#5d9a3c','#74b551','#559035'][(R()*4)|0]; g.fillRect(x, y, 1, 1);
  }
  for (let x = 0; x < 16; x++) if (R() < .5){ g.fillStyle = ['#69a846','#5d9a3c'][(R()*2)|0]; g.fillRect(x, 4, 1, 1); }
});
T.stone     = tex(speckle(['#8f9096','#84858c','#9a9ba1','#787a80']));
T.stoneDark = tex(speckle(['#6c6e76','#616369','#75777f','#5a5c63']));
T.sand      = tex(speckle(['#d9c992','#cfc087','#e2d49f']));
T.snow      = tex(speckle(['#f7fafe','#eef3fa','#ffffff','#e6edf6']));
T.wood      = woodTex('#543a24','#6b4a2f','#7d5838');
T.woodDark  = woodTex('#3d2a1a','#4a3320','#573d26');
T.red       = woodTex('#a83224','#c23b2a','#d44a35');
T.roof      = roofTex('#2e3440','#252a34','#3a4150');
T.gold      = tex(speckle(['#d9a63c','#d9a63c','#f4cf5e','#b3822a','#ffe9a1']));
T.shoji     = tex((g, R) => {
  speckle(['#f7ecd2','#f2e4c4','#fdf6e0','#efe0be'])(g, R);
  g.fillStyle = '#6b4a2f';
  g.fillRect(0,0,16,1); g.fillRect(0,15,16,1); g.fillRect(0,0,1,16); g.fillRect(15,0,1,16);
  g.fillRect(7,1,1,14); g.fillRect(1,7,14,1);
});
T.paper     = tex((g, R) => {
  speckle(['#ffdf9e','#ffd285','#ffe9b8'])(g, R);
  g.fillStyle = '#5a4030'; g.fillRect(0,0,16,2); g.fillRect(0,14,16,2);
  g.fillStyle = 'rgba(90,64,48,0.35)'; for (let x = 2; x < 16; x += 4) g.fillRect(x, 2, 1, 12);
});
T.bamboo    = tex((g, R) => {
  speckle(['#57a34a','#4a8f3e','#66b356','#3f7d34'])(g, R);
  g.fillStyle = '#2f6627'; g.fillRect(0,5,16,1); g.fillRect(0,11,16,1);
});
T.leaf      = tex(speckle(['#4c8f37','#417f2f','#57a03f','#3a7229']));
T.blossom   = tex(speckle(['#f6c6dd','#f3b7d4','#fbe0ec','#eda9cc','#fdeff5']));
T.trunk     = woodTex('#5b402c','#6e4f38','#7d5c42');
T.wool      = tex(speckle(['#f5f5f2','#e9e9e6','#fdfdfb','#dcdcd8']));
T.cream     = tex(speckle(['#e7d7b4','#dfcda6','#efe1c2']));
T.dark      = tex(speckle(['#3a3d46','#31343c','#43464f']));
T.armor     = tex(speckle(['#2e3d63','#273554','#354672','#212c47']));
T.armorDark = tex(speckle(['#232a3d','#1d2333','#2a3247']));
T.skin      = tex(speckle(['#e8b48c','#dfaa82','#f0bf97']));
T.silver    = tex(speckle(['#c9d1da','#bdc5cf','#d6dde4']));
T.cloud     = tex(speckle(['#ffffff','#f3f6fb','#eef2f8']));
T.water     = tex((g, R) => {
  speckle(['#3f8fd2','#3a88c9','#4898dc'])(g, R);
  g.fillStyle = '#63a9e4';
  for (let i = 0; i < 6; i++){ g.fillRect((R()*12)|0, (R()*16)|0, 3 + ((R()*3)|0), 1); }
});
T.path      = tex((g, R) => {
  speckle(['#8d8d93','#84848a','#97979d','#7a7a80'])(g, R);
  g.fillStyle = '#5e5e64';
  g.fillRect(0,0,16,1); g.fillRect(0,15,16,1); g.fillRect(0,0,1,16); g.fillRect(15,0,1,16);
});

const M = {};
const lam = (o) => new THREE.MeshLambertMaterial(o);
// grass block = 6-face material array [px,nx,py,ny,pz,nz]
M.grass = [lam({map:T.grassSide}), lam({map:T.grassSide}), lam({map:T.grass}),
           lam({map:T.dirt}), lam({map:T.grassSide}), lam({map:T.grassSide})];
M.dirt      = lam({map:T.dirt});       M.stone     = lam({map:T.stone});
M.stoneDark = lam({map:T.stoneDark});  M.sand      = lam({map:T.sand});
M.snow      = lam({map:T.snow});       M.wood      = lam({map:T.wood});
M.woodDark  = lam({map:T.woodDark});   M.red       = lam({map:T.red});
M.roof      = lam({map:T.roof});
M.gold      = lam({map:T.gold, emissive:0xffb84d, emissiveMap:T.gold, emissiveIntensity:0.25});
M.shoji     = lam({map:T.shoji, emissive:0xffd9a0, emissiveMap:T.shoji, emissiveIntensity:0.25});
M.paper     = lam({map:T.paper, emissive:0xffb45e, emissiveMap:T.paper, emissiveIntensity:0.5});
M.bamboo    = lam({map:T.bamboo});     M.leaf      = lam({map:T.leaf});
M.trunk     = lam({map:T.trunk});
M.blossom   = lam({map:T.blossom, emissive:0xff9ec4, emissiveIntensity:0.06});
M.wool      = lam({map:T.wool});       M.cream     = lam({map:T.cream});
M.dark      = lam({map:T.dark});       M.armor     = lam({map:T.armor});
M.armorDark = lam({map:T.armorDark});  M.skin      = lam({map:T.skin});
M.silver    = lam({map:T.silver});     M.cloud     = lam({map:T.cloud});
M.water     = lam({map:T.water, transparent:true, opacity:0.72, depthWrite:false});
M.path      = lam({map:T.path});
M.petal     = lam({color:0xf7b6d2, emissive:0xd06a9a, emissiveIntensity:0.15});
M.bird      = lam({color:0x35383f});
M.glowGold  = lam({color:0xe8b13a, emissive:0xffaa33, emissiveIntensity:0.4});
// ---------- SECTION C · VOXEL BATCHING (InstancedMesh) ----------
const lanternLights = [];
const VOX = new Map();
function V(matKey, x, y, z, sx = 1, sy, sz, rx = 0, ry = 0, rz = 0){
  sy = sy ?? sx; sz = sz ?? sx;
  let b = VOX.get(matKey);
  if (!b){ b = { mat: M[matKey], list: [] }; VOX.set(matKey, b); }
  b.list.push([x, y, z, sx, sy, sz, rx, ry, rz]);
}
function buildVoxels(){
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const dummy = new THREE.Object3D();
  let total = 0;
  for (const [key, b] of VOX){
    const m = new THREE.InstancedMesh(geo, b.mat, b.list.length);
    b.list.forEach((v, i) => {
      dummy.position.set(v[0], v[1], v[2]);
      dummy.scale.set(v[3], v[4], v[5]);
      dummy.rotation.set(v[6], v[7], v[8]);
      dummy.updateMatrix();
      m.setMatrixAt(i, dummy.matrix);
    });
    m.castShadow = key !== 'water';
    m.receiveShadow = key !== 'water';
    m.frustumCulled = false;
    if (key === 'water') m.renderOrder = 2;
    scene.add(m);
    total += b.list.length;
  }
  return total;
}

// ---------- SECTION D · TERRAIN (4×4 voxels, heightmap mountains) ----------
const TS = 4, HALF = 26; // grid columns -26..25 → world ±104
const PEAKS = [
  { x: 92, z: -58, h: 9, s: 26 }, { x: -78, z: 66, h: 8, s: 24 },
  { x: -72, z: -72, h: 11, s: 23 }, { x: 78, z: 84, h: 8, s: 25 },
  { x: 6, z: -104, h: 10, s: 20 }, { x: -104, z: 4, h: 8, s: 19 }, { x: 104, z: -6, h: 8, s: 19 },
];
function smoothstep(a, b, x){ x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); }
function hash2(x, y){ const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123; return n - Math.floor(n); }
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => vnoise(x, y) * 0.55 + vnoise(x * 2.1, y * 2.1) * 0.28 + vnoise(x * 4.3, y * 4.3) * 0.17;

function colHeight(gx, gz){
  const wx = gx * TS, wz = gz * TS, r = Math.hypot(wx, wz);
  if (r < 52) return 1; // flat sanctuary floor
  const t = smoothstep(50, 120, r);
  let base = t * t * (11 + fbm(gx * 0.13, gz * 0.13) * 9);
  const c = Math.max(Math.abs(wx), Math.abs(wz)) / (HALF * TS);
  base += c * c * 5;
  for (const p of PEAKS){
    const d2 = ((wx - p.x) ** 2 + (wz - p.z) ** 2) / (2 * p.s * p.s);
    base += p.h * Math.exp(-d2);
  }
  return 1 + Math.min(26, Math.max(1, Math.round(base + fbm(gx * 0.3 + 9, gz * 0.3 + 4) * 2.4)));
}
function hAt(gx, gz){ return (gx < -HALF || gx >= HALF || gz < -HALF || gz >= HALF) ? 1 : colHeight(gx, gz); }
const inPond = (wx, wz) => ((wx + 30) / 17) ** 2 + ((wz + 5) / 12) ** 2 < 1;

function stonePath(pts){
  for (let s = 0; s < pts.length - 1; s++){
    const [x0, z0] = pts[s], [x1, z1] = pts[s + 1];
    const len = Math.hypot(x1 - x0, z1 - z0), n = Math.max(1, Math.round(len / 2.6));
    for (let i = 0; i <= n; i++){
      const R = Math.random;
      const x = x0 + (x1 - x0) * i / n + (R() - 0.5) * 0.5, z = z0 + (z1 - z0) * i / n + (R() - 0.5) * 0.5;
      if (inPond(x, z)) continue;
      V('path', x, G + 0.18, z, 1.8, 0.36, 1.8, 0, (R() - 0.5) * 0.7);
    }
  }
}

(function terrain(){
  for (let gx = -HALF; gx < HALF; gx++) for (let gz = -HALF; gz < HALF; gz++){
    const h = colHeight(gx, gz), wx = gx * TS, wz = gz * TS;
    const minN = Math.min(hAt(gx + 1, gz), hAt(gx - 1, gz), hAt(gx, gz + 1), hAt(gx, gz - 1));
    if (h === 1 && inPond(wx, wz)){ // carved pond: dirt bed + sand + water slab
      V('dirt', wx, 0.6, wz, TS, 2.0, TS);
      V('sand', wx, 1.35, wz, TS, 0.5, TS);
      V('water', wx, 2.55, wz, TS, 1.9, TS);
      continue;
    }
    if (h === 1){ V('grass', wx, 2, wz, TS, TS, TS); continue; }
    const snowy = h * TS >= 52;
    const rock = hash2(gx, gz) < 0.5 ? 'stone' : 'stoneDark';
    if (snowy){
      V('snow', wx, (h - 1) * TS + TS / 2, wz, TS, TS, TS);
      if (h >= 17) V('snow', wx, (h - 2) * TS + TS / 2, wz, TS, TS, TS);
      else V(rock, wx, (h - 2) * TS + TS / 2, wz, TS, TS, TS);
    } else {
      V(rock, wx, (h - 1) * TS + TS / 2, wz, TS, TS, TS);
      if (h - 2 >= minN) V(rock, wx, (h - 2) * TS + TS / 2, wz, TS, TS, TS);
    }
    for (let lvl = minN; lvl < h - 2; lvl++) V('stoneDark', wx, lvl * TS + TS / 2, wz, TS, TS, TS);
  }
  // pond rim boulders
  const R = rng(99);
  for (let a = 0; a < Math.PI * 2; a += 0.22){
    const rx = -30 + Math.cos(a) * 18.5, rz = -5 + Math.sin(a) * 13.5;
    if (R() < 0.55) V(R() < 0.5 ? 'stone' : 'stoneDark', rx + (R() - 0.5), 4.2, rz + (R() - 0.5), 1 + R() * 1.6, 0.8 + R() * 1.4, 1 + R() * 1.6);
  }
  // stepping-stone paths
  stonePath([[0, 46], [0, 15]]);
  stonePath([[0, 12], [-26, 12], [-30, 9]]);
  stonePath([[0, 14], [22, 14], [33, 17]]);
  stonePath([[-6, 20], [-30, 23]]);
  // wildflowers
  const R2 = rng(4242);
  for (let i = 0; i < 70; i++){
    const x = (R2() - 0.5) * 88, z = (R2() - 0.5) * 88;
    if (Math.hypot(x, z) > 47 || inPond(x, z) || (Math.abs(x) < 12 && Math.abs(z) < 12) || (Math.abs(x) < 8 && z > 8 && z < 50)) continue;
    V(['red', 'blossom', 'snow', 'gold'][(R2() * 4) | 0], x, 4.45, z, 0.4, 0.4, 0.4);
    V('leaf', x, 4.15, z, 0.16, 0.6, 0.16);
  }
  // bushes
  for (let i = 0; i < 12; i++){
    const x = (R2() - 0.5) * 80, z = (R2() - 0.5) * 80;
    if (Math.hypot(x, z) > 42 || inPond(x, z) || (Math.abs(x) < 10 && Math.abs(z) < 10) || (Math.abs(x) < 9 && z > 8 && z < 50)) continue;
    if (Math.hypot(x - 34, z - 19) < 15) continue; // keep the pastoral meadow clear
    const n = 4 + ((R2() * 4) | 0);
    for (let j = 0; j < n; j++)
      V('leaf', x + (R2() - 0.5) * 2.6, 4.6 + R2() * 1.1, z + (R2() - 0.5) * 2.6, 1.2 + R2() * 1.4, 1 + R2() * 1.2, 1.2 + R2() * 1.4);
  }
  // lone boulders
  for (let i = 0; i < 14; i++){
    const x = (R2() - 0.5) * 84, z = (R2() - 0.5) * 84;
    if (Math.hypot(x, z) > 46 || inPond(x, z) || (Math.abs(x) < 8 && z > 8 && z < 50)) continue;
    if (Math.hypot(x - 34, z - 19) < 14) continue;
    V(R2() < 0.5 ? 'stone' : 'stoneDark', x, 4.35, z, 1 + R2() * 1.8, 0.7 + R2() * 1.2, 1 + R2() * 1.8, 0, R2() * Math.PI);
  }
})();
// ---------- SECTION E · ARCHITECTURE ----------
(function structures(){
  // ===== Pagoda Temple =====
  V('stone', 0, G - 0.6, 0, 20, 1.2, 20);                 // stone platform (top = 5.2)

const microGeo = new THREE.BoxGeometry(1, 1, 1);
function mb(parent, mat, x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0){

const MEADOW = { x: 34, z: 19, r: 12 };
function pickTarget(a){
  const ang = Math.random() * Math.PI * 2, rr = 2 + Math.random() * MEADOW.r;
  a.target.set(MEADOW.x + Math.cos(ang) * rr, MEADOW.z + Math.sin(ang) * rr);
  a.t = 6;
}
function updateAnimals(dt, t){
  for (const a of animals){
    a.t -= dt;
    if (a.state === 'idle'){
      a.head.rotation.x += (a.graze - a.head.rotation.x) * Math.min(1, dt * 3);
      a.head.position.y = a.headHomeY + Math.sin(t * 3 + a.g.position.x) * 0.03;
      if (a.t <= 0){ a.state = 'walk'; pickTarget(a); }
    } else {
      a.head.rotation.x += (0.08 - a.head.rotation.x) * Math.min(1, dt * 3);
      const dx = a.target.x - a.g.position.x, dz = a.target.y - a.g.position.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.4){ a.state = 'idle'; a.t = 2 + Math.random() * 3.5; a.graze = 0.85; }
      else {
        const ang = Math.atan2(dx, dz);
        let diff = ang - a.g.rotation.y;
        while (diff > Math.PI) diff -= 2 * Math.PI;
        while (diff < -Math.PI) diff += 2 * Math.PI;
        a.g.rotation.y += diff * Math.min(1, dt * 2.5);
        a.g.position.x += Math.sin(a.g.rotation.y) * a.speed * dt;
        a.g.position.z += Math.cos(a.g.rotation.y) * a.speed * dt;
        a.g.position.y = a.baseY + Math.abs(Math.sin(t * 7)) * 0.07;
        if (a.t <= 0){ a.state = 'idle'; a.t = 1.5 + Math.random() * 2.5; a.graze = 0.85; }
      }
    }
  }
}

    b.g.rotation.z = 0.22 * Math.sign(b.w);
    const s = Math.sin(t * b.fl + b.ph) * 0.8;
    b.wings[0].rotation.z = s; b.wings[1].rotation.z = -s;
  }
}
// ---------- SECTION H · SKY DOME, SUN/MOON, STARS, CLOUDS, PETALS ----------
const skyUni = { top: { value: new THREE.Color(0x6fb0e4) }, bottom: { value: new THREE.Color(0xd8ecf5) }, expn: { value: 0.9 } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(480, 24, 12), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, uniforms: skyUni,
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `varying vec3 vP; uniform vec3 top; uniform vec3 bottom; uniform float expn;
    void main(){ float h = clamp(normalize(vP).y, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, pow(h, expn)), 1.0); }`
}));
sky.frustumCulled = false; sky.renderOrder = -10; scene.add(sky);

// square celestial voxel (sun / moon)
const sunBlock = new THREE.Mesh(new THREE.BoxGeometry(18, 18, 18), new THREE.MeshBasicMaterial({ color: 0xfff3c2, fog: false }));
const sunGlow = new THREE.Mesh(new THREE.BoxGeometry(27, 27, 27), new THREE.MeshBasicMaterial({ color: 0xfff3c2, fog: false, transparent: true, opacity: 0.16, depthWrite: false }));
sunBlock.add(sunGlow); scene.add(sunBlock);

// night stars
const starGeo = new THREE.BufferGeometry();
{
  const R = rng(555), pos = [];
  for (let i = 0; i < 450; i++){
    const a = R() * Math.PI * 2, e = Math.asin(R() * 0.95), r = 440;
    pos.push(Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r + 20, Math.sin(a) * Math.cos(e) * r);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
}
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xcfe0ff, size: 2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false }));
stars.frustumCulled = false; scene.add(stars);

// drifting blocky clouds
const clouds = [];
function mbC(parent, x, y, z, sx, sy, sz){
  const m = new THREE.Mesh(microGeo, M.cloud);
  m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.castShadow = true;
  parent.add(m);
}
(function makeClouds(){
  const R = rng(88);
  for (let i = 0; i < 9; i++){
    const g = new THREE.Group();
    const n = 5 + ((R() * 4) | 0);
    for (let j = 0; j < n; j++)
      mbC(g, (R() - 0.5) * 20, (R() - 0.5) * 3, (R() - 0.5) * 10, 5 + R() * 7, 2.5 + R() * 2, 4 + R() * 5);
    g.position.set(-170 + R() * 340, 76 + R() * 20, (R() - 0.5) * 260);
    scene.add(g);
    clouds.push({ g, v: 0.9 + R() * 1.3 });
  }
})();
function updateClouds(dt){
  for (const c of clouds){
    c.g.position.x += c.v * dt;
    if (c.g.position.x > 190) c.g.position.x = -190;
  }
}

// falling sakura petals (instanced particles)
const PET_N = 150;
const petals = new THREE.InstancedMesh(new THREE.BoxGeometry(0.34, 0.1, 0.34), M.petal, PET_N);
petals.frustumCulled = false;
const petData = [], petDummy = new THREE.Object3D();
function resetPetal(p){
  const s = SAKURA[(Math.random() * SAKURA.length) | 0];
  p.x = s[0] + (Math.random() - 0.5) * 7; p.y = s[1] + Math.random() * 2; p.z = s[2] + (Math.random() - 0.5) * 7;
  p.seed = Math.random() * 10; p.spin = (Math.random() - 0.5) * 4;
}
for (let i = 0; i < PET_N; i++){ const p = {}; resetPetal(p); p.y = Math.random() * 22 + G; petData.push(p); }
scene.add(petals);
function updatePetals(dt, t){
  for (let i = 0; i < PET_N; i++){
    const p = petData[i];
    p.y -= dt * (0.9 + (p.seed % 1) * 0.5);
    p.x += Math.sin(t * 1.2 + p.seed) * dt * 0.7;
    p.z += Math.cos(t * 0.9 + p.seed * 1.7) * dt * 0.5;
    if (p.y < G + 0.15) resetPetal(p);
    petDummy.position.set(p.x, p.y, p.z);
    petDummy.rotation.set(p.seed + t * p.spin, t * p.spin * 0.7, 0);
    petDummy.updateMatrix();
    petals.setMatrixAt(i, petDummy.matrix);
  }
  petals.instanceMatrix.needsUpdate = true;
}

// ---------- SECTION I · LIGHTS & TIME MODES ----------
function addPointLight(x, y, z){
  const l = new THREE.PointLight(0xffb45e, 0, 17, 2);
  l.position.set(x, y, z); scene.add(l); lanternLights.push(l);
  return l;
}
const hemi = new THREE.HemisphereLight(0xbfdcf2, 0x6d8757, 0.6); scene.add(hemi);
const amb = new THREE.AmbientLight(0xffffff, 0.32); scene.add(amb);
const sun = new THREE.DirectionalLight(0xfff1d0, 1.35);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -110, right: 110, top: 110, bottom: -110, near: 20, far: 480 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.5;
scene.add(sun); scene.add(sun.target);

const MODES = {
  morning: {
    top: 0x6fb0e4, bottom: 0xd8ecf5, fog: 0xcfe8f2, fogNear: 130, fogFar: 380,
    sunDir: [0.62, 0.62, -0.45], sunColor: 0xfff1d0, sunInt: 1.35,
    hemiSky: 0xbfdcf2, hemiGround: 0x6d8757, hemiInt: 0.6, ambInt: 0.32,
    block: 0xfff3c2, lantern: 0.06, shoji: 0.25, stars: 0, exposure: 1.05,
  },
  sunset: {
    top: 0x45356f, bottom: 0xf2965c, fog: 0xe08a63, fogNear: 110, fogFar: 340,
    sunDir: [-0.72, 0.24, -0.4], sunColor: 0xffa04d, sunInt: 1.25,
    hemiSky: 0xffb98a, hemiGround: 0x5e4a63, hemiInt: 0.5, ambInt: 0.28,
    block: 0xffb35c, lantern: 0.55, shoji: 0.8, stars: 0.12, exposure: 1.08,
  },
  night: {
    top: 0x060a1e, bottom: 0x1a2444, fog: 0x131a36, fogNear: 90, fogFar: 320,
    sunDir: [0.4, 0.62, 0.35], sunColor: 0xa8c0ff, sunInt: 0.42,
    hemiSky: 0x2a3a66, hemiGround: 0x10141f, hemiInt: 0.34, ambInt: 0.18,
    block: 0xdfe8ff, lantern: 1.0, shoji: 1.15, stars: 1, exposure: 0.92,
  },
};
let mode = 'morning';
const cur = {
  top: new THREE.Color(MODES.morning.top), bottom: new THREE.Color(MODES.morning.bottom),
  fog: new THREE.Color(MODES.morning.fog), sunColor: new THREE.Color(MODES.morning.sunColor),
  block: new THREE.Color(MODES.morning.block), sunDir: new THREE.Vector3(...MODES.morning.sunDir),
  sunInt: 1.35, hemiInt: 0.6, ambInt: 0.32, lantern: 0.06, shoji: 0.25, stars: 0, exposure: 1.05,
  fogNear: 130, fogFar: 380,
};
const _c1 = new THREE.Color(), _v1 = new THREE.Vector3();
function setMode(name){
  mode = name;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === name));
  if (window.zenAudio) window.zenAudio.setNight(name === 'night');
}
function lerpAtmosphere(dt){
  const m = MODES[mode], k = 1 - Math.exp(-dt * 2.2);
  cur.top.lerp(_c1.set(m.top), k);          cur.bottom.lerp(_c1.set(m.bottom), k);
  cur.fog.lerp(_c1.set(m.fog), k);          cur.sunColor.lerp(_c1.set(m.sunColor), k);
  cur.block.lerp(_c1.set(m.block), k);      cur.sunDir.lerp(_v1.set(...m.sunDir), k);
  cur.sunInt += (m.sunInt - cur.sunInt) * k;     cur.hemiInt += (m.hemiInt - cur.hemiInt) * k;
  cur.ambInt += (m.ambInt - cur.ambInt) * k;     cur.lantern += (m.lantern - cur.lantern) * k;
  cur.shoji += (m.shoji - cur.shoji) * k;        cur.stars += (m.stars - cur.stars) * k;
  cur.exposure += (m.exposure - cur.exposure) * k;
  cur.fogNear += (m.fogNear - cur.fogNear) * k;  cur.fogFar += (m.fogFar - cur.fogFar) * k;
  // apply
  skyUni.top.value.copy(cur.top); skyUni.bottom.value.copy(cur.bottom);
  scene.fog.color.copy(cur.fog); scene.fog.near = cur.fogNear; scene.fog.far = cur.fogFar;
  sun.color.copy(cur.sunColor); sun.intensity = cur.sunInt;
  sun.position.copy(cur.sunDir).multiplyScalar(190); sun.target.position.set(0, 0, 0);
  sunBlock.position.copy(cur.sunDir).multiplyScalar(430); sunBlock.lookAt(0, 0, 0);
  sunBlock.material.color.copy(cur.block); sunGlow.material.color.copy(cur.block);
  hemi.color.copy(cur.top).lerp(_c1.set(m.hemiSky), 0.5); hemi.groundColor.lerp(_c1.set(m.hemiGround), k);
  hemi.intensity = cur.hemiInt; amb.intensity = cur.ambInt;
  M.shoji.emissiveIntensity = cur.shoji;
  M.paper.emissiveIntensity = 0.35 + cur.lantern * 2.0;
  M.glowGold.emissiveIntensity = 0.25 + cur.lantern * 0.6;
  for (const l of lanternLights) l.intensity = cur.lantern * 22;
  stars.material.opacity = cur.stars;
  renderer.toneMappingExposure = cur.exposure;
}
// ---------- SECTION J · WEB AUDIO AMBIENCE (wind + wind chimes) ----------
window.zenAudio = (() => {
  let ctx, master, windGain, delayNode, started = false;
  function start(){
    if (started) return; started = true;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    // --- wind: looped noise → bandpass → gain with slow LFO swell ---
    const len = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 380; bp.Q.value = 0.55;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    windGain = ctx.createGain(); windGain.gain.value = 0.055;
    src.connect(bp); bp.connect(lp); lp.connect(windGain); windGain.connect(master);
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
    const lfoG = ctx.createGain(); lfoG.gain.value = 0.032;
    lfo.connect(lfoG); lfoG.connect(windGain.gain);
    src.start(); lfo.start();
    // --- wind chimes: pentatonic plucks through a feedback delay ---
    delayNode = ctx.createDelay(1); delayNode.delayTime.value = 0.34;
    const fb = ctx.createGain(); fb.gain.value = 0.35;
    delayNode.connect(fb); fb.connect(delayNode);
    const wet = ctx.createGain(); wet.gain.value = 0.4;
    delayNode.connect(wet); wet.connect(master);
    scheduleChime();
  }
  function scheduleChime(){
    setTimeout(() => {
      if (ctx && ctx.state === 'running') chime();
      scheduleChime();
    }, ((mode === 'night' ? 6 : 3.5) + Math.random() * 6) * 1000);
  }
  function chime(){
    const notes = [880, 987.77, 1108.7, 1318.5, 1568, 1760];
    const f = notes[(Math.random() * notes.length) | 0] * (Math.random() < 0.35 ? 0.5 : 1);
    const t0 = ctx.currentTime;
    for (let h = 0; h < 2; h++){
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.value = f * (h ? 2.01 : 1);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(h ? 0.02 : 0.09, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.6);
      o.connect(g);
      let out = g;
      if (ctx.createStereoPanner){ const pan = ctx.createStereoPanner(); pan.pan.value = Math.random() * 1.6 - 0.8; g.connect(pan); out = pan; }
      out.connect(master); out.connect(delayNode);
      o.start(t0); o.stop(t0 + 2.8);
    }
  }
  function setNight(n){
    if (windGain) windGain.gain.linearRampToValueAtTime(n ? 0.03 : 0.055, ctx.currentTime + 2);
  }
  function toggle(){
    if (!started) start();
    if (ctx.state === 'running') ctx.suspend(); else ctx.resume();
    return ctx.state === 'running';
  }
  return { start, toggle, setNight };
})();

// ---------- SECTION K · CAMERA PRESETS, UI WIRING, MAIN LOOP ----------
const VIEWS = {
  pagoda:  { p: [28, 24, 48],   t: [0, 16, 0] },
  samurai: { p: [7.0, 7.0, 20.6], t: [6.5, 5.8, 16.6] },
  meadow:  { p: [16, 8, 36],    t: [34, 4.5, 19] },
  vista:   { p: [0, 60, 46],    t: [0, 24, -2] },
  aerial:  { p: [66, 148, 66],  t: [0, 4, 0] },
};
let camTween = null;
const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function flyTo(v){
  camTween = { p0: camera.position.clone(), p1: new THREE.Vector3(...v.p),
               t0: controls.target.clone(), t1: new THREE.Vector3(...v.t),
               s: performance.now(), d: 1500 };
}
controls.addEventListener('start', () => { camTween = null; });

document.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
document.querySelectorAll('.view-btn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.view-btn').forEach(x => x.classList.toggle('active', x === b));
  flyTo(VIEWS[b.dataset.view]);
}));
const audioBtn = document.getElementById('audioBtn');
audioBtn.addEventListener('click', () => {
  const on = window.zenAudio.toggle();
  audioBtn.textContent = on ? '🔊 Ambience On' : '🔇 Enable Sound';
  audioBtn.classList.toggle('pulse', !on);
});
const orbitBtn = document.getElementById('orbitBtn');
orbitBtn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  orbitBtn.classList.toggle('active', controls.autoRotate);
});

// build the world after the loader paints, then fade it out
setTimeout(() => {
  const n = buildVoxels();
  document.getElementById('voxCount').textContent = '≈ ' + (n + 1400).toLocaleString();
  const loader = document.getElementById('loader');
  loader.style.opacity = '0';
  setTimeout(() => loader.remove(), 800);
}, 80);

const clock = new THREE.Clock();
const _tick = () => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  lerpAtmosphere(dt);
  if (camTween){
    const k = Math.min(1, (performance.now() - camTween.s) / camTween.d), e = ease(k);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (k >= 1) camTween = null;
  }
  controls.update();
  for (const s of samurai){ // idle breathing
    s.body.scale.y = 1 + Math.sin(t * 1.8 + s.phase) * 0.02;
    s.g.position.y = G + Math.sin(t * 1.8 + s.phase) * 0.04;
    s.g.rotation.z = Math.sin(t * 0.9 + s.phase) * 0.008;
  }
  updateAnimals(dt, t);
  updateBirds(dt, t);
  updateClouds(dt);
  updatePetals(dt, t);
  renderer.render(scene, camera);
};
renderer.setAnimationLoop(_tick);
</script>
