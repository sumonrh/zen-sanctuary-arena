<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <title>Zen Sanctuary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #ui { position: absolute; top: 1rem; left: 1rem; z-index: 10; }
    button { @apply px-3 py-1 m-1 bg-white bg-opacity-20 text-white rounded backdrop-blur; }
  </style>
</head>
<body>
  <div id="ui" class="flex flex-col">
    <button data-mode="morning">Morning Sun</button>
    <button data-mode="sunset">Sunset</button>
    <button data-mode="night">Night</button>
  </div>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.150.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.150.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.150.0/examples/jsm/controls/OrbitControls.js';

    //── Utility: Procedural Pixel Texture ────────────────────────────────────────────
    function makePixelTexture(pixels, size = 16, repeat = 1) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      pixels.forEach((row, y) => {
        row.forEach((col, x) => {
          ctx.fillStyle = col;
          ctx.fillRect(x, y, 1, 1);
        });
      });
      const tex = new THREE.CanvasTexture(canvas);
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeat, repeat);
      return tex;
    }

    //── Scene, Camera, Renderer ────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
    camera.position.set(30, 20, 30);
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    //── Controls ─────────────────────────────────────────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0,5,0);
    controls.update();

    //── Lights & Time‐of‐Day ─────────────────────────────────────────────────────────
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(50,50, -50);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const ambientLight = new THREE.AmbientLight(0x888888);
    scene.add(ambientLight);

    // Lanterns container
    const lanterns = new THREE.Group();
    scene.add(lanterns);

    function setTimeMode(mode) {
      if (mode==='morning') {
        dirLight.color.set(0xfff5e1); dirLight.intensity=1.0;
        ambientLight.intensity=0.5;
        lanterns.children.forEach(l=>l.intensity=0.0);
        scene.background = new THREE.Color(0x87ceeb);
      }
      if (mode==='sunset') {
        dirLight.color.set(0xff7744); dirLight.intensity=0.8;
        ambientLight.intensity=0.4;
        lanterns.children.forEach(l=>l.intensity=0.2);
        scene.background = new THREE.Color(0xffccaa);
      }
      if (mode==='night') {
        dirLight.intensity=0.1;
        ambientLight.intensity=0.2;
        lanterns.children.forEach(l=>l.intensity=1.0);
        scene.background = new THREE.Color(0x000022);
      }
    }
    document.querySelectorAll('#ui button').forEach(btn=>{
      btn.onclick = ()=> setTimeMode(btn.dataset.mode);
    });
    setTimeMode('morning');

    //── Voxel Creator ───────────────────────────────────────────────────────────────
    function createVoxel(size, material) {
      const geo = new THREE.BoxGeometry(size, size, size);
      const mesh = new THREE.Mesh(geo, material);
      mesh.castShadow = mesh.receiveShadow = true;
      return mesh;
    }

    //── Ground & Mountain Terrain ────────────────────────────────────────────────────
    const groundMat = new THREE.MeshLambertMaterial({ color:0x77aa55 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(200,200), groundMat);
    ground.rotation.x = -Math.PI/2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Simple mountain range – random heights
    const mountainGroup = new THREE.Group();
    scene.add(mountainGroup);
    const mountainMat = new THREE.MeshLambertMaterial({color:0x888888});
    for(let x=-50;x<=50;x+=4){
      for(let z=-60;z<=-10;z+=4){
        const h = Math.random()*10 + 5 + (Math.abs(z+60)/50)*20;
        for(let i=0;i<Math.floor(h);i++){
          const v = createVoxel(4, mountainMat);
          v.position.set(x, 2 + i*4, z);
          mountainGroup.add(v);
          if(i === Math.floor(h)-1){ // snow cap
            v.material = new THREE.MeshLambertMaterial({color:0xffffff});
          }
        }
      }
    }

    //── Clouds ──────────────────────────────────────────────────────────────────────
    const cloudGeo = new THREE.BoxGeometry(4,4,4);
    const cloudMat = new THREE.MeshLambertMaterial({color:0xffffff});
    const clouds = new THREE.Group();
    scene.add(clouds);
    for(let i=0;i<20;i++){
      const c = new THREE.Mesh(cloudGeo, cloudMat);
      c.position.set(
        Math.random()*200 -100,
        50 + Math.random()*20,
        Math.random()*200 -100
      );
      clouds.add(c);
    }

    //── Pagoda Temple ──────────────────────────────────────────────────────────────
    const pagoda = new THREE.Group();
    scene.add(pagoda);
    const woodTex = makePixelTexture(
      Array(16).fill(Array(16).fill('#5a3a20')), 16, 1
    );
    const paperTex = makePixelTexture(
      Array(16).fill(Array(16).fill('#f7e7c6')),16,1
    );
    const woodMat = new THREE.MeshLambertMaterial({map: woodTex});
    const paperMat = new THREE.MeshLambertMaterial({map: paperTex});

    let tierHeight = 0;
    for(let tier=0;tier<4;tier++){
      const w = 12 - tier*2, h=2;
      const floor = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), woodMat);
      floor.position.set(0, tierHeight + h/2, 0);
      pagoda.add(floor);

      // roof
      const roof = new THREE.Mesh(
        new THREE.BoxGeometry(w+4, 1, w+4), 
        new THREE.MeshLambertMaterial({color:0x333333})
      );
      roof.position.set(0, tierHeight + h + 0.5, 0);
      pagoda.add(roof);

      tierHeight += h + 1;
    }
    // spire
    const spire = new THREE.Mesh(
      new THREE.ConeGeometry(0.5, 6, 4), 
      new THREE.MeshLambertMaterial({color:0xffd700})
    );
    spire.position.set(0, tierHeight + 3, 0);
    pagoda.add(spire);

    pagoda.position.set(0,0,0);
    pagoda.traverse(m=>{ m.castShadow=true; m.receiveShadow=true; });

    //── Torii Gate ─────────────────────────────────────────────────────────────────
    const torii = new THREE.Group();
    scene.add(torii);
    const redMat = new THREE.MeshLambertMaterial({color:0xdd2233});
    const postL = createVoxel(1, redMat).clone();
    postL.scale.set(1,6,1);
    postL.position.set(-3,3,15);
    torii.add(postL);
    const postR = postL.clone();
    postR.position.x = 3;
    torii.add(postR);
    const lintel = createVoxel(1, redMat).clone();
    lintel.scale.set(8,1,1);
    lintel.position.set(0,6.5,15);
    torii.add(lintel);

    //── Bridge & Pond ──────────────────────────────────────────────────────────────
    const bridge = new THREE.Group();
    scene.add(bridge);
    const bridgeMat = new THREE.MeshLambertMaterial({color:0xcc3333});
    for(let i=0;i<20;i++){
      const b = createVoxel(1, bridgeMat).clone();
      b.position.set(-10 + i, 2, 10 + Math.sin(i/5)*2);
      bridge.add(b);
    }
    // pond
    const waterMat = new THREE.MeshLambertMaterial({color:0x3366aa, transparent:true, opacity:0.7});
    const pond = new THREE.Mesh(new THREE.CircleGeometry(8,32), waterMat);
    pond.rotation.x = -Math.PI/2;
    pond.position.set(-1,1.9,10);
    pond.receiveShadow = true;
    scene.add(pond);

    //── Bamboo Grove & Sakura ──────────────────────────────────────────────────────
    const flora = new THREE.Group();
    scene.add(flora);
    const bambooMat = new THREE.MeshLambertMaterial({color:0x33aa33});
    for(let i=0;i<30;i++){
      const bx = Math.random()*40 -20;
      const bz = Math.random()*40 -20;
      const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.3,8), bambooMat);
      stalk.position.set(bx,4,bz);
      flora.add(stalk);
    }
    // Sakura trees – pink cubes + falling petals
    const sakuraMat = new THREE.MeshLambertMaterial({color:0xff99cc});
    for(let i=0;i<10;i++){
      const t = new THREE.Group();
      const tx = Math.random()*40 -20, tz = Math.random()*40 -20;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,4), woodMat);
      trunk.position.set(tx,2,tz);
      t.add(trunk);
      for(let p=0;p<20;p++){
        const fl = createVoxel(1, sakuraMat).clone();
        fl.position.set(
          tx + (Math.random()-0.5)*3,
          4 + Math.random()*2,
          tz + (Math.random()-0.5)*3
        );
        t.add(fl);
      }
      flora.add(t);
    }

    //── Samurais & Animals (Simplified Micro‐Voxels) ────────────────────────────────
    const microGroup = new THREE.Group();
    scene.add(microGroup);
    // Samurai placeholder: a stack of 3 tiny voxels
    const armorMat = new THREE.MeshLambertMaterial({color:0x444444});
    for(let i=0;i<3;i++){
      const sam = createVoxel(0.5, armorMat);
      sam.position.set(5 + i*1.2, 1 + i*0.5, 5);
      microGroup.add(sam);
    }
    // Sheep & Alpaca: single cubes with white/gray
    [ {pos:[-5,0,-5],col:0xffffff}, {pos:[-8,0,-8],col:0xdddddd} ]
      .forEach(o=>{
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(1,1,1), 
          new THREE.MeshLambertMaterial({color:o.col})
        );
        m.position.set(...o.pos);
        microGroup.add(m);
      });
    // Flying birds
    const birdMat = new THREE.MeshLambertMaterial({color:0x000000});
    const birds = [];
    for(let i=0;i<10;i++){
      const b = createVoxel(0.5, birdMat);
      b.position.set(Math.random()*50-25, 20 + Math.random()*10, Math.random()*50-25);
      scene.add(b);
      birds.push(b);
    }

    //── Lanterns ────────────────────────────────────────────────────────────────────
    for(let i=0;i<8;i++){
      const pl = new THREE.PointLight(0xffaa66, 0.5, 10);
      const px = Math.cos(i/8*Math.PI*2)*10;
      const pz = Math.sin(i/8*Math.PI*2)*10;
      pl.position.set(px,3,pz);
      lanterns.add(pl);
    }

    //── Ambient Sound (Wind + Random Chimes) ────────────────────────────────────────
    const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    // Wind noise
    const bufferSize = 2*audioCtx.sampleRate;
    const pinkNoise = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = pinkNoise.getChannelData(0);
    let b0,b1,b2,b3,b4,b5,b6=0;
    for(let i=0;i<bufferSize;i++){
      const white = Math.random()*2-1;
      b0 = 0.99886*b0 + white*0.0555179;
      b1 = 0.99332*b1 + white*0.0750759;
      b2 = 0.96900*b2 + white*0.1538520;
      b3 = 0.86650*b3 + white*0.3104856;
      b4 = 0.55000*b4 + white*0.5329522;
      b5 = -0.7616*b5 - white*0.0168980;
      data[i] = b0+b1+b2+b3+b4+b5+b6+white*0.5362;
      b6 = white*0.115926;
    }
    const pinkSource = audioCtx.createBufferSource();
    pinkSource.buffer = pinkNoise;
    pinkSource.loop = true;
    const windGain = audioCtx.createGain(); windGain.gain.value = 0.2;
    pinkSource.connect(windGain).connect(audioCtx.destination);
    pinkSource.start();

    // Random chimes
    function playChime(){
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = 200 + Math.random()*400;
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime+0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+1.5);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime+2);
    }
    setInterval(playChime, 10000 + Math.random()*10000);

    //── Animation Loop ──────────────────────────────────────────────────────────────
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Animate clouds
      clouds.children.forEach((c,i)=>{
        c.position.x += 0.02 * (1 + i*0.01);
        if(c.position.x>150) c.position.x = -150;
      });
      // Animate birds
      birds.forEach((b,i)=>{
        b.position.x += Math.cos(t+i)*0.02;
        b.position.z += Math.sin(t+i*1.3)*0.02;
        b.position.y = 20 + Math.sin(t*2 + i)*2;
      });
      // Samurai idle
      microGroup.children.slice(0,3).forEach((s,i)=>{
        s.position.y = 1 + 0.1*Math.sin(t*2 + i);
      });
      // Sakura petals fall
      flora.children.forEach(tree=>{
        tree.children.forEach(leaf=>{
          if(Math.random()<0.001){
            leaf.position.y -= 5;
            if(leaf.position.y<0) leaf.position.y = 4+Math.random()*2;
          }
        });
      });

      renderer.render(scene, camera);
    }
    animate();

  </script>
</body>
</html>
