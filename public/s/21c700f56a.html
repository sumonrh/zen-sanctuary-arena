<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   Renderer / Scene / Camera
============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#bcd6e4');
scene.fog = new THREE.Fog('#bcd6e4', 110, 330);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .5, 900);
camera.position.set(30, 15, 55);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .06;
controls.enablePan = false;
controls.minDistance = 4; controls.maxDistance = 300;
controls.maxPolarAngle = 1.54;
controls.target.set(0, 8, -6);
controls.autoRotate = true; controls.autoRotateSpeed = .45;

/* ============================================================
   Deterministic RNG + value noise
============================================================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand = mulberry32(20240607);
function hash2(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);
  return (a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v)*2-1;
}
function fbm(x,y){let f=0,a=.5;for(let i=0;i<4;i++){f+=a*vnoise(x,y);x*=2.03;y*=2.03;a*=.5;}return f;}
function sstep(a,b,x){const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);}
const lerp=(a,b,t)=>a+(b-a)*t;
function lerpAngle(a,b,t){let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return a+d*Math.min(1,t);}

/* ============================================================
   Procedural 16×16 pixel textures + materials
============================================================ */
function makeTex(d,key){
  const cv=document.createElement('canvas');cv.width=cv.height=16;
  const g=cv.getContext('2d'), base=new THREE.Color(d.c);
  const seed=[...key].reduce((a,c)=>a+c.charCodeAt(0),0);
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    let c=base.clone().multiplyScalar(1+(hash2(x+seed*.13,y+seed*.31)*2-1)*(d.v??.1));
    if(d.sp && hash2(x+seed*.7+40,y+seed*.9+9)<d.sp.p) c=new THREE.Color(d.sp.c);
    g.fillStyle=`rgb(${Math.min(255,c.r*255)|0},${Math.min(255,c.g*255)|0},${Math.min(255,c.b*255)|0})`;
    g.fillRect(x,y,1,1);
  }
  if(d.lines){g.fillStyle=d.lines;for(let y=3;y<16;y+=4)g.fillRect(0,y,16,1);}
  if(d.lattice){g.fillStyle='rgba(150,110,64,.55)';
    for(const x of[0,5,10,15])g.fillRect(x,0,1,16);
    for(const y of[0,7,15])g.fillRect(0,y,16,1);}
  const t=new THREE.CanvasTexture(cv);
  t.magFilter=t.minFilter=THREE.NearestFilter;
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
const TEXDEF={
  grass:{c:'#7dab54',v:.13,sp:{c:'#5d8b3e',p:.18}},
  dirt:{c:'#7c5a3e',v:.1,sp:{c:'#63472f',p:.12}},
  sand:{c:'#d9c69a',v:.07,sp:{c:'#c4ad7d',p:.1}},
  stone:{c:'#9a968f',v:.08,sp:{c:'#7d7973',p:.12}},
  darkstone:{c:'#6e6b66',v:.07,sp:{c:'#585550',p:.12}},
  rock:{c:'#7e8188',v:.12,sp:{c:'#666a72',p:.15}},
  snow:{c:'#eef2f5',v:.035,sp:{c:'#dfe6ec',p:.1}},
  water:{c:'#3d7fa8',v:.1,sp:{c:'#6aa6c8',p:.09}},
  woodDark:{c:'#4b3627',v:.09,lines:'#3a2a1e'},
  woodLight:{c:'#8a6844',v:.09,lines:'#755738'},
  red:{c:'#c04a32',v:.07,lines:'#a83c28'},
  roof:{c:'#3b4048',v:.07,lines:'#2c3037'},
  kuro:{c:'#26221f',v:.06},
  gold:{c:'#d9a63f',v:.09,sp:{c:'#b8862c',p:.15}},
  shoji:{c:'#f2e2bd',v:.05,lattice:true},
  lantern:{c:'#ffd9a0',v:.06},
  bamboo:{c:'#7fae57',v:.09,lines:'#6a9a47'},
  bambooDark:{c:'#5e8a3f',v:.08},
  leaf:{c:'#4f7d3c',v:.16,sp:{c:'#3d6630',p:.2}},
  sakura:{c:'#e9a9c6',v:.1,sp:{c:'#d892b3',p:.18}},
  sakuraDark:{c:'#d68fb0',v:.1},
  wool:{c:'#efe9dc',v:.06},
  face:{c:'#4a4038',v:.05},
  skin:{c:'#e6b78f',v:.05},
  tan:{c:'#d6bd9c',v:.06},
  indigo:{c:'#35415f',v:.06,lines:'#2a3450'},
  indigoLight:{c:'#5a6c94',v:.06},
  armorRed:{c:'#8a3a2f',v:.07},
  craneWhite:{c:'#f2eee4',v:.05},
  craneRed:{c:'#c33d2e',v:.08},
  cloud:{c:'#f7f9fb',v:.03},
  flowerP:{c:'#e88bb0',v:.08},
  flowerW:{c:'#f0ead8',v:.06},
  flowerG:{c:'#e3c25b',v:.08},
};
const M={};
for(const[k,d]of Object.entries(TEXDEF)) M[k]=new THREE.MeshLambertMaterial({map:makeTex(d,k)});
M.water.transparent=true; M.water.opacity=.88;
M.water.map.wrapS=M.water.map.wrapT=THREE.RepeatWrapping;
M.shoji.emissive=new THREE.Color('#ffc27d'); M.shoji.emissiveMap=M.shoji.map;
M.lantern.emissive=new THREE.Color('#ffab54'); M.lantern.emissiveMap=M.lantern.map;
M.gold.emissive=new THREE.Color('#8a6420');
M.cloud.emissive=new THREE.Color('#ffffff');
const glowMats=[[M.shoji,1],[M.lantern,1.3],[M.gold,.35]];

/* ============================================================
   Terrain field
============================================================ */
const POND={x:0,z:16,r:10};
function carve(x,z){
  const rr=POND.r+fbm(x*.08+31,z*.08+17)*2.2;
  return sstep(rr+4,rr-2,Math.hypot(x-POND.x,z-POND.z));
}
function H(x,z){
  const d=Math.hypot(x,z);
  let h=1.5+fbm(x*.015,z*.015)*2.6+fbm(x*.06+7,z*.06+3)*1.1;
  h=lerp(h,2,sstep(40,26,d));
  const ring=sstep(48,102,d);
  if(ring>0){const rg=Math.abs(fbm(x*.02+13,z*.02+5)); h+=ring*(10+Math.pow(rg,1.15)*52);}
  const c=carve(x,z); if(c>0) h=lerp(h,-3.5,c);
  return h;
}
function colTopAt(x,z){const d=Math.hypot(x,z);const s=d<=47?2:4;return Math.round(H(x,z)/s)*s;}
function groundTop(x,z){const d=Math.hypot(x,z);const s=d<=47?2:4;
  return colTopAt(Math.round(x/s)*s,Math.round(z/s)*s);}

/* ============================================================
   Voxel batching (variable block sizes, merged per material)
============================================================ */
class Vox{
  constructor(origin){this.map=new Map();this.origin=origin||new THREE.Vector3();}
  add(key,x,y,z,sx=1,sy=1,sz=1,o={}){
    const g=new THREE.BoxGeometry(sx,sy,sz);
    if(o.rx)g.rotateX(o.rx); if(o.ry)g.rotateY(o.ry); if(o.rz)g.rotateZ(o.rz);
    g.translate(x-this.origin.x,y-this.origin.y,z-this.origin.z);
    if(!this.map.has(key))this.map.set(key,[]);
    this.map.get(key).push(g);
  }
  build(opts={}){
    const out=[];
    for(const[key,geos]of this.map){
      const m=new THREE.Mesh(mergeGeometries(geos),M[key]);
      m.castShadow=opts.cast!==false; m.receiveShadow=opts.recv!==false;
      m.position.copy(this.origin); scene.add(m);
      geos.forEach(g=>g.dispose()); out.push(m);
    }
    return out;
  }
}
const V=new Vox();
const W=new Vox();

/* ============================================================
   Terrain (2×2 near sanctuary, 4×4 mountains)
============================================================ */
function column(cx,cz,s){
  const c=carve(cx,cz);
  const top=colTopAt(cx,cz);
  let topKey;
  if(c>.15&&top<4) topKey='sand';
  else if(top>=24+hash2(cx*.37,cz*.29)*8) topKey='snow';
  else if(top>=13) topKey='rock';
  else topKey='grass';
  let minN=Infinity;
  for(const[dx,dz]of[[1,0],[-1,0],[0,1],[0,-1]])
    minN=Math.min(minN,colTopAt(cx+dx*s,cz+dz*s));
  const bottom=Math.min(top-s,minN-s);
  for(let y=top-s;y>=bottom;y-=s){
    let key;
    if(y===top-s) key=topKey;
    else if(y>=top-3*s) key=c>.15?'sand':'dirt';
    else key=top>13?'rock':'stone';
    V.add(key,cx,y+s/2,cz,s,s,s);
  }
  if(c>.5&&top<1) W.add('water',cx,.62,cz,s,.75,s);
}
for(let iz=-24;iz<=24;iz++)for(let ix=-24;ix<=24;ix++){
  const cx=ix*2,cz=iz*2; if(Math.hypot(cx,cz)<=47) column(cx,cz,2);
}
for(let iz=-29;iz<=29;iz++)for(let ix=-29;ix<=29;ix++){
  const cx=ix*4,cz=iz*4; const d=Math.hypot(cx,cz);
  if(d>47&&d<=118) column(cx,cz,4);
}

/* ============================================================
   Architecture — Pagoda
============================================================ */
let pagodaTopY=0;
(function pagoda(){
  const cx=0,cz=-18;
  let gmin=99;
  for(let sx=-8;sx<=8;sx+=4)for(let sz=-8;sz<=8;sz+=4)
    gmin=Math.min(gmin,groundTop(cx+sx,cz+sz));
  const b=gmin;
  V.add('darkstone',cx,b+.7,cz,19,1.4,19);
  V.add('darkstone',cx,b+1.9,cz,16.4,1,16.4);
  V.add('stone',cx,b+2.9,cz,14.6,1,14.6);
  let y=b+3.4;
  const tiers=[{w:10,h:3.8},{w:8,h:3.5},{w:6.2,h:3.2}];
  const roofTop=(w0)=>{
    let ry=y,rw=w0;
    for(let i=0;i<4;i++){
      const th=i===0?.85:.55;
      V.add(i===0?'woodDark':'roof',cx,ry-th/2,cz,rw,th,rw);
      if(i<2)for(const sx of[-1,1])for(const sz of[-1,1])
        V.add('roof',cx+sx*(rw/2+.55),ry+.3+i*.3,cz+sz*(rw/2+.55),1.35,.5,1.35);
      ry+=th+.12; rw-=2;
    }
    const pw=Math.max(rw*.55,1.6);
    V.add('roof',cx,ry+.15,cz,pw,.5,pw);
    return ry+.4;
  };
  tiers.forEach((t,i)=>{
    const w=t.w,th=t.h;
    for(const sx of[-1,1])for(const sz of[-1,1])
      V.add('woodDark',cx+sx*(w/2-.45),y+th/2,cz+sz*(w/2-.45),.95,th,.95);
    for(const s of[-1,1]){
      V.add('woodDark',cx,y+.28,cz+s*(w/2-.22),w-1.4,.56,.5);
      V.add('woodDark',cx,y+th-.3,cz+s*(w/2-.22),w-1.4,.6,.5);
      V.add('woodDark',cx+s*(w/2-.22),y+.28,cz,.5,.56,w-1.4);
      V.add('woodDark',cx+s*(w/2-.22),y+th-.3,cz,.5,.6,w-1.4);
    }
    for(const s of[-1,1]){
      V.add('shoji',cx,y+th/2,cz+s*(w/2-.15),w-2.1,th-1.3,.34);
      V.add('shoji',cx+s*(w/2-.15),y+th/2,cz,.34,th-1.3,w-2.1);
    }
    y+=th;
    if(i===0){
      const off=w/2+2.6;
      for(const sx of[-1,1])for(const sz of[-1,1]){
        V.add('gold',cx+sx*off,y+.45,cz+sz*off,.6,.3,.6);
        V.add('lantern',cx+sx*off,y-.05,cz+sz*off,.85,.85,.85);
        V.add('gold',cx+sx*off,y-.55,cz+sz*off,.6,.3,.6);
      }
    }
    y=roofTop(t.w+4.6);
    if(i<2){
      const nw=tiers[i+1].w+2.8, ry2=y+.55;
      for(const s of[-1,1]){
        V.add('woodLight',cx,ry2,cz+s*(nw/2),nw,.16,.16);
        V.add('woodLight',cx+s*(nw/2),ry2,cz,.16,.16,nw);
      }
      for(const sx of[-1,1])for(const sz of[-1,1])
        V.add('woodLight',cx+sx*nw/2,y+.3,cz+sz*nw/2,.22,.6,.22);
    }
  });
  V.add('gold',cx,y+.35,cz,1.6,.3,1.6);
  V.add('gold',cx,y+1.3,cz,.42,1.6,.42);
  V.add('gold',cx,y+.85,cz,1.25,.22,1.25);
  V.add('gold',cx,y+1.5,cz,1,.22,1);
  V.add('gold',cx,y+2,cz,.75,.22,.75);
  V.add('gold',cx,y+2.35,cz,.32,.5,.32);
  pagodaTopY=y+2.6;
})();

/* ============================================================
   Torii gate
============================================================ */
(function torii(){
  const z=34.5;
  for(const s of[-1,1]){
    const gy=groundTop(s*4.2,z);
    V.add('darkstone',s*4.2,gy+.4,z,2.3,.8,2.3);
    V.add('red',s*4.2,gy+.8+4.3,z,1.15,8.6,1.15,{rz:.035*s});
  }
  V.add('red',0,6.7,z,9.3,.85,1.05);
  V.add('red',0,8.75,z,11.6,.8,1.3);
  V.add('red',0,7.8,z,.75,1.5,.7);
  for(let i=-2.5;i<=2.5;i++){
    const x=i*2.34, y=9.55+Math.pow(Math.abs(x)/5.85,2)*.8;
    V.add('kuro',x,y,z,2.3,.85,1.55);
  }
})();

/* ============================================================
   Taiko-bashi — red arch bridge
============================================================ */
const arch=z=>1.9+3.1*Math.sin(Math.PI*(z-4)/24);
(function bridge(){
  for(let i=0;i<=17;i++){
    const z=4+i*24/17, y=arch(z);
    V.add('red',0,y-.25,z,3.1,.5,1.7);
    V.add('red',-1.65,y-1.15,z,.55,1.9,1.7);
    V.add('red',1.65,y-1.15,z,.55,1.9,1.7);
  }
  for(const z of[5.5,10,14.5,19,23.5,27]){
    const y=arch(z);
    V.add('red',-1.72,y+.75,z,.42,1.5,.42);
    V.add('red',1.72,y+.75,z,.42,1.5,.42);
  }
  for(let i=0;i<=30;i++){
    const z=5+i*22/30, y=arch(z)+1.35;
    V.add('red',-1.72,y,z,.3,.3,.95);
    V.add('red',1.72,y,z,.3,.3,.95);
  }
  V.add('darkstone',0,1,3,3.4,3,2.4);
  V.add('darkstone',0,1,29,3.4,3,2.4);
})();

/* ============================================================
   Stone lanterns, stepping stones, lily pads
============================================================ */
const lanternLights=[];

function normMode(m){const{cap,...r}=m;return{...r,
  sky:new THREE.Color(r.sky),sunCol:new THREE.Color(r.sunCol),
  hemiS:new THREE.Color(r.hemiS),hemiG:new THREE.Color(r.hemiG),
  waterTint:new THREE.Color(r.waterTint),cubeCol:new THREE.Color(r.cubeCol),
  dir:new THREE.Vector3(...r.dir)};}
const cur=normMode(MODES.night);
let target=normMode(MODES.morning);

function lerpSky(dt){
  const k=1-Math.exp(-dt*1.3);
  for(const key of['sky','sunCol','hemiS','hemiG','waterTint','cubeCol'])cur[key].lerp(target[key],k);
  cur.dir.lerp(target.dir,k);
  for(const key of['sunI','hemiI','ambI','glow','lantern','stars','cubeS','cloudEm','fogN','fogF'])
    cur[key]+=(target[key]-cur[key])*k;
}
function applySky(){
  scene.background.copy(cur.sky);
  scene.fog.color.copy(cur.sky); scene.fog.near=cur.fogN; scene.fog.far=cur.fogF;
  dir.position.copy(cur.dir).normalize().multiplyScalar(160);
  dir.color.copy(cur.sunCol); dir.intensity=cur.sunI;
  hemi.color.copy(cur.hemiS); hemi.groundColor.copy(cur.hemiG); hemi.intensity=cur.hemiI;
  amb.intensity=cur.ambI;
  for(const[m,b]of glowMats)m.emissiveIntensity=b*cur.glow;
  lanternLights.forEach(l=>l.intensity=cur.lantern*1.5);
  starMat.opacity=cur.stars*.95;
  M.water.color.copy(cur.waterTint);
  M.cloud.emissiveIntensity=cur.cloudEm;
  fireflyMat.opacity=Math.max(0,Math.min(1,(cur.lantern-.25)/1.2));
  cel.position.copy(cur.dir).normalize().multiplyScalar(215);
  cel.material.color.copy(cur.cubeCol); cel.scale.setScalar(cur.cubeS);
}

/* ============================================================
   Ambient audio — wind + chimes + temple bell (Web Audio)
============================================================ */
const Snd={
  ctx:null,on:false,master:null,
  ensure(){
    if(this.ctx)return;
    const C=this.ctx=new(window.AudioContext||window.webkitAudioContext)();
    this.master=C.createGain(); this.master.gain.value=0; this.master.connect(C.destination);
    const len=2*C.sampleRate, buf=C.createBuffer(1,len,C.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const src=C.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=C.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; lp.Q.value=.6;
    const wg=C.createGain(); wg.gain.value=.055;
    src.connect(lp); lp.connect(wg); wg.connect(this.master); src.start();
    const lfo=C.createOscillator(); lfo.frequency.value=.06;
    const lg=C.createGain(); lg.gain.value=180;
    lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    const lfo2=C.createOscillator(); lfo2.frequency.value=.021;
    const lg2=C.createGain(); lg2.gain.value=.03;
    lfo2.connect(lg2); lg2.connect(wg.gain); lfo2.start();
    this.schedule();
  },
  note(f,amp,dec,when){
    const C=this.ctx;
    const o=C.createOscillator(); o.type='sine'; o.frequency.value=f;
    const o2=C.createOscillator(); o2.type='sine'; o2.frequency.value=f*2.756;
    const g=C.createGain(), g2=C.createGain();
    g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(amp,when+.012);
    g.gain.exponentialRampToValueAtTime(.0001,when+dec);
    g2.gain.setValueAtTime(0,when); g2.gain.linearRampToValueAtTime(amp*.22,when+.01);
    g2.gain.exponentialRampToValueAtTime(.0001,when+dec*.45);
    let out=this.master;
    if(C.createStereoPanner){const pan=C.createStereoPanner();
      pan.pan.value=Math.random()*1.4-.7; pan.connect(this.master); out=pan;}
    o.connect(g); g.connect(out); o2.connect(g2); g2.connect(out);
    o.start(when);o.stop(when+dec+1);o2.start(when);o2.stop(when+dec+1);
  },
  chime(){
    const scale=[392,440,523.25,587.33,659.25,783.99,880];
    const t=this.ctx.currentTime, n=1+(Math.random()*2|0);
    for(let i=0;i<n;i++)
      this.note(scale[Math.random()*scale.length|0],.05,2.8+Math.random()*2,t+i*(.18+Math.random()*.5));
  },
  bell(){
    const t=this.ctx.currentTime, f=130.8;
    [[1,.09,9],[2,.04,7],[2.92,.028,5],[4.1,.018,4]]
      .forEach(([r,a,d])=>this.note(f*r,a,d,t));
  },
  schedule(){
    setTimeout(()=>{ if(this.on)(Math.random()<.14?this.bell():this.chime()); this.schedule(); },
      2600+Math.random()*6500);
  },
  toggle(){
    this.ensure(); this.on=!this.on; this.ctx.resume();
    this.master.gain.setTargetAtTime(this.on?.9:0,this.ctx.currentTime,.4);
    const b=document.getElementById('audioBtn');
    b.classList.toggle('on',this.on);
    document.getElementById('icSndOn').classList.toggle('hidden',!this.on);
    document.getElementById('icSndOff').classList.toggle('hidden',this.on);
    document.getElementById('audioLbl').textContent=this.on?'Sound On':'Sound';
  },
};

/* ============================================================
   UI wiring
============================================================ */
const capEl=document.getElementById('caption');
const capText=document.getElementById('capText');
let capTimer;
function caption(t){
  capText.textContent=t; capEl.classList.add('show');
  clearTimeout(capTimer);
  capTimer=setTimeout(()=>capEl.classList.remove('show'),2600);
}
function setMode(name){
  target=normMode(MODES[name]);
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===name));
  caption(MODES[name].cap);
}
document.querySelectorAll('[data-mode]').forEach(b=>
  b.addEventListener('click',()=>setMode(b.dataset.mode)));
setMode('morning');

const VIEWS={
  pagoda:{p:[9,10,14],t:[0,10,-18]},
  samurai:{p:[-1.2,3.3,42.6],t:[-2.7,2.7,37.6]},
  meadow:{p:[-38,11,70],t:[-6,2,52]},
  vista:{p:[42,46,124],t:[-8,22,-40]},
  aerial:{p:[3,155,44],t:[0,0,-2]},
};
let tween=null;
function flyTo(v){
  controls.autoRotate=false;
  tween={p0:camera.position.clone(),t0:controls.target.clone(),
    p1:new THREE.Vector3(...v.p),t1:new THREE.Vector3(...v.t),k:0};
}
document.querySelectorAll('[data-view]').forEach(b=>
  b.addEventListener('click',()=>flyTo(VIEWS[b.dataset.view])));
controls.addEventListener('start',()=>{tween=null;controls.autoRotate=false;});
document.getElementById('audioBtn').addEventListener('click',()=>Snd.toggle());

/* ============================================================
   Animation loop
============================================================ */
const clock=new THREE.Clock();
let veilGone=false;
const veil=document.getElementById('veil');

function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;

  lerpSky(dt); applySky();

  if(tween){
    tween.k+=dt/1.9;
    const e=(x=>x*x*(3-2*x))(Math.min(1,tween.k));
    camera.position.lerpVectors(tween.p0,tween.p1,e);
    controls.target.lerpVectors(tween.t0,tween.t1,e);
    if(tween.k>=1)tween=null;
  }
  controls.update();

  // samurai idle breathing
  for(const s of samurais){
    s.body.position.y=Math.sin(t*1.4+s.ph)*.02;
    s.body.scale.y=1+Math.sin(t*1.4+s.ph)*.011;
    s.head.rotation.y=Math.sin(t*.23+s.ph)*.08;
  }

  // animal wander / graze state machine
  for(const a of animals){
    a.timer-=dt;
    if(a.timer<=0){
      if(a.state!=='idle'){a.state='idle';a.timer=1+Math.random()*3;}
      else{
        const r=Math.random();
        if(r<.5){a.state='walk';
          a.tx=a.bx+(Math.random()-.5)*14; a.tz=a.bz+(Math.random()-.5)*14;
          a.timer=2+Math.random()*3;}
        else{a.state='graze';a.timer=1.5+Math.random()*2;}
      }
    }
    const gy=groundTop(a.g.position.x,a.g.position.z);
    if(a.state==='walk'){
      const dx=a.tx-a.g.position.x, dz=a.tz-a.g.position.z, d=Math.hypot(dx,dz);
      if(d>.2){
        const s=a.spd*dt;
        a.g.position.x+=dx/d*s; a.g.position.z+=dz/d*s;
        a.g.rotation.y=lerpAngle(a.g.rotation.y,Math.atan2(dx,dz),dt*4);
        a.g.position.y=gy+Math.abs(Math.sin(t*7+a.ph))*.09;
      } else {a.state='idle';a.timer=.5+Math.random()*2;}
    } else if(a.state==='graze'){
      a.head.rotation.x=a.hb+.9+Math.sin(t*5+a.ph)*.12;
      a.g.position.y=gy;
    } else {
      a.head.rotation.x=lerp(a.head.rotation.x,a.hb,dt*3);
      a.g.position.y=gy+Math.sin(t*2+a.ph)*.02;
    }
  }

  // birds circling with flapping wings
  for(const b of birds){
    b.th+=b.spd*dt;
    b.g.position.set(
      b.cx+Math.cos(b.th)*b.R,
      b.cy+Math.sin(t*.7+b.ph)*1.6,
      b.cz+Math.sin(b.th)*b.R);
    b.g.rotation.y=-b.th;
    b.g.rotation.z=Math.sin(t*.7+b.ph)*.06;
    const f=Math.sin(t*b.fs+b.ph)*.8;
    b.wL.rotation.z=f; b.wR.rotation.z=-f;
  }

  // falling sakura petals
  petals.forEach((p,i)=>{
    p.y-=p.spd*dt;
    if(p.y<p.t.gy+.2){p.y=p.t.gy+9+Math.random()*4;p.ox=(Math.random()-.5)*9;p.oz=(Math.random()-.5)*9;}
    pPos[i*3]  =p.t.x+p.ox+Math.sin(t*.7+p.ph)*1.3;
    pPos[i*3+1]=p.y;
    pPos[i*3+2]=p.t.z+p.oz+Math.cos(t*.5+p.ph)*1.3;
  });
  pGeo.attributes.position.needsUpdate=true;

  // fireflies (visible at dusk / night)
  fBase.forEach((f,i)=>{
    fPos[i*3]  =f.x+Math.sin(t*.35+f.ph)*1.6;
    fPos[i*3+1]=f.gy+Math.sin(t*.9+f.ph2)*.7+Math.sin(t*.5+f.ph)*.4;
    fPos[i*3+2]=f.z+Math.cos(t*.3+f.ph2)*1.6;
    const br=.5+.5*Math.sin(t*2.2+f.ph*3);
    fCol[i*3]=1; fCol[i*3+1]=.75+.2*br; fCol[i*3+2]=.3*br;
  });
  fGeo.attributes.position.needsUpdate=true;
  fGeo.attributes.color.needsUpdate=true;

  // water shimmer + drifting clouds
  M.water.map.offset.set(t*.01,t*.006);
  for(const c of clouds){
    c.position.x+=c.userData.s*dt;
    if(c.position.x>160)c.position.x=-160;
  }

  // lantern flame flicker
  lanternLights.forEach((l,i)=>
    l.intensity=cur.lantern*1.5*(1+Math.sin(t*7+i*2.1)*.08+Math.sin(t*13+i)*.05));

  cel.rotation.y=t*.1;

  renderer.render(scene,camera);

  // dismiss loading veil after the first successful frame
  if(!veilGone){
    veilGone=true;
    veil.style.opacity=0;
    veil.style.pointerEvents='none';
    setTimeout(()=>veil.remove(),900);
    setTimeout(()=>caption('朝 · Morning Sun'),1400);
  }
}
loop();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
