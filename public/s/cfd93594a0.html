<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zen Sanctuary</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }
  .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.15); }
  .btn-glass { background: rgba(255,255,255,0.1); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2); transition: all 0.3s; }
  .btn-glass:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
  .btn-glass.active { background: rgba(255,200,100,0.3); border-color: rgba(255,200,100,0.6); }
  #loading { position: fixed; inset: 0; z-index: 9999; background: #1a1a2e; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #e8d5b7; transition: opacity 0.8s; }
  #loading h1 { font-size: 2rem; margin-bottom: 1rem; letter-spacing: 0.3em; }
  .loader { width: 48px; height: 48px; border: 4px solid rgba(255,200,100,0.3); border-top-color: #d4a056; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #ui-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #ui-overlay > * { pointer-events: auto; }
</style>
</head>
<body>

<div id="loading">
  <h1>禅 ZEN SANCTUARY</h1>
  <div class="loader"></div>
  <p style="margin-top:1rem;opacity:0.6;font-size:0.85rem;">Loading voxel world...</p>
</div>

<div id="ui-overlay">
  <div id="title-card" class="glass rounded-2xl px-5 py-3 absolute top-4 left-4" style="pointer-events:auto;">
    <h2 style="color:#e8d5b7;font-size:1.1rem;letter-spacing:0.15em;font-weight:600;">禅 ZEN SANCTUARY</h2>
    <p style="color:rgba(232,213,183,0.5);font-size:0.7rem;margin-top:2px;">Minecraft-style Voxel Landscape</p>
  </div>

  <div id="time-panel" class="glass rounded-2xl p-3 absolute top-4 right-4" style="pointer-events:auto;">
    <p style="color:rgba(232,213,183,0.6);font-size:0.65rem;text-transform:uppercase;letter-spacing:0.15em;margin-bottom:6px;">Time of Day</p>
    <div class="flex gap-2">
      <button id="btn-morning" class="btn-glass rounded-lg px-3 py-1.5 text-xs active" style="color:#f0d890;">☀ Morning</button>
      <button id="btn-sunset" class="btn-glass rounded-lg px-3 py-1.5 text-xs" style="color:#e88040;">🌅 Sunset</button>
      <button id="btn-night" class="btn-glass rounded-lg px-3 py-1.5 text-xs" style="color:#8090c0;">🌙 Night</button>
    </div>
  </div>

  <div id="camera-panel" class="glass rounded-2xl p-3 absolute bottom-4 left-1/2 -translate-x-1/2" style="pointer-events:auto;">
    <p style="color:rgba(232,213,183,0.6);font-size:0.65rem;text-transform:uppercase;letter-spacing:0.15em;margin-bottom:6px;text-align:center;">Camera View</p>
    <div class="flex gap-2 flex-wrap justify-center">
      <button class="cam-btn btn-glass rounded-lg px-3 py-1.5 text-xs active" style="color:#e8d5b7;" data-view="pagoda">🏯 Pagoda</button>
      <button class="cam-btn btn-glass rounded-lg px-3 py-1.5 text-xs" style="color:#e8d5b7;" data-view="samurai">⚔ Samurai</button>
      <button class="cam-btn btn-glass rounded-lg px-3 py-1.5 text-xs" style="color:#e8d5b7;" data-view="meadow">🌿 Meadow</button>
      <button class="cam-btn btn-glass rounded-lg px-3 py-1.5 text-xs" style="color:#e8d5b7;" data-view="mountain">🗻 Mountain</button>
      <button class="cam-btn btn-glass rounded-lg px-3 py-1.5 text-xs" style="color:#e8d5b7;" data-view="birds">🦅 Birds Eye</button>
    </div>
  </div>

  <div id="audio-panel" class="glass rounded-2xl p-3 absolute bottom-4 right-4" style="pointer-events:auto;">
    <button id="btn-audio" class="btn-glass rounded-lg px-4 py-2 text-xs" style="color:#e8d5b7;">🔇 Sound Off</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const S = 1;
const textureCache = {};
const animatedObjects = { samurai: [], sheep: [], alpacas: [], birds: [], petals: [], clouds: [] };
let currentMode = 'morning';
let audioStarted = false;
let audioCtx, windGain, chimeInterval;

function tex(f) {
  if (textureCache[f]) return textureCache[f];
  const c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  const x = c.getContext('2d');
  f(x, 16);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  textureCache[f] = t;
  return t;
}

function noise(x, y, s) {
  const n = Math.sin(x * 12.9898 + y * 78.233 + s * 43758.5453) * 43758.5453;
  return n - Math.floor(n);
}

function mat(f, opts) { return new THREE.MeshStandardMaterial({ map: tex(f), ...opts }); }

const M = {
  grass:    mat((x, s) => { for (let i=0;i<s;i++) for(let j=0;j<s;j++) { x.fillStyle = noise(i,j,1) > 0.7 ? '#4a8c3f' : '#5a9e4f'; x.fillRect(i,j,1,1); } }),
  dirt:     mat((x, s) => { for (let i=0;i<s;i++) for(let j=0;j<s;j++) { x.fillStyle = noise(i,j,2) > 0.6 ? '#8b6b4a' : '#7a5c3a'; x.fillRect(i,j,1,1); } }),
  stone:    mat((x, s) => { for (let i=0;i<s;i++) for(let j=0;j<s;j++) { const v = noise(i,j,3); x.fillStyle = v > 0.7 ? '#999' : v > 0.4 ? '#888' : '#777'; x.fillRect(i,j,1,1); } }),
  snow:     mat((x, s) => { for (let i=0;i<s;i++) for(let j=0;j<s;j++) { x.fillStyle = noise(i,j,4) > 0.8 ? '#eef' : '#fff'; x.fillRect(i,j,1,1); } }),
  darkWood: mat((x, s) => { for(let i=0;i<s;i++) x.fillStyle = noise(i,0,5)>0.5 ? '#3a2515' : '#4a3020', x.fillRect(i,0,1,s); }),
  lightWood:mat((x, s) => { for(let i=0;i<s;i++) x.fillStyle = noise(i,0,6)>0.5 ? '#c4a060' : '#b49050', x.fillRect(i,0,1,s); }),
  roofTile: mat((x, s) => { for (let i=0;i<s;i++) for(let j=0;j<s;j++) { x.fillStyle = noise(i,j,7) > 0.5 ? '#2a2a2a' : '#333'; x.fillRect(i,j,1,1); } }),
  red:      mat((x, s) => { for (let i=0;i<s;i++) for(let j=0;j<s;j++) { x.fillStyle = noise(i,j,8) > 0.6 ? '#c03030' : '#b02020'; x.fillRect(i,j,1,1); } }),
  gold:     mat((x, s) => { for (let i=0;i<s;i++) for(let j=0;j<s;j++) { x.fillStyle = noise(i,j,9) > 0.5 ? '#ffd700' : '#e8c200'; x.fillRect(i,j,1,1); } }),
  shoji:    mat((x, s) => { x.fillStyle = '#f5e8c8'; x.fillRect(0,0,s,s); x.fillStyle = '#d4c4a0'; for(let i=4;i<s;i+=4) x.fillRect(i,0,1,s); for(let j=4;j<s;j+=4) x.fillRect(0,j,s,1); }),
  water:    mat((x, s) => { for (let i=0;i<s;i++) for(let j=0;j<s;j++) { x.fillStyle = noise(i,j,10) > 0.5 ? '#3060a0' : '#2850a0'; x.fillRect(i,j,1,1); } }),
  leaves:   mat((x, s) => { for (let i=0;i<s;i++) for(let j=0;j<s;j++) { x.fillStyle = noise(i,j,11) > 0.6 ? '#2d7a2d' : '#3a8a3a'; x.fillRect(i,j,1,1); } }),
  sakura:   mat((x, s) => { for (let i=0;i<s;i++) for(let j=0;j<s;j++) { x.fillStyle = noise(i,j,12) > 0.5 ? '#ffb7c5' : '#ff9eb5'; x.fillRect(i,j,1,1); } }),
  bamboo:   mat((x, s) => { x.fillStyle = '#4a7a2a'; x.fillRect(0,0,s,s); x.fillStyle = '#5a8a3a'; x.fillRect(2,0,1,s); x.fillRect(10,0,1,s); }),
  sand:     mat((x, s) => { for (let i=0;i<s;i++) for(let j=0;j<s;j++) { x.fillStyle = noise(i,j,13) > 0.5 ? '#d4c090' : '#c4b080'; x.fillRect(i,j,1,1); } }),
  bridge:   mat((x, s) => { for (let i=0;i<s;i++) for(let j=0;j<s;j++) { x.fillStyle = noise(i,j,14) > 0.5 ? '#a03030' : '#902828'; x.fillRect(i,j,1,1); } }),
  white:    mat((x, s) => { x.fillStyle = '#f0f0f0'; x.fillRect(0,0,s,s); }),
  wool:     mat((x, s) => { for (let i=0;i<s;i++) for(let j=0;j<s;j++) { x.fillStyle = noise(i,j,15) > 0.6 ? '#f8f8f0' : '#e8e8e0'; x.fillRect(i,j,1,1); } }),
  skin:     mat((x, s) => { x.fillStyle = '#e8c8a0'; x.fillRect(0,0,s,s); }),
  armor:    mat((x, s) => { for (let i=0;i<s;i++) for(let j=0;j<s;j++) { x.fillStyle = noise(i,j,16) > 0.5 ? '#2a2a3a' : '#1a1a2a'; x.fillRect(i,j,1,1); } }),
  lily:     mat((x, s) => { x.fillStyle = '#2a6a2a'; x.fillRect(2,2,12,12); x.fillStyle = '#ff8090'; x.fillRect(6,5,3,3); }),
  moonTex:  mat((x, s) => { x.fillStyle = '#dde8ff'; x.fillRect(0,0,s,s); x.fillStyle = '#c0d0e8'; x.fillRect(4,3,2,2); x.fillRect(8,9,3,2); }),
};

function mkBox(g, m, px, py, pz, sx, sy, sz) {
  const mesh = new THREE.Mesh(g || new THREE.BoxGeometry(S * (sx||1), S * (sy||1), S * (sz||1)), m);
  mesh.position.set(px * S, py * S, pz * S);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function box(m, px, py, pz, sx, sy, sz) {
  return mkBox(new THREE.BoxGeometry(S * (sx||1), S * (sy||1), S * (sz||1)), m, px, py, pz, sx, sy, sz);
}

function smoothstep(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x87CEEB, 0.003);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.set(35, 25, 35);

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 5;
controls.maxDistance = 120;
controls.target.set(0, 3, 0);

const ambientLight = new THREE.AmbientLight(0x6688aa, 0.4);
scene.add(ambientLight);

const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x4a7a2a, 0.4);
scene.add(hemiLight);

const sunPivot = new THREE.Group();
scene.add(sunPivot);

const sunLight = new THREE.DirectionalLight(0xfff0d0, 1.2);
sunLight.position.set(50, 80, 30);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -60;
sunLight.shadow.camera.right = 60;
sunLight.shadow.camera.top = 60;
sunLight.shadow.camera.bottom = -60;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 200;
sunLight.shadow.bias = -0.001;
sunPivot.add(sunLight);

const celestialGroup = new THREE.Group();
sunPivot.add(celestialGroup);

const sunGeo = new THREE.BoxGeometry(6, 6, 6);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffee88 });
const sunMesh = new THREE.Mesh(sunGeo, sunMat);
sunMesh.position.copy(sunLight.position).multiplyScalar(1.1);
celestialGroup.add(sunMesh);

const moonGeo = new THREE.BoxGeometry(5, 5, 5);
const moonMat = new THREE.MeshBasicMaterial({ map: M.moonTex.map, color: 0xccddff });
const moonMesh = new THREE.Mesh(moonGeo, moonMat);
moonMesh.position.set(-50, -80, -30).normalize().multiplyScalar(90);
moonMesh.visible = false;
celestialGroup.add(moonMesh);

const world = new THREE.Group();
scene.add(world);

// ── Terrain ──
function getHeight(x, z) {
  const d = Math.sqrt(x * x + z * z);
  let h = 0;
  h += Math.sin(x * 0.12) * Math.cos(z * 0.12) * 2;
  h += Math.sin(x * 0.25 + 1) * Math.cos(z * 0.18) * 1;
  const edge = smoothstep(15, 35, d);
  h += edge * 6;
  if (d < 16) h = Math.min(h, 0.3);
  return Math.max(-0.5, h);
}

{
  const grassPositions = [];
  const dirtPositions = [];
  for (let x = -40; x <= 40; x++) {
    for (let z = -40; z <= 40; z++) {
      const h = getHeight(x, z);
      if (h < -0.3) continue;
      const gy = Math.round(h * 2) / 2;
      grassPositions.push(x, gy, z);
      if (gy > 0.5) {
        dirtPositions.push(x, gy - 0.5, z);
      }
    }
  }

  const grassGeo = new THREE.BoxGeometry(S, S * 0.5, S);
  const grassInst = new THREE.InstancedMesh(grassGeo, M.grass, grassPositions.length / 3);
  grassInst.receiveShadow = true;
  grassInst.castShadow = false;
  const grassDummy = new THREE.Object3D();
  for (let i = 0; i < grassPositions.length; i += 3) {
    grassDummy.position.set(grassPositions[i], grassPositions[i+1], grassPositions[i+2]);
    grassDummy.updateMatrix();
    grassInst.setMatrixAt(i / 3, grassDummy.matrix);
  }
  grassInst.instanceMatrix.needsUpdate = true;
  world.add(grassInst);

  if (dirtPositions.length > 0) {
    const dirtGeo = new THREE.BoxGeometry(S, S * 0.5, S);
    const dirtInst = new THREE.InstancedMesh(dirtGeo, M.dirt, dirtPositions.length / 3);
    dirtInst.castShadow = false;
    for (let i = 0; i < dirtPositions.length; i += 3) {
      grassDummy.position.set(dirtPositions[i], dirtPositions[i+1], dirtPositions[i+2]);
      grassDummy.updateMatrix();
      dirtInst.setMatrixAt(i / 3, grassDummy.matrix);
    }
    dirtInst.instanceMatrix.needsUpdate = true;
    world.add(dirtInst);
  }
}

// ── Stone Path ──
for (let z = 2; z <= 22; z++) {
  const sx = z % 4 < 2 ? 0 : 1;
  const s = box(M.stone, sx, 0.1, z, 1, 0.15, 1);
  s.receiveShadow = true;
  world.add(s);
  if (z % 4 < 2) {
    const s2 = box(M.stone, -1, 0.1, z, 1, 0.15, 1);
    s2.receiveShadow = true;
    world.add(s2);
  }
}

// ── Water Pond ──
const waterGroup = new THREE.Group();
const waterMesh = box(M.water, 16, -0.3, 5, 14, 0.2, 12);
waterMesh.receiveShadow = true;
waterGroup.add(waterMesh);
world.add(waterGroup);

// Lily pads
for (let i = 0; i < 8; i++) {
  const lp = box(M.lily, 12 + Math.random() * 8, -0.1, 2 + Math.random() * 8, 1, 0.1, 1);
  lp.rotation.y = Math.random() * Math.PI;
  waterGroup.add(lp);
}

// ── Torii Gate ──
function buildTorii(g, px, pz) {
  const t = new THREE.Group();
  const pillarH = 8;
  t.add(box(M.red, px - 3, pillarH / 2, pz, 1, pillarH, 1));
  t.add(box(M.red, px + 3, pillarH / 2, pz, 1, pillarH, 1));
  t.add(box(M.red, px, pillarH + 0.3, pz, 9, 0.8, 1.2));
  t.add(box(M.red, px, pillarH - 1.2, pz, 7, 0.5, 0.8));
  const eaveW = 10;
  t.add(box(M.darkWood, px, pillarH + 1.0, pz, eaveW, 0.4, 1.5));
  for (let dx = -1; dx <= 1; dx += 2) {
    const fin = box(M.red, px + dx * (eaveW / 2 + 0.3), pillarH + 0.8, pz, 0.8, 0.6, 1.2);
    fin.rotation.z = dx * 0.2;
    t.add(fin);
  }
  g.add(t);
}
buildTorii(world, 0, 20);

// ── Pagoda Temple ──
function buildPagoda(g) {
  const p = new THREE.Group();
  const tierW = 10;
  const tierH = 2.5;
  const tiers = 5;
  for (let i = 0; i < tiers; i++) {
    const w = tierW - i * 1.2;
    const base = box(M.darkWood, 0, i * tierH + tierH / 2, 0, w, tierH, w);
    p.add(base);
    for (let dx = -1; dx <= 1; dx += 2) {
      for (let dz = -1; dz <= 1; dz += 2) {
        const win = box(M.shoji, dx * (w / 2 - 0.6), i * tierH + tierH / 2, dz * (w / 2 - 0.1), 0.2, 1.2, 1.2);
        win.material = M.shoji.clone();
        win.material.emissive = new THREE.Color(0xf5e8c8);
        win.material.emissiveIntensity = 0.4;
        p.add(win);
      }
    }
    const roofY = (i + 1) * tierH;
    const roofW = w + 2;
    const roof = box(M.roofTile, 0, roofY, 0, roofW, 0.5, roofW);
    p.add(roof);
    for (let dx = -1; dx <= 1; dx += 2) {
      for (let dz = -1; dz <= 1; dz += 2) {
        const eave = box(M.roofTile, dx * (roofW / 2 + 0.4), roofY - 0.2, dz * (roofW / 2 + 0.4), 1.5, 0.3, 1.5);
        eave.rotation.z = dx * 0.15;
        eave.rotation.x = dz * 0.15;
        p.add(eave);
      }
    }
  }
  const spireY = tiers * tierH;
  const spireH = 6;
  for (let i = 0; i < 4; i++) {
    const ring = box(M.gold, 0, spireY + i * 1.2, 0, 2.0 - i * 0.3, 0.3, 2.0 - i * 0.3);
    p.add(ring);
  }
  const spireTop = box(M.gold, 0, spireY + spireH, 0, 0.4, spireH, 0.4);
  p.add(spireTop);
  const orbGeo = new THREE.SphereGeometry(0.5, 6, 6);
  const orb = new THREE.Mesh(orbGeo, M.gold);
  orb.position.set(0, spireY + spireH + 0.5, 0);
  p.add(orb);
  const baseW = tierW + 2;
  p.add(box(M.stone, 0, -0.75, 0, baseW, 1.5, baseW));
  for (let dx = -1; dx <= 1; dx += 2) {
    for (let dz = -1; dz <= 1; dz += 2) {
      p.add(box(M.stone, dx * (baseW / 2 + 0.5), -0.5, dz * (baseW / 2 + 0.5), 1, 2, 1));
    }
  }
  g.add(p);
  return p;
}
buildPagoda(world);

// ── Bridge ──
function buildBridge(g) {
  const br = new THREE.Group();
  const span = 12;
  for (let i = 0; i < span; i++) {
    const t = (i / (span - 1)) * Math.PI;
    const y = Math.sin(t) * 2.5;
    const pl = box(M.bridge, 16 - span / 2 + i, y, 1.5, 1, 0.3, 3);
    br.add(pl);
    if (i === 0 || i === span - 1) {
      const pil = box(M.darkWood, 16 - span / 2 + i, y / 2 - 0.5, 1.5, 0.8, y + 2, 0.8);
      br.add(pil);
    }
  }
  for (let i = 0; i < span; i++) {
    const t = (i / (span - 1)) * Math.PI;
    const y = Math.sin(t) * 2.5;
    br.add(box(M.red, 16 - span / 2 + i, y + 1, 0.1, 0.3, 0.8, 0.3));
    br.add(box(M.red, 16 - span / 2 + i, y + 1, 2.9, 0.3, 0.8, 0.3));
  }
  for (let i = 0; i < span; i += 2) {
    const t = (i / (span - 1)) * Math.PI;
    const y = Math.sin(t) * 2.5;
    br.add(box(M.red, 16 - span / 2 + i, y + 1.5, 0.1, 0.2, 0.2, 2.8));
  }
  g.add(br);
}
buildBridge(world);

// ── Bamboo Grove ──
function buildBamboo(g, bx, bz, count) {
  for (let i = 0; i < count; i++) {
    const h = 5 + Math.random() * 6;
    const ox = (Math.random() - 0.5) * 5;
    const oz = (Math.random() - 0.5) * 5;
    g.add(box(M.bamboo, bx + ox, h / 2, bz + oz, 0.3, h, 0.3));
    for (let j = 0; j < 3; j++) {
      const leafY = h * 0.4 + j * h * 0.2;
      const dx = (Math.random() - 0.5) * 1.5;
      g.add(box(M.leaves, bx + ox + dx, leafY, bz + oz, 1.2, 0.3, 0.3));
    }
  }
}
buildBamboo(world, -15, -10, 12);
buildBamboo(world, -20, -5, 8);
buildBamboo(world, -12, -18, 10);

// ── Sakura Trees ──
function buildSakura(g, sx, sz) {
  const t = new THREE.Group();

// ── Mountains ──
function buildMountain(g, mx, mz, height, radius) {
  const positions = { snow: [], stone: [], dirt: [] };
  for (let y = 0; y < height; y++) {
    const layerR = radius * (1 - y / height);
    const step = y < height * 0.3 ? 2 : 1;
    for (let x = -layerR; x <= layerR; x += step) {
      for (let z = -layerR; z <= layerR; z += step) {
        if (x * x + z * z > layerR * layerR) continue;
        const useMat = y > height * 0.7 ? 'snow' : y > height * 0.4 ? 'stone' : 'dirt';
        positions[useMat].push(x, y + 0.5, z, step);
      }
    }
  }
  const mtn = new THREE.Group();
  const dummy = new THREE.Object3D();
  const geoCache = {};
  for (const [key, arr] of Object.entries(positions)) {
    if (arr.length === 0) continue;
    const count = arr.length / 4;
    const sizeSet = new Set();
    for (let i = 0; i < arr.length; i += 4) sizeSet.add(arr[i+3]);
    const sizes = [...sizeSet];
    for (const sz of sizes) {
      const indices = [];
      for (let i = 0; i < arr.length; i += 4) {
        if (arr[i+3] === sz) indices.push(i);
      }
      const k = `${key}_${sz}`;
      if (!geoCache[k]) geoCache[k] = new THREE.BoxGeometry(sz, 1, sz);
      const inst = new THREE.InstancedMesh(geoCache[k], M[key], indices.length);
      indices.forEach((idx, i) => {
        dummy.position.set(arr[idx], arr[idx+1], arr[idx+2]);
        dummy.updateMatrix();
        inst.setMatrixAt(i, dummy.matrix);
      });
      inst.instanceMatrix.needsUpdate = true;
      mtn.add(inst);
    }
  }
  mtn.position.set(mx, 0, mz);
  g.add(mtn);
}

// ── Web Audio API ──
function initAudio() {
  if (audioStarted) return;
  audioStarted = true;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  const bufLen = audioCtx.sampleRate * 4;
  const buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) {
    data[i] = (Math.random() * 2 - 1) * 0.3;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  const lpf = audioCtx.createBiquadFilter();
  lpf.type = 'lowpass';
  lpf.frequency.value = 300;
  lpf.Q.value = 1;

  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 0.15;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 150;
  lfo.connect(lfoGain);
  lfoGain.connect(lpf.frequency);
  lfo.start();

  windGain = audioCtx.createGain();
  windGain.gain.value = 0.12;

  src.connect(lpf);
  lpf.connect(windGain);
  windGain.connect(audioCtx.destination);
  src.start();

  function playChime() {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const notes = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
    osc.frequency.value = notes[Math.floor(Math.random() * notes.length)];
    osc.type = 'sine';
    g.gain.setValueAtTime(0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 2.5);
  }

  chimeInterval = setInterval(() => {
    if (Math.random() < 0.4) playChime();
  }, 3000);
}

const audioBtn = document.getElementById('btn-audio');
audioBtn.addEventListener('click', () => {
  if (!audioStarted) {
    initAudio();
    audioBtn.textContent = '🔊 Sound On';
    audioBtn.classList.add('active');
  } else if (audioCtx.state === 'running') {
    audioCtx.suspend();
    audioBtn.textContent = '🔇 Sound Off';
    audioBtn.classList.remove('active');
  } else {
    audioCtx.resume();
    audioBtn.textContent = '🔊 Sound On';
    audioBtn.classList.add('active');
  }
});

// ── Animation Loop ──
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  elapsed += dt;

  controls.update();

  if (cameraTransition) {
    const ct = cameraTransition;
    const t = Math.min(1, (performance.now() - ct.startTime) / ct.duration);
    const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    camera.position.lerpVectors(ct.startPos, ct.endPos, ease);
    controls.target.lerpVectors(ct.startTarget, ct.endTarget, ease);
    if (t >= 1) cameraTransition = null;
  }

  // Samurai breathing
  animatedObjects.samurai.forEach(s => {
    const breathe = Math.sin(elapsed * 1.5 + s.phase) * 0.04;
    s.mesh.position.y = s.baseY + breathe;
  });

  // Sheep wandering
  animatedObjects.sheep.forEach(s => {
    s.wanderAngle += (Math.random() - 0.5) * 0.02;
    const nx = s.mesh.position.x + Math.cos(s.wanderAngle) * s.speed * dt;
    const nz = s.mesh.position.z + Math.sin(s.wanderAngle) * s.speed * dt;
    if (Math.abs(nx) < 18 && Math.abs(nz) < 18 && Math.sqrt(nx * nx + nz * nz) > 5) {
      s.mesh.position.x = nx;
      s.mesh.position.z = nz;
      s.mesh.rotation.y = s.wanderAngle;
    } else {
      s.wanderAngle += Math.PI;
    }
    s.mesh.position.y = Math.sin(elapsed * 2 + s.phase) * 0.05;
  });

  // Alpacas wandering
  animatedObjects.alpacas.forEach(a => {
    a.wanderAngle += (Math.random() - 0.5) * 0.015;
    const nx = a.mesh.position.x + Math.cos(a.wanderAngle) * a.speed * dt;
    const nz = a.mesh.position.z + Math.sin(a.wanderAngle) * a.speed * dt;
    if (Math.abs(nx) < 18 && Math.abs(nz) < 20 && Math.sqrt(nx * nx + nz * nz) > 5) {
      a.mesh.position.x = nx;
      a.mesh.position.z = nz;
      a.mesh.rotation.y = a.wanderAngle;
    } else {
      a.wanderAngle += Math.PI;
    }
    a.mesh.position.y = Math.sin(elapsed * 1.5 + a.phase) * 0.06;
  });

  // Birds flying
  animatedObjects.birds.forEach(b => {
    b.angle += b.speed * dt;
    b.mesh.position.x = Math.cos(b.angle) * b.radius;
    b.mesh.position.z = Math.sin(b.angle) * b.radius + b.centerZ;
    b.mesh.position.y = b.height + Math.sin(elapsed * 0.5 + b.angle) * 2;
    b.mesh.rotation.y = -b.angle + Math.PI / 2;
    const flapAngle = Math.sin(elapsed * b.flapSpeed) * 0.4;
    b.wl.rotation.z = flapAngle;
    b.wr.rotation.z = -flapAngle;
  });

  // Clouds drifting
  animatedObjects.clouds.forEach(c => {
    c.mesh.position.x += c.speed * dt;
    if (c.mesh.position.x > 50) c.mesh.position.x = -50;
  });

  // Sakura petals falling
  animatedObjects.petals.forEach(p => {
    p.mesh.position.y -= p.speed * dt;
    p.mesh.position.x += p.drift * dt + Math.sin(elapsed + p.phase) * 0.01;
    p.mesh.position.z += Math.cos(elapsed * 0.7 + p.phase) * 0.01;
    p.mesh.rotation.x += p.rotSpeed * dt;
    p.mesh.rotation.z += p.rotSpeed * 0.7 * dt;
    if (p.mesh.position.y < -1) {
      p.mesh.position.y = 12 + Math.random() * 5;
      p.mesh.position.x = (Math.random() - 0.5) * 50;
      p.mesh.position.z = (Math.random() - 0.5) * 50;
    }
  });

  // Water shimmer
  if (waterMesh.material.map) {
    waterMesh.material.emissive = waterMesh.material.emissive || new THREE.Color();
    waterMesh.material.emissiveIntensity = 0.05 + Math.sin(elapsed * 0.8) * 0.03;
  }

  renderer.render(scene, camera);
}

// ── Init ──
setTimeMode('morning');
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

setTimeout(() => {
  const loading = document.getElementById('loading');
  loading.style.opacity = '0';
  setTimeout(() => loading.style.display = 'none', 800);
}, 1500);

</script>
