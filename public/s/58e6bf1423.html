<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

const app=document.getElementById('app');
const loaderEl=document.getElementById('loader');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xaad8ec,140,520);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1500);
camera.position.set(30,20,-6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,22,-44);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.minDistance=5;
controls.maxDistance=420;
controls.maxPolarAngle=Math.PI*.497;

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const fract=x=>x-Math.floor(x);
const hash2=(x,y)=>fract(Math.sin(x*127.1+y*311.7)*43758.5453);
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return hash2(xi,yi)*(1-u)*(1-v)+hash2(xi+1,yi)*u*(1-v)+hash2(xi,yi+1)*(1-u)*v+hash2(xi+1,yi+1)*u*v;
}
function fbm(x,y,o=4){let a=.5,f=1,s=0,n=0;for(let i=0;i<o;i++){s+=vnoise(x*f,y*f)*a;n+=a;a*=.5;f*=2}return s/n}

function makeTex(base,v,paint){
  const cv=document.createElement('canvas');cv.width=cv.height=16;
  const g=cv.getContext('2d');
  const cc=x=>Math.max(0,Math.min(255,x))|0;
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const n=(Math.random()*2-1)*v;
    g.fillStyle='rgb('+cc(base[0]+n)+','+cc(base[1]+n)+','+cc(base[2]+n)+')';
    g.fillRect(x,y,1,1);
  }
  if(paint)paint(g);
  const t=new THREE.CanvasTexture(cv);
  t.magFilter=THREE.NearestFilter;
  t.minFilter=THREE.NearestFilter;
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

const TEX={
  grass:makeTex([104,158,74],14,g=>{g.fillStyle='rgba(60,110,45,.7)';for(let i=0;i<14;i++)g.fillRect(Math.random()*16|0,Math.random()*16|0,1,1)}),
  dirt:makeTex([121,85,58],12),
  rock:makeTex([128,128,132],14),
  snow:makeTex([235,240,246],7),
  gravel:makeTex([150,140,124],16),
  sand:makeTex([206,182,134],10),
  woodDark:makeTex([74,52,36],9,g=>{g.fillStyle='rgba(40,26,16,.55)';for(let x=1;x<16;x+=4)g.fillRect(x,0,1,16)}),
  plank:makeTex([142,102,64],8,g=>{g.fillStyle='rgba(80,52,28,.6)';for(let y=3;y<16;y+=4)g.fillRect(0,y,16,1)}),
  red:makeTex([178,44,36],10,g=>{g.fillStyle='rgba(120,20,16,.4)';for(let x=0;x<16;x+=5)g.fillRect(x,0,1,16)}),
  roof:makeTex([52,58,72],7,g=>{g.fillStyle='rgba(24,28,40,.75)';for(let y=0;y<16;y+=3)g.fillRect(0,y,16,1)}),
  shoji:makeTex([244,228,190],5,g=>{g.fillStyle='rgba(90,60,34,.9)';for(let i=0;i<=16;i+=5){g.fillRect(i,0,1,16);g.fillRect(0,i,16,1)}}),
  paper:makeTex([255,196,110],8),
  gold:makeTex([222,178,72],12),
  bamboo:makeTex([96,168,72],10,g=>{g.fillStyle='rgba(50,120,44,.6)';g.fillRect(3,0,1,16);g.fillRect(11,0,1,16)}),
  bambooNode:makeTex([70,128,54],8),
  bambooLeaf:makeTex([64,140,60],10),
  sakura:makeTex([238,170,196],12),
  sakuraLight:makeTex([248,198,214],10),
  trunk:makeTex([96,68,48],10,g=>{g.fillStyle='rgba(58,40,26,.5)';for(let x=2;x<16;x+=5)g.fillRect(x,0,1,16)}),
  leafDark:makeTex([58,110,52],12),
  leafBright:makeTex([88,158,66],10),
  stoneLantern:makeTex([158,156,150],9)
};

const MATS={
  grass:new THREE.MeshLambertMaterial({map:TEX.grass}),
  dirt:new THREE.MeshLambertMaterial({map:TEX.dirt}),
  rock:new THREE.MeshLambertMaterial({map:TEX.rock}),
  snow:new THREE.MeshLambertMaterial({map:TEX.snow}),
  gravel:new THREE.MeshLambertMaterial({map:TEX.gravel}),
  sand:new THREE.MeshLambertMaterial({map:TEX.sand}),
  woodDark:new THREE.MeshLambertMaterial({map:TEX.woodDark}),
  plank:new THREE.MeshLambertMaterial({map:TEX.plank}),
  red:new THREE.MeshLambertMaterial({map:TEX.red}),
  roof:new THREE.MeshLambertMaterial({map:TEX.roof}),
  shoji:new THREE.MeshLambertMaterial({map:TEX.shoji,emissive:new THREE.Color(0xffb45e),emissiveIntensity:.2,emissiveMap:TEX.shoji}),
  paper:new THREE.MeshLambertMaterial({map:TEX.paper,emissive:new THREE.Color(0xffa040),emissiveIntensity:.35,emissiveMap:TEX.paper}),
  gold:new THREE.MeshLambertMaterial({map:TEX.gold,emissive:new THREE.Color(0x8a5a00),emissiveIntensity:.1}),
  bamboo:new THREE.MeshLambertMaterial({map:TEX.bamboo}),
  bambooNode:new THREE.MeshLambertMaterial({map:TEX.bambooNode}),
  bambooLeaf:new THREE.MeshLambertMaterial({map:TEX.bambooLeaf}),
  sakura:new THREE.MeshLambertMaterial({map:TEX.sakura}),
  sakuraLight:new THREE.MeshLambertMaterial({map:TEX.sakuraLight}),
  trunk:new THREE.MeshLambertMaterial({map:TEX.trunk}),
  leafDark:new THREE.MeshLambertMaterial({map:TEX.leafDark}),
  leafBright:new THREE.MeshLambertMaterial({map:TEX.leafBright}),
  stoneLantern:new THREE.MeshLambertMaterial({map:TEX.stoneLantern})
};
const vcMat=new THREE.MeshLambertMaterial({vertexColors:true});
const cloudMat=new THREE.MeshLambertMaterial({map:TEX.cloud,transparent:true,opacity:.93});
const waterMat=new THREE.MeshPhongMaterial({color:0x4a90c2,transparent:true,opacity:.72,shininess:110,specular:0xaaddff});

class Vox{
  constructor(){this.batches=new Map()}
  add(key,x,y,z,sx=1,sy=1,sz=1,rx=0,ry=0,rz=0,tint=null){
    let b=this.batches.get(key);
    if(!b){b={m:[],t:[]};this.batches.set(key,b)}
    const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz));
    b.m.push(new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),q,new THREE.Vector3(sx,sy,sz)));
    b.t.push(tint);
  }
  build(parent,shadow={}){
    const unit=new THREE.BoxGeometry(1,1,1);
    const white=new THREE.Color(0xffffff);
    for(const[key,b]of this.batches){
      const mesh=new THREE.InstancedMesh(unit,MATS[key],b.m.length);
      b.m.forEach((m,i)=>mesh.setMatrixAt(i,m));
      if(b.t.some(v=>v)){b.t.forEach((t,i)=>mesh.setColorAt(i,t||white));mesh.instanceColor.needsUpdate=true}
      const c=shadow[key]||{};
      mesh.castShadow=c.cast!==false;
      mesh.receiveShadow=c.receive!==false;
      parent.add(mesh);
    }
    this.batches.clear();
  }
}
const W=new Vox();

const CELL=4,N=112,HALF=N*CELL/2;
const POND={x:-40,z:28,rx:21,rz:11};
const PATHS=[
  {pts:[[0,96],[0,-30]],w:3.4},
  {pts:[[0,40],[-16,37],[-30,32],[-38,29]],w:2.6},
  {pts:[[-44,28],[-58,22],[-66,12]],w:2.4},
  {pts:[[0,52],[22,52],[42,55],[52,57]],w:2.6}
];
function distSeg(px,pz,ax,az,bx,bz){
  const dx=bx-ax,dz=bz-az,l2=dx*dx+dz*dz;
  let t=l2?((px-ax)*dx+(pz-az)*dz)/l2:0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+dx*t),pz-(az+dz*t));
}
function pathInfo(x,z){
  let best=1e9;
  for(const p of PATHS)for(let i=0;i<p.pts.length-1;i++)
    best=Math.min(best,distSeg(x,z,p.pts[i][0],p.pts[i][1],p.pts[i+1][0],p.pts[i+1][1]));
  return best;
}
function rawH(x,z){
  const r=Math.hypot(x,z);
  let h=fbm(x*.018+3,z*.018+7)*10*sstep(16,70,r)+fbm(x*.06,z*.06)*2;
  const mt=sstep(108,180,r);
  if(mt>0)h+=mt*mt*(46+fbm(x*.012+11,z*.012+5)*95+fbm(x*.05,z*.05)*10);
  return h;
}
function groundH(x,z){
  let h=rawH(x,z);
  h=lerp(h,2,1-sstep(20,34,Math.hypot(x,z+46)));
  h=lerp(h,2,1-sstep(24,38,Math.hypot(x-55,z-55)));
  const pd=pathInfo(x,z);
  if(pd<6)h=lerp(h,clamp(h,0,3),1-sstep(1.5,6,pd));
  const dx=(x-POND.x)/POND.rx,dz=(z-POND.z)/POND.rz;
  h=lerp(h,-7,sstep(.12,.7,1-Math.min(1,Math.hypot(dx,dz))));
  return Math.round(h/2)*2;
}

const HG=new Int16Array(N*N);
const WATER_CELLS=[];
for(let ix=0;ix<N;ix++)for(let iz=0;iz<N;iz++)
  HG[ix*N+iz]=groundH(ix*CELL-HALF+CELL/2,iz*CELL-HALF+CELL/2);
const qAt=(ix,iz)=>(ix<0||iz<0||ix>=N||iz>=N)?null:HG[ix*N+iz];
const cTmp=new THREE.Color();
for(let ix=0;ix<N;ix++)for(let iz=0;iz<N;iz++){
  const x=ix*CELL-HALF+CELL/2,z=iz*CELL-HALF+CELL/2,q=HG[ix*N+iz];
  const nb=[qAt(ix+1,iz),qAt(ix-1,iz),qAt(ix,iz+1),qAt(ix,iz-1)].filter(v=>v!==null);
  const nbMin=Math.min(q,...nb),nbMax=Math.max(q,...nb);
  const slope=nbMax-nbMin;
  const pe=1-Math.min(1,Math.hypot((x-POND.x)/POND.rx,(z-POND.z)/POND.rz));
  const isWater=pe>.28&&q<=-2;
  let cap='grass',tint=null;
  if(isWater){cap='sand';WATER_CELLS.push([x,z])}
  else if(q>60+vnoise(x*.05,z*.05)*16){cap='snow';tint=cTmp.setHSL(.6,.15,.88+hash2(ix,iz)*.09).clone()}
  else if(q>32+vnoise(x*.04+5,z*.04)*14||slope>6)cap='rock';
  else if(pathInfo(x,z)<2.6)cap='gravel';
  else if(pe>0&&q<=0&&q>=-2)cap='sand';
  else tint=cTmp.setHSL(.27+hash2(ix,iz)*.05,.42,.36+hash2(ix+7,iz)*.07).clone();
  const capH=isWater?2.4:Math.max(1.6,q-nbMin+2);
  W.add(cap,x,q+capH/2,z,CELL,capH,CELL,0,0,0,tint);
  const baseBot=Math.max(nbMin-2,q-18,-26);
  if(baseBot<q-1)W.add(q>26?'rock':'dirt',x,(q-1+baseBot)/2,z,CELL,q-1-baseBot,CELL);
}
W.add('rock',0,-27,0,HALF*2.4,4,HALF*2.4);

const waterMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),waterMat,WATER_CELLS.length);
WATER_CELLS.forEach(([x,z],i)=>waterMesh.setMatrixAt(i,new THREE.Matrix4().compose(new THREE.Vector3(x,-3.4,z),new THREE.Quaternion(),new THREE.Vector3(CELL,4.8,CELL))));
scene.add(waterMesh);

const lilyPads=[];
{
  const spots=WATER_CELLS.filter(([x])=>Math.abs(x-POND.x)>5);
  for(let i=0;i<9&&i<spots.length;i++){
    const[sx,sz]=spots[(i*7+3)%spots.length];
    const g=new THREE.Group();
    g.position.set(sx+(hash2(i,3)-.5)*3,-.75,sz+(hash2(i,9)-.5)*3);
    const pad=new THREE.Mesh(new THREE.BoxGeometry(1.9,.25,1.9),MATS.leafBright);
    pad.castShadow=false;pad.receiveShadow=true;g.add(pad);
    if(i<3){
      const lotus=new THREE.Mesh(new THREE.BoxGeometry(.55,.45,.55),MATS.sakuraLight);
      lotus.position.set(.3,.34,.2);g.add(lotus);
      const core=new THREE.Mesh(new THREE.BoxGeometry(.25,.25,.25),MATS.gold);
      core.position.set(.3,.6,.2);g.add(core);
    }
    g.rotation.y=hash2(i,11)*Math.PI;
    scene.add(g);
    lilyPads.push(g);
  }
}

const B=(k,x,y,z,sx=1,sy=1,sz=1,o={})=>W.add(k,x,y,z,sx,sy,sz,o.rx||0,o.ry||0,o.rz||0,o.tint||null);
const HANGING=[];
const PLIGHTS=[];
function addPL(x,y,z,color,base,dist=30){
  const l=new THREE.PointLight(color,0,dist,2);
  l.position.set(x,y,z);
  scene.add(l);
  PLIGHTS.push({l,base});
}
function hangingLantern(x,y,z){
  const g=new THREE.Group();
  g.position.set(x,y,z);
  const mk=(sx,sy,sz,oy,mat)=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
    m.position.y=oy;m.castShadow=true;
    g.add(m);return m;
  };
  mk(.14,1.5,.14,-.75,MATS.woodDark);
  mk(2,.45,2,-1.65,MATS.roof);
  mk(1.55,1.9,1.55,-2.8,MATS.paper);
  mk(1.15,.35,1.15,-3.9,MATS.roof);
  scene.add(g);
  HANGING.push(g);
}

function buildPagoda(){
  const CX=0,CZ=-52;
  B('rock',CX,1.8,CZ,34,3.6,34);
  B('rock',CX-6,2.4,CZ+19.5,12,.8,2.6,{ry:.06});
  B('rock',CX+6,2.4,CZ+19.5,12,.8,2.6,{ry:-.06});
  const tiers=[13,11.2,9.4,7.6,5.8],whs=[8,7.5,7,6.5,6];
  let ty=3.6;
  for(let i=0;i<5;i++){
    const s=tiers[i],wh=whs[i],px=s-.55;
    B('plank',CX,ty+.4,CZ,2*s+1.6,.8,2*s+1.6);
    for(const sx of[-px,px])for(const sz of[-px,px])B('woodDark',CX+sx,ty+wh/2,CZ+sz,1.1,wh,1.1);
    for(const m of[-s/2,s/2]){
      B('woodDark',CX+m,ty+wh/2,CZ-px,.9,wh,.9);
      B('woodDark',CX+m,ty+wh/2,CZ+px,.9,wh,.9);
      B('woodDark',CX-px,ty+wh/2,CZ+m,.9,wh,.9);
      B('woodDark',CX+px,ty+wh/2,CZ+m,.9,wh,.9);
    }
    B('woodDark',CX,ty+1.1,CZ-(s-.28),2*s-.5,2.2,.56);
    B('woodDark',CX,ty+1.1,CZ+(s-.28),2*s-.5,2.2,.56);
    B('woodDark',CX-(s-.28),ty+1.1,CZ,.56,2.2,2*s-.5);
    B('woodDark',CX+(s-.28),ty+1.1,CZ,.56,2.2,2*s-.5);
    const shH=wh-3.4,shY=ty+2.2+shH/2;
    B('shoji',CX,shY,CZ-(s-.48),2*s-2.2,shH,.3);
    B('shoji',CX,shY,CZ+(s-.48),2*s-2.2,shH,.3);
    B('shoji',CX-(s-.48),shY,CZ,.3,shH,2*s-2.2);
    B('shoji',CX+(s-.48),shY,CZ,.3,shH,2*s-2.2);
    const nM=Math.max(2,Math.floor(s/2));
    for(let k=0;k<=nM;k++){
      const mx=-s+.9+k*(2*s-1.8)/nM;
      B('woodDark',CX+mx,shY,CZ-(s-.42),.26,shH,.52);
      B('woodDark',CX+mx,shY,CZ+(s-.42),.26,shH,.52);
    }
    if(i===0){
      B('woodDark',CX-2.7,ty+3.6,CZ+(s-.32),.4,3.2,.6);
      B('woodDark',CX+2.7,ty+3.6,CZ+(s-.32),.4,3.2,.6);
    }
    if(i<3){
      const ro=s+.85,cnt=Math.max(3,Math.round(2*ro/2.8));
      for(let k=0;k<=cnt;k++){
        const off=-ro+k*2*ro/cnt;
        B('woodDark',CX+off,ty+1.85,CZ-ro,.42,2.1,.42);
        B('woodDark',CX+off,ty+1.85,CZ+ro,.42,2.1,.42);
        B('woodDark',CX-ro,ty+1.85,CZ+off,.42,2.1,.42);
        B('woodDark',CX+ro,ty+1.85,CZ+off,.42,2.1,.42);
      }
      B('red',CX,ty+2.95,CZ-ro,2*ro+.4,.3,.36);
      B('red',CX,ty+2.95,CZ+ro,2*ro+.4,.3,.36);
      B('red',CX-ro,ty+2.95,CZ,.36,.3,2*ro+.4);
      B('red',CX+ro,ty+2.95,CZ,.36,.3,2*ro+.4);

function updateAnimal(a,dt,T){
  a.timer-=dt;
  if(a.timer<=0){
    if(a.state==='walk'){
      a.state=Math.random()<.55?'graze':'idle';
      a.timer=a.state==='graze'?2.5+Math.random()*3:1.5+Math.random()*2.5;
    }else{
      a.state='walk';
      a.target=[30+Math.random()*52,32+Math.random()*48];
      a.timer=14;
    }
  }
  const p=a.root.position;
  let bobY;
  if(a.state==='walk'){
    const dx=a.target[0]-p.x,dz=a.target[1]-p.z;
    const want=Math.atan2(dx,dz);
    let diff=want-a.root.rotation.y;
    while(diff>Math.PI)diff-=6.283;
    while(diff<-Math.PI)diff+=6.283;
    a.root.rotation.y+=clamp(diff,-2.4*dt,2.4*dt);
    if(Math.hypot(dx,dz)>.6&&Math.abs(diff)<.9){
      p.x+=Math.sin(a.root.rotation.y)*a.speed*dt;
      p.z+=Math.cos(a.root.rotation.y)*a.speed*dt;
    }
    bobY=Math.abs(Math.sin(T*7+a.ph))*.12;
  }else bobY=Math.sin(T*1.7+a.ph)*.03;
  p.y=groundH(p.x,p.z)+bobY;
  a.neck.rotation.x=lerp(a.neck.rotation.x,a.state==='graze'?1.05:a.state==='idle'?Math.sin(T*.8+a.ph)*.06-.04:0,Math.min(1,dt*3));
}

    g.add(m);
  }
  g.position.set(-280+i*66,126+hash2(i,5)*48,-150+hash2(5,i)*230);
  scene.add(g);
  CLOUDS.push({g,v:1+hash2(i,9)*1.7});
}

const PET=[];
const petPos=new Float32Array(PETAL_TREES.length*26*3);
PETAL_TREES.forEach(t=>{for(let k=0;k<26;k++)PET.push({t,bx:t.x+(Math.random()-.5)*8,bz:t.z+(Math.random()-.5)*8,y:t.y+Math.random()*3,v:.8+Math.random(),ph:Math.random()*6.28})});
const petGeo=new THREE.BufferGeometry();
petGeo.setAttribute('position',new THREE.BufferAttribute(petPos,3).setUsage(THREE.DynamicDrawUsage));
const petPts=new THREE.Points(petGeo,new THREE.PointsMaterial({color:0xffc9dc,size:.85,transparent:true,opacity:.95,sizeAttenuation:true,depthWrite:false}));
petPts.frustumCulled=false;
scene.add(petPts);
function updatePetals(dt,T){
  for(let i=0;i<PET.length;i++){
    const p=PET[i];
    p.y-=p.v*dt;
    p.bx+=Math.sin(T*.9+p.ph)*dt*.8;
    p.bz+=Math.cos(T*.7+p.ph)*dt*.55;
    if(p.y<groundH(p.bx,p.bz)+.25){
      p.y=p.t.y+Math.random()*3;
      p.bx=p.t.x+(Math.random()-.5)*8;
      p.bz=p.t.z+(Math.random()-.5)*8;
    }
    petPos[i*3]=p.bx;petPos[i*3+1]=p.y;petPos[i*3+2]=p.bz;
  }
  petGeo.attributes.position.needsUpdate=true;
}

const starPos=new Float32Array(650*3);
for(let i=0;i<650;i++){
  const th=Math.random()*6.28,ph=Math.random()*Math.PI*.47,R=720;
  starPos[i*3]=Math.sin(ph)*Math.cos(th)*R;
  starPos[i*3+1]=Math.cos(ph)*R*.85+30;
  starPos[i*3+2]=Math.sin(ph)*Math.sin(th)*R;
}
const stars=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.BufferAttribute(starPos,3)),
  new THREE.PointsMaterial({color:0xffffff,size:1.7,sizeAttenuation:false,transparent:true,opacity:0,fog:false}));
stars.frustumCulled=false;
scene.add(stars);

const skyCube=(s,c)=>{
  const m=new THREE.Mesh(new THREE.BoxGeometry(s,s,s),new THREE.MeshBasicMaterial({color:c,fog:false,transparent:true}));
  scene.add(m);
  return m;
};
const sunCube=skyCube(20,0xffdf8a);
const moonCube=skyCube(13,0xe8eef8);

const hemi=new THREE.HemisphereLight(0xbfe0ff,0x86a06a,.6);
scene.add(hemi);
const amb=new THREE.AmbientLight(0xffffff,.3);
scene.add(amb);
const sun=new THREE.DirectionalLight(0xfff3da,1.5);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=40;
sun.shadow.camera.far=700;
sun.shadow.camera.left=-175;
sun.shadow.camera.right=175;
sun.shadow.camera.top=175;
sun.shadow.camera.bottom=-175;
sun.shadow.bias=-.0004;
sun.shadow.normalBias=.5;
scene.add(sun);
scene.add(sun.target);

const CC=h=>new THREE.Color(h);
const VV=(x,y,z)=>new THREE.Vector3(x,y,z);
const PRESETS={
  morning:{sky:CC(0xaad8ec),fogN:150,fogF:560,dir:VV(.5,.58,.42),dcol:CC(0xfff3da),di:1.5,hs:CC(0xbfe0ff),hg:CC(0x86a06a),hi:.6,ai:.3,glow:.22,st:0,sunP:VV(180,210,150),moonP:VV(0,-600,0),sv:1,mv:0,wc:CC(0x4a90c2)},
  sunset:{sky:CC(0xef9f66),fogN:120,fogF:520,dir:VV(-.85,.16,.38),dcol:CC(0xff9a4d),di:1.25,hs:CC(0xffb98c),hg:CC(0x6b5470),hi:.45,ai:.24,glow:.85,st:.08,sunP:VV(-330,62,148),moonP:VV(0,-600,0),sv:1,mv:0,wc:CC(0xd98a58)},
  night:{sky:CC(0x0c1230),fogN:100,fogF:470,dir:VV(.32,.75,-.4),dcol:CC(0xc3d7ff),di:.55,hs:CC(0x24344f),hg:CC(0x10131c),hi:.2,ai:.15,glow:1,st:1,sunP:VV(0,-600,0),moonP:VV(230,545,-288),sv:0,mv:1,wc:CC(0x1c3653)}
};
let curMode='morning';
const ENV={
  sky:CC(0xaad8ec),fogN:150,fogF:560,dir:VV(.5,.58,.42),dcol:CC(0xfff3da),di:1.5,
  hs:CC(0xbfe0ff),hg:CC(0x86a06a),hi:.6,ai:.3,glow:.22,st:0,
  sunP:VV(180,210,150),moonP:VV(0,-600,0),sv:1,mv:0,wc:CC(0x4a90c2)
};
scene.background=ENV.sky;
function applyEnv(){
  scene.fog.color.copy(ENV.sky);
  scene.fog.near=ENV.fogN;
  scene.fog.far=ENV.fogF;
  hemi.color.copy(ENV.hs);
  hemi.groundColor.copy(ENV.hg);
  hemi.intensity=ENV.hi;
  amb.intensity=ENV.ai;
  sun.color.copy(ENV.dcol);
  sun.intensity=ENV.di;
  sun.position.copy(ENV.dir).normalize().multiplyScalar(300);
  sun.target.position.set(0,0,-20);
  sunCube.position.copy(ENV.sunP);
  sunCube.material.opacity=ENV.sv;
  moonCube.position.copy(ENV.moonP);
  moonCube.material.opacity=ENV.mv;
  stars.material.opacity=ENV.st*.95;
  MATS.shoji.emissiveIntensity=.12+ENV.glow*.85;
  MATS.paper.emissiveIntensity=.3+ENV.glow*1.4;
  MATS.gold.emissiveIntensity=.06+ENV.glow*.22;
  waterMat.color.copy(ENV.wc);
  for(const p of PLIGHTS)p.l.intensity=p.base*ENV.glow;
}
applyEnv();

const CAMS={
  pagoda:[[30,20,-6],[0,22,-44]],
  samurai:[[13,3.8,-26.5],[7.5,3.2,-33]],
  meadow:[[32,11,88],[55,3,55]],
  vista:[[-175,92,185],[0,45,0]],
  birdseye:[[.01,260,40],[0,0,-10]]
};
let camAnim=null;
const easeSm=t=>t*t*t*(t*(t*6-15)+10);
function flyTo(name){
  const c=CAMS[name];
  camAnim={t:0,dur:1.7,p0:camera.position.clone(),p1:new THREE.Vector3(...c[0]),t0:controls.target.clone(),t1:new THREE.Vector3(...c[1])};
  controls.enabled=false;
}

const Ambience={
  ctx:null,on:false,
  start(){
    if(this.ctx)return;
    const ctx=this.ctx=new(window.AudioContext||window.webkitAudioContext)();
    this.master=ctx.createGain();
    this.master.gain.value=.8;
    this.master.connect(ctx.destination);
    const dl=ctx.createDelay(1);
    dl.delayTime.value=.31;
    const fb=ctx.createGain();fb.gain.value=.42;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
    dl.connect(lp);lp.connect(fb);fb.connect(dl);
    const wet=ctx.createGain();wet.gain.value=.5;
    dl.connect(wet);wet.connect(this.master);
    this.chimeBus=ctx.createGain();
    this.chimeBus.connect(this.master);
    this.chimeBus.connect(dl);
    const len=ctx.sampleRate*3,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
    let b=0;
    for(let i=0;i<len;i++){b=(b+(Math.random()*2-1)*.02)/1.02;d[i]=b*3.2}
    const src=ctx.createBufferSource();
    src.buffer=buf;src.loop=true;
    const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=380;filt.Q.value=.7;
    this.windG=ctx.createGain();this.windG.gain.value=.16;
    src.connect(filt);filt.connect(this.windG);this.windG.connect(this.master);
    const lfo=ctx.createOscillator();lfo.frequency.value=.05;
    const lg=ctx.createGain();lg.gain.value=.07;
    lfo.connect(lg);lg.connect(this.windG.gain);lfo.start();
    const lfo2=ctx.createOscillator();lfo2.frequency.value=.023;
    const lg2=ctx.createGain();lg2.gain.value=140;
    lfo2.connect(lg2);lg2.connect(filt.frequency);lfo2.start();
    src.start();
    this.schedule();
  },
  schedule(){
    setTimeout(()=>{
      if(this.on)this.chime();
      this.schedule();
    },2500+Math.random()*6500*(curMode==='night'?1.5:1));
  },
  chime(){
    const ctx=this.ctx,freqs=[392,440,523.25,587.33,659.25,784];
    const n=1+Math.floor(Math.random()*3),st=Math.floor(Math.random()*(freqs.length-n));
    for(let i=0;i<n;i++){
      const t=ctx.currentTime+i*.3+Math.random()*.05,f=freqs[st+i];
      const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;
      const o2=ctx.createOscillator();o2.type='sine';o2.frequency.value=f*2.005;
      const g=ctx.createGain(),g2=ctx.createGain();
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.14/n,t+.02);
      g.gain.exponentialRampToValueAtTime(.0003,t+3.5+Math.random()*3);
      g2.gain.value=.22;
      o2.connect(g2);g2.connect(g);
      o.connect(g);g.connect(this.chimeBus);
      o.start(t);o.stop(t+7);o2.start(t);o2.stop(t+7);
    }
  },
  toggle(){
    if(!this.ctx)this.start();
    else if(this.on)this.ctx.suspend();
    else this.ctx.resume();
    this.on=!this.on;
    return this.on;
  }
};

const setActive=(sel,el)=>document.querySelectorAll(sel).forEach(b=>b.classList.toggle('active',b===el));
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{
  curMode=b.dataset.mode;
  setActive('[data-mode]',b);
}));
document.querySelectorAll('[data-cam]').forEach(b=>b.addEventListener('click',()=>{
  flyTo(b.dataset.cam);
  setActive('[data-cam]',b);
}));
const audioBtn=document.getElementById('audioBtn');
audioBtn.addEventListener('click',()=>{
  const on=Ambience.toggle();
  document.getElementById('icoOn').classList.toggle('hidden',!on);
  document.getElementById('icoOff').classList.toggle('hidden',on);
});

const clock=new THREE.Clock();
let frames=0;
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05),T=clock.elapsedTime;
  const P=PRESETS[curMode],k=1-Math.exp(-dt*2.2);
  ENV.sky.lerp(P.sky,k);ENV.dcol.lerp(P.dcol,k);ENV.hs.lerp(P.hs,k);
  ENV.hg.lerp(P.hg,k);ENV.wc.lerp(P.wc,k);ENV.dir.lerp(P.dir,k);
  ENV.sunP.lerp(P.sunP,k);ENV.moonP.lerp(P.moonP,k);
  ENV.fogN=lerp(ENV.fogN,P.fogN,k);ENV.fogF=lerp(ENV.fogF,P.fogF,k);
  ENV.di=lerp(ENV.di,P.di,k);ENV.hi=lerp(ENV.hi,P.hi,k);ENV.ai=lerp(ENV.ai,P.ai,k);
  ENV.glow=lerp(ENV.glow,P.glow,k);ENV.st=lerp(ENV.st,P.st,k);
  ENV.sv=lerp(ENV.sv,P.sv,k);ENV.mv=lerp(ENV.mv,P.mv,k);
  applyEnv();
  if(camAnim){
    camAnim.t+=dt;
    const e=easeSm(Math.min(1,camAnim.t/camAnim.dur));
    camera.position.lerpVectors(camAnim.p0,camAnim.p1,e);
    controls.target.lerpVectors(camAnim.t0,camAnim.t1,e);
    if(camAnim.t>=camAnim.dur){camAnim=null;controls.enabled=true}
  }
  controls.update();
  for(const s of SAM){
    const br=Math.sin(T*1.3+s.ph);
    if(s.by===undefined)s.by=s.root.position.y;
    s.root.position.y=s.by+br*.04;
    s.torso.scale.y=1+br*.02;
    s.head.rotation.y=Math.sin(T*.5+s.ph)*.14;
  }
  for(const a of ANIMALS)updateAnimal(a,dt,T);
  updateBirds(T);
  for(const c of CLOUDS){
    c.g.position.x+=c.v*dt;
    if(c.g.position.x>320)c.g.position.x=-320;
  }
  updatePetals(dt,T);
  waterMesh.position.y=Math.sin(T*.7)*.07;
  HANGING.forEach((h,i)=>{
    h.rotation.z=Math.sin(T*.9+i)*.1;
    h.rotation.x=Math.cos(T*.7+i*1.7)*.07;
  });
  lilyPads.forEach((g,i)=>{g.position.y=-.75+Math.sin(T*.85+i)*.16});
  renderer.render(scene,camera);
  if(++frames===3){
    loaderEl.style.opacity='0';
    setTimeout(()=>loaderEl.remove(),900);
  }
}
tick();
</script>
