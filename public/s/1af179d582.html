<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: { disp:['"Shippori Mincho"','serif'], body:['"Zen Kaku Gothic New"','sans-serif'] },
    colors: { ink:'#0b1120', verm:'#e0472f', gold:'#f2c14e', moss:'#7fae62' }

<style>
  html,body{height:100%;overflow:hidden;background:#0b1120;}
  .glass{background:rgba(10,16,30,.44);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);}
  .btn{transition:all .22s cubic-bezier(.2,.9,.3,1.35);}
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(0) scale(.96);}
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{scrollbar-width:none}
  @keyframes enso{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  @keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
  .enso-ring{animation:enso 1.6s linear infinite;}
  .kanji-pulse{animation:breathe 2.4s ease-in-out infinite;}
  @keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .fadeup{animation:fadeup .8s ease both;}
  .fadeup-d1{animation-delay:.15s}.fadeup-d2{animation-delay:.3s}.fadeup-d3{animation-delay:.45s}
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ════════════════════════ RENDERER / SCENE ════════════════════════ */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9dff0);
scene.fog = new THREE.Fog(0xb9dff0, 70, 320);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 900);
camera.position.set(0.6, 16, 84);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .06;
controls.minDistance = 3; controls.maxDistance = 150;
controls.maxPolarAngle = 1.52;
controls.target.set(0, 6, -13);
controls.autoRotate = true; controls.autoRotateSpeed = .45;

/* ════════════════════════ 16×16 PIXEL TEXTURES ════════════════════════ */
function makeTex(paint){
  const c = document.createElement('canvas'); c.width = c.height = 16;
  paint(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function speck(g, colors, n){ for(let i=0;i<n;i++){ g.fillStyle = colors[(Math.random()*colors.length)|0]; g.fillRect((Math.random()*16)|0,(Math.random()*16)|0,1,1);} }

const TEX = {
  grass: makeTex(g=>{ g.fillStyle='#5d9c4a'; g.fillRect(0,0,16,16); speck(g,['#6db156','#4f8a3e','#79bd60','#548f42'],120); }),
  dirt:  makeTex(g=>{ g.fillStyle='#8a6a4a'; g.fillRect(0,0,16,16); speck(g,['#7a5c3e','#9a7a55','#6e5238'],90); }),
  stone: makeTex(g=>{ g.fillStyle='#8f9096'; g.fillRect(0,0,16,16); speck(g,['#7c7d84','#a2a3a9','#6f7076'],80);
    g.fillStyle='#6f7076'; g.fillRect(0,7,16,1); g.fillRect(7,0,1,7); g.fillRect(3,8,1,8); g.fillRect(11,8,1,8); }),
  gravel:makeTex(g=>{ g.fillStyle='#c9c2b2'; g.fillRect(0,0,16,16); speck(g,['#b8b0a0','#d8d2c4','#a8a090'],70);
    g.fillStyle='#a8a090'; for(let y=2;y<16;y+=4) g.fillRect(0,y,16,1); }),
  wood:  makeTex(g=>{ g.fillStyle='#7d5432'; g.fillRect(0,0,16,16); g.fillStyle='#6b4527';
    for(let x=0;x<16;x+=3) g.fillRect(x,0,1,16); speck(g,['#8a6038','#5c3a20'],40); }),
  darkwood: makeTex(g=>{ g.fillStyle='#4a3122'; g.fillRect(0,0,16,16); g.fillStyle='#3b2619';
    for(let x=1;x<16;x+=4) g.fillRect(x,0,1,16); speck(g,['#563a27','#33200f'],36); }),
  red:   makeTex(g=>{ g.fillStyle='#b8352b'; g.fillRect(0,0,16,16); speck(g,['#a02a22','#c94438','#8f211b'],60);
    g.fillStyle='#d4553f'; g.fillRect(2,2,1,4); g.fillRect(11,8,1,5); }),
  roof:  makeTex(g=>{ g.fillStyle='#3e4757'; g.fillRect(0,0,16,16);
    for(let y=0;y<16;y+=4){ g.fillStyle='#525e72'; g.fillRect(0,y,16,1); g.fillStyle='#333b49'; g.fillRect(0,y+3,16,1);} speck(g,['#485264'],30); }),
  gold:  makeTex(g=>{ g.fillStyle='#e0ab35'; g.fillRect(0,0,16,16); speck(g,['#f5cf6a','#c2901f','#ffe9a0'],70); }),
  snow:  makeTex(g=>{ g.fillStyle='#eef4fa'; g.fillRect(0,0,16,16); speck(g,['#dce8f4','#ffffff','#cfdcec'],60); }),
  rock:  makeTex(g=>{ g.fillStyle='#6f7078'; g.fillRect(0,0,16,16); speck(g,['#5e5f67','#7f8089','#55565e'],90);
    g.fillStyle='#4c4d55'; g.fillRect(3,2,1,6); g.fillRect(10,7,1,7); }),
  water: makeTex(g=>{ g.fillStyle='#3f7fae'; g.fillRect(0,0,16,16); speck(g,['#37739f','#4a8dbd'],50);
    g.fillStyle='#7fc3e8'; for(let y=2;y<16;y+=5){ g.fillRect((y*3)%14,y,3,1); g.fillRect((y*7)%12,(y+2)%16,2,1);} }),
  shoji: makeTex(g=>{ g.fillStyle='#f4e3c2'; g.fillRect(0,0,16,16); speck(g,['#eedbb5','#f9ecd2'],30);
    g.fillStyle='#6b4527'; g.fillRect(0,0,16,1); g.fillRect(0,15,16,1); g.fillRect(0,0,1,16); g.fillRect(15,0,1,16);
    g.fillRect(7,0,2,16); g.fillRect(0,7,16,2); }),
  lantern: makeTex(g=>{ g.fillStyle='#f7c877'; g.fillRect(0,0,16,16); speck(g,['#f2bd63','#fcd98f'],40);
    g.fillStyle='#b8352b'; g.fillRect(0,0,16,2); g.fillRect(0,14,16,2); g.fillRect(7,4,2,8); }),
  sakura: makeTex(g=>{ g.fillStyle='#f2a7c3'; g.fillRect(0,0,16,16); speck(g,['#e78fb2','#f9c3d7','#d97ba6','#fcd7e4'],110); }),
  bamboo: makeTex(g=>{ g.fillStyle='#69a84f'; g.fillRect(0,0,16,16); speck(g,['#5c9a44','#79b85e'],50);
    g.fillStyle='#4c8a38'; g.fillRect(0,3,16,1); g.fillRect(0,11,16,1); g.fillStyle='#8cc96f'; g.fillRect(0,4,16,1); g.fillRect(0,12,16,1); }),
  bLeaf: makeTex(g=>{ g.fillStyle='#4f8f3f'; g.fillRect(0,0,16,16); speck(g,['#5fa04c','#417c33','#6fb25b'],80); }),
  cloud: makeTex(g=>{ g.fillStyle='#ffffff'; g.fillRect(0,0,16,16); speck(g,['#e8edf4','#f4f7fb'],50);
    g.fillStyle='#dfe6ee'; g.fillRect(0,14,16,2); }),
  paper: makeTex(g=>{ g.fillStyle='#ffffff'; g.fillRect(0,0,16,16); speck(g,['#f2f2f2','#e8e8e8','#fafafa'],60); }),
  wool:  makeTex(g=>{ g.fillStyle='#f2efe6'; g.fillRect(0,0,16,16); speck(g,['#e2ddcd','#fbf9f2','#d6d0bd'],100); }),
  sun:   makeTex(g=>{ g.fillStyle='#ffcf52'; g.fillRect(0,0,16,16); g.fillStyle='#ffe694'; g.fillRect(3,3,10,10);
    g.fillStyle='#ffb02e'; g.fillRect(0,0,16,1); g.fillRect(0,15,16,1); g.fillRect(0,0,1,16); g.fillRect(15,0,1,16); }),
  moon:  makeTex(g=>{ g.fillStyle='#e8ecf4'; g.fillRect(0,0,16,16); speck(g,['#c9cfdd','#f6f8fc'],50);
    g.fillStyle='#b9c0d2'; g.fillRect(4,5,3,3); g.fillRect(10,9,2,2); g.fillRect(6,11,2,2); })
};
TEX.water.wrapS = TEX.water.wrapT = THREE.RepeatWrapping;

/* materials */
const LM = (map,extra={}) => new THREE.MeshLambertMaterial({map,...extra});
const MAT = {
  grass:LM(TEX.grass), dirt:LM(TEX.dirt), stone:LM(TEX.stone), gravel:LM(TEX.gravel),
  wood:LM(TEX.wood), darkwood:LM(TEX.darkwood), red:LM(TEX.red), roof:LM(TEX.roof),
  gold:LM(TEX.gold), snow:LM(TEX.snow), rock:LM(TEX.rock), wool:LM(TEX.wool),
  sakura:LM(TEX.sakura), bamboo:LM(TEX.bamboo), bLeaf:LM(TEX.bLeaf), cloud:LM(TEX.cloud), paper:LM(TEX.paper),
  shoji: LM(TEX.shoji,{emissive:0xffc27d, emissiveMap:TEX.shoji, emissiveIntensity:.3}),
  lamp:  LM(TEX.lantern,{emissive:0xff8f3f, emissiveMap:TEX.lantern, emissiveIntensity:.4}),
  water: LM(TEX.water,{transparent:true, opacity:.93})
};

/* ════════════════════════ INSTANCED VOXEL BATCHING ════════════════════════ */
const BOX = new THREE.BoxGeometry(1,1,1);
class Batch{
  constructor(mat){ this.mat=mat; this.items=[]; }
  add(x,y,z,sx,sy,sz,o={}){ this.items.push([x,y+sy/2,z,sx,sy,sz,o.c??0xffffff,o.rx??0,o.ry??0,o.rz??0]); }
  build(cast=true,recv=true){
    const im = new THREE.InstancedMesh(BOX,this.mat,this.items.length);
    const m=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(),
          p=new THREE.Vector3(), s=new THREE.Vector3(), col=new THREE.Color();
    this.items.forEach((it,i)=>{ e.set(it[7],it[8],it[9]); q.setFromEuler(e);
      p.set(it[0],it[1],it[2]); s.set(it[3],it[4],it[5]);
      m.compose(p,q,s); im.setMatrixAt(i,m); im.setColorAt(i,col.setHex(it[6])); });
    im.castShadow=cast; im.receiveShadow=recv; im.frustumCulled=false;
    scene.add(im); return im;
  }
}
const B = {};
for(const k of ['grass','dirt','stone','gravel','wood','darkwood','red','roof','gold','snow','rock',
                'sakura','bamboo','bLeaf','paper','shoji','lamp','water','wool']) B[k]=new Batch(MAT[k]);
/* foot-anchored add: y is the BOTTOM of the block */
const A = (b,x,y,z,sx,sy,sz,o)=>b.add(x,y,z,sx,sy,sz,o);

/* small mesh helper for animated characters (micro-voxels) */
function v(parent,mat,x,y,z,sx,sy,sz,rx=0,ry=0,rz=0){
  const m = new THREE.Mesh(BOX,mat); m.scale.set(sx,sy,sz);
  m.position.set(x,y+sy/2,z); m.rotation.set(rx,ry,rz); m.castShadow=true;
  parent.add(m); return m;
}
const F = c=>new THREE.MeshLambertMaterial({color:c});

/* ════════════════════════ GROUND / POND / PATHS ════════════════════════ */
const worldBase = new THREE.Mesh(new THREE.PlaneGeometry(500,500), MAT.dirt);
worldBase.rotation.x = -Math.PI/2; worldBase.position.y = -1.1; worldBase.receiveShadow = true;
scene.add(worldBase);

const POND = {x:15, z:11, rx:7.5, rz:6};
const inPond = (x,z,f=1)=> ((x-POND.x)**2)/((POND.rx*f)**2) + ((z-POND.z)**2)/((POND.rz*f)**2) <= 1;

for(let x=-44;x<44;x+=2) for(let z=-44;z<44;z+=2){
  const cx=x+1, cz=z+1;
  if(inPond(cx,cz,1.02)) continue;
  const tint = .9+Math.random()*.18;
  A(B.grass,x,-1,z,2,1,2,{c:new THREE.Color(tint*.95,tint,tint*.9).getHex()});
}
/* pond water + dirt bed + shore stones */
for(let x=6;x<25;x+=2) for(let z=3;z<19;z+=2){
  const cx=x+1, cz=z+1;
  if(inPond(cx,cz,.88)){ A(B.water,x,-0.95,z,2,.8,2,{c:0x9fc8e8}); A(B.dirt,x,-1.6,z,2,.6,2); }
  else if(inPond(cx,cz,1.15) && Math.random()<.8){
    A(B.stone,x,-0.15,z,2,.55,2,{c:0x99a0a8 + (Math.random()*0x101010|0)});
  }
}
/* lily pads + lotus */
[[12.5,9],[17,8.4],[14,13.4],[18.5,12.5],[11.5,12]].forEach(([x,z],i)=>{
  A(B.grass,x,-0.18,z,.7,.06,.55,{c:0x3f7c33, ry:Math.random()*3});
  if(i%2===0) A(B.sakura,x,-0.11,z,.18,.12,.18,{c:0xffd1e0});

  for(let i=0;i<3;i++) v(head,M.dark,0,.4-i*.11,-.27,.5-i*.06,.09,.12); // shikoro
  v(head,M.gold,0,.6,.24,.1,.15,.06);                     // crescent jewel
  v(head,M.gold,-.13,.66,.24,.06,.3,.05,0,0,.55);
  v(head,M.gold, .13,.66,.24,.06,.3,.05,0,0,-.55);
  /* sheathed katana, edge-down at left hip */

  v(g,M.white,-.36,1.05,.5,.1,.11,.3,0,.18);
  return {g,torso,sodeL,sodeR,head,ph:Math.random()*7};
}

/* ════════════════════════ AUDIO — wind + chimes + night bell ════════════════════════ */
const AudioSys={
  ctx:null,on:false,nextChime:0,nextBell:0,
  init(){ if(this.ctx) return;
    const C=this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    this.master=C.createGain(); this.master.gain.value=.85; this.master.connect(C.destination);
    const len=C.sampleRate*2, buf=C.createBuffer(1,len,C.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=C.createBufferSource(); src.buffer=buf; src.loop=true;
    const bp=C.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=480; bp.Q.value=.6;
    const wg=C.createGain(); wg.gain.value=.05;
    src.connect(bp); bp.connect(wg); wg.connect(this.master); src.start();
    const lfo=C.createOscillator(); lfo.frequency.value=.07;
    const lg=C.createGain(); lg.gain.value=230; lfo.connect(lg); lg.connect(bp.frequency); lfo.start();
    const lfo2=C.createOscillator(); lfo2.frequency.value=.05;
    const lg2=C.createGain(); lg2.gain.value=.02; lfo2.connect(lg2); lg2.connect(wg.gain); lfo2.start();
    this.chimeIn=C.createGain(); this.chimeIn.connect(this.master);
    this.delay=C.createDelay(1); this.delay.delayTime.value=.31;
    const fb=C.createGain(); fb.gain.value=.36; this.delay.connect(fb); fb.connect(this.delay);
    const wet=C.createGain(); wet.gain.value=.24; this.delay.connect(wet); wet.connect(this.master);
    this.chimeIn.connect(this.delay);
  },
  note(f,vol=.11,dur=3){
    const C=this.ctx,t=C.currentTime;
    const o=C.createOscillator(), g=C.createGain();
    o.type='sine'; o.frequency.value=f;
    const o2=C.createOscillator(), g2=C.createGain();
    o2.type='sine'; o2.frequency.value=f*2.01; g2.gain.value=vol*.3;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012);
    g.exponentialRampToValueAtTime(1e-4,t+dur);
    g2.gain.setValueAtTime(0,t); g2.gain.linearRampToValueAtTime(vol*.3,t+.01);
    g2.gain.exponentialRampToValueAtTime(1e-4,t+dur*.6);
    const pan=C.createStereoPanner?C.createStereoPanner():null;
    o.connect(g); o2.connect(g2);
    let out=g; g2.connect(g);
    if(pan){ pan.pan.value=(Math.random()-.5)*.9; g.connect(pan); out=pan; }
    out.connect(this.chimeIn);
    o.start(); o2.start(); o.stop(t+dur+.2); o2.stop(t+dur+.2);
  },
  bell(){
    const C=this.ctx,t=C.currentTime;
    [[98,.1],[196.5,.06],[262,.03]].forEach(([f,vv])=>{
      const o=C.createOscillator(),g=C.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vv,t+.03);
      g.gain.exponentialRampToValueAtTime(1e-4,t+7);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t+7.2);
    });
  },
  toggle(){ this.init(); this.on=!this.on;
    if(this.on) this.ctx.resume(); else this.ctx.suspend();
    document.getElementById('audioIco').textContent=this.on?'🔔':'🔇';
    document.getElementById('audioTxt').textContent=this.on?'Wind & Chimes — on':'Wind & Chimes — off';
  }
};
const PENTA=[659.25,739.99,830.61,987.77,1108.73];

/* ════════════════════════ CAMERA PRESETS & TWEEN ════════════════════════ */
const VIEWS={
  pagoda:{p:[13,8.5,13],t:[0,6.5,-10]},
  gate:{p:[.6,3.4,38],t:[0,5.5,-14]},
  samurai:{p:[6.3,2.1,24.2],t:[4.2,1.25,20.5]},
  meadow:{p:[-25,5.5,27],t:[-15,1.4,16.5]},
  vista:{p:[3,13,34],t:[0,26,-140]},
  bird:{p:[2,88,36],t:[0,0,2]}
};
const VIEW_KEYS=Object.keys(VIEWS);
let camTween=null;
function flyTo(key,dur=2.3){
  const v=VIEWS[key];
  camTween={t:0,dur,p0:camera.position.clone(),t0:controls.target.clone(),
    p1:new THREE.Vector3(...v.p),t1:new THREE.Vector3(...v.t)};
  controls.autoRotate=false; syncOrbitBtn();
  document.querySelectorAll('.vbtn').forEach(b=>{
    const on=b.dataset.view===key;
    b.classList.toggle('bg-gold/25',on); b.classList.toggle('border-gold/50',on);

}
function ease(k){ return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2; }

/* ════════════════════════ UI WIRING ════════════════════════ */
document.querySelectorAll('.tbtn').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
document.querySelectorAll('.vbtn').forEach(b=>b.addEventListener('click',()=>flyTo(b.dataset.view)));
document.getElementById('audioBtn').addEventListener('click',()=>AudioSys.toggle());
const orbitBtn=document.getElementById('orbitBtn');
function syncOrbitBtn(){ orbitBtn.classList.toggle('bg-gold/40',controls.autoRotate); }
orbitBtn.addEventListener('click',()=>{ controls.autoRotate=!controls.autoRotate; syncOrbitBtn(); });
renderer.domElement.addEventListener('pointerdown',()=>{ if(!camTween){controls.autoRotate=false; syncOrbitBtn();} },{once:false});
addEventListener('keydown',e=>{
  if(e.key==='1')setMode('morning'); if(e.key==='2')setMode('sunset'); if(e.key==='3')setMode('night');
  if(e.key==='m'||e.key==='M')AudioSys.toggle();
  if(e.key==='o'||e.key==='O'){controls.autoRotate=!controls.autoRotate;syncOrbitBtn();}
  if(e.key==='c'||e.key==='C'){
    const i=VIEW_KEYS.indexOf([...document.querySelectorAll('.vbtn')].find(b=>b.classList.contains('border-gold/50'))?.dataset.view??'');
    flyTo(VIEW_KEYS[(i+1)%VIEW_KEYS.length]);
  }
});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);

/* ════════════════════════ ANIMATION LOOP ════════════════════════ */
const clock=new THREE.Clock();
const _m=new THREE.Matrix4(), _q=new THREE.Quaternion(), _e=new THREE.Euler(),
      _p=new THREE.Vector3(), _s=new THREE.Vector3(), _c=new THREE.Color();

flyTo('gate',3.4);   // cinematic approach through the torii
setTimeout(()=>{ const l=document.getElementById('loader'); l.style.opacity='0'; setTimeout(()=>l.remove(),750); },400);

function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  const k=1-Math.exp(-2.6*dt);

  /* --- smooth time-of-day transition --- */
  cur.sky.lerp(TGT.sky,k); cur.hemiS.lerp(TGT.hemiS,k); cur.hemiG.lerp(TGT.hemiG,k);
  cur.sunC.lerp(TGT.sunC,k); cur.sun.lerp(TGT.sun,k);
  for(const key of ['hemiI','sunI','lantern','stars','exp','day','fogN','fogF'])
    cur[key]+=(TGT[key]-cur[key])*k;
  scene.background.copy(cur.sky); scene.fog.color.copy(cur.sky);
  scene.fog.near=cur.fogN; scene.fog.far=cur.fogF;
  hemi.color.copy(cur.hemiS); hemi.groundColor.copy(cur.hemiG); hemi.intensity=cur.hemiI;
  sunLight.color.copy(cur.sunC); sunLight.intensity=cur.sunI;
  sunLight.position.copy(cur.sun).normalize().multiplyScalar(140);
  renderer.toneMappingExposure=cur.exp;
  starMat.opacity=cur.stars*.95;
  flyMat.opacity=Math.max(0,(cur.day<.5? (1-cur.day*2):0))*.9;
  MAT.shoji.emissiveIntensity=.25+cur.lantern*.9;
  MAT.lamp.emissiveIntensity=.35+cur.lantern*1.25;
  lampLights.forEach(L=>L.intensity=cur.lantern*8);
  const cd=_p.copy(cur.sun).normalize().multiplyScalar(255);
  sunCube.position.copy(cd); moonCube.position.copy(cd);
  sunCube.scale.setScalar(.001+cur.day*11); moonCube.scale.setScalar(.001+(1-cur.day)*9);

  /* --- living elements --- */
  TEX.water.offset.x+=dt*.02; TEX.water.offset.y+=dt*.008;
  clouds.forEach(c=>{ c.mesh.position.x+=c.speed*dt; if(c.mesh.position.x>180)c.mesh.position.x=-180; });

  flocks.forEach(f=>{
    f.root.rotation.y+=f.speed*dt;
    f.root.position.y+=Math.sin(t*.4+f.phase)*dt*.4;
    f.wings.forEach(w=>{ w.piv.rotation.z=w.s*(0.15+0.75*Math.abs(Math.sin(t*9+w.ph))); });
  });

  for(let i=0;i<pState.length;i++){
    const p=pState[i];
    p.y-=p.vy*dt; p.x+=Math.sin(t*1.3+p.ph)*dt*.7+.15*dt; p.z+=Math.cos(t*1.1+p.ph)*dt*.5;
    if(p.y<.05) respawnPetal(p);
    _e.set(t*2+p.ph,p.ph,t+p.ph); _q.setFromEuler(_e);
    _p.set(p.x,p.y,p.z); _s.setScalar(p.s*.16/.1); _m.compose(_p,_q,_s);
    petals.setMatrixAt(i,_m);
  }
  petals.instanceMatrix.needsUpdate=true;

  for(let i=0;i<flyState.length;i++){
    const f=flyState[i];
    _p.set(f.x+Math.sin(t*.7+f.p)*1.2, f.y+Math.sin(t*1.1+f.p*2)*.5, f.z+Math.cos(t*.6+f.p)*1.2);
    _s.setScalar(1+Math.sin(t*3+f.p)*.4); _q.identity(); _m.compose(_p,_q,_s);
    fireflies.setMatrixAt(i,_m);
  }
  fireflies.instanceMatrix.needsUpdate=true;

  samurais.forEach(s=>{
    const b=Math.sin(t*1.6+s.ph);
    s.torso.scale.y=1+b*.02; s.torso.scale.x=1-b*.008;
    s.sodeL.position.y=1.32+b*.012; s.sodeR.position.y=1.32+b*.012;
    s.head.rotation.x=Math.sin(t*.7+s.ph)*.03; s.head.rotation.y=Math.sin(t*.35+s.ph)*.08;
  });

  animals.forEach(a=>{
    a.t-=dt;
    if(a.mode==='walk'){
      const dx=a.tx-a.g.position.x, dz=a.tz-a.g.position.z, d=Math.hypot(dx,dz);
      if(d<.25||a.t<0){ a.mode=Math.random()<.5?'graze':'idle'; a.t=1.5+Math.random()*3; }
      else{
        a.g.position.x+=dx/d*a.speed*dt; a.g.position.z+=dz/d*a.speed*dt;
        const want=Math.atan2(dx,dz);
        let diff=want-a.g.rotation.y; diff=Math.atan2(Math.sin(diff),Math.cos(diff));
        a.g.rotation.y+=diff*Math.min(1,dt*4);
        a.g.position.y=Math.abs(Math.sin(t*7+a.ph))*.05;
        a.head.rotation.x*= .9;
      }
    } else {
      a.g.position.y*= .9;
      if(a.mode==='graze'){
        a.head.rotation.x+= ( .95-a.head.rotation.x)*Math.min(1,dt*3);
        if(a.t<0){ a.mode='idle'; a.t=.8+Math.random()*2; }
      } else {
        a.head.rotation.x*= (1-Math.min(1,dt*3));
        if(a.t<0){
          a.mode='walk'; a.t=8;
          a.tx=a.home[0]+(Math.random()-.5)*9; a.tz=a.home[1]+(Math.random()-.5)*7;
        }
      }
    }
  });

  /* --- audio scheduling --- */
  if(AudioSys.on){
    if(t>AudioSys.nextChime){
      const n=1+(Math.random()*3|0);
      for(let i=0;i<n;i++) setTimeout(()=>AudioSys.note(PENTA[(Math.random()*PENTA.length)|0]),i*260);
      AudioSys.nextChime=t+5+Math.random()*9;
    }
    if(modeName==='night'&&t>AudioSys.nextBell){ AudioSys.bell(); AudioSys.nextBell=t+38+Math.random()*45; }
  }

  /* --- camera tween & controls --- */
  if(camTween){
    camTween.t+=dt/camTween.dur;
    const kk=ease(Math.min(1,camTween.t));
    camera.position.lerpVectors(camTween.p0,camTween.p1,kk);
    controls.target.lerpVectors(camTween.t0,camTween.t1,kk);
    if(camTween.t>=1) camTween=null;
  }
  controls.update();
  renderer.render(scene,camera);
}
tick();
</script>
