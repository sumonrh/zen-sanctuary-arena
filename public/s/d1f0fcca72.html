<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8" />
  <title>Zen Sanctuary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
    canvas { display: block; }
    .glass {
      background: rgba(255,255,255,0.08);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn {
      @apply text-white/90 px-3 py-2 rounded-md hover:bg-white/10 transition;
    }
    .btn-active {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.25);
    }
    .label {
      @apply text-xs uppercase tracking-widest text-white/70;
    }
  </style>
</head>
<body>
  <div id="ui" class="absolute top-3 left-3 right-3 md:left-6 md:right-auto z-20 glass rounded-xl p-3 md:p-4 flex flex-col gap-3 md:max-w-[520px]">
    <div class="flex items-center justify-between">
      <div>
        <div class="text-white font-semibold text-lg">Zen Sanctuary</div>
        <div class="text-white/60 text-xs">Minecraft-style Voxel World • Three.js</div>
      </div>
      <button id="audioBtn" class="btn glass border border-white/20">Enable Audio</button>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
      <div class="col-span-2 md:col-span-3">
        <div class="label mb-1">Time Mode</div>
        <div class="flex gap-2">
          <button id="modeMorning" class="btn btn-active">Morning</button>
          <button id="modeSunset" class="btn">Sunset</button>
          <button id="modeNight" class="btn">Night</button>
        </div>
      </div>
      <div class="col-span-2 md:col-span-3">
        <div class="label mb-1">Camera Presets</div>
        <div class="flex flex-wrap gap-2">
          <button class="btn" data-preset="pagoda">Pagoda Front</button>
          <button class="btn" data-preset="samurai">Samurai Closeup</button>
          <button class="btn" data-preset="meadow">Pastoral Meadow</button>
          <button class="btn" data-preset="mountain">Mountain Vista</button>
          <button class="btn" data-preset="bird">Bird's Eye</button>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.162.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.162.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.162.0/examples/jsm/controls/OrbitControls.js';

    // --- Renderer & Scene ---
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1020);

    // --- Camera & Controls ---
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
    camera.position.set(35, 26, 45);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 6, 0);
    controls.enableDamping = true;
    controls.enablePan = true;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minDistance = 8;
    controls.maxDistance = 180;

    // --- Helpers: Random & Ease ---
    const rand = (a,b) => a + Math.random()*(b-a);
    const lerp = (a,b,t) => a + (b-a)*t;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    // --- Pixel Canvas Texture Factory ---
    function makePixelTexture(painter, size=16, interpolate=false) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      for (let y=0; y<size; y++){
        for (let x=0; x<size; x++){
          const i = (y*size + x)*4;
          const col = painter(x,y,size);
          img.data[i+0] = col[0];
          img.data[i+1] = col[1];
          img.data[i+2] = col[2];
          img.data[i+3] = col[3] ?? 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.generateMipmaps = false;
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.needsUpdate = true;
      return tex;
    }

    // --- Palette ---
    const PAL = {
      woodDark: [68, 45, 35],
      woodRed: [160, 36, 36],
      woodBrown: [102, 66, 45],
      roofDark: [24, 26, 30],
      gold: [230, 186, 41],
      shoji: [255, 238, 192],
      stone: [120, 120, 120],
      stoneDark: [96, 96, 96],
      grass: [58, 122, 60],
      dirt: [92, 66, 44],
      leaf: [50, 142, 72],
      bamboo: [74, 160, 66],
      sakura: [245, 170, 190],
      water: [26, 94, 162],
      snow: [235, 240, 250],
      sheepWool: [245, 245, 245],
      alpacaFur: [230, 210, 180],
      bird: [30, 40, 60]
    };

    // --- Common Pixel Patterns ---
    const checker = (c1, c2, scale=4) => (x,y,n)=>{
      const b = (((x/scale|0)+(y/scale|0))%2===0);
      return b ? c1.concat(255) : c2.concat(255);
    };
    const noisy = (base, variance=20) => (x,y,n)=>{
      const r = (Math.sin(x*12.9898 + y*78.233)*43758.5453)%1;
      const v = base.map((v,i)=> i<3 ? clamp(v + (r-0.5)*variance, 0, 255)|0 : v);
      return v.concat(255);
    };
    const stripes = (c1, c2, scale=3) => (x,y,n)=>{
      const b = ((y/scale|0)%2===0);
      return b ? c1.concat(255) : c2.concat(255);
    };
    const dots = (bg, dot, gap=4) => (x,y,n)=>{
      const b = ((x%gap===0) && (y%gap===0));
      return (b ? dot : bg).concat(255);
    };

    // --- Materials ---
    const mat = {
      woodDark: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(checker(PAL.woodDark, PAL.woodBrown, 4)), roughness: 0.8, metalness: 0 }),
      woodRed: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(noisy(PAL.woodRed, 12)), roughness: 0.7, metalness: 0 }),
      roof: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(stripes(PAL.roofDark, [18,18,22], 2)), roughness: 0.9, metalness: 0 }),
      gold: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(noisy(PAL.gold, 8)), roughness: 0.3, metalness: 0.6, emissive: 0x332200, emissiveIntensity: 0.1 }),
      shoji: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(dots(PAL.shoji, [255,200,150], 4)), roughness: 0.4, metalness: 0, emissive: 0xfff1c1, emissiveIntensity: 0.3 }),
      stone: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(noisy(PAL.stone, 18)), roughness: 0.95, metalness: 0 }),
      stoneDark: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(noisy(PAL.stoneDark, 12)), roughness: 0.95, metalness: 0 }),
      grass: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(noisy(PAL.grass, 14)), roughness: 0.95, metalness: 0 }),
      dirt: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(noisy(PAL.dirt, 10)), roughness: 0.95 }),
      leaf: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(noisy(PAL.leaf, 16)), roughness: 0.9 }),
      bamboo: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(stripes(PAL.bamboo, [64,128,54], 2)), roughness: 0.9 }),
      sakura: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(noisy(PAL.sakura, 18)), roughness: 0.9 }),
      wool: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(noisy(PAL.sheepWool, 10)), roughness: 0.95 }),
      alpaca: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(noisy(PAL.alpacaFur, 12)), roughness: 0.95 }),
      water: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(checker(PAL.water, [22, 70, 140], 2)), transparent: true, opacity: 0.82, roughness: 0.5, metalness: 0 }),
      bird: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(noisy(PAL.bird, 12)), roughness: 1.0 }),
      lightEmissive: new THREE.MeshStandardMaterial({ color: 0xffffff, map: makePixelTexture(noisy([255,200,120], 10)), emissive: 0xffddaa, emissiveIntensity: 0.9, roughness: 0.7 })
    };

    // --- Lighting: Sky Light + Ambient ---
    const ambient = new THREE.AmbientLight(0xffffff, 0.18);
    scene.add(ambient);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.1);
    sunLight.position.set(40, 60, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 200;
    sunLight.shadow.camera.left = -80;
    sunLight.shadow.camera.right = 80;
    sunLight.shadow.camera.top = 80;
    sunLight.shadow.camera.bottom = -80;
    scene.add(sunLight);

    // Visible square Sun/Moon voxel
    const skyVoxelGeo = new THREE.BoxGeometry(4,4,1);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xfff2a1 });
    const moonMat = new THREE.MeshBasicMaterial({ color: 0xbcd1ff });
    const skyVoxel = new THREE.Mesh(skyVoxelGeo, sunMat);
    skyVoxel.position.set(100, 80, -120);
    scene.add(skyVoxel);

    // --- Voxel Builder Helpers ---
    function voxelBox(w, h, d, material) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function placeVoxel(group, x, y, z, w, h, d, material) {
      const m = voxelBox(w, h, d, material);
      m.position.set(x + w/2, y + h/2, z + d/2);
      group.add(m);
      return m;
    }

    const world = new THREE.Group();
    scene.add(world);

    // --- Terrain (variable voxel sizes 2 & 4) with Pond ---
    const terrain = new THREE.Group();
    world.add(terrain);

    function heightFunc(ix, iz) {
      // Coarse ridged noise-like function
      const nx = ix/10, nz = iz/10;
      const v = Math.abs(Math.sin(nx*0.8) + Math.cos(nz*0.6) + Math.sin((nx+nz)*0.5)*0.8);
      return Math.floor(v*3 + Math.sin(nx*0.3)*2 + Math.cos(nz*0.4)*2);
    }

    const TERR_SIZE = 20; // grid in cells
    const CELL = 2;       // each cell 2x2 meters
    const pondCenter = new THREE.Vector2(0, 6);
    for (let iz=-TERR_SIZE; iz<=TERR_SIZE; iz++) {
      for (let ix=-TERR_SIZE; ix<=TERR_SIZE; ix++) {
        const x = ix * CELL, z = iz * CELL;
        const r = Math.hypot(ix-pondCenter.x, iz-pondCenter.y);
        let h = heightFunc(ix, iz);
        // Carve pond
        if (r < 6) h = Math.min(h, 0);
        // base dirt column
        for (let y=0; y<h; y+=2) {
          placeVoxel(terrain, x, y*1, z, CELL, 2, CELL, y < h-2 ? mat.dirt : mat.grass);
        }
      }
    }

    // Pond water plane & lily pads
    const waterY = 1.1;
    const water = voxelBox(24, 0.6, 24, mat.water);
    water.position.set((pondCenter.x*CELL)+1, waterY, (pondCenter.y*CELL)+1);
    water.receiveShadow = true; water.castShadow = false;
    terrain.add(water);

    const lilyPads = new THREE.Group();
    terrain.add(lilyPads);
    for (let i=0;i<20;i++){
      const lx = rand(-8,8) + pondCenter.x*CELL;
      const lz = rand(-8,8) + pondCenter.y*CELL;
      if (Math.hypot(lx-pondCenter.x*CELL, lz-pondCenter.y*CELL) < 12) {
        const pad = voxelBox(0.8, 0.2, 0.8, mat.leaf);
        pad.position.set(lx, waterY+0.4, lz);
        lilyPads.add(pad);
      }
    }

    // Stone stepping path
    const path = new THREE.Group();
    world.add(path);
    for (let i=0;i<18;i++){
      const px = lerp(-20, 6, i/17), pz = lerp(18, 8, i/17);
      placeVoxel(path, px, 2, pz, 1.6, 0.4, 1.6, mat.stoneDark);
    }

    // --- Torii Gate (red beams) ---
    const torii = new THREE.Group();
    world.add(torii);
    const toriiBaseX = -8, toriiBaseZ = 10;
    // pillars
    placeVoxel(torii, toriiBaseX, 2, toriiBaseZ, 1, 8, 1, mat.woodRed);
    placeVoxel(torii, toriiBaseX+6, 2, toriiBaseZ, 1, 8, 1, mat.woodRed);
    // top lintel beams
    placeVoxel(torii, toriiBaseX-1, 10, toriiBaseZ, 9, 1, 1, mat.woodRed);
    placeVoxel(torii, toriiBaseX-1, 11, toriiBaseZ, 9, 1, 1, mat.woodRed);
    // small tie beam
    placeVoxel(torii, toriiBaseX+2, 8, toriiBaseZ, 3, 1, 1, mat.woodRed);

    // --- Pagoda Temple (1x1 voxels with tiers) ---
    const pagoda = new THREE.Group();
    world.add(pagoda);
    pagoda.position.set(6, 0, 0);

    function boxAdd(g, x,y,z, w,h,d, m){ placeVoxel(g, x,y,z,w,h,d,m); }

    // base platform (stone)
    boxAdd(pagoda, -6, 2, -6, 14, 2, 14, mat.stone);
    // level columns and shoji
    function pagodaTier(yBase, size, roofOverhang) {
      const half = size/2;
      // columns
      const colPos = [
        [-half, yBase, -half], [half-1, yBase, -half],
        [-half, yBase, half-1], [half-1, yBase, half-1]
      ];
      colPos.forEach(p => boxAdd(pagoda, p[0], p[1], p[2], 1, 6, 1, mat.woodDark));
      // walls with shoji window strips
      boxAdd(pagoda, -half, yBase+2, -half+1, size-2, 3, 1, mat.shoji);
      boxAdd(pagoda, -half, yBase+2, half-2, size-2, 3, 1, mat.shoji);
      boxAdd(pagoda, -half+1, yBase+2, -half, 1, 3, size-2, mat.shoji);
      boxAdd(pagoda, half-2, yBase+2, -half+1, 1, 3, size-2, mat.shoji);

      // roof tier (dark roof with flared eaves)
      const roofY = yBase+6;
      const roofSize = size + roofOverhang;
      boxAdd(pagoda, -half - roofOverhang/2, roofY, -half - roofOverhang/2, roofSize, 1, roofSize, mat.roof);
      // small corner eaves (flare)
      const e = 2;
      boxAdd(pagoda, -half - roofOverhang/2 - e, roofY, -half - roofOverhang/2, e, 1, 1, mat.roof);
      boxAdd(pagoda, half + roofOverhang/2, roofY, -half - roofOverhang/2, e, 1, 1, mat.roof);
      boxAdd(pagoda, -half - roofOverhang/2, roofY, half + roofOverhang/2, 1, 1, e, mat.roof);
      boxAdd(pagoda, half + roofOverhang/2, roofY, half + roofOverhang/2, 1, 1, e, mat.roof);
    }

    pagodaTier(3, 10, 4);
    pagodaTier(10, 8, 4);
    pagodaTier(17, 6, 3);

    // gold spire (Sorin)
    boxAdd(pagoda, -0.5, 24, -0.5, 1, 6, 1, mat.gold);

    // lanterns (Kasuga-dōrō) around pagoda and path
    const lanterns = new THREE.Group();
    world.add(lanterns);

    function addLantern(x,z){
      const g = new THREE.Group();
      const base = voxelBox(1, 0.6, 1, mat.stone);
      base.position.set(x, 2.3, z);
      const pole = voxelBox(0.4, 2.2, 0.4, mat.stoneDark);
      pole.position.set(x, 3.4, z);
      const head = voxelBox(1, 1, 1, mat.lightEmissive);
      head.position.set(x, 4.4, z);
      g.add(base, pole, head);
      const L = new THREE.PointLight(0xffcda0, 0.0, 18, 2.0);
      L.position.set(x, 4.6, z);
      L.castShadow = false;
      g.add(L);
      g.userData.light = L;
      lanterns.add(g);
    }

    [-4, 0, 4].forEach(dx=>{
      addLantern(pagoda.position.x + dx, pagoda.position.z - 8);
      addLantern(pagoda.position.x + dx, pagoda.position.z + 8);
    });
    [-14, -10, -6, -2].forEach((s,i)=>{
      addLantern(toriiBaseX + 3, toriiBaseZ + s);
    });

    // --- Arch Bridge (Taiko-bashi) over pond ---
    const bridge = new THREE.Group();
    world.add(bridge);
    bridge.position.set(pondCenter.x*CELL, 0, pondCenter.y*CELL-8);
    const steps = 9;
    for (let i=0;i<steps;i++){
      const t = i/(steps-1);
      const x = lerp(-6, 6, t);
      const y = 3 + Math.sin(t*Math.PI) * 2.4;
      // arch steps
      placeVoxel(bridge, x-0.5, y, 12, 2, 0.6, 2, mat.woodRed);
      // side rails
      placeVoxel(bridge, x-0.8, y+1.0, 11, 0.4, 1, 0.4, mat.woodRed);
      placeVoxel(bridge, x-0.8, y+1.0, 13.6, 0.4, 1, 0.4, mat.woodRed);
    }

    // --- Bamboo Grove & Bushes ---
    const flora = new THREE.Group();
    world.add(flora);

    function addBamboo(x,z,h=8,nodes=5){
      const g = new THREE.Group();
      for (let i=0;i<nodes;i++){
        placeVoxel(g, x, 2+i*(h/nodes), z, 0.6, h/nodes, 0.6, mat.bamboo);
      }
      // simple leaves cluster
      placeVoxel(g, x-0.6, 2+h, z, 1.6, 1.2, 1.6, mat.leaf);
      placeVoxel(g, x+0.6, 2+h-0.4, z+0.4, 1.6, 1.2, 1.6, mat.leaf);
      flora.add(g);
    }

    for (let i=0;i<14;i++){
      addBamboo(rand(-20,-6), rand(-5,15), rand(6,10), 6);
    }

    function addBush(x,z){
      const g = new THREE.Group();
      placeVoxel(g, x, 2.2, z, 2, 1.2, 2, mat.leaf);
      placeVoxel(g, x+0.6, 2.8, z+0.4, 1.6, 1.0, 1.6, mat.leaf);
      flora.add(g);
    }
    for (let i=0;i<10;i++){
      addBush(rand(-8,18), rand(-6,16));
    }

    // --- Sakura Trees with falling petals ---
    const sakuraGroup = new THREE.Group();
    world.add(sakuraGroup);

    function addSakura(x,z,h=8){
const g = new THREE.Group();
      // trunk
      placeVoxel(g, x, 2, z, 1.4, 4, 1.4, mat.woodDark);
      placeVoxel(g, x-1.4, 5.5, z, 1, 2, 1, mat.woodDark);
      placeVoxel(g, x+1.4, 6, z, 1, 2, 1, mat.woodDark);
      // blossom canopy
      for (let i=0;i<45;i++){
        const bx = x + rand(-4,4), bz = z + rand(-4,4), by = 5 + rand(1.5,3.5);
        if (Math.hypot(bx-x, bz-z) < 4.2) {
          placeVoxel(g, bx, by, bz, 1.3, 1.3, 1.3, mat.sakura);
        }
      }
      // falling petal particles (sakura planes)
      const petalMat = new THREE.MeshBasicMaterial({ map: mat.sakura.map, transparent: true, side: THREE.DoubleSide, depthWrite: false });
      for (let i=0;i<24;i++){
        const petal = new THREE.Mesh(new THREE.PlaneGeometry(0.16,0.16), petalMat);
        petal.position.set(x+rand(-4,4), 5+rand(3,7), z+rand(-4,4));
        petal.rotation.set(rand(0,Math.PI), rand(0,Math.PI), rand(0,Math.PI));
        scene.add(petal);
        petals.push({ mesh: petal, speed: 0.01+Math.random()*0.02, sway: Math.random()*Math.PI*2 });
      }
      sakuraGroup.add(g);
      return g;
    }

    const petals = [];
    const samuraiUnits = [];
    const animals = [];
    const birds = [];
    const clouds = [];

    addSakura(12, 12, 9);
    addSakura(-12, 14, 8);
    addSakura(-10, 2, 10);

    // --- Samurai Guardians (micro-voxels) ---
    function addSamurai(x, z, facing){
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      g.rotation.y = facing;
      // legs
      placeVoxel(g, -0.2, 0, 0, 0.28, 0.55, 0.28, mat.stoneDark);
      placeVoxel(g,  0.2, 0, 0, 0.28, 0.55, 0.28, mat.stoneDark);
      // torso (Do armor)
      placeVoxel(g, 0, 0.55, 0, 0.55, 0.55, 0.35, mat.woodDark);
      // shoulder guards (Sode)
      placeVoxel(g, -0.4, 0.85, 0, 0.28, 0.2, 0.3, mat.stoneDark);
      placeVoxel(g,  0.4, 0.85, 0, 0.28, 0.2, 0.3, mat.stoneDark);
      // head
      placeVoxel(g, 0, 1.05, 0, 0.28, 0.28, 0.28, mat.shoji);
      // kabuto helmet + gold crescent
      placeVoxel(g, 0, 1.38, 0, 0.35, 0.16, 0.35, mat.stoneDark);
      placeVoxel(g, 0, 1.58, 0.16, 0.22, 0.1, 0.06, mat.gold);
      // katana
      placeVoxel(g, 0.48, 0.55, 0.2, 0.08, 0.65, 0.08, mat.gold);
      g.userData = { anim: Math.random()*Math.PI*2, baseY: 0 };
      samuraiUnits.push(g);
      scene.add(g);
      return g;
    }
    addSamurai(7.2, 7, 0);
    addSamurai(4.8, 7, 0);

    // --- Animals: Sheep & Alpacas (micro-voxels) ---
    function addSheep(x, z){
      const g = new THREE.Group();
      g.position.set(x, 2, z);
      placeVoxel(g, 0, 0.3, 0, 0.75, 0.45, 0.45, mat.wool);   // body
      placeVoxel(g, 0.45, 0.35, 0, 0.28, 0.28, 0.28, mat.wool); // head
      placeVoxel(g, -0.25, 0, -0.12, 0.12, 0.3, 0.12, mat.wool); // legs
      placeVoxel(g,  0.25, 0, -0.12, 0.12, 0.3, 0.12, mat.wool);
      placeVoxel(g, -0.25, 0,  0.12, 0.12, 0.3, 0.12, mat.wool);
      placeVoxel(g,  0.25, 0,  0.12, 0.12, 0.3, 0.12, mat.wool);
      g.userData = { anim: Math.random()*Math.PI*2, baseX: x, baseZ: z, type: 'sheep' };
      animals.push(g);
      world.add(g);
      return g;
    }
    function addAlpaca(x, z){
      const g = new THREE.Group();
      g.position.set(x, 2, z);
      placeVoxel(g, 0, 0.3, 0, 0.65, 0.5, 0.42, mat.alpaca);   // body
      placeVoxel(g, 0.3, 0.6, 0, 0.22, 0.45, 0.22, mat.alpaca); // neck
      placeVoxel(g, 0.35, 0.95, 0, 0.28, 0.28, 0.28, mat.alpaca); // head
      placeVoxel(g, 0.35, 1.25, 0.16, 0.1, 0.2, 0.1, mat.alpaca); // ears
      placeVoxel(g, 0.35, 1.25, -0.16, 0.1, 0.2, 0.1, mat.alpaca);
      placeVoxel(g, -0.25, 0, -0.12, 0.14, 0.32, 0.14, mat.wool); // legs
      placeVoxel(g,  0.25, 0, -0.12, 0.14, 0.32, 0.14, mat.wool);
      placeVoxel(g, -0.25, 0,  0.12, 0.14, 0.32, 0.14, mat.wool);
      placeVoxel(g,  0.25, 0,  0.12, 0.14, 0.32, 0.14, mat.wool);
      g.userData = { anim: Math.random()*Math.PI*2, baseX: x, baseZ: z, type: 'alpaca' };
      animals.push(g);
      world.add(g);
      return g;
    }
    for (let i=0;i<5;i++) addSheep(rand(-14,4), rand(10,20));
    for (let i=0;i<4;i++) addAlpaca(rand(-14,4), rand(10,20));

    // --- Flying Birds ---
    function addBird(x, y, z){
      const g = new THREE.Group();
      g.position.set(x, y, z);
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.16,0.36), mat.bird);
      const wingL = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.05,0.16), mat.bird);
      wingL.position.set(-0.26, 0, 0);
      const wingR = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.05,0.16), mat.bird);
      wingR.position.set(0.26, 0, 0);
      g.add(body, wingL, wingR);
      g.userData = { anim: Math.random()*Math.PI*2, baseX: x, baseY: y, baseZ: z, wingL, wingR };
      birds.push(g);
      scene.add(g);
      return g;
    }
    for (let i=0;i<8;i++) addBird(rand(-10,14), 18+rand(0,8), rand(-6,14));

    // --- Clouds ---
    function addCloud(x, y, z){
      const g = new THREE.Group();
      g.position.set(x, y, z);
      for (let i=0;i<5;i++){
        const puff = new THREE.Mesh(new THREE.BoxGeometry(rand(2,4), rand(1,2), rand(2,4)), mat.wool);
        puff.position.set(rand(-3,3), rand(-0.5,0.5), rand(-2,2));
        g.add(puff);
      }
      clouds.push(g);
      scene.add(g);
      return g;
    }
    for (let i=0;i<6;i++) addCloud(rand(-24,24), 26+rand(0,6), rand(-20,10));

    // --- Time-of-Day Modes ---
    const times = {
      morning: { bg: 0x87ceeb, sun: 0xfff2a1, light: 1.1, amb: 0.5, lantern: 0.2 },
      sunset:  { bg: 0xffb47a, sun: 0xffa44f, light: 0.8, amb: 0.35, lantern: 0.6 },
      night:   { bg: 0x0a1028, sun: 0xbcd1ff, light: 0.25, amb: 0.15, lantern: 1.2 }
    };
    let currentTime = 'morning';
    function setTime(name){
      currentTime = name;
      const t = times[name];
      scene.background = new THREE.Color(t.bg);
      renderer.setClearColor(t.bg, 1);
      sunLight.color.setHex(t.sun);
      sunLight.intensity = t.light;
      ambient.intensity = t.amb;
      skyVoxel.material = name === 'night' ? moonMat : sunMat;
      lanterns.children.forEach(g => { if (g.userData.light) g.userData.light.intensity = t.lantern; });
    }
    setTime('morning');

    // --- Camera Presets ---
    const presets = {
      pagoda:  { pos: [18, 14, 24], tgt: [6, 6, 0] },
      samurai: { pos: [6, 5, 10],   tgt: [6, 4, 7] },
      meadow:  { pos: [-6, 10, 30], tgt: [-4, 4, 14] },
      mountain:{ pos: [30, 22, 32], tgt: [0, 6, 0] },
      bird:    { pos: [0, 45, 10],  tgt: [0, 6, 0] }
    };
    function gotoPreset(name){
      const p = presets[name];
      if (!p) return;
      camera.position.set(...p.pos);
      controls.target.set(...p.tgt);
      controls.update();
    }
    gotoPreset('pagoda');

    // --- UI Events ---
    document.getElementById('modeMorning').onclick = () => setTime('morning');
    document.getElementById('modeSunset').onclick  = () => setTime('sunset');
    document.getElementById('modeNight').onclick   = () => setTime('night');
    document.querySelectorAll('[data-preset]').forEach(btn => {
      btn.onclick = () => gotoPreset(btn.dataset.preset);
    });

    // --- Ambient Audio (wind + chimes) ---
    let audioCtx = null;
    function startAudio(){
      if (audioCtx) { audioCtx.resume(); return; }
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuf; src.loop = true;
      const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
      const gain = audioCtx.createGain(); gain.gain.value = 0.12;
      src.connect(lp).connect(gain).connect(audioCtx.destination);
      src.start();
      (function chime(){
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const g2 = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.value = 700+Math.random()*500;
        g2.gain.setValueAtTime(0, audioCtx.currentTime);
        g2.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime+0.05);
        g2.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+1.8);
        osc.connect(g2).connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime+1.9);
        setTimeout(chime, 4000+Math.random()*5000);
      })();
    }
    document.getElementById('audioBtn').onclick = () => {
      startAudio();
      document.getElementById('audioBtn').textContent = 'Audio On';
    };

    // --- Animation Loop ---
    let lastTime = performance.now();
    function animate(now){
      requestAnimationFrame(animate);
      const dt = Math.min((now-lastTime)/1000, 0.05); lastTime = now;
      const t = now*0.001;

      // falling sakura petals
      petals.forEach(p=>{
        p.mesh.position.y -= p.speed;
        p.mesh.position.x += Math.sin(t*1.5 + p.sway)*0.01;
        p.mesh.rotation.z += 0.03;
        if (p.mesh.position.y < 2) p.mesh.position.y = 8 + Math.random()*4;
      });

      // samurai idle breathing
      samuraiUnits.forEach(s=>{
        s.position.y = s.userData.baseY + Math.sin(t*2 + s.userData.anim)*0.04;
        s.scale.y = 1 + Math.sin(t*2 + s.userData.anim)*0.03;
      });

      // animals wandering & grazing
      animals.forEach(a=>{
        const w = Math.sin(t*0.5 + a.userData.anim)*0.3;
        a.position.x = a.userData.baseX + w;
        a.position.z = a.userData.baseZ + Math.cos(t*0.5 + a.userData.anim)*0.3;
        a.rotation.y = Math.sin(t*0.3 + a.userData.anim)*0.25;
      });

      // birds flapping & circling
      birds.forEach((b,i)=>{
        b.userData.wingL.rotation.z = Math.sin(t*6 + b.userData.anim)*0.6;
        b.userData.wingR.rotation.z = -Math.sin(t*6 + b.userData.anim)*0.6;
        b.position.x = b.userData.baseX + Math.sin(t*0.4 + i)*2;
        b.position.z = b.userData.baseZ + Math.cos(t*0.4 + i)*2;
        b.position.y = b.userData.baseY + Math.sin(t*0.8 + i)*0.5;
      });

      // clouds drifting
      clouds.forEach(c=>{
        c.position.x += dt*2;
        if (c.position.x > 30) c.position.x = -30;
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate(performance.now());

    // --- Resize ---
    addEventListener('resize', ()=>{
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
