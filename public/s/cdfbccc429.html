  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const PAGODA = { x: 0, z: -8 };
const POND = { x: 16, z: 6, rx: 7.15, rz: 5.15 };
const TORII_Z = 31.2;
const V = 0.25;

const buckets = {};
const waterItems = [];
const lilyItems = [];
let voxelTotal = 0;

const samurai = [];
const animals = [];
const birds = [];
const clouds = [];
const bambooSway = [];
const fireflies = [];
const koi = [];
let petalMesh = null;
let petalData = [];
let waterMesh = null;
let lilyMesh = null;
let drip = null;

const dummy = new THREE.Object3D();
const clock = new THREE.Clock();

function mulberry32(seed) {
  let a = seed >>> 0;
  return function rand() {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260325);

function hash2(ix, iz) {
  let n = Math.imul(ix | 0, 374761393) + Math.imul(iz | 0, 668265263);
  n = (n ^ (n >>> 13)) >>> 0;
  n = Math.imul(n, 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

function vnoise(x, z) {
  const x0 = Math.floor(x);
  const z0 = Math.floor(z);
  const tx = x - x0;
  const tz = z - z0;
  const sx = tx * tx * (3 - 2 * tx);
  const sz = tz * tz * (3 - 2 * tz);
  const a = hash2(x0, z0);
  const b = hash2(x0 + 1, z0);
  const c = hash2(x0, z0 + 1);
  const d = hash2(x0 + 1, z0 + 1);
  return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
}

function fbm(x, z) {
  let v = 0;
  let a = 0.5;
  let f = 1;
  for (let i = 0; i < 4; i++) {
    v += a * vnoise(x * f, z * f);
    f *= 2;
    a *= 0.5;
  }
  return v;
}

function smoothstep(e0, e1, x) {
  const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
  return t * t * (3 - 2 * t);
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function clampByte(v) {
  return Math.max(0, Math.min(255, v | 0));
}

function makeTex(paint, size = 16) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const g = canvas.getContext('2d');
  paint(g, size);
  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

function noisyFill(g, s, hex, amount, rng, extra) {
  const [r, gv, b] = hexToRgb(hex);
  for (let y = 0; y < s; y++) {
    for (let x = 0; x < s; x++) {
      const n = (rng() - 0.5) * amount;
      g.fillStyle = `rgb(${clampByte(r + n)},${clampByte(gv + n)},${clampByte(b + n)})`;
      g.fillRect(x, y, 1, 1);
    }
  }
  if (extra) extra(g, s, rng);
}

function texOf(hex, amount, seed, extra) {
  const rng = mulberry32(seed);
  return makeTex((g, s) => noisyFill(g, s, hex, amount, rng, extra));
}

function addVoxel(type, x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0) {
  (buckets[type] ||= []).push({ x, y, z, sx, sy, sz, rx, ry, rz });
  voxelTotal++;
}

function inPond(x, z) {
  const dx = (x - POND.x) / POND.rx;
  const dz = (z - POND.z) / POND.rz;
  return dx * dx + dz * dz <= 1;
}
function onPlatform(x, z) {
  return Math.abs(x - PAGODA.x) <= 7.2 && Math.abs(z - PAGODA.z) <= 7.2;
}
function inGarden(x, z) {
  return x >= 8.2 && x <= 15.2 && z >= -16.2 && z <= -9.2;
}

const PEAKS = [
  { x: -28, z: -84, h: 56, r: 32 },
  { x: 42, z: -90, h: 70, r: 36 },
  { x: 6, z: -124, h: 74, r: 34 },
  { x: -74, z: -68, h: 48, r: 30 },
  { x: 92, z: -36, h: 44, r: 28 },
  { x: -104, z: -6, h: 42, r: 30 },
  { x: -36, z: 96, h: 38, r: 32 },
  { x: 64, z: 86, h: 36, r: 28 },
  { x: 116, z: 18, h: 40, r: 26 },
  { x: -92, z: 54, h: 34, r: 24 },
  { x: 18, z: -70, h: 28, r: 18 },
];

function terrainHeight(x, z) {
  let h = 0;
  for (const p of PEAKS) {
    const d = Math.hypot(x - p.x, z - p.z) / p.r;
    if (d < 1) {
      const s = 1 - d;
      h = Math.max(h, p.h * s * s * (3 - 2 * s));
    }
  }
  h += (fbm(x * 0.021, z * 0.021) - 0.32) * 12;
  h += (fbm(x * 0.055 + 9, z * 0.055) - 0.5) * 4.5;
  const dist = Math.hypot(x, z);
  h *= smoothstep(40, 64, dist);
  return Math.max(0, h);
}

function emitTerrain(step, minR, maxR) {
  const hmap = new Map();
  const cells = [];
  const limit = Math.ceil(maxR / step) * step;
  for (let x = -limit; x <= limit; x += step) {
    for (let z = -limit; z <= limit; z += step) {
      const d = Math.hypot(x, z);
      if (d < minR || d > maxR) continue;
      let h = Math.round(terrainHeight(x, z) / step) * step;
      if (h < 0) h = 0;
      const key = x + ',' + z;
      hmap.set(key, h);
      cells.push({ x, z, h });
    }
  }
  const dirs = [[step, 0], [-step, 0], [0, step], [0, -step]];
  for (const c of cells) {
    if (c.h <= 0) {
      const t = hash2(c.x, c.z) > 0.78 ? 'dirt' : hash2(c.x + 3, c.z) > 0.86 ? 'moss' : 'grass';
      addVoxel(t, c.x, -0.42, c.z, step, 0.84, step);
      continue;
    }
    for (let y = 0; y < c.h; y += step) {
      const isTop = y + step >= c.h - 0.001;
      let exposed = isTop;
      if (!exposed) {
        for (const [dx, dz] of dirs) {
          const nh = hmap.get((c.x + dx) + ',' + (c.z + dz));
          if (nh === undefined || nh <= y) {
            exposed = true;
            break;
          }
        }
      }
      if (!exposed) continue;
      let type = 'rock';
      if (isTop && c.h >= 30) type = 'snow';
      else if (isTop && c.h <= 8) type = 'grass';
      else if (isTop && c.h <= 16) type = 'moss';
      else if (!isTop && y < 6) type = 'dirt';
      addVoxel(type, c.x, y + step / 2, c.z, step, step, step);
    }
  }
}

function buildGardenFloor() {
  for (let x = -40; x <= 40; x++) {
    for (let z = -40; z <= 40; z++) {
      if (Math.hypot(x, z) > 39.2) continue;
      if (inPond(x, z)) continue;
      if (onPlatform(x, z)) continue;
      if (inGarden(x, z)) continue;
      const onPath = Math.abs(x) <= 1 && z >= -1 && z <= 33;
      if (onPath) {
        addVoxel('gravel', x, -0.4, z, 1, 0.8, 1);
        continue;
      }
      const n = hash2(x * 3 + 11, z * 5 - 2);
      const type = n > 0.9 ? 'moss' : n > 0.84 ? 'dirt' : 'grass';
      addVoxel(type, x, -0.42, z, 1, 0.84, 1);
      if (n > 0.72 && n < 0.8 && z > -2 && x < -6) {
        addVoxel(n > 0.76 ? 'flower' : 'flowerYellow', x, 0.16, z, 0.16, 0.16, 0.16);
        addVoxel('leaf', x, 0.06, z, 0.06, 0.16, 0.06);
      }
    }
  }
}

function buildPond() {
  for (let x = 8; x <= 24; x++) {
    for (let z = 0; z <= 12; z++) {
      const dx = (x - POND.x) / POND.rx;
      const dz = (z - POND.z) / POND.rz;
      const d2 = dx * dx + dz * dz;
      if (d2 <= 1.02) {
        waterItems.push({
          x, y: -0.24, z, sx: 1, sy: 0.36, sz: 1,
          ph: hash2(x, z) * Math.PI * 2, sp: 1.1 + hash2(x + 4, z) * 0.6,
        });
        voxelTotal++;
      } else if (d2 <= 1.42) {
        addVoxel('stone', x, 0.08, z, 1, 0.28, 1);
        if (hash2(x, z + 9) > 0.72) addVoxel('moss', x, 0.24, z, 0.45, 0.12, 0.38);
      }
    }
  }
  const pads = [
    [12.2, 3.6, 1], [13.4, 8.6, 0], [19.4, 3.2, 1], [20.6, 8.8, 1],
    [14.8, 9.5, 0], [18.2, 8.2, 1], [11.4, 7.6, 0], [21.6, 4.2, 1], [14.0, 2.4, 0],
  ];
  for (const [x, z, flower] of pads) {
    if (Math.abs(x - POND.x) < 0.9) continue;
    lilyItems.push({ x, y: 0.02, z, sx: 0.78, sy: 0.06, sz: 0.72, ph: x, sp: 0.8, rx: 0, ry: 0.4, rz: 0 });
    voxelTotal++;
    if (flower) {
      addVoxel('lilyFlower', x + 0.08, 0.12, z - 0.05, 0.16, 0.12, 0.16);
      addVoxel('sakuraPale', x - 0.06, 0.12, z + 0.06, 0.12, 0.1, 0.12);
    }
  }
}

function buildBridge() {
  const z = POND.z;
  const x0 = POND.x - POND.rx + 0.35;
  const x1 = POND.x + POND.rx - 0.35;
  const span = x1 - x0;
  const H = 2.35;
  const n = 16;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const x = x0 + span * t;
    const y = Math.sin(Math.PI * t) * H;
    const dydx = Math.cos(Math.PI * t) * H * Math.PI / span;
    const rot = Math.atan(dydx);
    const plank = span / n + 0.16;
    addVoxel('vermilion', x, y + 0.1, z, plank, 0.14, 1.4, 0, 0, rot);
    addVoxel('wood', x, y + 0.01, z, plank * 0.88, 0.08, 1.05, 0, 0, rot);
    if (i % 2 === 0) {
      addVoxel('vermilion', x, y + 0.48, z - 0.64, 0.12, 0.58, 0.12);
      addVoxel('vermilion', x, y + 0.48, z + 0.64, 0.12, 0.58, 0.12);
    }
    addVoxel('vermilionDark', x, y + 0.8, z - 0.64, plank, 0.08, 0.1, 0, 0, rot);
    addVoxel('vermilionDark', x, y + 0.8, z + 0.64, plank, 0.08, 0.1, 0, 0, rot);
  }
  addVoxel('stone', x0 - 0.45, 0.2, z, 0.9, 0.4, 1.8);
  addVoxel('stone', x1 + 0.45, 0.2, z, 0.9, 0.4, 1.8);
}

function buildSteppingStones() {
  for (let z = 29.2; z >= 0.4; z -= 1.62) {
    const j = (hash2(Math.round(z * 10), 7) - 0.5) * 0.85;
    const ry = (hash2(Math.round(z * 10), 3) - 0.5) * 0.5;
    addVoxel('stone', j, 0.1, z, 0.92, 0.18, 0.66, 0, ry, 0);
    if (hash2(Math.round(z * 10), 11) > 0.62) {
      addVoxel('stoneDark', j + 0.72, 0.08, z + 0.28, 0.48, 0.14, 0.4, 0, ry * 0.5, 0);
    }
  }
}

function buildGravelGarden() {
  for (let x = 9; x <= 15; x++) {
    for (let z = -16; z <= -9; z++) {
      addVoxel('sand', x, -0.36, z, 1, 0.72, 1);
      if ((x + z) % 3 === 0) addVoxel('sandDark', x, 0.02, z, 0.82, 0.035, 0.1);
    }
  }
  addVoxel('rock', 11.1, 0.38, -13.1, 0.72, 0.72, 0.55);
  addVoxel('rock', 11.35, 0.9, -13.15, 0.4, 0.42, 0.34);
  addVoxel('rock', 12.45, 0.28, -12.15, 0.46, 0.42, 0.4);
  addVoxel('moss', 10.35, 0.22, -13.7, 0.38, 0.28, 0.32);
  addVoxel('rock', 13.6, 0.2, -14.4, 0.3, 0.26, 0.28);
}

function buildTorii() {
  const z = TORII_Z;
  const pillarX = 3.35;
  for (const sx of [-1, 1]) {
    addVoxel('stoneDark', sx * pillarX, 0.18, z, 1.05, 0.36, 1.05);
    addVoxel('vermilion', sx * pillarX, 3.35, z, 0.72, 6.0, 0.72);
    addVoxel('vermilionDark', sx * pillarX, 6.42, z, 0.78, 0.22, 0.82);
  }
  for (let i = -9; i <= 9; i++) {
    const x = i * 0.52;
    const lift = Math.pow(Math.abs(i) / 9, 2) * 0.62;
    addVoxel('vermilion', x, 6.15 + lift, z, 0.52, 0.36, 0.78);
    addVoxel('vermilionDark', x, 6.42 + lift, z, 0.52, 0.16, 0.84);
  }
  for (let i = -7; i <= 7; i++) {
    addVoxel('vermilion', i * 0.5, 5.55, z, 0.5, 0.28, 0.62);
  }
  addVoxel('vermilion', 0, 4.55, z, 7.4, 0.32, 0.42);
  addVoxel('vermilionDark', -3.7, 4.55, z, 0.22, 0.55, 0.55);
  addVoxel('vermilionDark', 3.7, 4.55, z, 0.22, 0.55, 0.55);
  addVoxel('woodDark', 0, 5.15, z + 0.34, 0.72, 0.85, 0.08);
  addVoxel('gold', 0, 5.2, z + 0.4, 0.16, 0.16, 0.06);
}

function addRoof(cx, cz, y, half) {
  for (let ix = -half; ix <= half; ix++) {
    for (let iz = -half; iz <= half; iz++) {
      const ax = Math.abs(ix);
      const az = Math.abs(iz);
      const edge = Math.max(ax, az);
      const corner = ax >= half - 1 && az >= half - 1;
      let lift = 0;
      if (corner) lift = 0.58;
      else if (edge === half) lift = 0.2;
      else if (edge === half - 1) lift = 0.08;
      if (ix === 0 || iz === 0) lift = Math.max(lift, 0.26);
      addVoxel('roof', cx + ix, y + lift, cz + iz, 0.98, 0.32, 0.98);
      if (edge >= half - 1) {
        addVoxel('wood', cx + ix, y + lift - 0.26, cz + iz, 0.88, 0.1, 0.88);
      }
    }
  }
  for (const [sx, sz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
    addVoxel('roof', cx + sx * (half + 0.42), y + 0.72, cz + sz * (half + 0.42), 0.72, 0.22, 0.72);
    addVoxel('roof', cx + sx * (half + 0.88), y + 1.02, cz + sz * (half + 0.88), 0.42, 0.16, 0.42);
    addVoxel('gold', cx + sx * (half + 0.9), y + 1.2, cz + sz * (half + 0.9), 0.12, 0.22, 0.12);
  }
  for (let ix = -half + 2; ix <= half - 2; ix++) {
    addVoxel('roofDark', cx + ix, y + 0.42, cz, 0.96, 0.16, 0.32);
  }
}

function addWalls(cx, cz, y0, y1, half, door) {
  const h = y1 - y0;
  const mid = y0 + h / 2;
  for (let ix = -half; ix <= half; ix++) {
    for (let iz = -half; iz <= half; iz++) {
      const onX = Math.abs(ix) === half;
      const onZ = Math.abs(iz) === half;
      if (!onX && !onZ) continue;
      const corner = onX && onZ;
      if (corner) {
        addVoxel('woodDark', cx + ix, mid, cz + iz, 0.4, h, 0.4);
        continue;
      }
      const southDoor = door && iz === half && Math.abs(ix) <= 1 && onZ && !onX;
      if (southDoor) {
        if (Math.abs(ix) === 1) addVoxel('woodDark', cx + ix, mid, cz + iz, 0.28, h, 0.28);

function sakuraTree(x, z, scale = 1) {
  const rng = mulberry32((x * 50 + z * 17 + 90) | 0);

    addVoxel('wood', x + lean, 0.4 + i * 0.68 * scale, z, 0.42 * scale, 0.72 * scale, 0.4 * scale);

  addVoxel('wood', x + 0.7 * scale, 3.0 * scale, z, 1.1 * scale, 0.18, 0.18, 0, 0, 0.35);
  addVoxel('wood', x - 0.65 * scale, 2.7 * scale, z + 0.2, 0.95 * scale, 0.16, 0.16, 0, 0.4, -0.4);
  addVoxel('wood', x + 0.15, 3.3 * scale, z - 0.55 * scale, 0.16, 0.16, 0.9 * scale, 0.3, 0, 0);
  const canopy = [];
  for (let i = 0; i < 78; i++) {
    const theta = rng() * Math.PI * 2;
    const phi = rng() * Math.PI;
    const r = (1.15 + rng() * 1.25) * scale;
    const px = x + Math.sin(phi) * Math.cos(theta) * r;
    const py = 3.5 * scale + Math.abs(Math.cos(phi)) * r * 0.8 + 0.35;
    const pz = z + Math.sin(phi) * Math.sin(theta) * r;

    addVoxel(kind, px, py, pz, sz, sz * 0.78, sz);

  for (let i = 0; i < 14; i++) {
    addVoxel('sakuraPale', x + (rng() - 0.5) * 5.2, 0.05, z + (rng() - 0.5) * 5.2, 0.12, 0.035, 0.1, rng(), rng(), 0);

  return { x, y: 4.3 * scale, z };
}

const _m4 = new THREE.Matrix4();
const _p = new THREE.Vector3();
const _q = new THREE.Quaternion();
const _s = new THREE.Vector3(1, 1, 1);
const _e = new THREE.Euler();

function mergedBoxes(boxes, material) {
  if (!boxes || !boxes.length) return null;
  const geos = [];
  for (const b of boxes) {
    const g = new THREE.BoxGeometry(b.sx, b.sy, b.sz);
    _p.set(b.x, b.y, b.z);
    _e.set(b.rx || 0, b.ry || 0, b.rz || 0);
    _q.setFromEuler(_e);
    _m4.compose(_p, _q, _s);
    g.applyMatrix4(_m4);
    geos.push(g);
  }
  const merged = mergeGeometries(geos, false);
  for (const g of geos) g.dispose();
  if (!merged) return null;
  const mesh = new THREE.Mesh(merged, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function addMerged(group, byType, yShift = 0) {
  for (const [type, boxes] of Object.entries(byType)) {
    if (!boxes.length) continue;
    const use = yShift ? boxes.map((b) => ({ ...b, y: b.y + yShift })) : boxes;
    const mesh = mergedBoxes(use, materials[type]);
    if (mesh) group.add(mesh);
    voxelTotal += boxes.length;
  }
}

function box(list, x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0) {
  list.push({ x, y, z, sx, sy, sz, rx, ry, rz });
}

function fillBlob(list, cx, cy, cz, rx, ry, rz, voxel, rng) {
  for (let y = cy - ry; y <= cy + ry + 0.001; y += voxel) {
    for (let z = cz - rz; z <= cz + rz + 0.001; z += voxel) {
      for (let x = cx - rx; x <= cx + rx + 0.001; x += voxel) {
        const nx = (x - cx) / rx;
        const ny = (y - cy) / ry;
        const nz = (z - cz) / rz;
        const d = nx * nx + ny * ny + nz * nz;
        if (d <= 1 && (d < 0.62 || rng() > 0.32)) {
          list.push({ x, y, z, sx: voxel, sy: voxel, sz: voxel });
        }
      }
    }
  }
}

function makeBird(kind) {
  const g = new THREE.Group();
  const bodyMat = kind === 'egret' ? materials.wool : materials.bird;
  const wingMat = kind === 'egret' ? materials.cloud : materials.birdWing;
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.12, 0.38), bodyMat);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, 0.12), bodyMat);
  head.position.set(0, 0.05, 0.22);
  const beak = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.035, 0.14), materials.beak);
  beak.position.set(0, 0.04, 0.34);
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.03, 0.16), bodyMat);
  tail.position.set(0, 0.02, -0.26);
  function wing(sign) {
    const pivot = new THREE.Group();
    pivot.position.set(sign * -0.1, 0.04, 0);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.035, 0.16), wingMat);
    mesh.position.x = sign * -0.25;
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.03, 0.1), materials.dark);
    tip.position.x = sign * -0.5;
    pivot.add(mesh, tip);
    return pivot;
  }
  const wingL = wing(1);
  const wingR = wing(-1);
  g.add(body, head, beak, tail, wingL, wingR);
  g.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = false;
      o.receiveShadow = false;
    }
  });
  if (kind === 'sparrow') g.scale.setScalar(0.85);
  else g.scale.setScalar(1.55);
  g.userData.wings = [wingL, wingR];
  voxelTotal += 8;
  return g;
}

function initSky() {
  const geo = new THREE.SphereGeometry(280, 24, 16);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      topColor: { value: new THREE.Color('#7eb6e3') },
      horizonColor: { value: new THREE.Color('#f3e2c4') },
      bottomColor: { value: new THREE.Color('#b7c4a4') },
    },
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 world = modelMatrix * vec4(position, 1.0);
        vWorld = world.xyz;
        gl_Position = projectionMatrix * viewMatrix * world;
      }
    `,
    fragmentShader: `
      varying vec3 vWorld;
      uniform vec3 topColor;
      uniform vec3 horizonColor;
      uniform vec3 bottomColor;
      void main() {
        float h = normalize(vWorld).y;
        vec3 col = mix(horizonColor, topColor, smoothstep(0.0, 0.62, h));
        col = mix(bottomColor, col, smoothstep(-0.35, 0.08, h));
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  scene.add(mesh);
  return mesh;
}

function buildBatches() {
  const noCast = new Set(['grass', 'moss', 'dirt', 'rock', 'snow', 'gravel', 'sand', 'sandDark', 'flower', 'flowerYellow', 'lilyFlower']);
  const vary = new Set(['grass', 'moss', 'sakura', 'sakuraPale', 'snow', 'rock', 'roof']);
  for (const [type, list] of Object.entries(buckets)) {
    if (!list.length || !materials[type]) continue;
    const mesh = new THREE.InstancedMesh(UNIT, materials[type], list.length);
    mesh.castShadow = !noCast.has(type);
    mesh.receiveShadow = true;
    mesh.frustumCulled = false;
    if (materials[type].transparent) mesh.renderOrder = 2;
    const useColor = vary.has(type);
    if (useColor) {
      mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(list.length * 3), 3);
    }
    for (let i = 0; i < list.length; i++) {
      const v = list[i];
      dummy.position.set(v.x, v.y, v.z);
      dummy.rotation.set(v.rx || 0, v.ry || 0, v.rz || 0);
      dummy.scale.set(v.sx, v.sy, v.sz);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      if (useColor) {
        const shade = 0.86 + hash2(i, list.length) * 0.28;
        mesh.setColorAt(i, tmpColor.setScalar(shade));
      }
    }
    mesh.instanceMatrix.needsUpdate = true;
    if (useColor) mesh.instanceColor.needsUpdate = true;
    scene.add(mesh);
  }
}

function makeInstanceMesh(items, material, transparent) {
  if (!items.length) return null;
  const mesh = new THREE.InstancedMesh(UNIT, material, items.length);
  mesh.castShadow = false;
  mesh.receiveShadow = true;
  mesh.frustumCulled = false;
  if (transparent) {
    mesh.renderOrder = 3;
  }
  writeItems(mesh, items, 0, 0);
  scene.add(mesh);
  return mesh;
}

function writeItems(mesh, items, time, amp) {
  for (let i = 0; i < items.length; i++) {
    const v = items[i];
    const wave = amp ? Math.sin(time * (v.sp || 1) + (v.ph || 0)) * amp : 0;
    dummy.position.set(v.x, v.y + wave, v.z);
    dummy.rotation.set(v.rx || 0, (v.ry || 0) + time * (v.spin || 0), v.rz || 0);
    dummy.scale.set(v.sx, v.sy, v.sz);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
}

function initAudio() {
  const ctx = new AudioContext();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const seconds = 3;
  const buffer = ctx.createBuffer(1, ctx.sampleRate * seconds, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  noise.loop = true;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 420;
  filter.Q.value = 0.4;
  const windGain = ctx.createGain();
  windGain.gain.value = 0.07;
  const high = ctx.createBiquadFilter();
  high.type = 'bandpass';
  high.frequency.value = 1400;
  high.Q.value = 0.6;
  const highGain = ctx.createGain();
  highGain.gain.value = 0.015;
  noise.connect(filter).connect(windGain).connect(master);
  noise.connect(high).connect(highGain).connect(master);
  noise.start();
  ambience.ctx = ctx;
  ambience.master = master;
  ambience.filter = filter;
  ambience.windGain = windGain;
  ambience.nextChime = ctx.currentTime + 1.5;
  ambience.nextGust = ctx.currentTime + 0.5;
}

function playChime(freq, when, gainVal) {
  const ctx = ambience.ctx;
  const bus = ctx.createGain();
  bus.connect(ambience.master);
  const o1 = ctx.createOscillator();
  const o2 = ctx.createOscillator();
  o1.type = 'sine';
  o2.type = 'sine';
  o1.frequency.value = freq;
  o2.frequency.value = freq * 2.003;
  const g1 = ctx.createGain();
  const g2 = ctx.createGain();
  g1.gain.value = 0.72;
  g2.gain.value = 0.14;
  o1.connect(g1).connect(bus);
  o2.connect(g2).connect(bus);
  bus.gain.setValueAtTime(0.0001, when);
  bus.gain.exponentialRampToValueAtTime(gainVal, when + 0.02);
  bus.gain.exponentialRampToValueAtTime(0.0001, when + 4.2);
  o1.start(when);
  o2.start(when);
  o1.stop(when + 4.4);
  o2.stop(when + 4.4);
}

const CHIMES = [293.66, 329.63, 392, 440, 493.88, 587.33];

function updateAudio() {
  if (!ambience.enabled || !ambience.ctx) return;
  const now = ambience.ctx.currentTime;
  if (now > ambience.nextGust) {
    const f = 220 + Math.random() * 520;
    ambience.filter.frequency.setTargetAtTime(f, now, 0.6);
    ambience.windGain.gain.setTargetAtTime(0.035 + Math.random() * 0.05, now, 0.8);
    ambience.nextGust = now + 1.6 + Math.random() * 2.4;
  }
  if (now > ambience.nextChime) {
    const notes = 1 + (Math.random() > 0.55 ? 1 : 0) + (Math.random() > 0.8 ? 1 : 0);
    for (let i = 0; i < notes; i++) {
      const freq = CHIMES[(Math.random() * CHIMES.length) | 0];
      playChime(freq, now + i * 0.22, 0.045 + Math.random() * 0.03);
    }
    ambience.nextChime = now + 6 + Math.random() * 9;
  }
}

function toggleAudio() {
  if (!ambience.ctx) initAudio();
  if (ambience.ctx.state === 'suspended') ambience.ctx.resume();
  ambience.enabled = !ambience.enabled;
  ambience.master.gain.setTargetAtTime(ambience.enabled ? 0.85 : 0, ambience.ctx.currentTime, 0.18);
  const btn = document.getElementById('audio-btn');
  btn.textContent = ambience.enabled ? 'Ambience On' : 'Enable Ambience';
  btn.classList.toggle('active', ambience.enabled);
  btn.setAttribute('aria-pressed', ambience.enabled ? 'true' : 'false');
}

function dampLook(dt) {
  const m = MODES[look.mode];
  const k = 1 - Math.exp(-2.1 * dt);
  look.night += (m.night - look.night) * k;
  look.sunPos.lerp(m.sunPos, k);
  look.body.lerp(m.body, k);
  look.sunColor.lerp(m.sunColor, k);
  look.sunIntensity += (m.sunIntensity - look.sunIntensity) * k;
  look.fillColor.lerp(m.fillColor, k);
  look.fillIntensity += (m.fillIntensity - look.fillIntensity) * k;
  look.hemiSky.lerp(m.hemiSky, k);
  look.hemiGround.lerp(m.hemiGround, k);
  look.hemiIntensity += (m.hemiIntensity - look.hemiIntensity) * k;
  look.ambient += (m.ambient - look.ambient) * k;
  look.top.lerp(m.top, k);
  look.horizon.lerp(m.horizon, k);
  look.bottom.lerp(m.bottom, k);
  look.fog.lerp(m.fog, k);
  look.fogNear += (m.fogNear - look.fogNear) * k;
  look.fogFar += (m.fogFar - look.fogFar) * k;
  look.exposure += (m.exposure - look.exposure) * k;
  look.lamp += (m.lamp - look.lamp) * k;
  look.celestial.lerp(m.celestial, k);
  look.glow.lerp(m.glow, k);
  look.scale += (m.scale - look.scale) * k;
  look.shoji += (m.shoji - look.shoji) * k;
  look.water.lerp(m.water, k);
  look.cloud.lerp(m.cloud, k);

  sky.material.uniforms.topColor.value.copy(look.top);
  sky.material.uniforms.horizonColor.value.copy(look.horizon);
  sky.material.uniforms.bottomColor.value.copy(look.bottom);
  scene.fog.color.copy(look.fog);
  scene.fog.near = look.fogNear;
  scene.fog.far = look.fogFar;
  renderer.toneMappingExposure = look.exposure;

  sunLight.color.copy(look.sunColor);
  sunLight.intensity = look.sunIntensity;
  sunLight.position.copy(look.sunPos);
  fillLight.color.copy(look.fillColor);
  fillLight.intensity = look.fillIntensity;
  hemi.color.copy(look.hemiSky);
  hemi.groundColor.copy(look.hemiGround);
  hemi.intensity = look.hemiIntensity;
  ambient.intensity = look.ambient;

  celestial.group.position.copy(look.body);
  celestial.group.scale.setScalar(look.scale);
  celestial.group.quaternion.copy(camera.quaternion);
  celestial.coreMat.color.copy(look.celestial);
  celestial.glowMat.color.copy(look.glow);
  celestial.glowMat.opacity = 0.22 + (1 - look.night) * 0.22;
  const flareOn = look.night < 0.65;
  for (const f of celestial.flares) f.visible = flareOn;
  for (const c of celestial.craters) c.visible = look.night > 0.62;
  stars.material.opacity = smoothstep(0.35, 0.85, look.night) * 0.95;

  materials.shoji.emissiveIntensity = look.shoji;
  materials.lantern.emissiveIntensity = 0.35 + look.lamp * 0.045;
  materials.gold.emissiveIntensity = 0.22 + look.night * 0.28;
  materials.water.color.copy(look.water);
  materials.water.emissiveIntensity = 0.08 + look.night * 0.22;
  materials.cloud.color.copy(look.cloud);

  const t = clock.elapsedTime;
  for (let i = 0; i < lanternLights.length; i++) {
    const light = lanternLights[i];
    const flick = 0.9 + Math.sin(t * 6 + i * 1.7) * 0.06 + Math.sin(t * 13.5 + i) * 0.04;
    light.intensity = look.lamp * light.userData.scale * flick;
  }
}

function tickAnimals(dt, t) {
  for (const a of animals) {
    a.stateT -= dt;
    if (a.stateT <= 0) {
      const r = rand();
      a.state = r < 0.42 ? 'graze' : r < 0.8 ? 'walk' : 'idle';
      a.stateT = 2 + rand() * 4;
      if (a.state === 'walk') a.dir += (rand() - 0.5) * 1.4;
    }
    if (a.state === 'walk') {
      a.x += Math.sin(a.dir) * a.speed * dt;
      a.z += Math.cos(a.dir) * a.speed * dt;
      if (a.x < a.minX || a.x > a.maxX) {
        a.dir = -a.dir;
        a.x = Math.max(a.minX, Math.min(a.maxX, a.x));
      }
      if (a.z < a.minZ || a.z > a.maxZ) {
        a.dir = Math.PI - a.dir;
        a.z = Math.max(a.minZ, Math.min(a.maxZ, a.z));
      }
      a.group.position.y = Math.abs(Math.sin(t * 7.5 + a.phase)) * (a.kind === 'alpaca' ? 0.05 : 0.07);
      a.head.rotation.x = THREE.MathUtils.damp(a.head.rotation.x, 0.05, 4, dt);
    } else if (a.state === 'graze') {
      a.head.rotation.x = THREE.MathUtils.damp(a.head.rotation.x, a.kind === 'alpaca' ? 0.7 : 0.85, 3.5, dt);
      a.group.position.y = Math.sin(t * 1.6 + a.phase) * 0.015;
    } else {
      a.head.rotation.x = THREE.MathUtils.damp(a.head.rotation.x, 0, 3, dt);
      a.group.position.y = Math.sin(t * 1.2 + a.phase) * 0.012;
    }
    a.group.position.x = a.x;
    a.group.position.z = a.z;
    let delta = a.dir - a.group.rotation.y;
    delta = Math.atan2(Math.sin(delta), Math.cos(delta));
    a.group.rotation.y += delta * Math.min(1, dt * 2.4);
  }
}

function tickBirds(t) {
  for (const b of birds) {
    const a = t * b.speed + b.phase;
    const x = b.cx + Math.cos(a) * b.radius;
    const z = b.cz + Math.sin(a) * b.radius * 0.72;
    const y = b.y + Math.sin(a * 2.1) * 1.4;
    b.group.position.set(x, y, z);
    const dx = -Math.sin(a) * b.radius;
    const dz = Math.cos(a) * b.radius * 0.72;
    b.group.rotation.y = Math.atan2(dx, dz);
    b.group.rotation.z = Math.cos(a) * 0.18;
    const flap = Math.sin(t * b.flap + b.phase);
    b.group.userData.wings[0].rotation.z = 0.25 + flap * 0.7;
    b.group.userData.wings[1].rotation.z = -0.25 - flap * 0.7;
  }
}

function tickPetals(dt, t) {
  if (!petalMesh) return;
  for (let i = 0; i < petalData.length; i++) {
    const p = petalData[i];
    p.y -= p.vy * dt;
    p.x += Math.sin(t * 0.8 + p.phase) * p.sway * dt;
    p.z += Math.cos(t * 0.65 + p.phase) * p.sway * 0.6 * dt;
    if (p.y < 0.05) {
      p.y = p.tree.y + rand() * 1.5;
      p.x = p.tree.x + (rand() - 0.5) * 3.5;
      p.z = p.tree.z + (rand() - 0.5) * 3.5;
    }
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.set(t * p.spin, p.phase, t * 0.4);
    dummy.scale.set(0.2, 0.06, 0.16);
    dummy.updateMatrix();
    petalMesh.setMatrixAt(i, dummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;
}

function animateCamera(now) {
  if (!camTween) return;
  const k = Math.min(1, (now - camTween.t0) / camTween.dur);
  const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  camera.position.lerpVectors(camTween.sp, camTween.ep, e);
  controls.target.lerpVectors(camTween.st, camTween.et, e);
  if (controls.sphericalDelta) controls.sphericalDelta.set(0, 0, 0);
  if (controls.panOffset) controls.panOffset.set(0, 0, 0);
  if (k >= 1) camTween = null;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  dampLook(dt);

  for (const s of samurai) {
    const u = s.userData.upper;
    const ph = s.userData.phase;
    u.scale.y = 1 + Math.sin(t * 1.45 + ph) * 0.016;
    u.rotation.y = Math.sin(t * 0.32 + ph) * 0.045;
    u.rotation.z = Math.sin(t * 0.8 + ph) * 0.008;
  }
  tickAnimals(dt, t);
  tickBirds(t);
  tickPetals(dt, t);

  for (const c of clouds) {
    c.position.x += dt * c.userData.speed;
    c.position.y = c.userData.baseY + Math.sin(t * 0.15 + c.userData.phase) * 0.4;
    if (c.position.x > 130) c.position.x = -130;
  }
  if (waterMesh) writeItems(waterMesh, waterItems, t, 0.045);
  if (lilyMesh) writeItems(lilyMesh, lilyItems, t, 0.03);

  for (const fish of koi) {
    const a = t * fish.speed + fish.phase;
    fish.group.position.set(
      POND.x + Math.cos(a) * fish.rx,
      -0.12 + Math.sin(t * 2.2 + fish.phase) * 0.03,
      POND.z + Math.sin(a) * fish.rz,
    );
    const dx = -Math.sin(a) * fish.rx;
    const dz = Math.cos(a) * fish.rz;
    fish.group.rotation.y = Math.atan2(dx, dz);
    fish.tail.rotation.y = Math.sin(t * 8 + fish.phase) * 0.45;
  }

  if (dripMesh) {
    const cycle = (t * 0.55) % 1;
    dripMesh.position.set(drip.x, drip.y0 + (drip.y1 - drip.y0) * cycle, drip.z);
    dripMesh.visible = cycle < 0.85 && look.night < 0.9;
    dripMesh.scale.y = 0.6 + cycle;
  }

  const night = smoothstep(0.4, 0.8, look.night);
  for (const f of fireflies) {
    f.mesh.position.x = f.x + Math.sin(t * 0.55 + f.phase) * 0.7;
    f.mesh.position.y = f.y + Math.sin(t * 1.1 + f.phase) * 0.35;
    f.mesh.position.z = f.z + Math.cos(t * 0.45 + f.phase) * 0.7;
    const blink = 0.25 + 0.75 * Math.max(0, Math.sin(t * 2.6 + f.phase));
    f.mat.opacity = night * blink;
  }

  sky.position.copy(camera.position);
  stars.position.copy(camera.position);

  animateCamera(performance.now());
  controls.update();
  if (camera.position.y < 0.35) camera.position.y = 0.35;
  updateAudio();
  renderer.render(scene, camera);
}

function lambert(map, opts = {}) {
  return new THREE.MeshLambertMaterial({
    map,
    color: opts.color ?? 0xffffff,
    emissive: new THREE.Color(opts.emissive ?? 0x000000),
    emissiveIntensity: opts.emissiveIntensity ?? 1,
    flatShading: true,
    transparent: !!opts.transparent,
    opacity: opts.opacity ?? 1,
    depthWrite: opts.depthWrite !== false,
    side: opts.side ?? THREE.FrontSide,
  });
}

  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  const modes = { Digit1: 'morning', Digit2: 'sunset', Digit3: 'night' };
  const cams = { Digit4: 'pagoda', Digit5: 'samurai', Digit6: 'meadow', Digit7: 'vista', Digit8: 'aerial' };
  if (modes[e.code]) setMode(modes[e.code]);
  if (cams[e.code]) moveCamera(cams[e.code]);
  if (e.code === 'KeyM') toggleAudio();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

window.__zen = { ready: true, voxels: voxelTotal };
document.getElementById('loader-msg').textContent = 'The garden is open';
requestAnimationFrame(() => {
  document.getElementById('loader').classList.add('hide');
});
animate();
  </script>
  <script>
    setTimeout(() => {
      const el = document.getElementById('loader');
      if (el && !el.classList.contains('hide') && !(window.__zen && window.__zen.ready)) {
        const msg = document.getElementById('loader-msg');
        if (msg) msg.textContent = 'Serve over HTTP so ES modules can load';
      }
    }, 8000);
  </script>
