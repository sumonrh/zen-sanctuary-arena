<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zen Sanctuary</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b1020; font-family: system-ui, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .glass {
    background: rgba(20, 24, 40, 0.45);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  }
  .btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); transition: all .2s ease; cursor:pointer; }
  .btn:hover { background: rgba(255,255,255,0.16); transform: translateY(-1px); }
  .btn.active { background: rgba(255,180,90,0.25); border-color: rgba(255,200,120,0.6); }
  .title-grad { background: linear-gradient(90deg,#ffd580,#ffb3a7); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #loader { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background: radial-gradient(circle at center, #1a1f3a, #05070f); z-index:100; transition: opacity .8s ease; }
  #loader.hidden { opacity:0; pointer-events:none; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }
  #errbox { position:fixed; top:10px; left:10px; right:10px; max-height:50vh; overflow:auto; background:#2a0a0a; color:#ffb0b0; padding:12px; border-radius:8px; font:12px monospace; z-index:200; white-space:pre-wrap; border:1px solid #f55; }
</style>
</head>
<body>
<div id="app">
  <div id="loader">
    <div class="text-center px-6">
      <div class="text-3xl title-grad font-bold tracking-widest mb-2">ZEN SANCTUARY</div>
      <div id="loadmsg" class="text-white/60 text-sm pulse">Generating voxel world...</div>
    </div>
  </div>

  <div class="absolute top-4 left-4 right-4 flex flex-col gap-3 pointer-events-none z-10">
    <div class="flex justify-between items-start gap-3 flex-wrap">
      <div class="glass rounded-2xl p-4 max-w-xs pointer-events-auto">
        <div class="text-xs uppercase tracking-widest text-amber-200/80 mb-1">Minecraft x Three.js</div>
        <h1 class="text-2xl font-bold title-grad mb-1">Voxel Zen Sanctuary</h1>
        <p class="text-xs text-white/70 leading-relaxed">Drag to orbit, scroll to zoom, right-drag to pan.</p>
      </div>
      <div class="glass rounded-2xl p-3 pointer-events-auto">
        <div class="text-xs uppercase tracking-widest text-white/50 mb-2">Time of Day</div>
        <div class="flex gap-2">
          <button data-time="morning" class="btn active text-xs px-3 py-1.5 rounded-lg text-white">Morning</button>
          <button data-time="sunset" class="btn text-xs px-3 py-1.5 rounded-lg text-white">Sunset</button>
          <button data-time="night" class="btn text-xs px-3 py-1.5 rounded-lg text-white">Night</button>
        </div>
      </div>
    </div>
    <div class="flex justify-between items-end gap-3 flex-wrap">
      <div class="glass rounded-2xl p-3 pointer-events-auto">
        <div class="text-xs uppercase tracking-widest text-white/50 mb-2">Camera Views</div>
        <div class="grid grid-cols-2 gap-2">
          <button data-view="pagoda" class="btn text-xs px-3 py-1.5 rounded-lg text-white">Pagoda Front</button>
          <button data-view="samurai" class="btn text-xs px-3 py-1.5 rounded-lg text-white">Samurai</button>
          <button data-view="meadow" class="btn text-xs px-3 py-1.5 rounded-lg text-white">Meadow</button>
          <button data-view="mountain" class="btn text-xs px-3 py-1.5 rounded-lg text-white">Vista</button>
          <button data-view="birdseye" class="btn text-xs px-3 py-1.5 rounded-lg text-white col-span-2">Bird's Eye</button>
        </div>
      </div>
      <div class="glass rounded-2xl p-3 pointer-events-auto">
        <div class="text-xs uppercase tracking-widest text-white/50 mb-2">Audio</div>
        <div class="flex items-center gap-3">
          <button id="audioToggle" class="btn text-xs px-3 py-1.5 rounded-lg text-white">Enable Sound</button>
          <div class="text-xs text-white/60">Wind &amp; chimes</div>
        </div>
      </div>
    </div>
  </div>

  <div class="absolute bottom-4 left-4 glass rounded-xl p-3 text-xs text-white/70 pointer-events-none z-10">
    <span class="text-amber-300">Voxels</span> <span id="voxcount">--</span>
    &nbsp;·&nbsp; <span class="text-amber-300">FPS</span> <span id="fps">--</span>
  </div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ImprovedNoise } from 'three/addons/math/ImprovedNoise.js';

// ---------- error surface + watchdog ----------
const loadmsg = document.getElementById('loadmsg');
function showErr(m) {
  let box = document.getElementById('errbox');
  if (!box) {
    box = document.createElement('pre');
    box.id = 'errbox';
    document.body.appendChild(box);
  }
  box.textContent += '\n' + m;
}
window.addEventListener('error', (e) => showErr('Error: ' + (e.message || e.error)));
window.addEventListener('unhandledrejection', (e) => showErr('Rejection: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason)));
window.__zenBooted = false;
setTimeout(() => {
  if (!window.__zenBooted && loadmsg) loadmsg.textContent = 'Still loading... check internet (Three.js CDN) or press F12 for errors.';
}, 10000);

// ---------- seeded rng + noise ----------
function mulberry32(seed) {
  return function () {
    let t = (seed += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260524);
const perlin = new ImprovedNoise();
function fbm(x, z) {
  let v = 0, amp = 1, f = 0.02, tot = 0;
  for (let o = 0; o < 4; o++) { v += perlin.noise(x * f, z * f, 0) * amp; tot += amp; amp *= 0.5; f *= 2; }
  return v / tot;
}
function pick(a) { return a[(rng() * a.length) | 0]; }

// ---------- renderer / scene / camera ----------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (err) {
  if (loadmsg) loadmsg.textContent = 'WebGL unavailable: ' + err.message;
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xa9c2dd, 0.0075);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1200);
camera.position.set(20, 16, 34);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 6;
controls.maxDistance = 300;
controls.target.set(0, 13, 0);

// ---------- lights / sky ----------
const ambient = new THREE.AmbientLight(0xfff0d8, 0.55);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff0d0, 1.15);
sun.position.set(80, 120, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 450;
sun.shadow.camera.left = -120; sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120; sun.shadow.camera.bottom = -120;
sun.shadow.bias = -0.0008;
scene.add(sun); scene.add(sun.target);

const skyBodyMat = new THREE.MeshBasicMaterial({ color: 0xfff6d8, fog: false });
const skyBody = new THREE.Mesh(new THREE.BoxGeometry(14, 14, 1), skyBodyMat);
scene.add(skyBody);

const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    topColor: { value: new THREE.Color(0x77b5e5) },
    bottomColor: { value: new THREE.Color(0xd8e8f2) },
    offset: { value: 33 }, exponent: { value: 0.6 }
  },
  vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
  fragmentShader: 'uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent; varying vec3 vW;' +
    'void main(){ float h = normalize(vW + vec3(0.0, offset, 0.0)).y; gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h,0.0),exponent),0.0)),1.0); }',
  side: THREE.BackSide, depthWrite: false
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), skyMat));

// stars (visible at night)
const starGeo = new THREE.BufferGeometry();
{
  const pos = [];
  for (let i = 0; i < 350; i++) {
    const a = rng() * Math.PI * 2, e = 0.12 + rng() * 1.3, r = 500;
    pos.push(Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
}
const starMat = new THREE.PointsMaterial({ color: 0xcfd8ff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
scene.add(new THREE.Points(starGeo, starMat));

// ---------- procedural 16x16 pixel textures ----------
function canvasTex(draw) {
  const c = document.createElement('canvas');
  c.width = c.height = 16;
  const g = c.getContext('2d');
  draw(g);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function fillNoise(g, cols) { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { g.fillStyle = pick(cols); g.fillRect(x, y, 1, 1); } }

const TEX = {};
TEX.grass = canvasTex((g) => {
  fillNoise(g, ['#3f7d2c', '#4a8d34', '#356b22', '#57a045', '#2f5e1c']);
  g.fillStyle = '#5a3d22'; g.fillRect(0, 14, 16, 2);
  g.fillStyle = '#ffe680';
  for (let i = 0; i < 6; i++) g.fillRect((rng() * 16) | 0, (rng() * 13) | 0, 1, 1);
});
TEX.stone = canvasTex((g) => {
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const v = 130 + ((rng() * 50) | 0); g.fillStyle = 'rgb(' + v + ',' + v + ',' + (v + 5) + ')'; g.fillRect(x, y, 1, 1); }
});
TEX.rock = canvasTex((g) => {
  fillNoise(g, ['#5b554d', '#6e6759', '#807667', '#4a443c', '#9c9280']);
  g.fillStyle = '#332e28';
  for (let i = 0; i < 4; i++) { const sx = (rng() * 12) | 0, sy = (rng() * 16) | 0; for (let k = 0; k < 5; k++) g.fillRect(sx + k, sy, 1, 1); }
});
TEX.snow = canvasTex((g) => {
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const v = 235 + ((rng() * 20) | 0); g.fillStyle = 'rgb(' + v + ',' + v + ',' + Math.min(v + 5, 255) + ')'; g.fillRect(x, y, 1, 1); }
});
TEX.water = canvasTex((g) => {
  const cols = ['#2a4a8a', '#3a5fa0', '#264080', '#4a78c0'];
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { g.fillStyle = cols[(x + y) % 4]; g.fillRect(x, y, 1, 1); }
  g.fillStyle = '#a0c8ff';
  for (let i = 0; i < 10; i++) g.fillRect((rng() * 16) | 0, (rng() * 16) | 0, 1, 1);
});
TEX.darkWood = canvasTex((g) => {
  const cols = ['#2c1a10', '#3a2415', '#251208'];
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { g.fillStyle = cols[(x + ((rng() * 2) | 0)) % 3]; g.fillRect(x, y, 1, 1); }
});
TEX.redWood = canvasTex((g) => {
  fillNoise(g, ['#b8201c', '#c8281e', '#a01814', '#d0382c']);
  g.fillStyle = '#1a1410';
  for (let y = 0; y < 16; y += 4) g.fillRect(0, y, 16, 1);
});
TEX.shoji = canvasTex((g) => {
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const j = (rng() * 18) | 0; g.fillStyle = 'rgba(' + (228 + j) + ',' + (206 + j) + ',' + (150 + j) + ',1)'; g.fillRect(x, y, 1, 1); }
  g.fillStyle = '#1a1208';
  for (let y = 0; y < 16; y += 4) g.fillRect(0, y, 16, 1);
  for (let x = 0; x < 16; x += 4) g.fillRect(x, 0, 1, 16);
});
TEX.roof = canvasTex((g) => {
  fillNoise(g, ['#1a1c24', '#22252e', '#2e323c', '#0f1018']);
  g.fillStyle = '#3a3e4a';
  for (let y = 0; y < 16; y += 2) g.fillRect(0, y, 16, 1);
});
TEX.gold = canvasTex((g) => { fillNoise(g, ['#e8b730', '#f4cf52', '#c89a20', '#ffd868']); });
TEX.bamboo = canvasTex((g) => {
  g.fillStyle = '#6eaa48'; g.fillRect(0, 0, 16, 16);
  g.fillStyle = '#4a7a2e';
  for (let y = 0; y < 16; y += 4) g.fillRect(0, y, 16, 1);
  g.fillStyle = '#8fc858'; g.fillRect(4, 0, 1, 16);
});
TEX.sakura = canvasTex((g) => {
  fillNoise(g, ['#ffc6dc', '#ffaad0', '#ffb6d8', '#e088a8', '#ffd0e0']);
  g.fillStyle = '#5a2a3a';
  for (let i = 0; i < 4; i++) g.fillRect((rng() * 16) | 0, (rng() * 16) | 0, 1, 1);
});
TEX.lantern = canvasTex((g) => {
  fillNoise(g, ['#d8a04a', '#e8b860', '#c08838', '#f0c878']);
  g.fillStyle = '#3a1a08'; g.fillRect(7, 3, 2, 10); g.fillRect(5, 7, 6, 2);
});
TEX.lilypad = canvasTex((g) => {
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const r = Math.sqrt((x - 7.5) * (x - 7.5) + (y - 7.5) * (y - 7.5));
    if (r < 7) { g.fillStyle = '#3a6a28'; g.fillRect(x, y, 1, 1); }
  }
  g.fillStyle = '#ffc0d0'; g.fillRect(7, 4, 2, 1); g.fillStyle = '#ffd0e0'; g.fillRect(7, 5, 2, 1);
});
TEX.bush = canvasTex((g) => {
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const r = Math.sqrt((x - 7.5) * (x - 7.5) + (y - 7.5) * (y - 7.5));
    if (r <= 7.4) { g.fillStyle = pick(['#2c5a1c', '#3e7a2c', '#4a8a34', '#1c4a10']); g.fillRect(x, y, 1, 1); }
  }
});
TEX.skin = canvasTex((g) => { g.fillStyle = '#d8a878'; g.fillRect(0, 0, 16, 16); });
TEX.cloud = canvasTex((g) => {
  g.clearRect(0, 0, 16, 16);
  g.fillStyle = '#f0f4f8';
  const shape = [[3,5],[4,5],[5,5],[6,5],[7,5],[8,5],[9,5],[10,5],[11,5],[12,5],[2,6],[3,6],[4,6],[5,6],[6,6],[7,6],[8,6],[9,6],[10,6],[11,6],[12,6],[13,6],[3,7],[4,7],[5,7],[6,7],[7,7],[8,7],[9,7],[10,7],[11,7],[12,7],[5,8],[6,8],[7,8],[8,8],[9,8],[10,8]];
  for (const p of shape) g.fillRect(p[0], p[1], 1, 1);
});
TEX.wool = canvasTex((g) => {
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const v = 228 + ((rng() * 27) | 0); g.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')'; g.fillRect(x, y, 1, 1); }
  g.fillStyle = '#b8b8b8';
  for (let i = 0; i < 12; i++) g.fillRect((rng() * 16) | 0, (rng() * 16) | 0, 1, 1);
});
TEX.alpaca = canvasTex((g) => { fillNoise(g, ['#e8d8b8', '#d4c098', '#c0a878', '#f0e2c8']); });
TEX.bird = canvasTex((g) => { g.fillStyle = '#1a1a22'; g.fillRect(0, 0, 16, 16); g.fillStyle = '#ffffff'; g.fillRect(7, 7, 1, 1); });
function armorTex(base, dark) {
  return canvasTex((g) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { g.fillStyle = rng() < 0.15 ? dark : base; g.fillRect(x, y, 1, 1); }
    g.fillStyle = '#1a1208';
    for (let y = 0; y < 16; y += 2) g.fillRect(0, y, 16, 1);
  });
}
TEX.armorRed = armorTex('#8a1a14', '#5a0a08');
TEX.armorBlue = armorTex('#1a3a6a', '#0a1e3a');
TEX.helmet = armorTex('#2a2a2a', '#0a0a0a');
TEX.kimono = armorTex('#3a2a4a', '#1a0a2a');
TEX.hair = canvasTex((g) => { g.fillStyle = '#1a0e08'; g.fillRect(0, 0, 16, 16); });

// ---------- materials ----------
const M = {
  grass: new THREE.MeshLambertMaterial({ map: TEX.grass }),
  stone: new THREE.MeshLambertMaterial({ map: TEX.stone }),
  rock: new THREE.MeshLambertMaterial({ map: TEX.rock }),
  snow: new THREE.MeshLambertMaterial({ map: TEX.snow }),
  water: new THREE.MeshLambertMaterial({ map: TEX.water, transparent: true, opacity: 0.85 }),
  darkWood: new THREE.MeshLambertMaterial({ map: TEX.darkWood }),
  redWood: new THREE.MeshLambertMaterial({ map: TEX.redWood }),
  shoji: new THREE.MeshLambertMaterial({ map: TEX.shoji, emissive: 0x664422, emissiveIntensity: 0.25 }),
  roof: new THREE.MeshLambertMaterial({ map: TEX.roof }),
  gold: new THREE.MeshLambertMaterial({ map: TEX.gold, emissive: 0x5a3a10, emissiveIntensity: 0.25 }),
  bamboo: new THREE.MeshLambertMaterial({ map: TEX.bamboo }),
  sakura: new THREE.MeshLambertMaterial({ map: TEX.sakura }),
  lantern: new THREE.MeshLambertMaterial({ map: TEX.lantern, emissive: 0xff8030, emissiveIntensity: 0.7 }),
  lilypad: new THREE.MeshLambertMaterial({ map: TEX.lilypad }),
  bush: new THREE.MeshLambertMaterial({ map: TEX.bush }),
  skin: new THREE.MeshLambertMaterial({ map: TEX.skin }),
  cloud: new THREE.MeshBasicMaterial({ map: TEX.cloud, transparent: true, fog: false }),
  wool: new THREE.MeshLambertMaterial({ map: TEX.wool }),
  alpaca: new THREE.MeshLambertMaterial({ map: TEX.alpaca }),
  bird: new THREE.MeshLambertMaterial({ map: TEX.bird }),
  helmet: new THREE.MeshLambertMaterial({ map: TEX.helmet }),
  armorRed: new THREE.MeshLambertMaterial({ map: TEX.armorRed }),
  armorBlue: new THREE.MeshLambertMaterial({ map: TEX.armorBlue }),
  kimono: new THREE.MeshLambertMaterial({ map: TEX.kimono })
};

// ---------- voxel batcher: ONE InstancedMesh per material ----------
// Variable voxel sizes supported: 8 (mountains) / 4 (terrain) / 1-2 (buildings) / 0.25 (details)
let batchTotal = 0;
class Batch {
  constructor() { this.map = new Map(); }
  add(mat, x, y, z, sx, sy, sz) {
    if (!this.map.has(mat)) this.map.set(mat, []);
    this.map.get(mat).push([x, y, z, sx, sy, sz]);
    batchTotal++;
  }
  box(mat, x, y, z, s) { this.add(mat, x, y, z, s, s, s); }
  build(parent, cast, receive) {
    const unit = new THREE.BoxGeometry(1, 1, 1);
    const d = new THREE.Object3D();
    for (const entry of this.map) {
      const im = new THREE.InstancedMesh(unit, entry[0], entry[1].length);
      for (let i = 0; i < entry[1].length; i++) {
        const b = entry[1][i];
        d.position.set(b[0], b[1], b[2]);
        d.scale.set(b[3], b[4], b[5]);
        d.rotation.set(0, 0, 0);
        d.updateMatrix();
        im.setMatrixAt(i, d.matrix);
      }
      im.instanceMatrix.needsUpdate = true;
      im.castShadow = cast; im.receiveShadow = receive;
      parent.add(im);
    }
  }
}
const world = new THREE.Group();
scene.add(world);
const solid = new Batch();   // casts + receives shadows
const waterB = new Batch();  // water only, no shadow casting

// ---------- terrain ----------
// safety plane far below (catches the void beyond voxel field)
{
  const far = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), new THREE.MeshLambertMaterial({ color: 0x2c4428 }));
  far.rotation.x = -Math.PI / 2; far.position.y = -4.6; far.receiveShadow = true;
  world.add(far);
}
const GS = 4, HE = 45; // cell size, half-extent in cells (field spans +-180)
function inPond(wx, wz) { return wx >= 30 && wx <= 66 && wz >= -18 && wz <= 18; }
function inPlaza(wx, wz) { return Math.abs(wx) < 30 && Math.abs(wz) < 30; }
for (let i = -HE; i <= HE; i++) {
  for (let j = -HE; j <= HE; j++) {
    const wx = i * GS, wz = j * GS;
    let h = 0, mat = M.grass;
    if (inPond(wx, wz)) { h = -1; mat = M.stone; }
    else if (!inPlaza(wx, wz)) {
      const n = fbm(wx, wz);
      h = n > 0.25 ? 1 : 0;
      mat = M.grass;
    }
    solid.add(mat, wx, h * GS - GS / 2, wz, GS, GS, GS);
  }
}
// pond water surface flush with plaza level
for (let wx = 30; wx <= 66; wx += GS) {
  for (let wz = -18; wz <= 18; wz += GS) {
    waterB.add(M.water, wx, -GS / 2, wz, GS, GS, GS);
  }
}

// ---------- mountains: stepped voxel pyramids (large 6-unit voxels) ----------
function buildMountain(cx, cz, baseR, levels) {
  const BH = 6;
  for (let l = 0; l < levels; l++) {
    const w = baseR * 2 * (1 - l / levels) + 5;
    const jx = perlin.noise(cx * 0.05, l * 0.7, 0) * 3;
    const jz = perlin.noise(cz * 0.05, l * 0.7, 5) * 3;
    const mat = l > levels * 0.62 ? M.snow : M.rock;
    solid.add(mat, cx + jx, l * BH + BH / 2 - 4, cz + jz, w, BH + (l === 0 ? 4 : 0), w);
  }
}

// ---------- ambient audio: wind + chimes (Web Audio, no files) ----------
let AC = null, windSrc = null, chimeTO = null, audioOn = false;
function playChime() {
  if (!AC) return;
  const scale = [523.25, 587.33, 659.25, 783.99, 880.0];
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.value = scale[(Math.random() * scale.length) | 0];
  g.gain.value = 0;
  g.gain.linearRampToValueAtTime(0.1, AC.currentTime + 0.03);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 2.5);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + 2.6);
}
function chimeLoop() {
  chimeTO = setTimeout(() => { playChime(); chimeLoop(); }, 4000 + Math.random() * 9000);
}
document.getElementById('audioToggle').addEventListener('click', (e) => {
  const btn = e.currentTarget;
  if (!audioOn) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const len = 2 * AC.sampleRate;
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const ch = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; ch[i] = (last + 0.02 * w) / 1.02; last = ch[i]; ch[i] *= 3.5; }
    windSrc = AC.createBufferSource(); windSrc.buffer = buf; windSrc.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    const g = AC.createGain(); g.gain.value = 0.07;
    windSrc.connect(f); f.connect(g); g.connect(AC.destination);
    windSrc.start();
    chimeLoop();
    audioOn = true; btn.textContent = 'Sound On'; btn.classList.add('active');
  } else {
    if (windSrc) { try { windSrc.stop(); } catch (err) {} windSrc = null; }
    if (chimeTO) clearTimeout(chimeTO);
    if (AC) AC.close(); AC = null;
    audioOn = false; btn.textContent = 'Enable Sound'; btn.classList.remove('active');
  }
});

function animate() {

  const now = performance.now();
  if (now - fpsT > 500) { fpsEl.textContent = Math.round((fpsN * 1000) / (now - fpsT)); fpsN = 0; fpsT = now; }

  renderer.toneMappingExposure += (targetExp - renderer.toneMappingExposure) * 0.04;

  if (camAnim) {
    camAnim.u += dt * 0.8;
    const u = Math.min(camAnim.u, 1);
    const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    camera.position.lerpVectors(camAnim.fp, camAnim.tp, e);
    controls.target.lerpVectors(camAnim.ft, camAnim.tt, e);
    if (u >= 1) camAnim = null;
  }

  for (let i = 0; i < samurai.length; i++) {
    const s = samurai[i], b = Math.sin(t * 1.6 + i * 2.1);
    s.position.y = b * 0.04;
    s.userData.head.position.y = 8 * 0.25 + b * 0.02;
    s.userData.torso.position.y = 5.5 * 0.25 + b * 0.03;
  }

  for (let i = 0; i < animals.length; i++) {
    const a = animals[i];
    a.userData.timer -= dt;
    if (a.userData.timer <= 0) {
      a.userData.tx = 14 + rng() * 42; a.userData.tz = 19 + rng() * 22;
      a.userData.timer = 3 + rng() * 5;
    }
    const dx = a.userData.tx - a.position.x, dz = a.userData.tz - a.position.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist > 0.6) {
      a.position.x += (dx / dist) * a.userData.speed * dt;
      a.position.z += (dz / dist) * a.userData.speed * dt;
      a.rotation.y = Math.atan2(dx, dz) - Math.PI / 2;
    }
    a.position.y = Math.abs(Math.sin(t * 3 + i * 1.7)) * 0.06;
    if (a.userData.head) a.userData.head.rotation.z = Math.sin(t * 1.4 + i) * 0.1;
  }

  for (const b of birds) {
    b.position.x += b.userData.vx * dt;
    b.position.z += b.userData.vz * dt;
    b.position.y += Math.sin(t * 0.7 + b.userData.ph) * dt * 0.6;
    if (b.position.x > 130) b.position.x = -130;
    if (b.position.z > 130) b.position.z = -130;
    if (b.position.z < -130) b.position.z = 130;
    b.rotation.y = Math.atan2(b.userData.vx, b.userData.vz) - Math.PI / 2;
    const flap = Math.sin(t * 11 + b.userData.ph) * 0.7;
    b.userData.wl.rotation.z = flap; b.userData.wr.rotation.z = -flap;
  }

  for (const c of clouds) {
    c.position.x += c.userData.sp * dt;
    if (c.position.x > 220) c.position.x = -220;
  }

  for (const p of lilyPads) p.position.y = 0.35 + Math.sin(t * 1.2 + p.userData.ph) * 0.06;

  for (let i = 0; i < PETALS; i++) {
    const p = petalData[i];
    p.y += p.vy * dt;
    p.x += Math.sin(t * 1.5 + p.sw) * dt * 1.2;
    p.z += Math.cos(t * 1.1 + p.sw) * dt * 1.2;
    p.ry += p.sp * dt;
    if (p.y < 0.3) { p.y = 22 + rng() * 6; p.x = -35 + rng() * 65; p.z = 8 + rng() * 30; }
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.set(p.ry * 0.5, p.ry, 0);
    dummy.updateMatrix();
    petalIM.setMatrixAt(i, dummy.matrix);
  }
  petalIM.instanceMatrix.needsUpdate = true;

  TEX.water.offset.x = (t * 0.015) % 1;
  TEX.water.offset.y = (t * 0.008) % 1;

  const lampBase = PRESETS[curTime].lamp;
  for (let i = 0; i < lanternLights.length; i++) {
    lanternLights[i].intensity = lampBase * (0.9 + Math.sin(t * 8 + i * 1.3) * 0.06 + Math.sin(t * 13.7 + i * 2.1) * 0.04);
  }

  controls.update();
  renderer.render(scene, camera);

  if (firstFrame) {
    firstFrame = false;
    window.__zenBooted = true;
    const l = document.getElementById('loader');
    if (l) l.classList.add('hidden');
  }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

setTime('morning');
animate();
</script>
</body>
</html>
