<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voxel Zen Sanctuary – Three.js Single-File Demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- TailwindCSS CDN (Play CDN – no build step) -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Glass-morphism helper */
  .glass {
    @apply rounded-xl bg-white/20 backdrop-blur-md border border-white/30 shadow-lg;
  }
  body { margin: 0; overflow: hidden; }
  canvas { display:block; }
</style>
</head>

<body class="bg-slate-900 text-white">

<!-- UI Overlay -->
<div id="ui" class="fixed top-4 left-1/2 -translate-x-1/2 flex flex-col gap-4 z-50">
  <div class="glass p-4 flex gap-2 justify-center">
    <button data-preset="pagoda"       class="px-3 py-1 glass hover:bg-white/30">Pagoda</button>
    <button data-preset="samurai"      class="px-3 py-1 glass hover:bg-white/30">Samurai</button>
    <button data-preset="meadow"       class="px-3 py-1 glass hover:bg-white/30">Meadow</button>
    <button data-preset="mountain"     class="px-3 py-1 glass hover:bg-white/30">Mountain</button>
    <button data-preset="bird"         class="px-3 py-1 glass hover:bg-white/30">Bird’s Eye</button>
  </div>

  <div class="glass p-4 flex gap-2 justify-center">
    <button data-time="morning" class="px-3 py-1 glass hover:bg-white/30">Morning</button>
    <button data-time="sunset"  class="px-3 py-1 glass hover:bg-white/30">Sunset</button>
    <button data-time="night"   class="px-3 py-1 glass hover:bg-white/30">Night</button>
  </div>
</div>

<!-- Three.js & OrbitControls via ES-module CDN -->
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE              from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { OrbitControls }       from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

/* ---------- CORE THREE.JS SETUP ---------- */
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 500);
camera.position.set(30, 25, 30);

const renderer = new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

/* ---------- CONSTANTS ---------- */
const WORLD_SCALE = 1;          // Treat 1 unit as 1 big voxel
const micro      = 0.25;        // For micro-voxels (characters, details)
const mats       = {};          // Cache of materials keyed by texture name
const objects    = [];          // For simple animation loops

/* ---------- PROCEDURAL 16×16 CANVAS TEXTURES ---------- */
function makeTexture(drawFn, name){
  if(mats[name]) return mats[name];
  const s = 16;
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = s;
  const ctx = cvs.getContext('2d');
  drawFn(ctx, s);
  const tex = new THREE.CanvasTexture(cvs);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  const mat = new THREE.MeshStandardMaterial({map:tex});
  mats[name] = mat;
  return mat;
}
/* Presets */
const grassMat   = makeTexture((c,s)=>{ c.fillStyle="#3aa655"; c.fillRect(0,0,s,s); for(let i=0;i<60;i++){ c.fillStyle=`rgba(0,0,0,${Math.random()*0.2})`; c.fillRect(Math.random()*s,Math.random()*s,1,1);} },"grass");
const woodMat    = makeTexture((c,s)=>{ c.fillStyle="#7b4e2d"; c.fillRect(0,0,s,s); c.fillStyle="#5c3518"; for(let y=0;y<s;y+=2) c.fillRect(0,y,s,1); },"wood");
const roofMat    = makeTexture((c,s)=>{ c.fillStyle="#1a1a1a"; c.fillRect(0,0,s,s); c.fillStyle="#252525"; for(let x=0;x<s;x+=2) c.fillRect(x,0,1,s);} ,"roof");
const paperMat   = makeTexture((c,s)=>{ c.fillStyle="#faf5e4"; c.fillRect(0,0,s,s); c.fillStyle="rgba(0,0,0,0.15)"; for(let y=0;y<s;y+=4) c.fillRect(0,y,s,1);} ,"paper");
const redMat     = makeTexture((c,s)=>{ c.fillStyle="#c62828"; c.fillRect(0,0,s,s);} ,"red");
const stoneMat   = makeTexture((c,s)=>{ c.fillStyle="#777"; c.fillRect(0,0,s,s); c.fillStyle="#666"; for(let i=0;i<80;i++) c.fillRect(Math.random()*s,Math.random()*s,1,1); },"stone");
const waterMat   = makeTexture((c,s)=>{ c.fillStyle="#1e88e5"; c.fillRect(0,0,s,s); },"water");
const bambooMat  = makeTexture((c,s)=>{ c.fillStyle="#5b8c1d"; c.fillRect(0,0,s,s); c.fillStyle="#3f6113"; for(let x=0;x<s;x+=4) c.fillRect(x,0,2,s);} ,"bamboo");
const pinkMat    = makeTexture((c,s)=>{ c.fillStyle="#f8bfe6"; c.fillRect(0,0,s,s);} ,"pink");
const cloudMat   = makeTexture((c,s)=>{ c.fillStyle="#eeeeee"; c.fillRect(0,0,s,s);} ,"cloud");
const goldMat    = makeTexture((c,s)=>{ c.fillStyle="#ffdd55"; c.fillRect(0,0,s,s);} ,"gold");

/* ---------- HELPER: CREATE A VOXEL CUBE ---------- */
function voxel(x,y,z, size, material, cast= true, receive=true){
  const g = new THREE.BoxGeometry(size,size,size);
  const m = material;
  const mesh = new THREE.Mesh(g,m);
  mesh.position.set(x+size/2,y+size/2,z+size/2);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  scene.add(mesh);
  return mesh;
}

/* ---------- GROUND & TERRAIN (variable voxel sizes) ---------- */
function generateTerrain(){
  const gSize = 60;
  for(let x=-gSize;x<gSize;x+=4){
    for(let z=-gSize;z<gSize;z+=4){
      // gentle hills
      const h = Math.floor(Math.sin(x*0.1)*Math.cos(z*0.1)*2);
      voxel(x, h-2, z, 4, grassMat, false, true);
    }
  }
  // Pond
  for(let x=4;x<12;x++){
    for(let z=-8;z<-2;z++){
      voxel(x,-1,z,1,waterMat,false,false);
    }
  }
}
generateTerrain();

/* ---------- MOUNTAIN RANGE (large voxels, 4×4) ---------- */
function generateMountains(){
  const range = 40;
  for(let i=0;i<50;i++){
    const baseX = Math.round((Math.random()*2-1)*range);
    const baseZ = Math.round((Math.random()*2-1)*range);
    const height = 6 + Math.random()*8;
    for(let y=0;y<height;y++){
      const size = 4;
      const spread = (height-y);
      for(let dx=-spread;dx<=spread;dx+=size){
        for(let dz=-spread;dz<=spread;dz+=size){
          const dist = Math.hypot(dx, dz);
          if(dist < spread+1){
            const mat = y>height-2 ? paperMat : stoneMat;  // snowy tops
            voxel(baseX+dx, y*size-2, baseZ+dz, size, mat, false, true);
          }
        }
      }
    }
  }
}
generateMountains();

/* ---------- PAGODA TEMPLE ---------- */
function buildPagoda(){
  const tiers = 4;
  const tierHeight = 3;
  for(let i=0;i<tiers;i++){
    const y = i*tierHeight;
    const size = 10 - i*2;
    // floor
    for(let x=0;x<size;x++){
      for(let z=0;z<size;z++){
        voxel(x-5,y-1,z-5,1,woodMat);
      }
    }
    // beams
    for(let x=0;x<size;x++){
      for(let z=0;z<size;z++){
        if(x===0||x===size-1||z===0||z===size-1){
          voxel(x-5,y,z-5,1,woodMat);
        }
      }
    }
    // shoji windows
    for(let x=1;x<size-1;x++){
      for(let z=1;z<size-1;z++){
        if((x+z)%2===0) voxel(x-5,y,z-5,1,paperMat);
      }
    }
    // roof overhang
    const roofY = y + tierHeight-0.5;
    const roofSize = size+2;
    const slope = 0.2;
    for(let x=-roofSize/2;x<roofSize/2;x++){
      for(let z=-roofSize/2;z<roofSize/2;z++){
        const dy = Math.max(Math.abs(x),Math.abs(z))*slope;
        voxel(x,roofY+dy,z,1,roofMat);
      }
    }
  }
  // Gold spire
  for(let y=tiers*tierHeight;y<tiers*tierHeight+5;y++){
    voxel(0,y,0,0.5,goldMat);
  }
}
buildPagoda();

/* ---------- TORII GATE ---------- */
function buildTorii(){
  const baseX = -12, baseZ = 4;
  // Pillars
  for(let y=0;y<6;y++){
    voxel(baseX,     y, baseZ,1,redMat);
    voxel(baseX+6,   y, baseZ,1,redMat);
  }
  // Cross-beam
  for(let x=0;x<7;x++){
    voxel(baseX-0.5+x,6,baseZ,1,redMat);
  }
}
buildTorii();

/* ---------- ARCH BRIDGE ---------- */
function buildBridge(){
  const sx=4, sz=-5;
  for(let i=0;i<8;i++){
    const h = Math.sin(i/7*Math.PI)*2;
    voxel(sx+i, h, sz, 1, redMat);
    voxel(sx+i, h-1, sz, 1, woodMat);
  }
}
buildBridge();

/* ---------- BAMBOO GROVE & SAKURA ---------- */
function buildFlora(){
  // Bamboo stalks
  for(let i=0;i<30;i++){
    const x = -20 + Math.random()*10;
    const z = -15 + Math.random()*10;
    for(let y=0;y<5+Math.random()*3;y++){
      voxel(x,y-1,z,0.5,bambooMat);
    }
  }
  // Sakura trees
  for(let i=0;i<5;i++){
    const x = 10+Math.random()*15;
    const z = -10+Math.random()*15;
    // trunk
    for(let y=0;y<4;y++) voxel(x,y-1,z,1,woodMat);
    // blossoms
    for(let dy=2;dy<6;dy++){
      for(let dx=-2;dx<=2;dx++){
        for(let dz=-2;dz<=2;dz++){
          if(Math.hypot(dx,dz)+Math.random()<3) voxel(x+dx,dy-1+Math.random(),z+dz,1,pinkMat,false,true);
        }
      }
    }
  }
}
buildFlora();

/* ---------- DYNAMIC SKY (Sun/Moon + Clouds) ---------- */
const sky = new THREE.Group(); scene.add(sky);
let sun;
function buildSky(){
  // Sun / Moon (switch material later)
  sun = voxel(0,40,-40,4,goldMat,false,false);
  sun.material.emissive = new THREE.Color(1,1,1);
  sun.material.emissiveIntensity = 0.8;
  // Clouds
  for(let i=0;i<20;i++){
    const cloud = voxel(Math.random()*60-30, 25+Math.random()*10, Math.random()*-40, 4, cloudMat,false,false);
    sky.add(cloud);
  }
}
buildSky();

/* ---------- CHARACTERS & ANIMALS (micro-voxels) ---------- */
function buildSamurai(){
  const g = new THREE.Group();
  const base = voxel(0,0,0,micro,stoneMat); // placeholder feet
  g.add(base);
  // torso
  const torso = voxel(0, micro, 0, micro, redMat);
  g.add(torso);
  // head
  const head = voxel(0, micro*2, 0, micro, paperMat);
  g.add(head);
  // kabuto crest
  const crest = voxel(0, micro*2.5, -micro*0.5, micro, goldMat);
  g.add(crest);
  g.position.set(-2,0,2);
  scene.add(g);
  objects.push({mesh:g, update:(t)=>{ g.position.y = Math.sin(t+g.id)*0.05; }}); // breathing
}
buildSamurai();

function buildSheep(x,z,mat){
  const body = voxel(0,0,0,micro*2,mat);
  const group = new THREE.Group(); group.add(body);
  group.position.set(x,0,z); scene.add(group);
  objects.push({mesh:group, update:(t)=>{
    group.position.x += Math.sin(t*0.5+group.id)*0.01;
    group.position.z += Math.cos(t*0.5+group.id)*0.01;
  }});
}
for(let i=0;i<6;i++) buildSheep(-5+Math.random()*10,5+Math.random()*10, paperMat);

function buildBirds(){
  const flock = [];
  for(let i=0;i<10;i++){
    const bird = voxel(0,0,0,micro,stoneMat,false,false);
    scene.add(bird);
    flock.push(bird);
  }
  objects.push({mesh:null, update:(t)=>{
    flock.forEach((b,idx)=>{
      b.position.set(Math.sin(t*0.5+idx)*15,20+Math.sin(t+idx)*2,Math.cos(t*0.5+idx)*15);
      b.rotation.z = Math.sin(t*5+idx); // wing flap
    });
  }});
}
buildBirds();

/* ---------- LIGHTING ---------- */
const hemi = new THREE.HemisphereLight(0xb1e1ff,0x444422,0.4); scene.add(hemi);
const dirLight = new THREE.DirectionalLight(0xffffff,1);
dirLight.position.set(30,50, -30);
dirLight.castShadow = true;
dirLight.shadow.camera.top = 50;
dirLight.shadow.camera.bottom = -50;
dirLight.shadow.camera.left = -50;
dirLight.shadow.camera.right = 50;
scene.add(dirLight);

// Lanterns (simple point lights)
function addLantern(x,y,z){
  const l = new THREE.PointLight(0xffcc88,0.0,15,2);
  l.position.set(x,y,z);
  scene.add(l);
  // visible voxel lamp
  voxel(x-0.25,y-0.25,z-0.25,0.5,goldMat,false,false);
  return l;
}
const lanterns=[];
lanterns.push(addLantern(0,3,0)); // inside pagoda
lanterns.push(addLantern(6,1,-3)); // by bridge
lanterns.push(addLantern(-12,2,4)); // torii

/* ---------- TIME-OF-DAY PRESETS ---------- */
const times = {
  morning:{bg:0xbfd6ff, sunColor:0xffffcc, light:1.0, lantern:0.0},
  sunset :{bg:0xffcc88, sunColor:0xffaa55, light:0.6, lantern:0.4},
  night  :{bg:0x001022, sunColor:0x8899ff, light:0.15, lantern:1.2}
};
let currentTime='morning';
function setTime(name){
  currentTime = name;
  const cfg = times[name];
  scene.background = new THREE.Color(cfg.bg);
  dirLight.intensity = cfg.light;
  sun.material.color.set(cfg.sunColor);
  lanterns.forEach(l=>l.intensity = cfg.lantern);
}
setTime('morning');

/* ---------- CAMERA PRESETS ---------- */
const presets = {
  pagoda :{pos:new THREE.Vector3(15,10,20), look:new THREE.Vector3(0,5,0)},
  samurai:{pos:new THREE.Vector3(-1,3,5),   look:new THREE.Vector3(-2,1,2)},
  meadow :{pos:new THREE.Vector3(0,4,15),   look:new THREE.Vector3(0,0,5)},
  mountain:{pos:new THREE.Vector3(0,35,40), look:new THREE.Vector3(0,0,0)},
  bird   :{pos:new THREE.Vector3(0,60,0),   look:new THREE.Vector3(0,0,0)}
};
function gotoPreset(name){
  const p = presets[name];
  if(!p) return;
  camera.position.copy(p.pos);
  controls.target.copy(p.look);
  controls.update();
}
gotoPreset('pagoda');

/* ---------- UI EVENTS ---------- */
document.querySelectorAll('button[data-preset]').forEach(btn=>{
  btn.addEventListener('click',()=>gotoPreset(btn.dataset.preset));
});
document.querySelectorAll('button[data-time]').forEach(btn=>{
  btn.addEventListener('click',()=>setTime(btn.dataset.time));
});

/* ---------- SIMPLE AMBIENT AUDIO (wind + random chimes) ---------- */
const AudioContext = window.AudioContext||window.webkitAudioContext;
const audioCtx = new AudioContext();
const gainWind = audioCtx.createGain();
gainWind.gain.value = 0.05;
gainWind.connect(audioCtx.destination);
/* White-noise wind generator */
{
  const bufferSize = 2 * audioCtx.sampleRate;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const output = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) output[i] = Math.random()*2-1;
  const whiteNoise = audioCtx.createBufferSource();
  whiteNoise.buffer = noiseBuffer;
  whiteNoise.loop = true;
  whiteNoise.connect(gainWind);
  whiteNoise.start(0);
}
/* Wind chimes: random soft sine pings */
function triggerChime(){
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.frequency.value = 600 + Math.random()*800;
  g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.1, audioCtx.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+2);
  osc.connect(g).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime+2);
  // schedule next
  setTimeout(triggerChime, 4000 + Math.random()*6000);
}
audioCtx.resume().then(triggerChime);

/* ---------- HANDLE RESIZE ---------- */
addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- ANIMATION LOOP ---------- */
let clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  // update animated objects
  objects.forEach(o=>o.update && o.update(t));
  // drift clouds
  sky.children.forEach((c,i)=>{ c.position.x += 0.01; if(c.position.x>40) c.position.x=-40; });
  controls.update();
  renderer.render(scene,camera);
}
animate();

/* ---------- USER INTERACTION: auto-start audio on first gesture ---------- */
document.body.addEventListener('click',()=>audioCtx.resume(),{once:true});
</script>
</body>
</html>
