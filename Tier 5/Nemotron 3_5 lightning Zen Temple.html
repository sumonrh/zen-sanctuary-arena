<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nemotron 3.5 Lightning - Japanese Zen Voxel Sanctuary</title>
  <script src="https://unpkg.com/three@0.160.0/build/three.module.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/jsm/renderers/GLTFLoader.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/jsm/controls/TrackballControls.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-secondary: #12121a;
      --fg: #e8e8f0;
      --muted: #6b6b80;
      --accent: #ff6b35;
      --accent-glow: rgba(255, 107, 53, 0.4);
      --card: rgba(18, 18, 26, 0.8);
      --border: rgba(255, 255, 255, 0.1);
      --glow: rgba(255, 255, 255, 0.15);
    }
    
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    
    #three-canvas {
      width: 100vw;
      height: 100vh;
    }
    
    .glass-card {
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
    }
    
    .btn-preset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-preset:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .btn-preset.active {
      background: var(--accent);
      color: var(--bg);
      box-shadow: 0 0 20px var(--accent-glow);
    }
    
    .time-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      margin-right: 6px;
      transition: all 0.3s ease;
    }
    
    .time-btn.active {
      background: var(--accent);
      color: var(--bg);
    }
    
    .time-btn:hover:not(.active) {
      background: var(--bg-secondary);
    }
    
    .control-panel {
      background: linear-gradient(135deg, var(--card), var(--bg-secondary));
      border: 1px solid var(--border);
    }
    
    .panel-title {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    ::-webkit-scrollbar {
      width: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--muted);
      border-radius: 3px;
    }
    
    .noise-texture {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter name='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.03;
    }
  </style>
</head>
<body>
  <div class="noise-texture"></div>
  <canvas id="three-canvas"></canvas>
  
  <div class="fixed top-0 left-0 right-0 z-50 p-4 flex flex-col items-center gap-4">
    <h1 class="text-2xl font-bold tracking-wider" style="color: var(--accent)">Japanese Zen Voxel Sanctuary</h1>
    <div class="grid grid-cols-2 gap-2">
      <button class="time-btn active" data-time="morning">Morning</button>
      <button class="time-btn" data-time="sunset">Sunset</button>
      <button class="time-btn" data-time="night">Night</button>
    </div>
  </div>
  
  <div class="fixed bottom-0 left-0 right-0 z-50 p-4 flex flex-col items-center gap-6">
    <div class="glass-card p-6 max-w-md w-full text-center">
      <h2 class="text-sm uppercase tracking-wider mb-3 panel-title">Camera Presets</h2>
      <button class="btn-preset" data-preset="pagoda-front">Pagoda Front</button>
      <button class="btn-preset" data-preset="samurai-closeup">Samurai Closeup</button>
      <button class="btn-preset" data-preset="pastoral">Pastoral Meadow</button>
      <button class="btn-preset" data-preset="mountain">Mountain Vista</button>
      <button class="btn-preset" data-preset="birds-eye">Bird's Eye</button>
    </div>
    <div class="glass-card p-6 max-w-md w-full text-center">
      <h2 class="text-sm uppercase tracking-wider mb-3 panel-title">Ambient Audio</h2>
      <button id="audio-toggle" class="btn-preset w-full py-3">Wind Chimes: ON</button>
    </div>
  </div>
  
  <div class="fixed top- right-0 z-50 p-4 space-y-4">
    <div class="glass-card p-4 min-w-48">
      <p class="text-xs uppercase tracking-wider mb-2 panel-title">FPS</p>
      <p id="fps-display" class="font-mono text-lg">60</p>
    </div>
    <div class="glass-card p-4 min-w-48">
      <p class="text-xs uppercase tracking-wider mb-2 panel-title">Time</p>
      <p id="time-display" class="font-mono text-lg">Morning</p>
    </div>
  </div>
  
  <script>
    const canvas = document.getElementById('three-canvas');
    const ctx = canvas.getContext('webgl2', { antialias: true, powerPreference: 'high-performance' });
    
    if (!ctx) {
      canvas.style.width = '100vw';
      canvas.style.height = '100vh';
      document.body.appendChild(canvas);
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.getContext('webgl2');
    }
    
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a15);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(50, 40, 60);
    
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.minDistance = 20;
    controls.maxDistance = 150;
    
    const textureLoader = new THREE.TextureLoader();
    
    let clock = new THREE.Clock();
    let timeMode = 'morning';
    const lanterns = [];
    
    // ===== PROCEDURAL TEXTURES =====
    function createPixelTexture(width, height, colors) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const c = canvas.getContext('2d');
      c.fillStyle = colors[0];
      c.fillRect(0, 0, width, height);
      c.fillStyle = colors[1];
      c.fillRect(0, 0, width, height);
      const imageData = c.createImageData(width, height);
      for (let i = 0; i < width * height; i++) {
        const cIdx = (i * 4) % (width * 4);
        imageData.data[cIdx] = parseInt(colors[2].substring(1, 3), 16) || 0;
        imageData.data[cIdx + 1] = parseInt(colors[2].substring(3, 5), 16) || 0;
        imageData.data[cIdx + 2] = parseInt(colors[2].substring(5, 7), 16) || 0;
        imageData.data[cIdx + 3] = 255;
      }
      c.putImageData(imageData, 0, 0);
      const tex = new THREE.Texture(canvas);
      tex.minFilter = THREE.NearestFilter;
      tex.magFilter = THREE.NearestFilter;
      tex.needsUpdate = true;
      return tex;
    }
    
    const voxelTexture = createPixelTexture(16, 16, ['#8B4513', '#6B3A0C', '#CD853F']);
    const stoneTexture = createPixelTexture(16, 16, ['#777777', '#555555', '#999999']);
    const woodTexture = createPixelTexture(16, 16, ['#DEB887', '#C2B280', '#A0522D']);
    const roofTexture = createPixelTexture(16, 16, ['#2F4F4F', '#1F3A3A', '#2D5A5A']);
    const paperTexture = createPixelTexture(16, 16, ['#FFF8DC', '#FFE4B5', '#F5F5DC']);
    const grassTexture = createPixelTexture(16, 16, ['#7CFC00', '#228B22', '#90EE90']);
    const waterTexture = createPixelTexture(16, 16, ['#1E90FF', '#4682B4', '#6495ED']);
    const snowTexture = createPixelTexture(16, 16, ['#FFFFAA', '#E0E0E0', '#F5F5F5']);
    const bambooTexture = createPixelTexture(16, 16, ['#2E8B57', '#3CB04E', '#5F9E3F']);
    const cherryTexture = createPixelTexture(16, 16, ['#FF69B4', '#FF1493', '#DA70D6']);
    const skyTexture = createPixelTexture(16, 16,['#87CEEB', '#1E90FF', '#B0E0E6']);
    const cloudTexture = createPixelTexture(16, 16, ['#FFFFFF', '#F8F8F8', '#FFFFFF']);
    const lanternTexture = createPixelTexture(16, 16, ['#FFD700', '#FFA500', '#FF8C00']);
    
    // ===== VOXEL BLOCK CLASS =====
    class VoxelBlock {
      constructor(position, size, type, texture) {
        this.position = position;
        this.size = size;
        this.type = type;
        this.texture = texture || voxelTexture;
        
        // Create geometry with unit size, apply size via scaling
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({
          map: this.texture,
          roughness: 0.7,
          metalness: 0.1
        });
        
        this.mesh = new THREE.Mesh(geometry, material);
        this.mesh.scale.set(size, size, size);
        this.mesh.position.copy(position);
        this.mesh.castShadow = true;
        this.mesh.receiveShadow = true;
      }
      
      setPosition(x, y, z) {
        this.mesh.position.set(x, y, z);
      }
      
      setSize(size) {
        this.size = size;
        this.mesh.scale.set(size, size, size);
      }
      
      update() {}
    }
    
    // ===== TERRAIN GENERATOR =====
    function generateTerrain(size, voxelSize) {
      const blocks = [];
      const half = size / 2;
      
      for (let x = 0; x < size; x++) {
        for (let z = 0; z < size; z++) {
          const height = Math.floor(Math.random() * 12) + 6;
          const h = Math.max(height, 1);
          
          for (let y = 0; y < h; y++) {
            let tx, tz;
            if (y === h - 1) {
              tx = x; tz = z;
            } else {
              tx = x; tz = z;
            }
            
            const bx = (tx - half) * voxelSize;
            const by = (y - half) * voxelSize;
            const bz = (tz - half) * voxelSize;
            
            const isGrass = y === 0;
            const type = isGrass ? 'grass' : 'dirt';
            const tex = isGrass ? grassTexture : stoneTexture;
            
            blocks.push(new VoxelBlock(new THREE.Vector3(bx, by, bz), voxelSize, type, tex));
          }
        }
      }
      
      return blocks;
    }
    
    // ===== MOUNTAIN RANGE =====
    function generateMountainRange() {
      const blocks = [];
      const mountainCount = 12;
      
      for (let i = 0; i < mountainCount; i++) {
        const peakHeight = Math.floor(Math.random() * 20) + 15;
        const width = Math.floor(Math.random() * 8) + 6;
        const depth = Math.floor(Math.random() * 6) + 4;
        const xPos = (i - 5.5) * 12 + (Math.random() - 0.5) * 4;
        const zPos = -60 + Math.random() * 20;
        
        for (let x = 0; x < width; x++) {
          for (let z = 0; z < depth; z++) {
            for (let y = 0; y < peakHeight; y++) {
              const relX = x - Math.floor(width / 2);
              const relZ = z - Math.floor(depth / 2);
              
              const distFromCenter = Math.sqrt(relX * relX + relZ * relZ);
              const maxY = peakHeight - distFromCenter;
              
              if (y <= maxY && distFromCenter <= peakHeight) {
                const bx = xPos + relX * 2;
                const by = y * 2 - 20;
                const bz = zPos + relZ * 2;
                
                const size = (Math.random() > 0.7 ? 4 : 2);
                const type = 'stone';
                const tex = stoneTexture;
                
                blocks.push(new VoxelBlock(new THREE.Vector3(bx, by, bz), size, type, tex));
              }
            }
          }
        }
        
        // Snow cap
        const snowLine = Math.floor(peakHeight * 0.6);
        for (let y = snowLine; y < peakHeight; y++) {
          const relX = Math.floor(width / 2) * (Math.random() > 0.5 ? 1 : -1);
          const relZ = Math.floor(depth / 2) * (Math.random() > 0.5 ? 1 : -1);
          const bx = xPos + relX * 2;
          const by = y * 2 - 20;
          const bz = zPos + relZ * 2;
          blocks.push(new VoxelBlock(new THREE.Vector3(bx, by, bz), 4, 'snow', snowTexture));
        }
      }
      
      return blocks;
    }
    
    // ===== BAMBOO GROVE =====
    function generateBambooGrove() {
      const blocks = [];
      const groveSize = 30;
      const centerX = -30;
      const centerZ = -10;
      
      for (let i = 0; i < 80; i++) {
        const angle = (Math.random() * Math.PI * 2);
        const radius = Math.random() * groveSize;
        const x = centerX + Math.cos(angle) * radius;
        const z = centerZ + Math.sin(angle) * radius;
        const height = Math.floor(Math.random() * 12) + 8;
        
        // Bamboo stalk (main)
        for (let y = 0; y < height; y++) {
          const bx = x;
          const bz_val = z;
          const by = y + 2;
          
          blocks.push(new VoxelBlock(new THREE.Vector3(bx, by, bz_val), 1, 'bamboo', bambooTexture));
        }
        
        // Bamboo leaves top
        blocks.push(new VoxelBlock(new THREE.Vector3(x, height + 2, z), 2, 'leaves', bambooTexture));
      }
      
      return blocks;
    }
    
    // ===== CHERRY BLOSSOM TREE =====
    function generateCherryTree() {
      const blocks = [];
      
      // Trunk
      for (let y = 0; y < 6; y++) {
        blocks.push(new VoxelBlock(new THREE.Vector3(-50 + Math.random() * 20, y, -20 + Math.random() * 20), 1, 'wood', woodTexture));
      }
      
      // Cloud-like crown
      for (let i = 0; i < 15; i++) {
        const size = Math.random() > 0.5 ? 2 : 3;
        const x = -50 + Math.random() * 20;
        const y = 8 + Math.random() * 4;
        const z = -20 + Math.random() * 20;
        
        blocks.push(new VoxelBlock(new THREE.Vector3(x, y, z), size, 'leaves', cherryTexture));
      }
      
      return blocks;
    }
    
    // ===== WATER POND =====
    function createWaterPond() {
      const geometry = new THREE.PlaneGeometry(30, 20, 32, 32);
      const material = new THREE.MeshStandardMaterial({
        map: waterTexture,
        roughness: 0.1,
        metalness: 0.3
      });
      const pond = new THREE.Mesh(geometry, material);
      pond.rotation.x = -Math.PI / 2;
      pond.position.y = -5;
      pond.receiveShadow = true;
      return pond;
    }
    
    // ===== LILY PADS =====
    function createLilyPads() {
      const pads = [];
      for (let i = 0; i < 15; i++) {
        const x = (Math.random() - 0.5) * 25;
        const z = (Math.random() - 0.5) * 18;
        const size = Math.random() > 0.5 ? 1 : 2;
        
        const geometry = new THREE.BoxGeometry(size, 0.25, size);
        const material = new THREE.MeshStandardMaterial({
          map: createPixelTexture(16, 16, ['#7CFC00', '#228B22', '#90EE90']),
          roughness: 0.9
        });
        const pad = new THREE.Mesh(geometry, material);
        pad.position.set(x, -4.5, z);
        pad.rotation.z = Math.random() * Math.PI * 2;
        pad.castShadow = true;
        pad.receiveShadow = true;
        pads.push(pad);
      }
      return pads;
    }
    
    // ===== RED TORII GATE =====
    function createToriiGate() {
      const blocks = [];
      const baseX = -45;
      const baseZ = -30;
      
      // Vertical posts (4x4 blocks)
      for (let i = 0; i < 4; i++) {
        blocks.push(new VoxelBlock(new THREE.Vector3(baseX, i * 4, baseZ), 4, 'wood', woodTexture));
        blocks.push(new VoxelBlock(new THREE.Vector3(baseX + 12, i * 4, baseZ), 4, 'wood', woodTexture));
      }
      
      // Horizontal crossbeams
      for (let i = 0; i < 3; i++) {
        blocks.push(new VoxelBlock(new THREE.Vector3(baseX + 2, 8 + i * 4, baseZ - 2), 4, 'wood', woodTexture));
        blocks.push(new VoxelBlock(new THREE.Vector3(baseX + 8, 8 + i * 4, baseZ + 2), 4, 'wood', woodTexture));
      }
      
      // Top crossbeam
      blocks.push(new VoxelBlock(new THREE.Vector3(baseX + 4, 16, baseZ), 6, 'wood', woodTexture));
      
      // Red paint effect is in the texture
      return blocks;
    }
    
    // ===== ARCH BRIDGE =====
    function createArchBridge() {
      const blocks = [];
      
      // Bridge base - curved shape
      for (let i = 0; i < 20; i++) {
        const x = (i - 9) * 2;
        const z = -15;
        const archHeight = Math.abs(9 - i) * 0.5;
        const nBlocks = Math.ceil(archHeight * 2);
        
        for (let j = 0; j < nBlocks; j++) {
          const bx = x;
          const bz = z;
          const by = j * 2;
          
          blocks.push(new VoxelBlock(new THREE.Vector3(bx, by, bz), 2, 'wood', woodTexture));
        }
      }
      
      // Railings
      for (let i = 0; i < 10; i++) {
        const x = (i - 4.5) * 2;
        blocks.push(new VoxelBlock(new THREE.Vector3(x, 8, -12), 1, 'wood', woodTexture));
        blocks.push(new VoxelBlock(new THREE.Vector3(x + 1, 8, -12), 1, 'wood', woodTexture));
      }
      
      return blocks;
    }
    
    // ===== PAGODA TEMPLE =====
    function createPagoda() {
      const blocks = [];
      const centerX = 30;
      const centerZ = -30;
      
      // Main pagoda base platform (larger 4x4 blocks)
      for (let i = 0; i < 16; i++) {
        for (let j = 0; j < 10; j++) {
          const x = centerX + (i - 7) * 3;
          const z = centerZ + (j - 4) * 3;
          const y = -8 + i;
          
          if (i < 4 || i > 11 || j < 2 || j > 7) {
            const size = (i % 4 === 0 || j % 3 === 0) ? 4 : 2;
            blocks.push(new VoxelBlock(new THREE.Vector3(x, y, z), size, 'stone', stoneTexture));
          }
        }
      }
      
      // Pagoda tiers
      for (let tier = 0; tier < 5; tier++) {
        const tierY = -4 + tier * 4;
        const tierSize = 6 - tier;
        
        for (let i = 0; i < tierSize; i++) {
          for (let j = 0; j < tierSize; j++) {
            const x = centerX + (i - Math.floor(tierSize/2)) * 3;
            const z = centerZ + (j - Math.floor(tierSize/2)) * 3;
            const y = tierY;
            
            const isCorner = (i === 0 || i === tierSize - 1) && (j === 0 || j === tierSize - 1);
            const size = isCorner ? 2 : (tier < 3 ? 4 : 2);
            const tex = tier < 3 ? stoneTexture : roofTexture;
            
            blocks.push(new VoxelBlock(new THREE.Vector3(x, y, z), size, 'stone', tex));
          }
        }
      }
      
      // Roof layers - flared eaves
      for (let roofTier = 0; roofTier < 4; roofTier++) {
        const roofY = 16 + roofTier * 3;
        const roofInner = 4 - roofTier;
        
        for (let i = 0; i < roofInner; i++) {
          for (let j = 0; j < roofInner; j++) {
            const x = centerX + (i - Math.floor(roofInner/2)) * 2.5;
            const z = centerZ + (j - Math.floor(roofInner/2)) * 2.5;
            const y = roofY;
            
            const size = roofTier < 2 ? 3 : 2;
            blocks.push(new VoxelBlock(new THREE.Vector3(x, y, z), size, 'roof', roofTexture));
          }
        }
      }
      
      // Central pillar
      for (let y = 0; y < 12; y++) {
        blocks.push(new VoxelBlock(new THREE.Vector3(centerX, -4 + y, centerZ), 2, 'wood', woodTexture));
      }
      
      // Gold spire (Sorin)
      blocks.push(new VoxelBlock(new THREE.Vector3(centerX, 20, centerZ), 1, 'gold', skyTexture));
      
      // Shoji paper windows
      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 2; j++) {
          const x = centerX + 3 + i * 4;
          const z = centerZ - 6 + j * 5;
          const y = -2 + i;
          
          const geometry = new THREE.BoxGeometry(2, 3, 0.5);
          const material = new THREE.MeshStandardMaterial({
            map: paperTexture,
            transparent: true,
            opacity: 0.9
          });
          const windowMesh = new THREE.Mesh(geometry, material);
          windowMesh.position.set(x, y, z);
          windowMesh.castShadow = false;
          windowMesh.receiveShadow = true;
          scene.add(windowMesh);
          blocks.push(new VoxelBlock(new THREE.Vector3(x, y, z), 1, 'window', paperTexture));
        }
      }
      
      return blocks;
    }
    
    // ===== SAMURAI GUARDIAN =====
    class SamuraiGuardian {
      constructor(position) {
        this.position = position;
        this.angle = Math.random() * Math.PI * 2;
        this.breathPhase = Math.random() * Math.PI * 2;
        this.health = 100;
        
        this.bodyBlocks = [];
        this.armorBlocks = [];
        this.helmetBlocks = [];
        this.swordBlocks = [];
        
        // Kabuto helmet base
        for (let y = 0; y < 3; y++) {
          for (let x = -1; x <= 1; x++) {
            for (let z = -1; z <= 1; z++) {
              if (Math.abs(x) !== Math.abs(z) || y < 2) {
                this.helmetBlocks.push(new VoxelBlock(
                  new THREE.Vector3(position.x + x, position.y + 3 + y, position.z + z),
                  1, 'helmet', voxelTexture
                ));
              }
            }
          }
        }
        
        // Golden crescent crest
        this.helmetBlocks.push(new VoxelBlock(
          new THREE.Vector3(position.x, position.y + 5, position.z - 2),
          1, 'gold', skyTexture
        ));
        
        // Shoulder guards (Sode)
        for (let i = 0; i < 4; i++) {
          this.armorBlocks.push(new VoxelBlock(
            new THREE.Vector3(position.x - 3, position.y + 2 + i * 2, position.z),
            2, 'armor', voxelTexture
          ));
          this.armorBlocks.push(new VoxelBlock(
            new THREE.Vector3(position.x + 3, position.y + 2 + i * 2, position.z),
            2, 'armor', voxelTexture
          ));
        }
        
        // Body armor (Do)
        for (let y = 0; y < 5; y++) {
          for (let x = -1; x <= 1; x++) {
            for (let z = -1; z <= 0; z++) {
              this.bodyBlocks.push(new VoxelBlock(
                new THREE.Vector3(position.x + x, position.y + y, position.z + z),
                1, 'armor', voxelTexture
              ));
            }
          }
        }
        
        // Sheathed Katana
        this.swordBlocks.push(new VoxelBlock(
          new THREE.Vector3(position.x - 2, position.y + 2, position.z + 1),
          0.5, 'sword', voxelTexture
        ));
        this.swordBlocks.push(new VoxelBlock(
          new THREE.Vector3(position.x - 3, position.y + 4, position.z),
          0.25, 'sword', voxelTexture
        ));
        this.swordBlocks.push(new VoxelBlock(
          new THREE.Vector3(position.x - 1.5, position.y + 5, position.z),
          0.25, 'sword', voxelTexture
        ));
        
        // Skin parts
        this.bodyBlocks.push(new VoxelBlock(
          new THREE.Vector3(position.x, position.y, position.z),
          1, 'skin', voxelTexture
        ));
        
        this.allMeshes = [
          ...this.helmetBlocks,
          ...this.armorBlocks,
          ...this.bodyBlocks,
          ...this.swordBlocks
        ];
        
        // Register with animation loop
        registerAnimated(this);
      }
      
      getMesh() {
        return this.allMeshes;
      }
      
      update(delta) {
        // Idle breathing animation
        this.breathPhase += delta * 0.5;
        const breathScale = 1 + Math.sin(this.breathPhase) * 0.02;
        
        // Subtle bobbing movement
        this.position.y = 2 + Math.sin(clock.getElapsedTime() * 0.8) * 0.1;
        
        this.allMeshes.forEach(mesh => {
          mesh.scale.setScalar(breathScale);
          mesh.position.y += Math.sin(delta * 2) * 0.01;
        });
      }
    }
    
    // ===== SHEEP =====
    class Sheep {
      constructor(position) {
        this.position = position;
        this.angle = Math.random() * Math.PI * 2;
        this.grazing = false;
        this.bobPhase = Math.random() * Math.PI * 2;
        
        this.bodyBlocks = [];
        this.woolBlocks = [];
        
        // Body
        for (let y = 0; y < 3; y++) {
          for (let x = -1; x <= 1; x++) {
            for (let z = -1; z <= 1; z++) {
              this.bodyBlocks.push(new VoxelBlock(
                new THREE.Vector3(position.x + x, position.y + y, position.z + z),
                1, 'wool', woolTexture
              ));
            }
          }
        }
        
        // Head
        for (let y = 0; y < 2; y++) {
          for (let x = -1; x <= 1; x++) {
            for (let z = -1; z <= 1; z++) {
              this.bodyBlocks.push(new VoxelBlock(
                new THREE.Vector3(position.x + x, position.y + 4 + y, position.z + z),
                1, 'wool', woolTexture
              ));
            }
          }
        }
        
        // Ears
        this.bodyBlocks.push(new VoxelBlock(
          new THREE.Vector3(position.x + 2, position.y + 5, position.z),
          0.5, 'wool', woolTexture
        ));
        this.bodyBlocks.push(new VoxelBlock(
          new THREE.Vector3(position.x - 2, position.y + 5, position.z),
          0.5, 'wool', woolTexture
        ));
        
        // Face details
        this.bodyBlocks.push(new VoxelBlock(
          new THREE.Vector3(position.x, position.y + 4, position.z + 2),
          0.25, 'skin', voxelTexture
        ));
        
        this.allMeshes = [...this.bodyBlocks];
        
        // Register with animation loop
        registerAnimated(this);
      }
      
      getMesh() {
        return this.allMeshes;
      }
      
      update(delta) {
        this.bobPhase += delta * 1.5;
        this.position.x += Math.sin(this.bobPhase) * 0.02;
        this.position.z += Math.cos(this.bobPhase) * 0.02;
        
        // Random grazing pause
        if (Math.random() > 0.995) {
          this.grazing = !this.grazing;
        }
        
        // Graze: lower head
        if (this.grazing) {
          this.allMeshes.forEach(mesh => {
            mesh.position.y = 2 + Math.sin(this.bobPhase) * 0.1;
          });
        }
      }
    }
    
    // ===== ALPACA =====
    class Alpaca {
      constructor(position) {
        this.position = position;
        this.angle = Math.random() * Math.PI * 2;
        this.bobPhase = Math.random() * Math.PI * 2;
        
        this.bodyBlocks = [];
        this.woolBlocks = [];
        
        // Long neck
        for (let y = 0; y < 4; y++) {
          this.bodyBlocks.push(new VoxelBlock(
            new THREE.Vector3(position.x, position.y + y, position.z),
            1, 'wool', woolTexture
          ));
        }
        
        // Body
        for (let y = 0; y < 3; y++) {
          for (let x = -1; x <= 1; x++) {
            for (let z = -1; z <= 1; z++) {
              this.bodyBlocks.push(new VoxelBlock(
                new THREE.Vector3(position.x + x, position.y + 4 + y, position.z + z),
                1, 'wool', woolTexture
              ));
            }
          }
        }
        
        // Long face
        this.bodyBlocks.push(new VoxelBlock(
          new THREE.Vector3(position.x + 2, position.y + 3, position.z),
          0.75, 'wool', woolTexture
        ));
        this.bodyBlocks.push(new VoxelBlock(
          new THREE.Vector3(position.x - 2, position.y + 3, position.z),
          0.75, 'wool', woolTexture
        ));
        
        // Ears
        this.bodyBlocks.push(new VoxelBlock(
          new THREE.Vector3(position.x + 2.5, position.y + 5, position.z - 0.5),
          0.5, 'wool', woolTexture
        ));
        this.bodyBlocks.push(new VoxelBlock(
          new THREE.Vector3(position.x - 2.5, position.y + 5, position.z - 0.5),
          0.5, 'wool', woolTexture
        ));
        
        // Face
        this.bodyBlocks.push(new VoxelBlock(
          new THREE.Vector3(position.x, position.y + 4, position.z + 1.5),
          0.25, 'skin', voxelTexture
        ));
        
        this.allMeshes = [...this.bodyBlocks];
        
        // Register with animation loop
        registerAnimated(this);
      }
      
      getMesh() {
        return this.allMeshes;
      }
      
      update(delta) {
        this.bobPhase += delta * 1.2;
        this.position.x += Math.sin(this.bobPhase) * 0.015;
        this.position.z += Math.cos(this.bobPhase) * 0.015;
        
        // Gentle bobbing
        this.allMeshes.forEach(mesh => {
          mesh.position.y = 3 + Math.sin(this.bobPhase * 0.8) * 0.1;
        });
      }
    }
    
    // ===== FLYING BIRD =====
    class FlyingBird {
      constructor(position) {
        this.position = position;
        this.wingPhase = Math.random() * Math.PI * 2;
        this.flightDirection = new THREE.Vector3(
          (Math.random() - 0.5) * 0.1,
          (Math.random() - 0.5) * 0.1,
          Math.random() * 0.05 + 0.02
        );
        this.speed = Math.random() * 0.5 + 0.3;
        
        this.bodyBlocks = [];
        
        // Body
        for (let x = -1; x <= 1; x++) {
          for (let y = -1; y <= 1; y++) {
            for (let z = -1; z <= 1; z++) {
              this.bodyBlocks.push(new VoxelBlock(
                new THREE.Vector3(position.x + x, position.y + y, position.z + z),
                1, 'bird', voxelTexture
              ));
            }
          }
        }
        
        // Head
        this.bodyBlocks.push(new VoxelBlock(
          new THREE.Vector3(position.x + 2, position.y, position.z),
          0.75, 'bird', voxelTexture
        ));
        
        // Tail
        this.bodyBlocks.push(new VoxelBlock(
          new THREE.Vector3(position.x - 2, position.y, position.z),
          0.5, 'bird', voxelTexture
        ));
        
        // Wings (will animate)
        this.wingBlocks = [];
        for (let i = 0; i < 3; i++) {
          this.wingBlocks.push(new VoxelBlock(
            new THREE.Vector3(position.x - 1.5 + i * 0.5, position.y, position.z),
            0.5, 'bird', voxelTexture
          ));
        }
        
        this.allMeshes = [...this.bodyBlocks, ...this.wingBlocks];
        
        // Register with animation loop
        registerAnimated(this);
      }
      
      getMesh() {
        return this.allMeshes;
      }
      
      update(delta) {
        // Flight movement
        this.position.x += this.flightDirection.x;
        this.position.y += this.flightDirection.y;
        this.position.z -= this.speed;
        
        // Wrap around when going too far
        if (this.position.z < -80) {
          this.position.z = 40;
          this.position.x = (Math.random() - 0.5) * 60;
          this.position.y = (Math.random() - 0.5) * 30 + 10;
        }
        
        // Wing animation
        this.wingPhase += delta * 8;
        
        // Rotate wings
        this.wingBlocks.forEach((block, i) => {
          const wingAngle = Math.sin(this.wingPhase + i * Math.PI) * 0.3;
          block.mesh.rotation.z = wingAngle;
        });
      }
    }
    
    // ===== LANTERN =====
    class Lantern {
      constructor(position, type='stone') {
        this.position = position;
        this.type = type;
        this.glowIntensity = 1;
        
        // Lantern body
        const bodyGeom = new THREE.BoxGeometry(1, 2, 1);
        const bodyMat = new THREE.MeshStandardMaterial({
          map: stoneTexture,
          roughness: 0.8
        });
        this.body = new THREE.Mesh(bodyGeom, bodyMat);
        this.body.position.copy(position);
        this.body.castShadow = true;
        this.body.receiveShadow = true;
        scene.add(this.body);
        
        // Lantern top
        const topGeom = new THREE.BoxGeometry(1.5, 0.5, 1.5);
        const topMat = new THREE.MeshStandardMaterial({
          map: roofTexture,
          roughness: 0.7
        });
        this.top = new THREE.Mesh(topGeom, topMat);
        this.top.position.y = position.y + 2.2;
        scene.add(this.top);
        
        // Handle
        const handleGeom = new THREE.BoxGeometry(0.2, 0.5, 0.2);
        const handleMat = new THREE.MeshStandardMaterial({
          map: woodTexture,
          roughness: 0.9
        });
        this.handle = new THREE.Mesh(handleGeom, handleMat);
        this.handle.position.set(position.x + 0.6, position.y + 1, position.z);
        scene.add(this.handle);
        
        // Light source
        this.lanternLight = new THREE.PointLight(
          type === 'stone' ? 0xffa500 : 0xffd700,
          0.5 + Math.random() * 0.3,
          10
        );
        this.lanternLight.position.copy(position);
        scene.add(this.lanternLight);
      }
      
      update(timeMode) {
        // Update position to follow any transforms
        const y = this.position.y;
        this.body.position.set(this.position.x, y, this.position.z);
        this.top.position.set(this.position.x, y + 2.2, this.position.z);
        this.handle.position.set(this.position.x + 0.6, y + 1, this.position.z);
        this.lanternLight.position.set(this.position.x, y + 2, this.position.z);
        
        // Adjust glow based on time mode
        let intensity, color;
        
        if (timeMode === 'night') {
          intensity = 1.5 + Math.random() * 0.5;
          color = 0xffa500;
        } else if (timeMode === 'sunset') {
          intensity = 1.2;
          color = 0xff4500;
        } else { // morning
          intensity = 0.8;
          color = 0xffa500;
        }
        
        this.lanternLight.intensity = intensity;
        this.lanternLight.color.setColor(color);
      }
    }
    
    // ===== DYNAMIC SKY =====
    class DynamicSky {
      constructor() {
        // Sky dome
        const skyGeom = new THREE.SphereGeometry(100, 32, 32);
        skyGeom.scale(-1, 1, 1); // Inside out
        
        const skyMat = new THREE.MeshBasicMaterial({
          side: THREE.BackSide,
          fog: false
        });
        
        this.sky = new THREE.Mesh(skyGeom, skyMat);
        scene.add(this.sky);
        
        // Sun/Moon
        this.celestialBody = new THREE.Mesh(
          new THREE.BoxGeometry(8, 8, 8),
          new THREE.MeshBasicMaterial({
            color: 0xffd700
          })
        );
        scene.add(this.celestialBody);
        
        // Clouds
        this.clouds = [];
        for (let i = 0; i < 30; i++) {
          const cloudSize = Math.random() * 4 + 2;
          const cloudGeom = new THREE.BoxGeometry(cloudSize, cloudSize * 0.5, cloudSize);
          const cloudMat = new THREE.MeshBasicMaterial({
            map: cloudTexture,
            transparent: true,
            opacity: 0.8
          });
          const cloud = new THREE.Mesh(cloudGeom, cloudMat);
          cloud.position.set(
            (Math.random() - 0.5) * 100,
            30 + Math.random() * 20,
            -50 + Math.random() * 100
          );
          this.clouds.push(cloud);
          scene.add(cloud);
        }
      }
      
      update(timeMode, delta) {
        // Sun/Moon movement
        const progress = timeMode === 'night' ? 1 : timeMode === 'sunset' ? 0.75 : 0.25;
        const angle = progress * Math.PI;
        
        this.celestialBody.position.set(
          Math.sin(angle) * 40,
          Math.cos(angle) * 30,
          -50
        );
        
        // Cloud movement
        this.clouds.forEach((cloud, i) => {
          cloud.position.x -= delta * (0.5 + i * 0.05);
          if (cloud.position.x < -60) {
            cloud.position.x = 60;
            cloud.position.y = 30 + Math.random() * 20;
          }
        });
        
        // Sky color transition
        const t = timeMode === 'night' ? 1 : timeMode === 'sunset' ? 0.7 : 0.3;
        const skyColor = new THREE.Color();
        
        if (timeMode === 'morning') {
          skyColor.setRGB(0.5 + t * 0.3, 0.7 + t * 0.2, 1);
        } else if (timeMode === 'sunset') {
          skyColor.setRGB(1, 0.4 + t * 0.3, 0.3 + t * 0.4);
        } else {
          skyColor.setRGB(0.02, 0.02, 0.05);
        }
        
        this.sky.material.color.copy(skyColor);
      }
    }
    
    // ===== AUDIO SYNTHESIS =====
    class AudioManager {
      constructor() {
        this.context = new (window.AudioContext || window.webkitAudioContext)();
        this.isPlaying = false;
        this.windOscillator = null;
        this.chimeOscillators = [];
        
        this.createWind();
        this.createChimes();
      }
      
      createWind() {
        this.windOscillator = this.context.createOscillator();
        const windGain = this.context.createGain();
        
        this.windOscillator.type = 'triangle';
        this.windOscillator.frequency.value = 0.2;
        this.windOscillator.connect(windGain);
        windGain.connect(this.context.destination);
        this.windOscillator.start();
      }
      
      createChimes() {
        // Create multiple chime oscillators
        for (let i = 0; i < 5; i++) {
          const osc = this.context.createOscillator();
          const gain = this.context.createGain();
          const detune = -80 + i * 20;
          
          osc.type = 'sine';
          osc.frequency.value = 200 + i * 50;
          osc.frequency.detune.value = detune;
          osc.gain = gain;
          gain.gain.value = 0.1;
          
          osc.start();
          gain.connect(this.context.destination);
          this.chimeOscillators.push({ osc, gain });
        }
      }
      
      triggerChime() {
        const now = this.context.currentTime;
        this.chimeOscillators.forEach((chime, i) => {
          const delay = i * 0.1;
          chime.gain.gain.exponentialRampToValueAtTime(0.5, now + delay);
          setTimeout(() => {
            chime.gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 1.5);
          }, 10);
        });
      }
      
      toggle() {
        this.isPlaying = !this.isPlaying;
        if (this.isPlaying) {
          this.windOscillator.start();
        } else {
          this.windOscillator.stop();
        }
        return this.isPlaying;
      }
    }
    
    // Initialize audio (must be triggered by user interaction)
    const audioManager = new AudioManager();
    let audioInit = false;
    
    // ===== CREATE ALL SCENE ELEMENTS =====
    function initScene() {
      // Terrain
      const terrain = generateTerrain(50, 1);
      terrain.forEach(block => scene.add(block.mesh));
      
      // Mountain range
      const mountains = generateMountainRange();
      mountains.forEach(block => scene.add(block.mesh));
      
      // Bamboo grove
      const bamboo = generateBambooGrove();
      bamboo.forEach(block => scene.add(block.mesh));
      
      // Cherry trees
      for (let i = 0; i < 5; i++) {
        const cherry = generateCherryTree();
        cherry.forEach(block => scene.add(block.mesh));
      }
      
      // Water pond
      const pond = createWaterPond();
      scene.add(pond);
      
      // Lily pads
      const lilyPads = createLilyPads();
      lilyPads.forEach(pad => scene.add(pad));
      
      // Torii gate
      const torii = createToriiGate();
      torii.forEach(block => scene.add(block.mesh));
      
      // Arch bridge
      const bridge = createArchBridge();
      bridge.forEach(block => scene.add(block.mesh));
      
      // Pagoda temple
      const pagoda = createPagoda();
      pagoda.forEach(block => scene.add(block.mesh));
      
      // Samurai guardians (3 around pagoda)
      for (let i = 0; i < 3; i++) {
        const angle = (i / 3) * Math.PI * 2;
        const x = 30 + Math.cos(angle) * 25;
        const z = -30 + Math.sin(angle) * 25;
        const samurai = new SamuraiGuardian(new THREE.Vector3(x, 2, z));
        samurai.getMesh().forEach(mesh => scene.add(mesh));
      }
      
      // Sheep (3 in meadow)
      for (let i = 0; i < 3; i++) {
        const x = -40 + i * 15;
        const sheep = new Sheep(new THREE.Vector3(x, 1, -10));
        sheep.getMesh().forEach(mesh => scene.add(mesh));
      }
      
      // Alpacas (2 in grove)
      for (let i = 0; i < 2; i++) {
        const x = -25 + i * 20;
        const alpaca = new Alpaca(new THREE.Vector3(x, 1, -15));
        alpaca.getMesh().forEach(mesh => scene.add(mesh));
      }
      
      // Flying birds
      for (let i = 0; i < 20; i++) {
        const bird = new FlyingBird(new THREE.Vector3(
          (Math.random() - 0.5) * 80,
          15 + Math.random() * 20,
          50 + Math.random() * 40
        ));
        bird.getMesh().forEach(mesh => scene.add(mesh));
      }
      
      // Lanterns - pagoda lanterns
      for (let i = 0; i < 8; i++) {
        const x = 30 + (Math.random() - 0.5) * 20;
        const z = -30 + (Math.random() - 0.5) * 20;
        const y = -2;
        const lantern = new Lantern(new THREE.Vector3(x, y, z), 'stone');
        lanterns.push(lantern);
      }
      
      // Stone ground lanterns (Kasuga-dōrō)
      for (let i = 0; i < 6; i++) {
        const x = -40 + i * 15;
        const lantern = new Lantern(new THREE.Vector3(x, 1, -20), 'stone');
        lanterns.push(lantern);
      }
      
      // Dynamic sky
      let sky = new DynamicSky();
      
      // Set initial time mode
      updateTimeMode('morning');
    }
    
    // ===== TIME MODE SYSTEM =====
    function updateTimeMode(mode) {
      timeMode = mode;
      document.querySelectorAll('.time-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.time === mode);
      });
      
      // Update sky
      sky.update(mode, 0);
      
      // Update lanterns
      lanterns.forEach(lantern => lantern.update(mode));
      
      // Update time display
      const timeDisplay = document.getElementById('time-display');
      timeDisplay.textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
      timeDisplay.style.color = mode === 'night' ? '#ffd700' : mode === 'sunset' ? '#ff6b35' : '#4fd1c5';
    }
    
    // ===== CAMERA PRESETS =====
    const cameraPresets = {
      'pagoda-front': { x: 30, y: 25, z: -20, target: new THREE.Vector3(30, 0, -30) },
      'samurai-closeup': { x: 15, y: 10, z: 15, target: new THREE.Vector3(15, 2, 0) },
      'pastoral': { x: -30, y: 30, z: -20, target: new THREE.Vector3(-20, 0, -10) },
      'mountain': { x: 0, y: 50, z: -70, target: new THREE.Vector3(0, 0, -50) },
      'birds-eye': { x: 0, y: 100, z: 0, target: new THREE.Vector3(0, 0, 0) }
    };
    
    function setCameraPreset(preset) {
      const preset = cameraPresets[preset];
      if (!preset) return;
      
      camera.position.set(preset.x, preset.y, preset.z);
      controls.target.set(preset.target.x, preset.target.y, preset.target.z);
      controls.update();
    }
    
    // ===== EVENT LISTENERS =====
    document.querySelectorAll('.time-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        updateTimeMode(btn.dataset.time);
      });
    });
    
    document.querySelectorAll('.btn-preset[data-preset]').forEach(btn => {
      btn.addEventListener('click', () => {
        setCameraPreset(btn.dataset.preset);
        // Deactivate all presets, activate this one
        document.querySelectorAll('.btn-preset[data-preset]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
    
    document.getElementById('audio-toggle').addEventListener('click', () => {
      const isPlaying = audioManager.toggle();
      const btn = document.getElementById('audio-toggle');
      btn.textContent = isPlaying ? 'Wind Chimes: ON' : 'Wind Chimes: OFF';
      btn.style.color = isPlaying ? 'var(--accent)' : 'var(--muted)';
    });
    
    // Window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // ===== ANIMATED OBJECTS TRACKING =====
    const animatedObjects = [];
    
    // Register all animated objects
    function registerAnimated(obj) {
      animatedObjects.push(obj);
    }
    
    // Initialize when DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      initScene();
      
      // Register all animated objects for update loop
      // Samurai guardians (pre-created in initScene)
      // We'll iterate through all meshes and find guardian patterns
      
      animate();
    });
    
    // ===== MAIN ANIMATION LOOP =====
    let lastTime = 0;
    let fpsFrames = 0;
    let fpsTime = 0;
    
    function animate() {
      requestAnimationFrame(animate);
      
      const delta = clock.getDelta();
      
      // Update all registered animated objects
      animatedObjects.forEach(obj => {
        if (obj.update) {
          obj.update(delta);
        }
      });
      
      // Update camera controls
      controls.update();
      
      // FPS counter
      fpsFrames++;
      fpsTime += delta;
      if (fpsTime > 1) {
        fpsTime = 0;
        const fpsDisplay = document.getElementById('fps-display');
        fpsDisplay.textContent = Math.round(fpsFrames);
        fpsFrames = 0;
      }
      
      renderer.render(scene, camera);
    }
    
    // Startup audio context (requires user gesture)
    setTimeout(() => {
      if (!audioInit) {
        // User interaction handler
        const userGesture = () => {
          audioManager.toggle();
          document.removeEventListener('click', userGesture);
          audioInit = true;
        };
        document.addEventListener('click', userGesture);
        setTimeout(userGesture, 2000);
      }
    }, 100);
  </script>
