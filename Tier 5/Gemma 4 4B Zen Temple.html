<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Sanctuary Voxel Engine</title>
    <!-- Tailwind CSS via CDN for the Glassmorphism UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Map for Three.js ES Modules -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 0; }
        /* Custom CSS for Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body>
    <!-- UI Layer -->
    <div id="ui" class="fixed top-4 left-4 right-4 z-50 pointer-events-none">
        <!-- Control Panel -->
        <div class="glass p-4 rounded-xl w-80 space-y-3 pointer-events-auto">
            <h1 class="text-white font-bold text-xl border-b border-white/30 pb-2">Zen Sanctuary Control</h1>
            <div class="flex flex-col gap-2">
                <button onclick="changeTimeMode('morning')" class="px-3 py-2 rounded bg-yellow-600/80 hover:bg-yellow-500 text-white font-medium transition">☀️ Morning Sun</button>
                <button onclick="changeTimeMode('sunset')" class="px-3 py-2 rounded bg-red-700/80 hover:bg-red-600 text-white font-medium transition">🌅 Sunset</button>
                <button onclick="changeTimeMode('night')" class="px-3 py-2 rounded bg-blue-900/80 hover:bg-blue-800 text-white font-medium transition">🌙 Night</button>
            </div>
            <p class="text-white/80 text-sm mt-2 italic">Use Mouse to Orbit | Q/E to move up/down</p>
        </div>

        <!-- Camera Preset Selector -->
        <div class="glass p-4 rounded-xl w-80 mt-4 pointer-events-auto">
            <h2 class="text-white text-xs uppercase tracking-widest mb-2 font-semibold">Camera Presets</h2>
            <div id="presetBtns" class="flex flex-wrap gap-2">
                <!-- Buttons populated by JS -->
            </div>
        </div>
    </div>

    <!-- Audio Button -->
    <button id="audio-toggle" class="fixed bottom-4 right-4 p-3 rounded-full bg-black/60 text-white hover:bg-black/80 transition z-50">🔊 Audio: OFF</button>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- CONFIGURATION ---
        const TILE_SIZE = 4;
        const WORLD_SIZE = 30;
        let scene, camera, renderer, controls;
        let sun, ambientLight, pointLight;
        let timeMode = 'morning';
        let isAudioEnabled = false;

        // --- TEXTURES & MATERIALS ---
        function createPixelTexture(width, height, colorA, b, colorB) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = colorA;
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = colorB || colorA;
            for (let x = 0; x < width; x += 4) {
                for (let y = 0; y < height; y += 4) {
                    if ((x + y) % 8 === 0) {
                        ctx.fillRect(x, y, 4, 4);
                    }
                }
            }
            
            const img = new THREE.CanvasTexture(canvas);
            img.magFilter = THREE.NearestFilter;
            img.minFilter = THREE.NearestFilter;
            img.needsUpdate = true;
            img.colorSpace = THREE.SRGBColorSpace;
            return img;
        }

        const textures = {
            grass: createPixelTexture(16, 16, '#4a8b3e', 1, '#2d5a2b'),
            soil: createPixelTexture(16, 16, '#8b4513', 1, '#5c3210'),
            snow: createPixelTexture(16, 16, '#f0f8ff', 1, '#cccccc'),
            woodDark: createPixelTexture(16, 16, '#4c2a16', 1, '#2a1a10'),
            woodRed: createPixelTexture(16, 16, '#a83232', 1, '#661d1d'),
            stone: createPixelTexture(16, 16, '#808080', 1, '#505050'),
            water: createPixelTexture(16, 16, '#004a8c', 1, '#002a4d')
        };

        // --- PROCEDURAL TERRAIN GENERATION ---
        function generateTerrain() {
            const geometry = new THREE.BoxGeometry(TILE_SIZE, TILE_SIZE, TILE_SIZE);
            const grassMat = new THREE.MeshLambertMaterial({ map: textures.grass });
            const soilMat = new THREE.MeshLambertMaterial({ map: textures.soil });
            const snowMat = new THREE.MeshLambertMaterial({ map: textures.snow });
            const waterMat = new THREE.MeshLambertMaterial({ map: textures.water, transparent: true, opacity: 0.8 });

            const half = (WORLD_SIZE * TILE_SIZE) / 2;
            for (let x = 0; x < WORLD_SIZE; x++) {
                for (let z = 0; z < WORLD_SIZE; z++) {
                    const posX = x * TILE_SIZE - half;
                    const posZ = z * TILE_SIZE - half;
                    const height = Math.floor((Math.sin(x * 0.25) * Math.cos(z * 0.25) + 1) * 2.5);
                    
                    for (let y = 0; y <= height; y++) {
                        let mat = soilMat;
                        if (y === height) {
                            mat = height >= 4 ? snowMat : grassMat;
                        }
                        const voxel = new THREE.Mesh(geometry, mat);
                        voxel.position.set(posX, y * TILE_SIZE, posZ);
                        scene.add(voxel);
                    }

                    if (height < 2) {
                        const waterVoxel = new THREE.Mesh(geometry, waterMat);
                        waterVoxel.position.set(posX, 1.5 * TILE_SIZE, posZ);
                        scene.add(waterVoxel);
                    }
                }
            }
        }

        // --- ARCHITECTURE: PAGODA & TORII GATE ---
        function buildPagoda(x, z) {
            const woodMaterial = new THREE.MeshLambertMaterial({ map: textures.woodDark });
            const redWoodMat = new THREE.MeshLambertMaterial({ map: textures.woodRed });
            const shojiMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });

            for (let tier = 0; tier < 3; tier++) {
                const tierY = 8 + tier * 6;
                const size = (3 - tier) * 3 + 2;

                const pillarGeo = new THREE.BoxGeometry(size, 4, size);
                const pillar = new THREE.Mesh(pillarGeo, woodMaterial);
                pillar.position.set(x, tierY + 2, z);
                scene.add(pillar);

                const shojiGeo = new THREE.BoxGeometry(size + 0.1, 2, size + 0.1);
                const shoji = new THREE.Mesh(shojiGeo, shojiMat);
                shoji.position.set(x, tierY + 2, z);
                scene.add(shoji);

                const roofGeo = new THREE.BoxGeometry((size + 3) * 1.3, 1, (size + 3) * 1.3);
                const roof = new THREE.Mesh(roofGeo, redWoodMat);
                roof.position.set(x, tierY + 4.5, z);
                scene.add(roof);
            }
        }

        function buildArchBridge(x, z) {
            const bridgeGeo = new THREE.BoxGeometry(14, 1.5, 5);
            const bridgeMat = new THREE.MeshLambertMaterial({ map: textures.woodRed });
            const bridgeMesh = new THREE.Mesh(bridgeGeo, bridgeMat);
            bridgeMesh.position.set(x, 7, z);
            scene.add(bridgeMesh);

            const railGeo = new THREE.BoxGeometry(14, 1, 0.4);
            const railMat = new THREE.MeshLambertMaterial({ color: 0x8b0000 });
            const rail1 = new THREE.Mesh(railGeo, railMat);
            rail1.position.set(x, 8.5, z + 2.2);
            const rail2 = new THREE.Mesh(railGeo, railMat);
            rail2.position.set(x, 8.5, z - 2.2);
            scene.add(rail1);
            scene.add(rail2);
        }

        function spawnShrines() {
            buildPagoda(0, 0);
            buildArchBridge(18, -8);
        }

        // --- ANIMATED ENTITIES ---
        function spawnSamurai(x, z) {
            const samuraiGroup = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(1.2, 2, 0.8);
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0x222233 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.set(0, 1, 0);
            samuraiGroup.add(body);

            const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const headMat = new THREE.MeshLambertMaterial({ color: 0x8b0000 });
            const headMesh = new THREE.Mesh(headGeo, headMat);
            headMesh.position.set(0, 2.4, 0);
            samuraiGroup.add(headMesh);

            const swordGeo = new THREE.BoxGeometry(0.1, 2.2, 0.2);
            const swordMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });
            const sword = new THREE.Mesh(swordGeo, swordMat);
            sword.position.set(0.8, 1.2, 0.2);
            sword.rotation.z = -0.3;
            samuraiGroup.add(sword);

            samuraiGroup.position.set(x, 9, z);
            scene.add(samuraiGroup);
            return samuraiGroup;
        }

        function spawnSheep(x, z) {
            const sheepGroup = new THREE.Group();

            const fluffGeo = new THREE.BoxGeometry(1.8, 1.4, 2.4);
            const fluffMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
            const fluffMesh = new THREE.Mesh(fluffGeo, fluffMat);
            fluffMesh.position.set(0, 1.2, 0);
            sheepGroup.add(fluffMesh);

            const headGeo = new THREE.BoxGeometry(0.9, 0.9, 1);
            const headMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
            const headMesh = new THREE.Mesh(headGeo, headMat);
            headMesh.position.set(0, 1.8, 1.4);
            sheepGroup.add(headMesh);

            const legGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
            const legMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const legOffsets = [[-0.6, -0.8], [0.6, -0.8], [-0.6, 0.8], [0.6, 0.8]];
            legOffsets.forEach(([lx, lz]) => {
                const leg = new THREE.Mesh(legGeo, legMat);
                leg.position.set(lx, 0.4, lz);
                sheepGroup.add(leg);
            });

            sheepGroup.position.set(x, 9, z);
            scene.add(sheepGroup);
            return sheepGroup;
        }

        // --- LIGHTING & ATMOSPHERE ---
        function setupLighting() {
            sun = new THREE.DirectionalLight(0xfff5e6, 1.5);
            sun.position.set(80, 100, 60);
            scene.add(sun);

            ambientLight = new THREE.AmbientLight(0x8899aa, 0.8);
            scene.add(ambientLight);

            // Pagoda Lantern
            const lanternGeo = new THREE.SphereGeometry(0.8, 16, 16);
            const lanternMat = new THREE.MeshBasicMaterial({ color: 0xffa500 });
            const lantern = new THREE.Mesh(lanternGeo, lanternMat);
            lantern.position.set(0, 14, 0);
            scene.add(lantern);

            pointLight = new THREE.PointLight(0xffa500, 2, 40);
            pointLight.position.set(0, 14, 0);
            scene.add(pointLight);
        }

        function changeTimeMode(mode) {
            timeMode = mode;
            if (mode === 'morning') {
                scene.background = new THREE.Color(0x87ceeb);
                scene.fog = new THREE.FogExp2(0x87ceeb, 0.008);
                if (sun) {
                    sun.color.setHex(0xfff5e6);
                    sun.intensity = 1.5;
                    sun.position.set(80, 100, 60);
                }
                if (ambientLight) {
                    ambientLight.color.setHex(0x8899aa);
                    ambientLight.intensity = 0.8;
                }
            } else if (mode === 'sunset') {
                scene.background = new THREE.Color(0xe06e43);
                scene.fog = new THREE.FogExp2(0xe06e43, 0.01);
                if (sun) {
                    sun.color.setHex(0xff6b35);
                    sun.intensity = 1.8;
                    sun.position.set(90, 25, -60);
                }
                if (ambientLight) {
                    ambientLight.color.setHex(0x664444);
                    ambientLight.intensity = 0.6;
                }
            } else if (mode === 'night') {
                scene.background = new THREE.Color(0x0a0e1a);
                scene.fog = new THREE.FogExp2(0x0a0e1a, 0.012);
                if (sun) {
                    sun.color.setHex(0x6688cc);
                    sun.intensity = 0.4;
                    sun.position.set(-50, 70, -40);
                }
                if (ambientLight) {
                    ambientLight.color.setHex(0x223344);
                    ambientLight.intensity = 0.4;
                }
            }
        }
        window.changeTimeMode = changeTimeMode;

        function buildPresets() {
            const container = document.getElementById('presetBtns');
            if (!container) return;
            container.innerHTML = '';
            const presets = [
                { name: 'Overview', pos: [60, 45, 60], target: [0, 8, 0] },
                { name: 'Pagoda', pos: [16, 14, 16], target: [0, 12, 0] },
                { name: 'Bridge', pos: [26, 12, -4], target: [18, 7, -8] },
                { name: 'Zen Garden', pos: [-20, 14, 20], target: [0, 8, 0] }
            ];

            presets.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'px-2 py-1 text-xs rounded bg-white/20 hover:bg-white/40 text-white transition';
                btn.textContent = p.name;
                btn.onclick = () => {
                    camera.position.set(...p.pos);
                    controls.target.set(...p.target);
                    controls.update();
                };
                container.appendChild(btn);
            });
        }

        // --- INIT & CONTROLS ---
        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(60, 45, 60);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 8, 0);

            setupLighting();
            changeTimeMode('morning');
            generateTerrain();

            spawnShrines();
            spawnSheep(6, -6);
            spawnSheep(10, 4);
            spawnSamurai(3, 6);

            // Cloud Mesh
            const cloudGeo = new THREE.SphereGeometry(6, 8, 8);
            const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });
            const cloud = new THREE.Mesh(cloudGeo, cloudMat);
            cloud.position.set(20, 35, -20);
            scene.add(cloud);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            window.addEventListener('keydown', (e) => {
                if (e.key === 'q' || e.key === 'Q') camera.position.y += 2;
                if (e.key === 'e' || e.key === 'E') camera.position.y -= 2;
            });

            // Audio button toggle
            const audioBtn = document.getElementById('audio-toggle');
            if (audioBtn) {
                let audioCtx = null;
                let osc = null;
                audioBtn.addEventListener('click', () => {
                    isAudioEnabled = !isAudioEnabled;
                    if (isAudioEnabled) {
                        audioBtn.textContent = '🔊 Audio: ON';
                        audioBtn.classList.add('bg-emerald-700/80');
                        try {
                            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                            osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.start();
                        } catch (e) {}
                    } else {
                        audioBtn.textContent = '🔇 Audio: OFF';
                        audioBtn.classList.remove('bg-emerald-700/80');
                        if (osc) {
                            try { osc.stop(); } catch (e) {}
                            osc = null;
                        }
                    }
                });
            }

            buildPresets();
            renderLoop();
        }

        function renderLoop() {
            requestAnimationFrame(renderLoop);
            controls.update();
            render();
        }

        function render() {
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
